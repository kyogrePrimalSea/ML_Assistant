        pick_when: Errors are correlated, for example over time
    - id: model.linear.shrink
      level: family
      names_label: Shrinkage (ridge-type)
      question_label: Fit a line, but features move together
      question_sentence: We need a line, but many features are correlated.
      question_prompt: null
      for: [predict-number]
      pages:
      - id: ridge
        shown_as: Ridge
        for: [predict-number]
        pick_when: Many correlated features; keeps them all, shrinks them
      - id: ridge-cv
        shown_as: RidgeCV
        for: [predict-number]
        pick_when: Ridge that picks its own strength
      - id: pls-regression
        shown_as: PLSRegression
        for: [predict-number]
        pick_when: More features than rows; builds a few combined ones
    - id: model.linear.sparse
      level: family
      names_label: Sparse (feature-dropping)
