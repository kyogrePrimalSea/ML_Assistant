    - id: ets-model
      shown_as: ETSModel
      for: [forecast]
      pick_when: The same idea, with prediction intervals
    - id: theta-model
      shown_as: ThetaModel
      for: [forecast]
      pick_when: A strong simple benchmark; hard to beat
  - id: model.ts-multi
    level: group
    names_label: Multivariate
    question_label: Forecast series that move together
    question_sentence: We need to forecast several series that influence each other.
    question_prompt: null
    for: [forecast]
    pages:
    - id: var
      shown_as: VAR
      for: [forecast]
      pick_when: Several stable series, each driving the others
    - id: varmax
      shown_as: VARMAX
      for: [forecast]
      pick_when: The same, plus moving-average terms and outside drivers
  - id: model.ts-changing
    level: group
    names_label: State space and regimes
    question_label: Forecast, but the pattern shifts
    question_sentence: We need to forecast, but the trend or behaviour changes over time.
    question_prompt: null
    for: [forecast]
    pages:
    - id: unobserved-components
      shown_as: UnobservedComponents
      for: [forecast]
      pick_when: Trend and seasons that drift slowly
    - id: markov-regression
      shown_as: MarkovRegression
      for: [forecast]
      pick_when: Behaviour switches between states, like boom and bust
- id: tune
  names_label: Tune
  question_label: Find better settings
  question_sentence: We need settings that make the model better.
  question_prompt: How should we find better settings?
  children:
  - id: tune.settings
    level: group
    names_label: Hyperparameters
    question_label: Know which settings matter
    question_sentence: We need to know which settings to change, and why.
    question_prompt: What should the settings control?
    for: [predict-number, predict-category, forecast]
    children:
    - id: tune.settings.complexity
      level: family
      names_label: Complexity
      question_label: Control how complex it gets
      question_sentence: We need to stop the model memorising the training data.
      question_prompt: null
      for: [predict-number, predict-category, forecast]
      pages:
      - id: max-depth
        shown_as: Tree depth limit
        for: [predict-number, predict-category, forecast]
        pick_when: Trees overfit or underfit
    - id: tune.settings.training
      level: family
      names_label: Training length
      question_label: Control how long it learns
      question_sentence: We need to balance learning enough against learning noise.
      question_prompt: null
      for: [predict-number, predict-category, forecast]
      pages:
      - id: n-estimators
        shown_as: Number of trees
        for: [predict-number, predict-category, forecast]
        pick_when: Boosting underfits, or we use early stopping
      - id: learning-rate
        shown_as: Learning rate
        for: [predict-number, predict-category, forecast]
        pick_when: Trading speed against accuracy in boosting
      - id: early-stopping
        shown_as: Early stopping
        for: [predict-number, predict-category, forecast]
        pick_when: A validation set should decide when to stop
  - id: tune.search
    level: group
    names_label: Search (scikit-learn)
    question_label: Search through settings
    question_sentence: We need to try settings and keep the best by cross-validation.
    question_prompt: How big is the search space?
    for: [predict-number, predict-category, forecast]
    children:
    - id: tune.search.grid
      level: family
      names_label: Grid search
      question_label: Try every combination
      question_sentence: We need to try every combination of a small set of options.
      question_prompt: null
      for: [predict-number, predict-category, forecast]
      pages:
      - id: gridsearchcv
        shown_as: GridSearchCV
        for: [predict-number, predict-category, forecast]
        pick_when: Few settings, few values each
      - id: parametergrid
        shown_as: ParameterGrid
        for: [predict-number, predict-category, forecast]
        pick_when: List the grid ourselves for a custom loop
    - id: tune.search.random
      level: family
      names_label: Random search
      question_label: Try random combinations
      question_sentence: We need to sample combinations from a large space.
      question_prompt: null
      for: [predict-number, predict-category, forecast]
      pages:
      - id: randomizedsearchcv
        shown_as: RandomizedSearchCV
        for: [predict-number, predict-category, forecast]
        pick_when: Many settings, or continuous ranges
      - id: parametersampler
        shown_as: ParameterSampler
        for: [predict-number, predict-category, forecast]
        pick_when: Draw samples ourselves for a custom loop
    - id: tune.search.halving
      level: family
      names_label: Successive halving
      question_label: Search, but each fit is slow
      question_sentence: We need to search, but fits are slow, so weak candidates must drop out early.
      question_prompt: null
      for: [predict-number, predict-category, forecast]
      pages:
      - id: halvinggridsearchcv
        shown_as: HalvingGridSearchCV
        for: [predict-number, predict-category, forecast]
        pick_when: Grid search that cuts weak options early
      - id: halvingrandomsearchcv
        shown_as: HalvingRandomSearchCV
        for: [predict-number, predict-category, forecast]
        pick_when: Random search that cuts weak options early
  - id: tune.optuna
    level: group
    names_label: Optuna
    question_label: Search smarter
    question_sentence: We need a search that learns where good settings are.
    question_prompt: What do we need from the search?
    for: [predict-number, predict-category, forecast]
    children:
    - id: tune.optuna.setup
      level: family
      names_label: Studies and trials
      question_label: Set up the search
      question_sentence: We need to define what to search and what to optimise.
      question_prompt: null
      for: [predict-number, predict-category, forecast]
      pages:
      - id: optuna-study
        shown_as: Study (create_study)
        for: [predict-number, predict-category, forecast]
        pick_when: Start, save or reload a search
      - id: optuna-trial
        shown_as: Trial
        for: [predict-number, predict-category, forecast]
        pick_when: Suggest values inside the objective function
      - id: frozentrial
        shown_as: FrozenTrial
        for: [predict-number, predict-category, forecast]
        pick_when: Read a finished trial's settings and score
      - id: partialfixedsampler
        shown_as: PartialFixedSampler
        for: [predict-number, predict-category, forecast]
        pick_when: Keep some settings fixed while searching the rest
    - id: tune.optuna.sampler
      level: family
      names_label: Samplers
      question_label: Choose how it picks the next try
      question_sentence: We need to choose the strategy for the next settings to try.
      question_prompt: null
      for: [predict-number, predict-category, forecast]
      pages:
      - id: tpesampler
        shown_as: TPESampler
        for: [predict-number, predict-category, forecast]
        pick_when: The default; good for most searches
      - id: gpsampler
        shown_as: GPSampler
        for: [predict-number, predict-category, forecast]
        pick_when: Few trials, because each fit is expensive
      - id: cmaessampler
        shown_as: CmaEsSampler
        for: [predict-number, predict-category, forecast]
        pick_when: Mostly continuous settings, many trials
      - id: randomsampler
        shown_as: RandomSampler
        for: [predict-number, predict-category, forecast]
        pick_when: A baseline, or a wide first look
      - id: qmcsampler
        shown_as: QMCSampler
        for: [predict-number, predict-category, forecast]
        pick_when: Cover the space evenly; tidier than random
      - id: gridsampler
        shown_as: GridSampler
        for: [predict-number, predict-category, forecast]
        pick_when: Every combination, inside Optuna
      - id: bruteforcesampler
        shown_as: BruteForceSampler
        for: [predict-number, predict-category, forecast]
        pick_when: Small discrete spaces; tries everything once
    - id: tune.optuna.multi
      level: family
      names_label: Multi-objective
      question_label: Balance several goals at once
      question_sentence: We need to balance goals like accuracy and speed together.
      question_prompt: null
      for: [predict-number, predict-category, forecast]
      pages:
      - id: nsgaiisampler
        shown_as: NSGAIISampler
        for: [predict-number, predict-category, forecast]
        pick_when: Two or three goals
      - id: nsgaiiisampler
        shown_as: NSGAIIISampler
        for: [predict-number, predict-category, forecast]
        pick_when: Many goals at once
      - id: plot-pareto-front
        shown_as: plot_pareto_front
        for: [predict-number, predict-category, forecast]
        pick_when: See the best trade-offs
      - id: plot-hypervolume-history
        shown_as: plot_hypervolume_history
        for: [predict-number, predict-category, forecast]
        pick_when: See whether the trade-offs are still improving
  - id: tune.watch
    level: group
    names_label: Optuna pruning and plots
    question_label: Watch and steer the search
    question_sentence: We need to stop wasting time, and see what the search found.
    question_prompt: What do we need to see or stop?
    for: [predict-number, predict-category, forecast]
    children:
    - id: tune.watch.prune-relative
      level: family
      names_label: Relative pruners
      question_label: Stop trials that lag behind
      question_sentence: We need to stop trials doing worse than earlier ones.
      question_prompt: null
      for: [predict-number, predict-category, forecast]
      pages:
      - id: medianpruner
        shown_as: MedianPruner
        for: [predict-number, predict-category, forecast]
        pick_when: The default; stop if worse than the median so far
      - id: percentilepruner
        shown_as: PercentilePruner
        for: [predict-number, predict-category, forecast]
        pick_when: The same idea, with our own cut-off
      - id: successivehalvingpruner
        shown_as: SuccessiveHalvingPruner
        for: [predict-number, predict-category, forecast]
        pick_when: Keep only the top share at each checkpoint
      - id: hyperbandpruner
        shown_as: HyperbandPruner
        for: [predict-number, predict-category, forecast]
        pick_when: Many cheap trials; balances budgets automatically
      - id: wilcoxonpruner
        shown_as: WilcoxonPruner
        for: [predict-number, predict-category, forecast]
        pick_when: Each trial is scored on many folds or instances
    - id: tune.watch.prune-rule
      level: family
      names_label: Rule-based pruning
      question_label: Stop trials by a fixed rule
      question_sentence: We need to stop trials when they cross a line we set.
      question_prompt: null
      for: [predict-number, predict-category, forecast]
      pages:
      - id: thresholdpruner
        shown_as: ThresholdPruner
        for: [predict-number, predict-category, forecast]
        pick_when: Stop if a score crosses a fixed value
      - id: patientpruner
        shown_as: PatientPruner
        for: [predict-number, predict-category, forecast]
        pick_when: Wait a few steps before another pruner acts
      - id: noppruner
        shown_as: NopPruner
        for: [predict-number, predict-category, forecast]
        pick_when: Turn pruning off
      - id: trialpruned
        shown_as: TrialPruned
        for: [predict-number, predict-category, forecast]
        pick_when: Raise this to stop a trial ourselves
    - id: tune.watch.stop
      level: family
      names_label: Stopping the study
      question_label: Know when to stop searching
      question_sentence: We need to know when more trials won't help.
      question_prompt: null
      for: [predict-number, predict-category, forecast]
      pages:
      - id: terminator
        shown_as: Terminator
        for: [predict-number, predict-category, forecast]
        pick_when: Estimate whether more trials can still improve
      - id: terminatorcallback
        shown_as: TerminatorCallback
        for: [predict-number, predict-category, forecast]
        pick_when: Stop the study automatically
      - id: maxtrialscallback
        shown_as: MaxTrialsCallback
        for: [predict-number, predict-category, forecast]
        pick_when: Stop after a total number of trials
      - id: plot-terminator-improvement
        shown_as: plot_terminator_improvement
        for: [predict-number, predict-category, forecast]
        pick_when: See how much room is left to improve
    - id: tune.watch.importance
      level: family
      names_label: Settings plots
      question_label: See which settings mattered
      question_sentence: We need to see which settings changed the score most.
      question_prompt: null
      for: [predict-number, predict-category, forecast]
      pages:
      - id: plot-param-importances
        shown_as: plot_param_importances
        for: [predict-number, predict-category, forecast]
        pick_when: Rank settings by impact
      - id: get-param-importances
        shown_as: get_param_importances
        for: [predict-number, predict-category, forecast]
        pick_when: The same ranking, as numbers
      - id: plot-slice
        shown_as: plot_slice
        for: [predict-number, predict-category, forecast]
        pick_when: Score against each setting
      - id: plot-contour
        shown_as: plot_contour
        for: [predict-number, predict-category, forecast]
        pick_when: How two settings interact
      - id: plot-parallel-coordinate
        shown_as: plot_parallel_coordinate
        for: [predict-number, predict-category, forecast]
        pick_when: Every setting of every trial at once
      - id: plot-rank
        shown_as: plot_rank
        for: [predict-number, predict-category, forecast]
        pick_when: Where the best trials sit in the space
    - id: tune.watch.history
      level: family
      names_label: Progress plots
      question_label: See how the search went
      question_sentence: We need to see whether the search is still finding better settings.
      question_prompt: null
      for: [predict-number, predict-category, forecast]
      pages:
      - id: plot-optimization-history
        shown_as: plot_optimization_history
        for: [predict-number, predict-category, forecast]
        pick_when: The best score over trials
      - id: plot-intermediate-values
        shown_as: plot_intermediate_values
        for: [predict-number, predict-category, forecast]
        pick_when: Each trial's learning curve, for pruning
      - id: plot-timeline
        shown_as: plot_timeline
        for: [predict-number, predict-category, forecast]
        pick_when: When each trial ran and how long it took
      - id: plot-edf
        shown_as: plot_edf
        for: [predict-number, predict-category, forecast]
        pick_when: Compare score spreads between studies
  - id: tune.threshold
    level: group
    names_label: Decision threshold
    question_label: Pick the cut-off for a yes/no call
    question_sentence: We need to choose the probability cut-off that turns scores into decisions.
    question_prompt: null
    for: [predict-category]
    pages:
    - id: tunedthresholdclassifiercv
      shown_as: TunedThresholdClassifierCV
      for: [predict-category]
      pick_when: Find the cut-off that maximises a metric
    - id: fixedthresholdclassifier
      shown_as: FixedThresholdClassifier
      for: [predict-category]
      pick_when: Use a cut-off we already chose
- id: evaluate
  names_label: Evaluate
  question_label: Check how good it is
  question_sentence: We need to know how good the predictions are.
  question_prompt:
    predict-number: How should we judge the numbers?
    predict-category: How should we judge the categories?
    forecast: How should we judge the forecast?
  children:
  - id: evaluate.error
    level: group
    names_label: Error metrics
    question_label: Measure how big the misses are
    question_sentence: We need to know how far off the predictions are.
    question_prompt: In what units should we measure the misses?
    for: [predict-number, forecast]
    children:
    - id: evaluate.error.units
      level: family
      names_label: Absolute and squared error
      question_label: In the target's own units
      question_sentence: We need the error in the same units as the target, like dollars.
      question_prompt: null
      for: [predict-number, forecast]
      pages:
      - id: mean-absolute-error
        shown_as: MAE
        for: [predict-number, forecast]
        pick_when: The typical miss; easy to explain
      - id: root-mean-squared-error
        shown_as: RMSE
        for: [predict-number, forecast]
        pick_when: Big misses should count more
      - id: mean-squared-error
        shown_as: MSE
        for: [predict-number, forecast]
        pick_when: RMSE squared; common as a training loss
      - id: median-absolute-error
        shown_as: Median absolute error
        for: [predict-number, forecast]
        pick_when: Ignore a few huge misses
      - id: max-error
        shown_as: Max error
        for: [predict-number, forecast]
        pick_when: The single worst miss
    - id: evaluate.error.relative
      level: family
      names_label: Percentage and log error
      question_label: As a percentage or ratio
      question_sentence: We need errors relative to size, so big and small targets compare fairly.
      question_prompt: null
      for: [predict-number, forecast]
      pages:
      - id: mean-absolute-percentage-error
        shown_as: MAPE
        for: [predict-number, forecast]
        pick_when: Misses as a percentage; avoid when targets are near zero
      - id: mean-squared-log-error
        shown_as: MSLE
        for: [predict-number, forecast]
        pick_when: Targets span orders of magnitude
      - id: root-mean-squared-log-error
        shown_as: RMSLE
        for: [predict-number, forecast]
        pick_when: The same, in log units
    - id: evaluate.error.deviance
      level: family
      names_label: Deviance metrics
      question_label: For counts and skewed amounts
      question_sentence: We need to score a Poisson, Gamma or Tweedie model on its own terms.
      question_prompt: null
      for: [predict-number]
      pages:
      - id: mean-poisson-deviance
        shown_as: Mean Poisson deviance
        for: [predict-number]
        pick_when: Count targets
      - id: mean-gamma-deviance
        shown_as: Mean Gamma deviance
        for: [predict-number]
        pick_when: Positive, skewed amounts
      - id: mean-tweedie-deviance
        shown_as: Mean Tweedie deviance
        for: [predict-number]
        pick_when: Amounts with many zeros
      - id: d2-tweedie-score
        shown_as: D² Tweedie score
        for: [predict-number]
        pick_when: Share of deviance explained, like R²
    - id: evaluate.error.quantile
      level: family
      names_label: Quantile loss
      question_label: For a predicted range
      question_sentence: We need to score a quantile prediction, not a mean.
      question_prompt: null
      for: [predict-number]
      pages:
      - id: mean-pinball-loss
        shown_as: Pinball loss
        for: [predict-number]
        pick_when: Scoring a quantile model
      - id: d2-pinball-score
        shown_as: D² pinball score
        for: [predict-number]
        pick_when: Share explained, for a quantile model
  - id: evaluate.explained
    level: group
    names_label: Explained variation
    question_label: Measure how much it explains
    question_sentence: We need to know how much of the variation the model explains.
    question_prompt: null
    for: [predict-number, forecast]
    pages:
    - id: r2-score
      shown_as: R²
      for: [predict-number, forecast]
      pick_when: Share explained; 1 is perfect, 0 matches the mean
    - id: explained-variance-score
      shown_as: Explained variance
      for: [predict-number, forecast]
      pick_when: Like R², but ignores a constant offset
    - id: d2-absolute-error-score
      shown_as: D² absolute error
      for: [predict-number, forecast]
      pick_when: An R²-style score built on absolute error
  - id: evaluate.diagnostics
    level: group
    names_label: Regression diagnostics
    question_label: Check the errors look healthy
    question_sentence: We need to check the model's assumptions before we trust it.
    question_prompt: What might be wrong?
    for: [predict-number]
    pages:
    - id: predictionerrordisplay
      shown_as: PredictionErrorDisplay
      for: [predict-number]
      pick_when: Plot predicted against actual, or the residuals
    - id: residual-normality
      shown_as: Residual normality tests
      for: [predict-number]
      pick_when: We need p-values or intervals from OLS
    - id: breusch-pagan
      shown_as: Breusch–Pagan test
      for: [predict-number]
      pick_when: Errors grow with the prediction (a fan shape)
    - id: vif
      shown_as: VIF
      for: [predict-number]
      pick_when: Features overlap so much that coefficients wobble
    - id: influence
      shown_as: Influence measures
      for: [predict-number]
      pick_when: A few rows pull the line too hard
  - id: evaluate.counts
    level: group
    names_label: Classification metrics
    question_label: Count right and wrong answers
    question_sentence: We need to know how often the predicted labels are right.
    question_prompt: What kind of mistake matters most?
    for: [predict-category]
    children:
    - id: evaluate.counts.overall
      level: family
      names_label: Overall scores
      question_label: One overall score
      question_sentence: We need one number for how often it's right.
      question_prompt: null
      for: [predict-category]
      pages:
      - id: accuracy-score
        shown_as: Accuracy
        for: [predict-category]
        pick_when: Classes are balanced
      - id: balanced-accuracy-score
        shown_as: Balanced accuracy
        for: [predict-category]
        pick_when: Classes are lopsided
      - id: matthews-corrcoef
        shown_as: Matthews correlation
        for: [predict-category]
        pick_when: One fair number, even when imbalanced
      - id: cohen-kappa-score
        shown_as: Cohen's kappa
        for: [predict-category]
        pick_when: Agreement beyond chance, like between raters
      - id: top-k-accuracy-score
        shown_as: Top-k accuracy
        for: [predict-category]
        pick_when: Counts as right if the true class is in the top k
      - id: zero-one-loss
        shown_as: Zero-one loss
        for: [predict-category]
        pick_when: The share wrong (1 minus accuracy)
      - id: hinge-loss
        shown_as: Hinge loss
        for: [predict-category]
        pick_when: Margin-based loss for SVM-style scores
    - id: evaluate.counts.pr
      level: family
      names_label: Precision and recall
      question_label: Weigh false alarms against misses
      question_sentence: We need to balance false alarms against missed cases.
      question_prompt: null
      for: [predict-category]
      pages:
      - id: precision-score
        shown_as: Precision
        for: [predict-category]
        pick_when: False alarms are costly
      - id: recall-score
        shown_as: Recall
        for: [predict-category]
        pick_when: Missing a real case is costly
      - id: f1-score
        shown_as: F1
        for: [predict-category]
        pick_when: Both matter equally
      - id: fbeta-score
        shown_as: F-beta
        for: [predict-category]
        pick_when: Lean towards precision or recall
      - id: precision-recall-fscore-support
        shown_as: precision_recall_fscore_support
        for: [predict-category]
        pick_when: All of them per class, in one call
      - id: jaccard-score
        shown_as: Jaccard
        for: [predict-category]
        pick_when: Overlap between predicted and true labels
    - id: evaluate.counts.breakdown
      level: family
      names_label: Breakdowns
      question_label: See every kind of mistake
      question_sentence: We need to see exactly which classes get confused.
      question_prompt: null
      for: [predict-category]
      pages:
      - id: confusion-matrix
        shown_as: Confusion matrix
        for: [predict-category]
        pick_when: See right and wrong for each class
      - id: classification-report
        shown_as: Classification report
        for: [predict-category]
        pick_when: Precision, recall and F1 per class, as a table
      - id: multilabel-confusion-matrix
        shown_as: Multilabel confusion matrix
        for: [predict-category]
        pick_when: One matrix per label
      - id: class-likelihood-ratios
        shown_as: Likelihood ratios
        for: [predict-category]
        pick_when: How much a positive shifts the odds, like a test
  - id: evaluate.prob
    level: group
    names_label: Probability metrics
    question_label: Judge the probabilities
    question_sentence: We need to judge the probabilities, not just the labels.
    question_prompt: What should the probabilities do well?
    for: [predict-category]
    children:
    - id: evaluate.prob.ranking
      level: family
      names_label: Ranking curves
      question_label: Rank yes above no
      question_sentence: We need positives scored higher than negatives, whatever the cut-off.
      question_prompt: null
      for: [predict-category]
      pages:
      - id: roc-auc-score
        shown_as: ROC AUC
        for: [predict-category]
        pick_when: Classes not too lopsided; ignores the cut-off
      - id: average-precision-score
        shown_as: Average precision
        for: [predict-category]
        pick_when: Rare positives (PR-AUC)
      - id: roc-curve
        shown_as: ROC curve
        for: [predict-category]
        pick_when: See the trade-off at every cut-off
      - id: precision-recall-curve
        shown_as: Precision-recall curve
        for: [predict-category]
        pick_when: The same, for rare positives
      - id: det-curve
        shown_as: DET curve
        for: [predict-category]
        pick_when: Compare error rates on a stretched scale
      - id: auc
        shown_as: auc
        for: [predict-category]
        pick_when: Area under a curve we already computed
    - id: evaluate.prob.calibration
      level: family
      names_label: Calibration and probabilistic loss
      question_label: Check the probabilities are honest
      question_sentence: We need a 70% prediction to come true about 70% of the time.
      question_prompt: null
      for: [predict-category]
      pages:
      - id: log-loss
        shown_as: Log loss
        for: [predict-category]
        pick_when: Punish confident wrong answers
      - id: brier-score-loss
        shown_as: Brier score
        for: [predict-category]
        pick_when: The squared error of the probabilities
