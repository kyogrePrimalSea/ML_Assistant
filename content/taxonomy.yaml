version: 1
source: docs/QUESTION_MAP.md
root:
  question_prompt: Where are we in the work?
goal_prompt: What are we trying to do?
goals:
- id: predict-number
  question_label: Predict a number
  names_label: Standard · Regression
  question_sentence: We need to predict a number, like a price, a demand or a duration.
  track: standard
  task: regression
- id: predict-category
  question_label: Sort things into categories
  names_label: Standard · Classification
  question_sentence: We need to decide which category something belongs to, like churn or not.
  track: standard
  task: classification
- id: forecast
  question_label: Forecast what comes next
  names_label: Time series
  question_sentence: We need to forecast future values of a series over time.
  track: time-series
  task: regression
later_goals:
- id: find-structure
  question_label: Find groups or odd ones out
  names_label: Unsupervised
- id: measure-effect
  question_label: Measure what a change caused
  names_label: Causal (DoubleML)
- id: learn-from-media
  question_label: Learn from images, text or sound
  names_label: Deep learning
stages:
- id: explore
  names_label: Explore
  question_label: Understand the data
  question_sentence: We need to understand the data before modelling.
  question_prompt:
    predict-number: What do we need to check?
    predict-category: What do we need to check?
    forecast: What do we need to know about the series?
  children:
  - id: explore.normality
    level: family
    names_label: Normality tests
    question_label: Check for a bell curve
    question_sentence: We need to check whether values follow a bell curve.
    question_prompt: Which check suits our sample?
    for: [predict-number, predict-category, forecast]
    pages:
    - id: shapiro-wilk
      shown_as: Shapiro–Wilk
      for: [predict-number, predict-category, forecast]
      pick_when: Samples up to a few thousand rows
    - id: normality-tests
      shown_as: D'Agostino–Pearson (normaltest)
      for: [predict-number, predict-category, forecast]
      pick_when: Larger samples; checks skew and tails together
  - id: explore.compare-means
    level: family
    names_label: t-tests
    question_label: Check if groups really differ
    question_sentence: We need to know whether a difference in averages is real or just noise.
    question_prompt: How were the groups measured?
    for: [predict-number, predict-category, forecast]
    pages:
    - id: ttest-ind
      shown_as: Independent t-test
      for: [predict-number, predict-category, forecast]
      pick_when: Two separate groups, like control vs treatment
    - id: ttest-rel
      shown_as: Paired t-test
      for: [predict-number, predict-category, forecast]
      pick_when: The same rows measured twice, like before vs after
    - id: ttest-1samp
      shown_as: One-sample t-test
      for: [predict-number, predict-category, forecast]
      pick_when: One group against a target value
  - id: explore.decompose
    level: family
    names_label: Decomposition
    question_label: Split the series into parts
    question_sentence: We need to see trend, seasonality and noise separately.
    question_prompt: How many seasons does the series have?
    for: [forecast]
    pages:
    - id: seasonal-decompose
      shown_as: seasonal_decompose
      for: [forecast]
      pick_when: A quick first look with one fixed season
    - id: stl
      shown_as: STL
      for: [forecast]
      pick_when: One season that can drift; robust to outliers
    - id: mstl
      shown_as: MSTL
      for: [forecast]
      pick_when: Several seasons at once, like daily and weekly
  - id: explore.cycle
    level: family
    names_label: Seasonality detection
    question_label: Find how long a cycle lasts
    question_sentence: We need to find the length of the repeating cycle.
    question_prompt: null
    for: [forecast]
    pages:
    - id: periodogram
      shown_as: Periodogram
      for: [forecast]
      pick_when: Season length unknown; shows the strongest cycles
  - id: explore.stationarity
    level: family
    names_label: Stationarity tests
    question_label: Check if the series is stable
    question_sentence: We need to know whether the series keeps a steady mean and spread over time.
    question_prompt: Which way round should the test be?
    for: [forecast]
    pages:
    - id: adf
      shown_as: ADF test
      for: [forecast]
      pick_when: Testing for a wandering trend; small p means stable
    - id: kpss
      shown_as: KPSS test
      for: [forecast]
      pick_when: The opposite check to ADF; small p means not stable
  - id: explore.memory
    level: family
    names_label: Autocorrelation
    question_label: See how the past shapes today
    question_sentence: We need to see how strongly each value depends on earlier ones.
    question_prompt: null
    for: [forecast]
    pages:
    - id: acf-pacf-plots
      shown_as: ACF and PACF plots
      for: [forecast]
      pick_when: Choosing AR and MA orders for ARIMA
    - id: ljung-box
      shown_as: Ljung–Box test
      for: [forecast]
      pick_when: Checking that leftovers are just noise
- id: clean
  names_label: Clean
  question_label: Fix missing values
  question_sentence: We need to deal with missing values.
  question_prompt: How should we fill the gaps?
  children:
  - id: clean.impute
    level: family
    names_label: Imputation
    question_label: Fill in missing values
    question_sentence: We need to fill gaps so the model can use every row.
    question_prompt: null
    for: [predict-number, predict-category, forecast]
    pages:
    - id: simpleimputer
      shown_as: SimpleImputer
      for: [predict-number, predict-category, forecast]
      pick_when: 'Fast default: mean, median, most frequent or a constant'
    - id: knnimputer
      shown_as: KNNImputer
      for: [predict-number, predict-category, forecast]
      pick_when: Borrow values from the most similar rows
    - id: iterativeimputer
      shown_as: IterativeImputer
      for: [predict-number, predict-category, forecast]
      pick_when: Predict each gap from the other columns; slower
    - id: missingindicator
      shown_as: MissingIndicator
      for: [predict-number, predict-category, forecast]
      pick_when: The fact that a value is missing is itself useful
- id: transform
  names_label: Transform
  question_label: Get the columns ready
  question_sentence: We need to turn raw columns into features a model can use.
  question_prompt: What do the columns need first?
  children:
  - id: transform.scale
    level: group
    names_label: Scaling and shaping
    question_label: Put numbers on a fair scale
    question_sentence: We need numeric columns on comparable scales or shapes.
    question_prompt: What's wrong with the numbers?
    for: [predict-number, predict-category, forecast]
    children:
    - id: transform.scale.rescale
      level: family
      names_label: Scalers
      question_label: Make columns comparable
      question_sentence: We need columns on the same scale so no column dominates.
      question_prompt: null
      for: [predict-number, predict-category, forecast]
      pages:
      - id: standardscaler
        shown_as: StandardScaler
        for: [predict-number, predict-category, forecast]
        pick_when: Default for linear models, SVMs, k-NN and neural nets
      - id: minmaxscaler
        shown_as: MinMaxScaler
        for: [predict-number, predict-category, forecast]
        pick_when: Values must sit between 0 and 1
      - id: robustscaler
        shown_as: RobustScaler
        for: [predict-number, predict-category, forecast]
        pick_when: Outliers would distort the mean and spread
      - id: maxabsscaler
        shown_as: MaxAbsScaler
        for: [predict-number, predict-category, forecast]
        pick_when: Sparse data where zeros must stay zero
      - id: normalizer
        shown_as: Normalizer
        for: [predict-number, predict-category, forecast]
        pick_when: Each row should have length 1, like text vectors
      - id: kernelcenterer
        shown_as: KernelCenterer
        for: [predict-number, predict-category, forecast]
        pick_when: Centring a precomputed kernel matrix
    - id: transform.scale.reshape
      level: family
      names_label: Distribution shaping
      question_label: Make skewed columns behave
      question_sentence: We need skewed columns to look closer to a bell curve.
      question_prompt: null
      for: [predict-number, predict-category, forecast]
      pages:
      - id: powertransformer
        shown_as: PowerTransformer
        for: [predict-number, predict-category, forecast]
        pick_when: Skewed columns; Yeo-Johnson handles zeros and negatives
      - id: quantiletransformer
        shown_as: QuantileTransformer
        for: [predict-number, predict-category, forecast]
        pick_when: Heavy outliers; forces a uniform or normal shape
    - id: transform.scale.bin
      level: family
      names_label: Discretisation
      question_label: Turn numbers into bands or flags
      question_sentence: We need to turn a number into ranges or on/off flags.
      question_prompt: null
      for: [predict-number, predict-category, forecast]
      pages:
      - id: kbinsdiscretizer
        shown_as: KBinsDiscretizer
        for: [predict-number, predict-category, forecast]
        pick_when: Group a number into ranges, like age bands
      - id: binarizer
        shown_as: Binarizer
        for: [predict-number, predict-category, forecast]
        pick_when: Turn a number into 0 or 1 at a cut-off
  - id: transform.encode
    level: group
    names_label: Encoding
    question_label: Turn categories into numbers
    question_sentence: We need text categories turned into numbers a model can use.
    question_prompt: Which columns hold categories?
    for: [predict-number, predict-category, forecast]
    children:
    - id: transform.encode.features
      level: family
      names_label: Categorical encoders
      question_label: Encode the input columns
      question_sentence: We need to encode the category columns in X.
      question_prompt: null
      for: [predict-number, predict-category, forecast]
      pages:
      - id: onehotencoder
        shown_as: OneHotEncoder
        for: [predict-number, predict-category, forecast]
        pick_when: Few categories; the safe default for linear models
      - id: ordinalencoder
        shown_as: OrdinalEncoder
        for: [predict-number, predict-category, forecast]
        pick_when: Categories with a real order, or for tree models
      - id: targetencoder
        shown_as: TargetEncoder
        for: [predict-number, predict-category, forecast]
        pick_when: Hundreds of categories, like postcodes
    - id: transform.encode.target
      level: family
      names_label: Label encoders
      question_label: Encode the target column
      question_sentence: We need to encode y, the thing we predict.
      question_prompt: null
      for: [predict-category]
      pages:
      - id: labelencoder
        shown_as: LabelEncoder
        for: [predict-category]
        pick_when: Turn class names in y into 0, 1, 2 (never for X)
      - id: labelbinarizer
        shown_as: LabelBinarizer
        for: [predict-category]
        pick_when: Turn y into one 0/1 column per class
      - id: label-binarizer
        shown_as: label_binarize
        for: [predict-category]
        pick_when: The same, as a one-off function
      - id: multilabelbinarizer
        shown_as: MultiLabelBinarizer
        for: [predict-category]
        pick_when: Each row can have several labels
  - id: transform.create
    level: group
    names_label: Feature creation
    question_label: Create new features
    question_sentence: We need features the raw columns don't give us.
    question_prompt: What should the new features capture?
    for: [predict-number, predict-category, forecast]
    children:
    - id: transform.create.expand
      level: family
      names_label: Feature expansion
      question_label: Add curves and interactions
      question_sentence: We need a straight-line model to capture curves or interactions.
      question_prompt: null
      for: [predict-number, predict-category, forecast]
      pages:
      - id: polynomialfeatures
        shown_as: PolynomialFeatures
        for: [predict-number, predict-category, forecast]
        pick_when: Add squares and products; few columns only
      - id: splinetransformer
        shown_as: SplineTransformer
        for: [predict-number, predict-category, forecast]
        pick_when: Smooth curves without the blow-up of high powers
      - id: add-dummy-feature
        shown_as: add_dummy_feature
        for: [predict-number, predict-category, forecast]
        pick_when: Add a constant column of ones
    - id: transform.create.custom
      level: family
      names_label: Custom transformation
      question_label: Apply our own function
      question_sentence: We need to apply our own function inside a pipeline.
      question_prompt: null
      for: [predict-number, predict-category, forecast]
      pages:
      - id: functiontransformer
        shown_as: FunctionTransformer
        for: [predict-number, predict-category, forecast]
        pick_when: Wrap a function like np.log1p as a pipeline step
  - id: transform.rebalance
    level: group
    names_label: Resampling
    question_label: Rebalance lopsided classes
    question_sentence: We need to classify, but one class is much rarer than the others.
    question_prompt: How should we rebalance?
    for: [predict-category]
    children:
    - id: transform.rebalance.weight
      level: family
      names_label: Class weighting
      question_label: Weight rare rows more
      question_sentence: We need the model to care more about the rare class, without changing the data.
      question_prompt: null
      for: [predict-category]
      pages:
      - id: compute-class-weight
        shown_as: compute_class_weight
        for: [predict-category]
        pick_when: Try before resampling; feeds class_weight or sample_weight
    - id: transform.rebalance.over
      level: family
      names_label: Over-sampling
      question_label: Make more rare rows
      question_sentence: We need more rows of the rare class.
      question_prompt: null
      for: [predict-category]
      pages:
      - id: randomoversampler
        shown_as: RandomOverSampler
        for: [predict-category]
        pick_when: 'Simplest: copy rare rows'
      - id: smote
        shown_as: SMOTE
        for: [predict-category]
        pick_when: Make new rare rows between neighbours; numeric data
      - id: smotenc
        shown_as: SMOTENC
        for: [predict-category]
        pick_when: Like SMOTE, for numeric and category columns mixed
      - id: smoten
        shown_as: SMOTEN
        for: [predict-category]
        pick_when: Like SMOTE, for category columns only
    - id: transform.rebalance.over-hard
      level: family
      names_label: Boundary over-sampling
      question_label: Make rare rows near the hard cases
      question_sentence: We need more rare rows, but mostly where the classes overlap.
      question_prompt: null
      for: [predict-category]
      pages:
      - id: borderlinesmote
        shown_as: BorderlineSMOTE
        for: [predict-category]
        pick_when: Focus on rare rows next to the other class
      - id: svmsmote
        shown_as: SVMSMOTE
        for: [predict-category]
        pick_when: Use an SVM to find the boundary first
      - id: adasyn
        shown_as: ADASYN
        for: [predict-category]
        pick_when: More new rows where rare rows are hardest to learn
      - id: kmeanssmote
        shown_as: KMeansSMOTE
        for: [predict-category]
        pick_when: Cluster first, then fill thin rare areas
    - id: transform.rebalance.under
      level: family
      names_label: Under-sampling
      question_label: Use fewer common rows
      question_sentence: We need fewer rows of the common class.
      question_prompt: null
      for: [predict-category]
      pages:
      - id: randomundersampler
        shown_as: RandomUnderSampler
        for: [predict-category]
        pick_when: 'Simplest: drop common rows at random'
      - id: nearmiss
        shown_as: NearMiss
        for: [predict-category]
        pick_when: Keep the common rows closest to the rare ones
      - id: clustercentroids
        shown_as: ClusterCentroids
        for: [predict-category]
        pick_when: Replace common rows with cluster centres
      - id: condensednearestneighbour
        shown_as: CondensedNearestNeighbour
        for: [predict-category]
        pick_when: Keep only the common rows needed for the boundary
      - id: instancehardnessthreshold
        shown_as: InstanceHardnessThreshold
        for: [predict-category]
        pick_when: Drop common rows a model finds hard to classify
    - id: transform.rebalance.clean
      level: family
      names_label: Cleaning under-samplers
      question_label: Remove overlapping rows
      question_sentence: We need fewer common rows, but only the noisy ones near the boundary.
      question_prompt: null
      for: [predict-category]
      pages:
      - id: tomeklinks
        shown_as: TomekLinks
        for: [predict-category]
        pick_when: Remove pairs of opposite-class neighbours
      - id: editednearestneighbours
        shown_as: EditedNearestNeighbours
        for: [predict-category]
        pick_when: Remove rows that disagree with their neighbours
      - id: repeatededitednearestneighbours
        shown_as: RepeatedEditedNearestNeighbours
        for: [predict-category]
        pick_when: Repeat that cleaning until nothing changes
      - id: allknn
        shown_as: AllKNN
        for: [predict-category]
        pick_when: Clean with growing neighbourhood sizes
      - id: neighbourhoodcleaningrule
        shown_as: NeighbourhoodCleaningRule
        for: [predict-category]
        pick_when: Gentler cleaning that protects the rare class
      - id: onesidedselection
        shown_as: OneSidedSelection
        for: [predict-category]
        pick_when: Drop redundant and noisy common rows together
    - id: transform.rebalance.combine
      level: family
      names_label: Combined sampling
      question_label: Make rare rows, then clean up
      question_sentence: We need to over-sample, then remove the noise that creates.
      question_prompt: null
      for: [predict-category]
      pages:
      - id: smoteenn
        shown_as: SMOTEENN
        for: [predict-category]
        pick_when: SMOTE, then stronger cleaning
      - id: smotetomek
        shown_as: SMOTETomek
        for: [predict-category]
        pick_when: SMOTE, then light cleaning
    - id: transform.rebalance.custom
      level: family
      names_label: Custom sampling
      question_label: Use our own sampler
      question_sentence: We need a resampling rule the library doesn't have.
      question_prompt: null
      for: [predict-category]
      pages:
      - id: functionsampler
        shown_as: FunctionSampler
        for: [predict-category]
        pick_when: Wrap our own function as a sampler step
  - id: transform.chain
    level: group
    names_label: Pipelines and composition
    question_label: Chain steps without leaks
    question_sentence: We need steps to run in order, fitted only on training data.
    question_prompt: What do we need to chain?
    for: [predict-number, predict-category, forecast]
    children:
    - id: transform.chain.pipeline
      level: family
      names_label: Pipelines
      question_label: Run steps in order
      question_sentence: We need steps that run in order and learn only from training data.
      question_prompt: null
      for: [predict-number, predict-category, forecast]
      pages:
      - id: pipeline
        shown_as: Pipeline
        for: [predict-number, predict-category, forecast]
        pick_when: Any multi-step model; stops leakage in cross-validation
      - id: imblearn-pipeline
        shown_as: Pipeline (imbalanced-learn)
        for: [predict-category]
        pick_when: The steps include a sampler like SMOTE
    - id: transform.chain.columns
      level: family
      names_label: Column transformers
      question_label: Treat columns differently
      question_sentence: We need different steps for different columns.
      question_prompt: null
      for: [predict-number, predict-category, forecast]
      pages:
      - id: columntransformer
        shown_as: ColumnTransformer
        for: [predict-number, predict-category, forecast]
        pick_when: Scale numbers and encode categories in one step
      - id: column-transformer
        shown_as: make_column_transformer
        for: [predict-number, predict-category, forecast]
        pick_when: The same, with step names filled in
      - id: make-column-selector
        shown_as: make_column_selector
        for: [predict-number, predict-category, forecast]
        pick_when: Pick columns by type or name pattern
    - id: transform.chain.target
      level: family
      names_label: Target transformation
      question_label: Transform the target, then undo it
      question_sentence: We need to model a transformed target, but report in the original units.
      question_prompt: null
      for: [predict-number, forecast]
      pages:
      - id: transformedtargetregressor
        shown_as: TransformedTargetRegressor
        for: [predict-number, forecast]
        pick_when: Train on a log target; predict in real units
    - id: transform.chain.union
      level: family
      names_label: Feature unions
      question_label: Run transforms side by side
      question_sentence: We need several transforms of the same columns, joined together.
      question_prompt: null
      for: [predict-number, predict-category, forecast]
      pages:
      - id: featureunion
        shown_as: FeatureUnion
        for: [predict-number, predict-category, forecast]
        pick_when: Join the outputs of several transformers
      - id: feature-union
        shown_as: make_union
        for: [predict-number, predict-category, forecast]
        pick_when: The same, with step names filled in
- id: select
  names_label: Select
  question_label: Keep the useful features
  question_sentence: We need fewer, better features.
  question_prompt: How should we cut down the features?
  children:
  - id: select.variance
    level: family
    names_label: Variance filter
    question_label: Drop columns that barely change
    question_sentence: We need to drop columns that are nearly constant.
    question_prompt: null
    for: [predict-number, predict-category, forecast]
    pages:
    - id: variancethreshold
      shown_as: VarianceThreshold
      for: [predict-number, predict-category, forecast]
      pick_when: A quick clean-up that needs no target
  - id: select.top-k
    level: family
    names_label: Univariate selection
    question_label: Keep the top-scoring features
    question_sentence: We need to keep the features that score best, one at a time.
    question_prompt: null
    for: [predict-number, predict-category]
    pages:
    - id: selectkbest
      shown_as: SelectKBest
      for: [predict-number, predict-category]
      pick_when: Keep a fixed number of features
    - id: selectpercentile
      shown_as: SelectPercentile
      for: [predict-number, predict-category]
      pick_when: Keep a fixed share of features
    - id: genericunivariateselect
      shown_as: GenericUnivariateSelect
      for: [predict-number, predict-category]
      pick_when: Switch the rule with one setting, for tuning
  - id: select.significance
    level: family
    names_label: Statistical tests
    question_label: Keep features that pass a test
    question_sentence: We need features that pass a significance test, with control over false picks.
    question_prompt: null
    for: [predict-number, predict-category]
    pages:
    - id: selectfdr
      shown_as: SelectFdr
      for: [predict-number, predict-category]
      pick_when: Many features; cap the share of false discoveries
    - id: selectfpr
      shown_as: SelectFpr
      for: [predict-number, predict-category]
      pick_when: Cap false positives per feature
    - id: selectfwe
      shown_as: SelectFwe
      for: [predict-number, predict-category]
      pick_when: 'Strictest: cap the chance of any false pick'
  - id: select.scores
    level: family
    names_label: Scoring functions
    question_label: Score each feature against the target
    question_sentence: We need a score for how much each feature tells us about the target.
    question_prompt: null
    for: [predict-number, predict-category]
    pages:
    - id: f-regression
      shown_as: f_regression
      for: [predict-number]
      pick_when: Straight-line link to a numeric target
    - id: r-regression
      shown_as: r_regression
      for: [predict-number]
      pick_when: Signed correlation with a numeric target
    - id: mutual-info-regression
      shown_as: mutual_info_regression
      for: [predict-number]
      pick_when: Any link, including curves; numeric target
    - id: f-classif
      shown_as: f_classif
      for: [predict-category]
      pick_when: Numeric features against a category target
    - id: chi2
      shown_as: chi2
      for: [predict-category]
      pick_when: Counts or other non-negative features
    - id: mutual-info-classif
      shown_as: mutual_info_classif
      for: [predict-category]
      pick_when: Any link, including curves; category target
  - id: select.model-based
    level: family
    names_label: Model-based selection
    question_label: Let a model choose
    question_sentence: We need a model to decide which features earn their place.
    question_prompt: null
    for: [predict-number, predict-category]
    pages:
    - id: selectfrommodel
      shown_as: SelectFromModel
      for: [predict-number, predict-category]
      pick_when: Keep features above an importance or coefficient cut-off
    - id: rfe
      shown_as: RFE
      for: [predict-number, predict-category]
      pick_when: Drop the weakest feature, refit, repeat
    - id: rfecv
      shown_as: RFECV
      for: [predict-number, predict-category]
      pick_when: Like RFE, and picks how many to keep by cross-validation
    - id: sequentialfeatureselector
      shown_as: SequentialFeatureSelector
      for: [predict-number, predict-category]
      pick_when: Add or remove one feature at a time; slow but thorough
  - id: select.compress
    level: family
    names_label: Dimensionality reduction
    question_label: Compress into fewer columns
    question_sentence: We need fewer columns, even if each one mixes the originals.
    question_prompt: null
    for: [predict-number, predict-category, forecast]
    pages:
    - id: pca
      shown_as: PCA
      for: [predict-number, predict-category, forecast]
      pick_when: Dense numeric data; scale first
    - id: truncatedsvd
      shown_as: TruncatedSVD
      for: [predict-number, predict-category, forecast]
      pick_when: Sparse data, like text or one-hot columns
- id: split
  names_label: Split
  question_label: Hold data back to test
  question_sentence: We need to keep some data aside so we can test honestly.
  question_prompt: How should we hold data back?
  children:
  - id: split.holdout
    level: family
    names_label: Hold-out splits
