      question_sentence: We need a line that sets unhelpful features to zero.
      question_prompt: null
      for: [predict-number]
      pages:
      - id: lasso
        shown_as: Lasso
        for: [predict-number]
        pick_when: Only a few features are expected to matter
      - id: lasso-cv
        shown_as: LassoCV
        for: [predict-number]
        pick_when: Lasso that picks its own strength
      - id: elastic-net
        shown_as: ElasticNet
        for: [predict-number]
        pick_when: Drop features, but keep correlated ones together
      - id: elastic-net-cv
        shown_as: ElasticNetCV
        for: [predict-number]
        pick_when: ElasticNet that picks its own settings
      - id: lars
        shown_as: Lars
        for: [predict-number]
        pick_when: Far more features than rows; fast
      - id: lasso-lars
        shown_as: LassoLars
        for: [predict-number]
        pick_when: Lasso fitted the LARS way; very wide data
      - id: orthogonal-matching-pursuit
        shown_as: OrthogonalMatchingPursuit
        for: [predict-number]
        pick_when: Keep exactly k features
    - id: model.linear.bayes
      level: family
      names_label: Bayesian linear
      question_label: Fit a line, with uncertainty
