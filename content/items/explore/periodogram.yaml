  prep:
    - step: {family: clean.impute}
      status: required
      why: One gap turns the whole spectrum NaN.
      condition: {has_missing: true}
      unless: null
  code:
    - library: scipy
      target: scipy.signal.periodogram
      why_this_library: One call; returns frequencies and power.
      snippet: |
        # scipy 1.18.1
        import numpy as np
        from scipy.signal import periodogram

        rng = np.random.default_rng(0)
        t = np.arange(240)
        series = 3 * np.sin(2 * np.pi * t / 12) + rng.normal(0, 1, 240)

        freqs, power = periodogram(series)
        peak = np.argmax(power[1:]) + 1
        print(round(1 / freqs[peak], 1))
  what_comes_out:
    items:
      - {name: f, kind: return, task: null, shape: '(n // 2 + 1,)', note: Frequencies in cycles per sample.}
      - {name: Pxx, kind: return, task: null, shape: '(n // 2 + 1,)', note: Power at each frequency.}
    next_step: Turn the peak frequency into a period, in samples.
    visual: null
  catch_outs:
    - Periods are in samples unless fs is set.
    - Default detrend of constant removes only the mean.
