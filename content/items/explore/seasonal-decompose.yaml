  code:
    - library: statsmodels
      target: statsmodels.tsa.seasonal.seasonal_decompose
      why_this_library: One call; returns the parts as arrays.
      snippet: |
        # statsmodels 0.15.0
        import numpy as np
        import pandas as pd
        from statsmodels.tsa.seasonal import seasonal_decompose

        rng = np.random.default_rng(0)
        t = np.arange(120)
        values = 10 + 0.05 * t + 3 * np.sin(2 * np.pi * t / 12)
        values = values + rng.normal(0, 0.5, 120)
        index = pd.date_range("2000-01", periods=120, freq="MS")
        series = pd.Series(values, index=index)

        result = seasonal_decompose(series, model="additive", period=12)
        print(round(result.seasonal.max() - result.seasonal.min(), 2))
  what_comes_out:
    items:
      - {name: trend, kind: return, task: null, shape: same length as input, note: Slow-moving level of the series.}
      - {name: seasonal, kind: return, task: null, shape: same length as input, note: Repeating pattern in each period.}
      - {name: resid, kind: return, task: null, shape: same length as input, note: What trend and season leave behind.}
    next_step: Check whether the residuals still show a pattern.
    visual: null
  catch_outs:
    - Needs two full cycles of data.
    - Gaps raise an error; fill them first.
    - The trend has no values at the ends unless extrapolate_trend is set.
