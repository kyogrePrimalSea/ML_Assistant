  use_avoid:
    use_when: [under a few thousand rows, quick check on one column]
    avoid_when: [above a few thousand rows, data has missing values]
  prep:
    - {step: {family: transform.scale.rescale}, status: not_needed, why: Scale does not change the result., condition: null, unless: null}
  code:
    - library: scipy
      target: scipy.stats.shapiro
      why_this_library: One call; returns statistic and p-value.
      snippet: |
        # scipy 1.18.1
        from scipy.stats import shapiro
        from sklearn.datasets import load_diabetes

        X, y = load_diabetes(return_X_y=True)

        stat, p_value = shapiro(y)
        print(f"{float(p_value):.2e}")
  what_comes_out:
    items:
      - {name: shapiro, kind: return, task: null, shape: "statistic and p-value", note: Small p-value means the sample is not normal.}
    next_step: Check a Q-Q plot before acting on a close call.
    visual: null
  catch_outs:
    - Needs at least three observations.
    - NaNs propagate unless nan_policy changes that.
    - Small p says not normal, not how far off.
