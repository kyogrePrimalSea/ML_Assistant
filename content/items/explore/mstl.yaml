  code:
    - library: statsmodels
      target: statsmodels.tsa.seasonal.MSTL
      why_this_library: One class; fit() returns one part per season.
      snippet: |
        # statsmodels 0.15.0
        import numpy as np
        import pandas as pd
        from statsmodels.tsa.seasonal import MSTL

        rng = np.random.default_rng(0)
        t = np.arange(400)
        values = 10 + 2 * np.sin(2 * np.pi * t / 7) + 4 * np.sin(2 * np.pi * t / 30)
        values = values + rng.normal(0, 0.5, 400)
        series = pd.Series(values, index=pd.date_range("2020-01-01", periods=400))

        result = MSTL(series, periods=[7, 30]).fit()
        print(list(result.seasonal.columns))
  what_comes_out:
    items:
      - {name: fit, kind: method, task: null, shape: MSTL results, note: Runs the decomposition.}
      - {name: trend, kind: return, task: null, shape: same length as input, note: Slow-moving level of the series.}
      - {name: seasonal, kind: return, task: null, shape: 'one column per period', note: Season parts; one column per period given.}
      - {name: resid, kind: return, task: null, shape: same length as input, note: What trend and seasons leave behind.}
    next_step: Compare the season columns to see which period matters most.
    visual: null
  catch_outs:
