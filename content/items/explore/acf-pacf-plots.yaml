    hero: {kind: diagnostic, dataset: airline-passengers, chart: ACF and PACF bars by lag}
    line: Shows how far back each value depends on earlier ones.
  quick_facts:
    facts:
      - {label: Confidence band, value: 95% (alpha 0.05)}
