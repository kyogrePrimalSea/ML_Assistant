  prep:
    - {step: {family: transform.scale.rescale}, status: not_needed, why: Scale does not change the result., condition: null, unless: null}
  code:
    - library: statsmodels
      target: statsmodels.graphics.tsaplots.plot_acf
      why_this_library: Draws both plots with confidence bands in one call.
      snippet: |
        # statsmodels 0.15.0
        import numpy as np
        from statsmodels.graphics.tsaplots import plot_acf
        from statsmodels.tsa.stattools import acf

        rng = np.random.default_rng(0)
        x = np.zeros(200)
        for t in range(1, 200):
            x[t] = 0.7 * x[t - 1] + rng.normal()

        fig = plot_acf(x, lags=20)
        print(acf(x, nlags=3).round(2))
  what_comes_out:
    items:
      - {name: plot_acf, kind: return, task: null, shape: Matplotlib Figure, note: Bars are autocorrelation by lag; band is 95%.}
      - {name: plot_pacf, kind: return, task: null, shape: Matplotlib Figure, note: Each lag's link once shorter lags are removed.}
    next_step: Lags past the band suggest AR or MA orders.
    visual: null
  catch_outs:
    - Rows must be in time order.
    - Lag 0 is always 1.
    - Bands are approximate; read them, do not test with them.
  key_settings:
