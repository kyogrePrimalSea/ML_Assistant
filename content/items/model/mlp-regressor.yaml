  intuition:
    idea: Layers of weighted sums, each followed by a bend, learn a curved line.
    analogy: A chain of simple calculators, each passing its result onward.
    animation: none
    good_at:
    - complex patterns
    - plenty of rows
    - non-linear effects
    bad_at:
    - tiny data
    - extrapolation
    - explaining the answer
    vs_siblings:
    - page: mlp-classifier
      note: Same network. Predicts a class, not a number.
    goal: Adjust layered weights to map scaled features to a numeric target while reducing regression loss.
    steps:
    - Scale features using training rows.
    - Initialize a weight matrix and bias for each connection.
    - Apply affine transformations and hidden activations from input to output.
    - Measure regression loss and backpropagate gradients to update weights and biases.
    - Repeat optimizer iterations until convergence, early stopping, or max_iter.
    math:
      notation:
      - symbol: a_0=x
        meaning: Input vector.
      - symbol: W_l,b_l
        meaning: Weights and bias at layer l.
      - symbol: phi
        meaning: Hidden activation function.
      - symbol: a_l
        meaning: Layer l activations.
      - symbol: L(y,yhat)
        meaning: Regression loss.
      equations:
      - expression: a_l=phi(a_(l-1) W_l+b_l)
        meaning: Each layer applies a learned affine transformation and activation.
      - expression: min_(W,b) mean_i L(y_i,f(x_i)) + alpha/(2n) sum_l ||W_l||_F^2
        meaning: Fit reduces regression loss with L2 penalty on weights using backpropagation and an optimizer.
      - expression: yhat=a_(L-1) W_L+b_L
        meaning: The regression output layer uses identity activation, so its weighted sum is the numeric prediction.
      prediction: predict returns one numeric value per row. Weights describe the fitted function; they do not prove causes.
    read_more:
    - Multiply inputs by weights and add a bias.
    - Pass the result through an activation.
    - Repeat for each hidden layer, then output one number.
