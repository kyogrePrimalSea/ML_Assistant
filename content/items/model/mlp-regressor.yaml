    next_step: "Check loss_curve_ flattens before trusting the score."
    snippet: |
      # scikit-learn 1.9.1
      import pandas as pd
      from sklearn.datasets import load_diabetes
      from sklearn.neural_network import MLPRegressor
      from sklearn.preprocessing import StandardScaler

      data = load_diabetes(as_frame=True)
      X = pd.DataFrame(
          StandardScaler().fit_transform(data.data),
          columns=data.feature_names,
      )
      model = MLPRegressor(hidden_layer_sizes=(32,), max_iter=1000, random_state=0)
      model.fit(X, data.target)
      print(model.predict(X[:3]).shape)
      print(round(model.score(X, data.target), 3))
      print(model.n_features_in_)
      print(model.n_iter_)
    snippet_library: scikit-learn
    visual: null
