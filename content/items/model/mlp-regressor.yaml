    - task: regression
      text: Scale neural-network inputs using training rows only; use probabilities for ranking and labels for confusion matrices.
  catch_outs:
  - Training stops at max_iter even when it has not converged.
  - Early stopping is off by default; set early_stopping=True to use it.
  - A score on training rows flatters the model.
  key_settings:
    tier1:
    - name: hidden_layer_sizes
      page: null
      controls: Sets number and width of hidden layers.
      effect: More units can fit richer functions but add weights and overfit risk.
    - name: learning_rate_init
      page: learning-rate
      controls: Sets initial step size for sgd/adam.
      effect: Large steps may overshoot; small steps learn more slowly.
    - name: alpha
      page: null
      controls: Sets L2 weight regularization.
      effect: More penalty can reduce overfit but underfit.
    - name: early_stopping
      page: null
      controls: Holds out validation rows and stops when validation score stalls.
      effect: Can limit overfitting but leaves fewer rows for fitting weights.
    tier2:
    - name: activation
      page: null
      controls: Chooses hidden-layer activation.
      effect: Changes representable nonlinearities; identity removes hidden bends.
    - name: solver
      page: null
      controls: Chooses lbfgs, sgd, or adam.
      effect: Solvers differ in minibatch behavior and convergence.
    - name: max_iter
      page: null
      controls: Caps optimization iterations.
      effect: A larger cap may permit convergence but takes longer.
    tier3:
    - name: loss
      page: null
      controls: Chooses regression objective, including squared error or Poisson where supported.
      effect: Changes which errors are penalized; Poisson requires nonnegative targets.
    - name: batch_size
      page: null
      controls: Sets stochastic optimizer minibatch size.
      effect: Small batches update often but noisily; large batches use more memory.
    - name: validation_fraction
      page: null
      controls: Sets validation share when early_stopping is on.
      effect: More validation data improves stopping estimates but reduces fit rows.
    - name: n_iter_no_change
      page: null
      controls: Sets tolerated iterations without sufficient improvement.
      effect: Lower values stop sooner; higher values tolerate plateaus.
  watch_it_work:
