    snippet: |
      # scikit-learn 1.9.1
      import warnings, numpy as np, pandas as pd
      from sklearn.datasets import make_regression
      from sklearn.exceptions import ConvergenceWarning
      from sklearn.model_selection import train_test_split
      from sklearn.neural_network import MLPRegressor
      from sklearn.preprocessing import StandardScaler
      warnings.filterwarnings('ignore',category=ConvergenceWarning)
      X,y=make_regression(
          n_samples=90, n_features=4, n_informative=3, noise=4, random_state=0
      )
      Xt,Xv,yt,yv=train_test_split(X,y,test_size=.25,random_state=0)
      s=StandardScaler().fit(Xt)
      columns=['feature_a','feature_b','feature_c','feature_d']
      Xt=pd.DataFrame(s.transform(Xt),columns=columns)
      Xv=pd.DataFrame(s.transform(Xv),columns=columns)
      ys=StandardScaler().fit(yt.reshape(-1,1))
      yts=ys.transform(yt.reshape(-1,1)).ravel()
      ysv=ys.transform(yv.reshape(-1,1)).ravel()
      m=MLPRegressor(
          hidden_layer_sizes=(6,3), solver='lbfgs', max_iter=1000, random_state=0
      ).fit(Xt,yts)
      y_pred=ys.inverse_transform(m.predict(Xv[:3]).reshape(-1,1)).ravel()
      print('y_pred:',np.round(y_pred,1))
      print('R2:',round(m.score(Xv,ysv),3))
      print('coefs:',[w.shape for w in m.coefs_])
      print('biases:',[b.shape for b in m.intercepts_])
      print('loss/iterations/features:',round(m.loss_,3),m.n_iter_,m.n_features_in_)
      print('feature_names_in_:',m.feature_names_in_)
    output: |
      y_pred: [-38.3 150.3 179.9]
      R2: 0.997
      coefs: [(4, 6), (6, 3), (3, 1)]
      biases: [(6,), (3,), (1,)]
      loss/iterations/features: 0.0 59 4
      feature_names_in_: ['feature_a' 'feature_b' 'feature_c' 'feature_d']
  what_comes_out:
    items:
    - name: predict
      kind: method
      task: regression
      shape: (n_samples,)
      object_type: numpy.ndarray
      example: '[12.4, -3.1, 7.8]'
      shape_explanation: One numeric prediction per row; three rows give shape (3,).
      note: Continuous output for single-target regression.
    - name: score
      kind: method
      task: regression
      shape: scalar
      object_type: float
      example: '0.72'
      shape_explanation: One scalar, no array dimensions.
      note: R² on the supplied rows; can be negative.
    - name: coefs_
      kind: attribute
      task: null
      shape: list of n_layers - 1 matrices
      object_type: list[numpy.ndarray]
      example: '[(4, 6), (6, 3), (3, 1)]'
      shape_explanation: One matrix connects each adjacent pair of layers. Four inputs, hidden widths 6 and 3, and one numeric output give these three shapes.
      note: Rows connect prior-layer units to next-layer units.
    - name: intercepts_
      kind: attribute
      task: null
      shape: list of n_layers - 1 vectors
      object_type: list[numpy.ndarray]
      example: '[(6,), (3,), (1,)]'
      shape_explanation: One bias vector per non-input layer; lengths equal layer widths.
      note: Added to each layer weighted sum.
    - name: loss_
      kind: attribute
      task: null
      shape: scalar
      object_type: float
      example: '0.021'
      shape_explanation: One scalar training-loss value with no array dimensions.
      note: Current fitted regression loss at the end of training.
    - name: n_iter_
      kind: attribute
      task: null
      shape: scalar
      object_type: int
      example: '250'
      shape_explanation: One integer count, not an array.
      note: May stop before max_iter.
    - name: n_features_in_
      kind: attribute
      task: null
      shape: scalar
      object_type: int
      example: '4'
      shape_explanation: One integer equal to input column count.
      note: Input width.
    - name: feature_names_in_
      kind: attribute
      task: null
      shape: (n_features_in_,)
      object_type: numpy.ndarray of str
      example: '[''age'', ''fare'', ''pclass'']'
      shape_explanation: One name per column; present only when fit receives all-string feature names.
      note: Names do not provide causal explanations.
    next_step: Check loss_curve_ flattens before trusting the score.
