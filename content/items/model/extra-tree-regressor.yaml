  catch_outs:
  - Text columns fail. Encode them first.
  - Set random_state, or the random splits change between runs.
  - max_depth None grows the tree until its leaves are pure. Set a limit.
  key_settings:
    tier1:
    - name: criterion
      page: null
      controls: The error or impurity measure minimized by a regression split.
      effect: Squared error favors means; absolute error is more robust but can cost more; Poisson requires non-negative
        targets.
    - name: min_impurity_decrease
      page: null
      controls: Minimum weighted impurity reduction required for a split.
      effect: A larger threshold grows a smaller tree and can miss useful detail.
    - name: max_features
      page: null
      controls: How many candidate input columns are considered at each split.
      effect: Fewer candidates add randomness and may reduce overfit, but can weaken a tree.
    - name: min_samples_leaf
      page: null
      controls: Minimum training rows required in every leaf.
      effect: Larger leaves smooth predictions and resist noise, but can miss local patterns.
    tier2:
    - name: monotonic_cst
      page: null
      controls: Per-feature constraints requiring predictions to move only in specified directions.
      effect: Constraints can encode known direction but restrict learned patterns.
    - name: ccp_alpha
      page: null
      controls: Strength of minimal cost-complexity pruning after growth.
      effect: Larger values prune more branches and can underfit.
    - name: min_samples_split
      page: null
      controls: Minimum rows a node must contain before it may split.
      effect: Larger values stop growth earlier and may smooth away useful detail.
    tier3:
    - name: max_leaf_nodes
      page: null
      controls: Maximum number of terminal leaves, grown by best-first impurity reduction.
      effect: Fewer leaves simplify the tree but limit local patterns.
    - name: splitter
      page: null
      controls: Whether each split uses the best threshold or randomly sampled thresholds.
      effect: Random thresholds add variation and may reduce variance, with more bias.
    - name: max_depth
      page: max-depth
      controls: Maximum number of levels from root to leaf.
      effect: Shallower trees are simpler but can underfit.
  watch_it_work:
    none: true
  intuition:
    idea: Grow one tree, drawing a random cut for each feature and keeping the best.
    analogy: Trying a few random cuts of a cake and keeping the one that splits it best.
    animation: none
    good_at:
    - tabular data
    - fast fits
    - one readable tree
    bad_at:
    - tiny data
    - images or text
    - smooth curves
    vs_siblings:
    - page: decision-tree-regressor
      note: Tries every cut. This one draws the cuts at random.
    - page: extra-trees
      note: Many of these trees, averaged together.
    read_more: &id001
    - At each node, draw candidate thresholds at random for sampled features.
    - Choose the sampled split with the greatest reduction in the selected regression criterion.
    - Repeat until a stopping rule creates leaves.
    - Predict from the target summary stored in the reached leaf.
    goal: Fit one readable piecewise-constant regression tree while randomizing candidate thresholds to vary its
      structure.
    steps: *id001
    math:
      notation:
      - symbol: A
        meaning: Rows reaching the current parent node.
      - symbol: j
        meaning: Input feature considered at this node.
      - symbol: t
        meaning: Random threshold proposed for feature j.
      - symbol: L, R
        meaning: Left and right child row groups.
      - symbol: i
        meaning: Training-row index.
      - symbol: x
        meaning: New input row to predict.
      - symbol: y_i
        meaning: Observed target for training row i.
      equations:
      - expression: choose (j,t) from random candidates to minimize impurity(L)+impurity(R)
        meaning: The tree draws candidate thresholds at random, then keeps the sampled split with the best criterion
          value.
      - expression: predict(x) = mean(y_i for i in leaf(x))
        meaning: With squared-error criterion, the prediction is the average training target in the reached leaf.
      prediction: A single tree returns its reached leaf value; with absolute_error the leaf summary is a median
        instead of a mean.
