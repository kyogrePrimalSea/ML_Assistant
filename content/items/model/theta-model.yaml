slots:
  header: {}
  solves:
    hero: {kind: model, dataset: airline-passengers, shape: fit_line}
    line: "A simple benchmark: remove the season, then a trend."
  quick_facts:
    data_size: 2+ seasons, e.g. 24 monthly points
  use_avoid:
    use_when: [need a quick benchmark, seasonal series]
