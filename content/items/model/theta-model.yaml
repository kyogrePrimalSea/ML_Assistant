targets:
- statsmodels.tsa.forecasting.theta.ThetaModel
pairs_with: []
clashes: []
source_urls:
- https://www.statsmodels.org/stable/generated/statsmodels.tsa.forecasting.theta.ThetaModel.html
- https://www.statsmodels.org/stable/generated/statsmodels.tsa.forecasting.theta.ThetaModelResults.forecast.html
