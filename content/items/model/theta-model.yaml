      condition: null
      unless: null
  code:
    - library: statsmodels
      target: statsmodels.tsa.forecasting.theta.ThetaModel
      why_this_library: Benchmark built in, with season testing.
      snippet: |
        # statsmodels 0.15.0
        import numpy as np
        from statsmodels.tsa.forecasting.theta import ThetaModel

        rng = np.random.default_rng(0)
        t = np.arange(144)
        y = 100 + 0.8 * t + 10 * np.sin(2 * np.pi * t / 12)
        y = y + rng.normal(0, 2, 144)

        model = ThetaModel(y[:132], period=12)
        res = model.fit()
        print(np.round(res.forecast(12), 1).tolist())
  what_comes_out:
    items:
      - {name: forecast, kind: return, task: regression, shape: "(steps,) Series",
         note: "Forecast from the fitted result. Pass the number of steps."}
      - {name: deseasonalize, kind: attribute, task: null, shape: "bool",
         note: "True by default. Season is removed before forecasting."}
      - {name: difference, kind: attribute, task: null, shape: "bool",
         note: "False by default. Set True to difference first."}
    next_step: Use as the benchmark that other models must beat.
    visual: null
  catch_outs:
