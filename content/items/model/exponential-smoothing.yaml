      target: statsmodels.tsa.holtwinters.ExponentialSmoothing
      why_this_library: Holt-Winters in one class, with season settings.
      snippet: |
        # statsmodels 0.15.0
        import numpy as np
        from statsmodels.tsa.holtwinters import ExponentialSmoothing

        rng = np.random.default_rng(0)
        t = np.arange(144)
        y = 100 + 0.8 * t + 10 * np.sin(2 * np.pi * t / 12)
        y = y + rng.normal(0, 2, 144)

        model = ExponentialSmoothing(
            y[:132], trend="add", seasonal="add", seasonal_periods=12,
        )
        res = model.fit()
        print(np.round(res.predict(132, 143), 1).tolist())
