  code:
  - library: statsmodels
    target: statsmodels.tsa.holtwinters.ExponentialSmoothing
    why_this_library: Holt-Winters in one class, with season settings.
    snippet: "# statsmodels 0.15.0\nimport numpy as np\nfrom statsmodels.tsa.holtwinters import ExponentialSmoothing\n\
      \nrng = np.random.default_rng(0)\nt = np.arange(144)\ny = 100 + 0.8 * t + 10 * np.sin(2 * np.pi * t / 12)\n\
      y = y + rng.normal(0, 2, 144)\n\nmodel = ExponentialSmoothing(\n    y[:132], trend=\"add\", seasonal=\"add\"\
      , seasonal_periods=12,\n)\nres = model.fit()\ny_pred = res.forecast(3)\ny_pred = res.forecast(3)\nprint(\"\
      forecast:\", np.round(y_pred, 2).tolist())\n"
    output: 'forecast: [205.06, 211.32, 216.09]

      '
  what_comes_out:
    items:
    - name: fitted Results object
      kind: return
      task: null
      shape: results object
      note: Returned by model.fit(); holds fitted parameters and forecasting methods.
      object_type: statsmodels HoltWintersResultsWrapper
      example: HoltWintersResultsWrapper(...)
      shape_explanation: A fitted Python HoltWintersResultsWrapper object, with no array shape; it holds estimates
        and prediction methods.
    - name: forecast result
      kind: return
      task: regression
      shape: (steps,)
      note: forecast(steps) returns future means; predict(start,end) can select fitted or future positions.
      object_type: numpy.ndarray
      example: '[205.1, 211.3, 216.1]'
      shape_explanation: steps is the number of future time points; three displayed values give shape (3,).
    - name: fitted values
      kind: return
      task: regression
      shape: (n_obs,)
      note: One-step fitted estimates aligned with observed time points.
      object_type: numpy.ndarray
      example: '[100.2, 101.1, 102.3]'
      shape_explanation: n_obs is the observed-series length; the fictional example shows three fitted points.
    - name: fitted parameters
      kind: return
      task: null
      shape: dict
      note: Fitted smoothing weights and component states.
      object_type: dict
      example: '{"smoothing_level": 0.4, "smoothing_trend": 0.1}'
      shape_explanation: A Python dict maps quoted parameter-name strings to numeric values; this example has two
        entries.
    - name: residuals
      kind: return
      task: regression
      shape: (n_obs,)
      note: Observed minus fitted values across the estimation sample.
      object_type: numpy.ndarray
      example: '[0.1, -0.2, 0.05]'
      shape_explanation: One residual per observed point; the three-value example corresponds to n_obs=3.
    - name: AIC
      kind: return
      task: null
      shape: scalar
      note: Likelihood-based criterion for comparing compatible fitted models.
      object_type: numpy.float64
      example: np.float64(128.4)
      shape_explanation: A numpy.float64 scalar contains one criterion value and has no array dimensions.
    next_step: Compare forecasts on a held-out future window and inspect residual patterns.
    visual: null
    snippet: "# statsmodels 0.15.0\nimport numpy as np\nfrom statsmodels.tsa.holtwinters import ExponentialSmoothing\n\
      \nrng = np.random.default_rng(0)\nt = np.arange(144)\ny = 100 + 0.8 * t + 10 * np.sin(2 * np.pi * t / 12)\n\
      y = y + rng.normal(0, 2, 144)\n\nmodel = ExponentialSmoothing(\n    y[:132], trend=\"add\", seasonal=\"add\"\
      , seasonal_periods=12,\n)\nres = model.fit()\ny_pred = res.forecast(3)\ny_pred = res.forecast(3)\nprint(\"\
      forecast:\", np.round(y_pred, 2).tolist())\nprint(\"fitted shape:\", res.fittedvalues.shape, \"resid shape:\"\
      , res.resid.shape)\nprint(\"smoothing_level:\", round(res.params[\"smoothing_level\"], 3))\nprint(\"AIC:\"\
      , round(float(res.aic), 2))\n"
    snippet_library: statsmodels
    output: 'forecast: [205.06, 211.32, 216.09]

      fitted shape: (132,) resid shape: (132,)

      smoothing_level: 0.0

      AIC: 184.02

      '
  catch_outs:
  - Time order must be preserved; random shuffling invalidates the forecast horizon.
  key_settings:
    tier1:
    - name: seasonal_periods
      page: null
      controls: Number of observations in one seasonal cycle.
      effect: Wrong cycle length misaligns seasonal states.
    - name: trend
      page: null
      controls: Additive, multiplicative or absent trend component.
      effect: Trend choice changes whether growth adds or multiplies over time.
    - name: seasonal
      page: null
      controls: Additive, multiplicative or absent seasonal component.
      effect: Seasonal choice changes how the cycle combines with level and trend.
    - name: damped_trend
      page: null
      controls: Whether the trend contribution decays over forecast horizon.
      effect: Damping reduces long-range trend growth.
    tier2:
    - name: initialization_method
      page: null
      controls: How initial level, trend and seasonal states are set.
      effect: Estimated, heuristic and known methods trade fitting effort against fixed starting states.
    - name: initial_seasonal
      page: null
      controls: Initial seasonal states for known initialization.
      effect: Starting values affect fitted seasonal states.
    - name: use_boxcox
      page: null
      controls: Whether to Box-Cox transform the input before fitting.
      effect: Can stabilize variance but changes the modeled scale.
    - name: bounds
      page: null
      controls: Parameter ranges for smoothing and initial states.
      effect: Tighter bounds constrain the fitted dynamics.
    tier3:
    - name: initial_level
      page: null
      controls: Known initial level when initialization_method is known.
      effect: Supplied values fix the starting state.
    - name: initial_trend
      page: null
      controls: Known initial trend when initialization_method is known.
      effect: Supplied values fix the starting slope.
    - name: missing
      page: null
      controls: How missing observations are handled.
      effect: Resolve gaps carefully so observations retain their intended time spacing.
  watch_it_work:
    none: true
  intuition:
    idea: Track level, trend and season, weighting recent values more.
    analogy: Like a shop manager who trusts this week's numbers more than last year's.
    animation: none
    good_at:
    - trend and season
    - recent values matter
    bad_at:
    - outside drivers
    - very short series
    vs_siblings:
    - page: ets-model
      note: Same idea, built as a state space model.
    - page: theta-model
      note: A simpler benchmark, often hard to beat.
    read_more: &id001
    - Initialize the level and any selected trend and seasonal states.
    - Compute the next value from current states and calculate its forecast error.
    - Use smoothing weights to update states, then project them forward.
    goal: Forecast by recursively updating level, trend and seasonal states from one-step errors.
    steps: *id001
    math:
      notation:
      - symbol: ℓ_t
        meaning: level at time t
      - symbol: b_t
        meaning: trend at time t
      - symbol: s_t
        meaning: seasonal state with cycle m
      - symbol: α,β,γ
        meaning: level, trend and seasonal smoothing weights
      - symbol: e_t
        meaning: observed value minus its one-step forecast
      - symbol: m
        meaning: observations per seasonal cycle
      - symbol: ŷ_{t+1}
        meaning: one-step-ahead forecast from current states
      equations:
      - expression: ŷ_{t+1}=ℓ_t+b_t+s_{t+1-m}
        meaning: For additive components, the next forecast combines level, trend and the matching seasonal state.
      - expression: ℓ_{t+1}=ℓ_t+b_t+αe_{t+1}; b_{t+1}=b_t+βe_{t+1}; s_{t+1}=s_{t+1-m}+γe_{t+1}
        meaning: The smoothing weights determine how an observed forecast error updates each state.
      prediction: Holt-Winters directly smooths states; it has no AR or MA error-lag terms or external regressors.
  next: []
