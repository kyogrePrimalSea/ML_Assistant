  prep: []
  code:
    - library: scikit-learn
      target: sklearn.gaussian_process.GaussianProcessRegressor
      why_this_library: "Built into scikit-learn; returns a standard deviation too."
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import make_friedman1
        from sklearn.gaussian_process import GaussianProcessRegressor
        from sklearn.model_selection import train_test_split
        from sklearn.pipeline import make_pipeline
        from sklearn.preprocessing import StandardScaler

        X, y = make_friedman1(n_samples=300, noise=0.5, random_state=0)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = make_pipeline(
            StandardScaler(),
            GaussianProcessRegressor(normalize_y=True, random_state=0),
        )
        model.fit(X_train, y_train)
        mean, std = model.predict(X_test, return_std=True)
        print(std.shape)
        print(round(model.score(X_test, y_test), 3))
  what_comes_out:
    items:
      - {name: predict, kind: method, task: regression, shape: "(n_samples,)",
         note: "One value per row. return_std=True adds the spread."}
      - {name: score, kind: method, task: regression, shape: "float",
         note: "R squared on the data you pass in."}
      - {name: sample_y, kind: method, task: regression, shape: "(n_samples, n_draws)",
         note: "Random curves drawn from the fitted model."}
      - {name: kernel_, kind: attribute, task: null, shape: "fitted kernel object",
         note: "The kernel after fit, with tuned length scales."}
    next_step: "Use predict(X, return_std=True) to get the error bars."
    visual: regression_preds
  catch_outs:
