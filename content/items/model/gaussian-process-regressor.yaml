  catch_outs:
  - normalize_y is off by default; turn it on to centre the targets.
  - alpha is added to the diagonal to avoid numerical errors.
  - Stores a copy of the training data by default.
  - Built for small data; training slows as rows grow.
  key_settings:
    tier1:
    - name: kernel
      page: null
      controls: Covariance function defining similarity and smoothness between input rows.
      effect: A more appropriate kernel can model the pattern; a poor choice limits fit.
    - name: alpha
      page: null
      controls: Noise variance added to the training kernel diagonal; scalar or one value per training row.
      effect: More noise stabilizes factorization and smooths fit, but can hide signal.
    - name: normalize_y
      page: null
      controls: Whether to center and scale targets before fitting, then reverse it for predictions.
      effect: Normalization helps when the prior assumes standardized targets; predictions return to original units.
    - name: n_restarts_optimizer
      page: null
      controls: Number of extra log-uniform starts for kernel hyperparameter optimization.
      effect: More starts may find a better likelihood maximum but increase fitting time.
    tier2:
    - name: optimizer
      page: null
      controls: Optimizer used to maximize log marginal likelihood over kernel parameters.
      effect: None holds kernel parameters fixed; optimizing may improve fit but can find local optima.
    tier3:
    - name: copy_X_train
      page: null
      controls: Whether to keep a persistent copy of training inputs for later predictions.
      effect: Copying uses more memory; without it, external edits to X can affect predictions.
    - name: n_targets
      page: null
      controls: Number of outputs for prior sampling before fit; ignored once fitted.
      effect: Set it only when drawing prior samples with multiple outputs; it does not alter fitted targets.
  watch_it_work:
    none: true
  intuition:
    idea: Learn a smooth curve through the points, and report how sure it is.
    analogy: A map with a best-guess line and a shaded zone of doubt.
    animation: none
    good_at:
    - small data
    - error bars
    - smooth curves
    bad_at:
    - large data
    - images or text
    - fast training
    vs_siblings:
    - page: kernel-ridge
      note: Same kernel idea. Kernel ridge gives no error bars.
    read_more:
    - A kernel defines prior covariance; similar input rows have related function values.
    - The fitted kernel parameters maximize log marginal likelihood.
    - Dense Cholesky factorization is cubic in training rows and stores a quadratic matrix.
    goal: Infer a smooth latent function and a posterior uncertainty from kernel similarities among training rows.
    steps:
    - Choose a kernel that defines prior covariance between rows.
    - Add alpha to the training covariance diagonal to represent noise and stabilize factorization.
    - Optimize kernel parameters by maximizing log marginal likelihood.
    - Condition the Gaussian prior on observed targets to obtain a posterior mean and covariance.
    - Return the mean and, when requested, standard deviation or covariance for query rows.
    math:
      notation:
      - symbol: k(x,x′)
        meaning: Kernel covariance between inputs x and x-prime.
      - symbol: K
        meaning: Training covariance matrix with alpha added to its diagonal.
      - symbol: k_*
        meaning: Covariances from training inputs to a query input.
      - symbol: y
        meaning: Observed training target vector.
      - symbol: mu_*
        meaning: Posterior predictive mean.
      - symbol: sigma_*^2
        meaning: Posterior predictive variance.
      - symbol: n_train
        meaning: Number of training rows used in the kernel matrix.
      equations:
      - expression: K = [k(x_i,x_j)] + alpha I
        meaning: The kernel fills pairwise training covariances; alpha adds diagonal noise.
      - expression: mu_* = k_*^T K^-1 y
        meaning: The posterior mean weights training targets by their covariance with the query.
      - expression: sigma_*^2 = k(x_*,x_*) - k_*^T K^-1 k_*
        meaning: Uncertainty is prior query variance minus information supplied by training rows.
      prediction: Means are point predictions; return_std gives marginal SD and return_cov joint covariance. Dense
        fitting is cubic.
