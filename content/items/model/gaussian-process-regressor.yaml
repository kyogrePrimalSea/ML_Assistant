  - library: scikit-learn
    target: sklearn.gaussian_process.GaussianProcessRegressor
    why_this_library: Built into scikit-learn; returns a standard deviation too.
    snippet: "# scikit-learn 1.9.1\nfrom sklearn.datasets import make_friedman1\nfrom sklearn.gaussian_process import\
      \ GaussianProcessRegressor\nfrom sklearn.gaussian_process.kernels import ConstantKernel, RBF\nfrom sklearn.model_selection\
      \ import train_test_split\nfrom sklearn.pipeline import make_pipeline\nfrom sklearn.preprocessing import StandardScaler\n\
      \nX, y = make_friedman1(n_samples=100, n_features=5, noise=0.4, random_state=0)\nX_train, X_test, y_train,\
      \ y_test = train_test_split(X, y, random_state=0)\nmodel = make_pipeline(\n    StandardScaler(),\n    GaussianProcessRegressor(\n\
      \        kernel=ConstantKernel(1.0, (0.1, 10.0)) * RBF(1.0, (0.1, 10.0)),\n        alpha=0.05,\n        normalize_y=True,\n\
      \        random_state=0,\n    ),\n).fit(X_train, y_train)\ngp = model.named_steps[\"gaussianprocessregressor\"\
      ]\ny_mean, y_std = model.predict(X_test[:3], return_std=True)\nprint(\"posterior mean:\", y_mean.round(2))\n\
      print(\"posterior std:\", y_std.round(2))\nprint(\"score:\", round(model.score(X_test, y_test), 3))\n"
    output: 'posterior mean: [14.73 15.34 17.5 ]

      posterior std: [0.86 0.57 1.16]

      score: 0.888

      '
  what_comes_out:
    items:
    - name: predict
      kind: method
      task: regression
      shape: (n_samples,)
      object_type: numpy.ndarray
      example: '[2.41, 3.08, 2.76]'
      shape_explanation: For this single-target example, one posterior mean per 3 query rows gives shape (3,).
      note: Default returns means; a multi-target fit adds a target axis.
    - name: predict
      kind: method
      task: regression
      shape: (n_samples,), (n_samples,)
      object_type: tuple[numpy.ndarray,numpy.ndarray]
      example: ([2.41, 3.08, 2.76], [0.31, 0.44, 0.28])
      shape_explanation: 'return_std=True returns a tuple: posterior mean and standard deviation. Each array has
        one value per 3 query rows, shape (3,).'
      note: The second array is marginal posterior standard deviation, not predicted values.
    - name: predict(return_cov=True)
      kind: return
      task: regression
      shape: (n_samples,), (n_samples,n_samples)
      object_type: tuple[numpy.ndarray,numpy.ndarray]
      example: ([2.41, 3.08, 2.76], [[0.10, 0.02, 0.01], [0.02, 0.19, 0.03], [0.01, 0.03, 0.08]])
      shape_explanation: return_cov=True returns mean values for 3 rows and their 3-by-3 covariance matrix, so the
        tuple contains shapes (3,) and (3, 3).
      note: The covariance array gives joint uncertainty across query rows.
    - name: sample_y
      kind: method
      task: regression
      shape: (n_samples, n_draws)
      object_type: numpy.ndarray
      example: '[[2.1, 2.7], [3.3, 2.9], [2.5, 2.8]]'
      shape_explanation: Rows are 3 query inputs and columns are 2 sampled function draws, shape (3, 2).
      note: Draws from the fitted posterior at query inputs.
    - name: kernel_
      kind: attribute
      task: null
      shape: kernel object
      object_type: kernel object
      example: 1.24**2 * RBF(length_scale=[0.8, 1.2])
      shape_explanation: One fitted kernel object has no array axes. This fictional two-feature RBF uses one length
        scale for each of its two feature dimensions.
      note: Hyperparameters are optimized by maximizing log marginal likelihood.
    - name: log_marginal_likelihood_value_
      kind: attribute
      task: null
      shape: scalar
      object_type: numpy.float64
      example: '-32.415'
      shape_explanation: One fitted likelihood value is a NumPy float64 scalar, not an array, so it has no array
        dimensions.
      note: Value of the log marginal likelihood at fitted kernel parameters.
    - name: L_
      kind: attribute
      task: null
      shape: (n_train, n_train)
      object_type: numpy.ndarray
      example: '[[1.0, 0.0], [0.2, 0.8]]'
      shape_explanation: Rows and columns index training cases. This fictional example has 2 training rows, so its
        matrix is (2, 2); 75 actual training rows produce (75, 75).
      note: Cholesky factorization reflects cubic training and quadratic storage costs.
    next_step: null
    visual: regression_preds
    guidance:
    - task: regression
      text: Use the posterior mean for point metrics; inspect return_std or return_cov separately to assess uncertainty.
    snippet: "# scikit-learn 1.9.1\nfrom sklearn.datasets import make_friedman1\nfrom sklearn.gaussian_process import\
      \ GaussianProcessRegressor\nfrom sklearn.gaussian_process.kernels import ConstantKernel, RBF\nfrom sklearn.model_selection\
      \ import train_test_split\nfrom sklearn.pipeline import make_pipeline\nfrom sklearn.preprocessing import StandardScaler\n\
      \nX, y = make_friedman1(n_samples=100, n_features=5, noise=0.4, random_state=0)\nX_train, X_test, y_train,\
      \ y_test = train_test_split(X, y, random_state=0)\nmodel = make_pipeline(StandardScaler(), GaussianProcessRegressor(\n\
      \    kernel=ConstantKernel(1.0, (0.1, 10.0)) * RBF(1.0, (0.1, 10.0)),\n    alpha=0.05, normalize_y=True, random_state=0,\n\
      )).fit(X_train, y_train)\ngp = model.named_steps[\"gaussianprocessregressor\"]\nmean, std = gp.predict(X_test[:3],\
      \ return_std=True)\n_, cov = gp.predict(X_test[:3], return_cov=True)\ndraws = gp.sample_y(X_test[:3], n_samples=2,\
      \ random_state=0)\nprint(\"mean/std:\", mean.round(2), std.round(2))\nprint(\"covariance shape:\", cov.shape)\n\
      print(\"sample_y shape:\", draws.shape)\nprint(\"kernel_:\", gp.kernel_)\nprint(\"LML value:\", round(gp.log_marginal_likelihood_value_,\
      \ 3))\nprint(\"L_ shape:\", gp.L_.shape)\n"
    snippet_library: scikit-learn
