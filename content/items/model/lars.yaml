id: lars
plain_name: Lars
code_name: Lars
aliases: [least angle regression, lar]
stage: model
family: model.linear.sparse
tracks: [standard]
archetype: model
question_tags: [more features than rows, wide data, fast path]
targets: [sklearn.linear_model.Lars]
pairs_with: []
clashes: []
source_urls: ['https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.Lars.html']
library_versions: {scikit-learn: 1.9.1}
reviewed: false
rules:
  task_types: [regression]
  blocked_when: []
  fits_on_data: true
  shape_effect: {rows: same, columns: same}
slots:
  header: {}
  solves:
    hero: {kind: model, dataset: ames, shape: fit_line}
    line: A fast line fitted step by step along the whole path.
  quick_facts: {none: true}
  use_avoid:
    use_when: [more features than rows, wide data]
    avoid_when: [classification targets, curved patterns]
  prep:
    - step: {family: clean.impute}
      status: required
      why: Scikit-learn rejects NaN in X.
      condition: {has_missing: true}
      unless: null
    - step: {family: transform.encode.features}
      status: required
      why: Text categories must become numbers.
      condition: {has_categoricals: true}
      unless: null
    - step: {family: transform.scale.rescale}
      status: required
      why: Units decide which columns are picked first.
      condition: null
      unless: null
  code:
    - library: scikit-learn
      target: sklearn.linear_model.Lars
      why_this_library: Built into scikit-learn. Keeps the full path by default.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_diabetes
        from sklearn.linear_model import Lars
        from sklearn.model_selection import train_test_split
        from sklearn.pipeline import make_pipeline
        from sklearn.preprocessing import StandardScaler

        X, y = load_diabetes(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(
            X, y, random_state=0
        )

        model = make_pipeline(StandardScaler(), Lars())
        model.fit(X_train, y_train)
        print(int((model[-1].coef_ != 0).sum()))
  what_comes_out:
    items:
      - {name: predict, kind: method, task: null, shape: "(n_samples,)", note: "One predicted value per row."}
      - {name: score, kind: method, task: null, shape: float, note: "R squared on the data you pass in."}
      - {name: coef_, kind: attribute, task: null, shape: "(n_features,)", note: "Weights at the end of the path."}
      - {name: intercept_, kind: attribute, task: null, shape: float, note: "Intercept of the fitted line."}
      - {name: coef_path_, kind: attribute, task: null, shape: "(n_features, n_alphas + 1)", note: "Weights at each step. Needs fit_path=True."}
      - {name: active_, kind: attribute, task: null, shape: "list per step", note: "Which features are in at each step."}
    next_step: Plot coef_path_ to see how the weights change along the path.
    visual: null
  catch_outs:
    - n_nonzero_coefs (default 500) caps how many features it keeps.
    - coef_path_ is only stored when fit_path is True.
    - Scale the columns first, or the units decide the picks.
    - Missing values stop the fit. Impute them first.
  key_settings:
    tier1:
      - {name: n_nonzero_coefs, page: null}
      - {name: fit_intercept, page: null}
      - {name: fit_path, page: null}
    tier2:
      - {name: precompute, page: null}
      - {name: jitter, page: null}
      - {name: copy_X, page: null}
    tier3:
      - {name: eps, page: null}
      - {name: random_state, page: null}
  watch_it_work: {none: true}
  intuition:
    idea: Move the weights toward the answer, adding one feature at a time.
    analogy: A group of hikers who split off only when another hiker catches up.
    animation: none
    good_at: [wide data, fast fits]
    bad_at: [classification, curved patterns]
    vs_siblings:
      - {page: lasso-lars, note: "Same path method, with a lasso penalty."}
      - {page: orthogonal-matching-pursuit, note: "Stops at a fixed count of features."}
    read_more:
      - Start with all weights at zero.
      - Move the weight of the feature most correlated with the residual.
      - Keep moving until another feature catches up.
  next: [know-feature-importance]
