  watch_it_work: {none: true}
  intuition:
    idea: Count each category value per class, then use those counts to classify new rows.
    analogy: A tally of answers for each group, used to guess the group of a new answer.
    animation: none
    good_at: [categorical features, class probabilities]
    bad_at: [continuous measurements, missing values]
    vs_siblings:
      - {page: multinomial-nb, note: "Counts of features. CategoricalNB counts each category value."}
      - {page: gaussian-nb, note: "Numbers per feature. CategoricalNB needs category codes."}
    read_more:
      - See the scikit-learn reference page for CategoricalNB.
