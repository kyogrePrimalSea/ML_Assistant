  catch_outs:
  - Deep trees overfit. Set max_depth or min_samples_leaf.
  - Predictions cannot go beyond the range seen in training.
  - Text columns fail. Encode them first.
  key_settings:
    tier1:
    - name: max_depth
      page: max-depth
      controls: Maximum number of levels from root to leaf.
      effect: Shallower trees are simpler and less prone to overfit, but can miss interactions.
    - name: min_samples_leaf
      page: null
      controls: Minimum training rows required in each leaf.
      effect: Larger leaves smooth predictions and resist noise, but can miss local patterns.
    - name: criterion
      page: null
      controls: 'Target-error measure used to rank splits: squared error, absolute error, or Poisson deviance.'
      effect: The measure changes split priorities; Poisson needs non-negative targets.
    - name: min_impurity_decrease
      page: null
      controls: Minimum weighted target-impurity reduction required for a split.
      effect: A larger threshold stops growth sooner but can miss useful structure.
    tier2:
    - name: max_features
      page: null
      controls: Number or fraction of input columns randomly considered at each split.
      effect: Fewer candidates add randomness and may weaken split choices.
    - name: ccp_alpha
      page: null
      controls: Minimal cost-complexity pruning strength.
      effect: Larger values prune more branches and may underfit.
    - name: min_samples_split
      page: null
      controls: Minimum rows in a node before it may split.
      effect: Larger values stop growth earlier and leave broader leaves.
    - name: monotonic_cst
      page: null
      controls: Per-feature constraints requiring predictions to move only in specified directions.
      effect: Constraints encode known trends but restrict learned patterns.
    tier3:
    - name: splitter
      page: null
      controls: Whether each node chooses its best threshold or a random threshold.
      effect: Random choices can reduce variance but increase bias.
    - name: max_leaf_nodes
      page: null
      controls: Maximum terminal leaves, grown by best-first impurity reduction.
      effect: A lower cap simplifies the tree but may underfit.
    - name: min_weight_fraction_leaf
      page: null
      controls: Minimum fraction of total sample weight required in a leaf.
      effect: A larger fraction prevents tiny weighted leaves but can smooth away rare cases.
  watch_it_work:
    none: true
  intuition:
    idea: Split the rows into groups, then predict each group's average.
    analogy: Sorting houses into price bands and quoting the band's average.
    animation: none
    good_at:
    - readable rules
    - tabular data
    - non-linear effects
    bad_at:
    - overfitting by default
    - extrapolation
    - smooth curves
    vs_siblings:
    - page: decision-tree-classifier
      note: Same tree, predicting a class instead.
    - page: random-forest
      note: Many trees averaged. Smoother, less readable.
    - page: xgboost
      note: Boosted trees. Usually more accurate, less readable.
    read_more: &id001
    - At a node, test candidate feature splits and rank them by target-error reduction.
    - Choose the best split and divide the rows into child groups.
    - Repeat recursively until a stopping rule creates leaves.
    - Predict the target summary stored in the reached leaf.
    goal: Partition the feature space into regions and predict a target summary within each leaf.
    steps: *id001
    math:
      notation:
      - symbol: A
        meaning: Rows reaching the current parent node.
      - symbol: y_i
        meaning: Observed target for training row i.
      - symbol: i
        meaning: Training-row index.
      - symbol: mean(A)
        meaning: Average target among rows in A.
      - symbol: L, R
        meaning: Left and right child groups created by a split.
      - symbol: n_L, n_R
        meaning: Numbers of rows in the two child groups.
      - symbol: x
        meaning: New input row to predict.
      equations:
      - expression: SSE(A) = sum_(i in A) (y_i - mean(A))^2
        meaning: Squared-error impurity measures how far targets in a node are from their mean.
      - expression: gain = SSE(A) - SSE(L) - SSE(R)
        meaning: The greedy split chooses a candidate that most reduces within-leaf squared error.
      prediction: With squared error, leaves return their target mean. Absolute error uses the median; tree values
        do not extrapolate.
