  code:
  - library: scikit-learn
    target: sklearn.tree.DecisionTreeRegressor
    why_this_library: Greedy splits reduce target error; leaves predict local target summaries.
    snippet: '# scikit-learn 1.9.1

      import numpy as np

      from sklearn.datasets import make_regression

      from sklearn.model_selection import train_test_split

      from sklearn.tree import DecisionTreeRegressor


      X, y = make_regression(n_samples=500, n_features=8, noise=10, random_state=0)

      X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

      model = DecisionTreeRegressor(max_depth=4, random_state=0)

      model.fit(X_train, y_train)

      y_pred = model.predict(X_test[:5])

      print(''y_pred:'', np.round(y_pred, 1))

      print(''R2:'', round(model.score(X_test, y_test), 3))

      print(''tree nodes:'', model.tree_.node_count)'
    output: 'y_pred: [-269.6 -148.   191.6   14.3   75.8]

      R2: 0.279

      tree nodes: 31

      '
  what_comes_out:
    items:
    - name: predict
      kind: method
      task: regression
      shape: (n_samples,) or (n_samples, n_outputs)
      object_type: numpy.ndarray
      example: '[12.4, -3.1, 8.0]'
      shape_explanation: One value per row for one target. This fictional example assumes n_samples=3, shape (3,).
        Multiple targets add an n_outputs column axis.
      note: Each leaf predicts a local target summary; with squared error this is its mean.
    - name: score
