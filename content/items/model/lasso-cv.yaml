    why_this_library: Built into scikit-learn, with cross-validation inside.
    snippet: "# scikit-learn 1.9.1\nfrom sklearn.datasets import load_diabetes\nfrom sklearn.linear_model import\
      \ LassoCV\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.pipeline import make_pipeline\n\
      from sklearn.preprocessing import StandardScaler\n\nX, y = load_diabetes(return_X_y=True)\nX_train, X_test,\
      \ y_train, y_test = train_test_split(\n    X, y, random_state=0\n)\n\nmodel = make_pipeline(StandardScaler(),\
      \ LassoCV(cv=5))\nmodel.fit(X_train, y_train)\nprint(int((model[-1].coef_ != 0).sum()))\ny_pred = model.predict(X_test[:5])\n\
      print('y_pred:', ', '.join(f'{v:.1f}' for v in y_pred))\n"
    output: '7

      y_pred: 236.0, 244.2, 164.6, 120.2, 177.7

      '
  what_comes_out:
    items:
    - name: predict
      kind: method
      task: regression
      shape: (n_samples,)
      note: One predicted value per row.
      object_type: numpy.ndarray
      example: '[146.2, 92.1, 155.8]'
      shape_explanation: One value is returned for each input row. n_samples is the number of rows; this example
        has 3 values, so its shape is (3,).
    - name: score
      kind: method
      task: regression
      shape: scalar
      note: R squared on the data you pass in.
      object_type: float
      example: '0.72'
      shape_explanation: A scalar is one value with no array dimensions. The example is one R-squared score.
    - name: coef_
      kind: attribute
      task: null
      shape: (n_features,)
      note: One weight per input column. Zero means dropped.
      object_type: numpy.ndarray
      example: '[0.0, 12.4, -3.1]'
      shape_explanation: A one-dimensional array with one coefficient per feature. n_features is the number of input
        columns; this example has 3 values, shape (3,).
    - name: intercept_
      kind: attribute
      task: null
      shape: scalar
      note: Intercept of the fitted line.
      object_type: float
      example: '152.0'
      shape_explanation: A scalar is one fitted intercept value, with no array dimensions.
    - name: alpha_
      kind: attribute
      task: null
      shape: scalar
      note: Penalty strength that cross-validation picked.
      object_type: float
      example: '0.05'
      shape_explanation: A scalar is the one penalty strength selected by cross-validation.
    - name: mse_path_
      kind: attribute
      task: null
      shape: (n_alphas, n_folds)
      note: Error for each alpha and fold. Shows the CV curve.
      object_type: numpy.ndarray
      example: '[[3200.0, 3400.0], [2800.0, 2900.0]]'
      shape_explanation: Rows are the n_alphas candidate penalties and columns are the n_folds validation splits.
        The example has 2 candidates and 2 folds, shape (2, 2).
    visual: null
    snippet: '# scikit-learn 1.9.1

      from sklearn.datasets import load_diabetes

      from sklearn.linear_model import LassoCV

      from sklearn.model_selection import train_test_split

      from sklearn.pipeline import make_pipeline

      from sklearn.preprocessing import StandardScaler

      import numpy as np


      X, y = load_diabetes(return_X_y=True)

      X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

      model = make_pipeline(StandardScaler(), LassoCV(cv=5))

      model.fit(X_train, y_train)

      y_pred = model.predict(X_test[:3])

      print(''y_pred:'', np.round(y_pred, 1))

      print(''coef_:'', np.round(model[-1].coef_, 3))

      print(''alpha_:'', round(model[-1].alpha_, 4))

      '
    snippet_library: scikit-learn
    guidance:
    - task: regression
      text: Use y_pred for regression metrics on held-out rows. Compare the selected features and residuals before
        interpreting the fit.
    output: "y_pred: [236.  244.2 164.6]\ncoef_: [ -0.     -6.592  28.793  11.685  -3.255  -1.531 -10.355   0. \
      \    25.466\n   0.   ]\nalpha_: 1.8617\n"
    next_step: null
  catch_outs:
  - Only the alphas on the path are tried.
  - Scale the columns first, or the penalty is unfair.
  - Missing values stop the fit. Impute them first.
  key_settings:
    tier1:
    - name: cv
      page: null
      controls: Cross-validation splitting strategy or number of folds used to score candidates.
      effect: More or structured folds can give a more relevant estimate, but increase computation.
    - name: alphas
      page: null
      controls: Penalty values tested along the regularization path; an integer requests an automatically generated
        path.
      effect: A broader or denser candidate set searches more choices but takes longer; the best value is limited
        to the path.
    tier2:
    - name: tol
      page: null
      controls: Optimization stopping tolerance, checked against coefficient updates and the dual gap.
      effect: A larger tolerance can stop sooner with a less precise solution; a smaller one takes more work.
    - name: selection
      page: null
      controls: Whether coordinate descent visits features cyclically or chooses one randomly at each update.
      effect: Random updates can converge faster in some cases; use random_state for reproducible random selection.
    - name: fit_intercept
      page: null
      controls: Whether to estimate an intercept; False assumes the data are already centered.
      effect: Turning it off avoids estimating a baseline, but biases predictions if the data are not centered.
    - name: eps
      page: null
      controls: Ratio of the smallest to largest alpha on the automatically generated path.
      effect: A smaller ratio extends the search to weaker regularization; it may add candidates and computation.
    tier3:
    - name: precompute
      page: null
      controls: Whether to use a Gram matrix (and for OMP, Xy) to speed fitting.
      effect: Precomputation can speed suitable dense or large-target problems, but uses extra memory.
    - name: positive
      page: null
      controls: Whether fitted coefficients are constrained to be non-negative.
      effect: The constraint can encode a known direction, but rules out useful negative effects.
    - name: copy_X
      page: null
      controls: Whether to copy X before fitting; False may allow X to be overwritten.
      effect: Copying protects the input at a memory cost; disabling the copy can save memory.
    - name: max_iter
      page: null
      controls: Maximum coordinate descent iterations.
      effect: A larger limit can allow convergence but takes longer; reaching the limit can leave an unfinished
        fit.
  watch_it_work:
    none: true
  intuition:
    idea: Try many penalty strengths with cross-validation, then keep the best.
    analogy: A coach who tries several training plans and keeps the one that scores best.
    animation: none
    good_at:
    - few useful features
    - no hand-tuned strength
    bad_at:
    - classification
    - curved patterns
    vs_siblings:
    - page: lasso
      note: Same penalty, but you set alpha yourself.
    - page: elastic-net-cv
      note: Adds an l1_ratio mix to the penalty.
    read_more:
    - Each alpha on the path gets a cross-validated score.
    - The best alpha is kept as alpha_.
    - The final weights are fitted at that alpha.
    goal: Choose a Lasso penalty from a candidate path by cross-validated mean squared error, then refit at the
      selected alpha.
    steps:
    - Build the candidate alpha path.
    - For each alpha, fit Lasso on each training fold and measure mean squared error on its held-out fold.
    - Average fold errors for each alpha and select the lowest-error candidate.
    - Refit Lasso on all supplied training rows at alpha_.
    math:
      notation:
      - symbol: n, p
        meaning: Number of training rows and input features.
      - symbol: x_ij
        meaning: Feature j in training row i.
      - symbol: y_i
        meaning: Observed target in training row i.
      - symbol: w_j, b
        meaning: Coefficient for feature j and fitted intercept.
      - symbol: alpha
        meaning: Non-negative strength of the L1 penalty.
      equations:
      - expression: minimise (1/(2n)) sum_i (y_i - b - sum_j x_ij w_j)^2 + alpha sum_j |w_j|
        meaning: Squared error rewards fit; the L1 term can set coefficients exactly to zero.
      - expression: alpha_ = argmin_alpha (1/K) sum_{k=1}^K MSE_k(alpha)
        meaning: Choose the tested alpha with lowest mean fold error, then refit on all training rows.
      prediction: For a new feature row x, return b + sum_j x_j w_j.
