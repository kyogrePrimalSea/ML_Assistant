    why_this_library: Built into scikit-learn. You choose k or a tolerance.
    snippet: "# scikit-learn 1.9.1\nfrom sklearn.datasets import load_diabetes\nfrom sklearn.linear_model import\
      \ OrthogonalMatchingPursuit\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.pipeline import\
      \ make_pipeline\nfrom sklearn.preprocessing import StandardScaler\n\nX, y = load_diabetes(return_X_y=True)\n\
      X_train, X_test, y_train, y_test = train_test_split(\n    X, y, random_state=0\n)\n\nmodel = make_pipeline(\n\
      \    StandardScaler(),\n    OrthogonalMatchingPursuit(n_nonzero_coefs=3),\n)\nmodel.fit(X_train, y_train)\n\
      print(int((model[-1].coef_ != 0).sum()))\ny_pred = model.predict(X_test[:5])\nprint('y_pred:', ', '.join(f'{v:.1f}'\
      \ for v in y_pred))\n"
    output: '3

      y_pred: 241.6, 237.8, 156.3, 111.1, 165.3

      '
