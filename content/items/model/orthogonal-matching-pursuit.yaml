  prep:
    - step: {family: clean.impute}
      status: required
      why: Scikit-learn rejects NaN in X.
      condition: {has_missing: true}
      unless: null
    - step: {family: transform.encode.features}
      status: required
      why: Text categories must become numbers.
      condition: {has_categoricals: true}
      unless: null
    - step: {family: transform.scale.rescale}
      status: required
      why: Units decide which columns are picked first.
      condition: null
      unless: null
  code:
    - library: scikit-learn
      target: sklearn.linear_model.OrthogonalMatchingPursuit
      why_this_library: Built into scikit-learn. You choose k or a tolerance.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_diabetes
        from sklearn.linear_model import OrthogonalMatchingPursuit
        from sklearn.model_selection import train_test_split
        from sklearn.pipeline import make_pipeline
        from sklearn.preprocessing import StandardScaler

        X, y = load_diabetes(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(
            X, y, random_state=0
        )

        model = make_pipeline(
            StandardScaler(),
            OrthogonalMatchingPursuit(n_nonzero_coefs=3),
        )
        model.fit(X_train, y_train)
        print(int((model[-1].coef_ != 0).sum()))
  what_comes_out:
    items:
      - {name: predict, kind: method, task: null, shape: "(n_samples,)", note: "One predicted value per row."}
      - {name: score, kind: method, task: null, shape: float, note: "R squared on the data you pass in."}
      - {name: coef_, kind: attribute, task: null, shape: "(n_features,)", note: "One weight per input column. Zero means not picked."}
      - {name: intercept_, kind: attribute, task: null, shape: float, note: "Intercept of the fitted line."}
      - {name: n_nonzero_coefs_, kind: attribute, task: null, shape: "int or None", note: "The k used, or None when tol is set."}
      - {name: n_iter_, kind: attribute, task: null, shape: "int or array-like", note: "Steps the greedy search took."}
    next_step: Try a few k values and compare scores on held-out data.
    visual: null
  catch_outs:
    - Setting tol overrides n_nonzero_coefs.
    - Scale the columns first, or big units get picked first.
    - Missing values stop the fit. Impute them first.
  key_settings:
    tier1:
      - {name: n_nonzero_coefs, page: null}
