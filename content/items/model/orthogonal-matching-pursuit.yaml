  watch_it_work: {none: true}
  intuition:
    idea: Pick the feature that best explains what is left, k times.
    analogy: Packing a bag by taking, each time, the item that fits the gap best.
    animation: none
    good_at: [exact feature count, few features]
    bad_at: [classification, many features to keep]
    vs_siblings:
      - {page: lasso, note: "Lasso sets a penalty. OMP sets a feature count."}
      - {page: lars, note: "Lars builds a full path. OMP stops at k features."}
    read_more:
      - Start with the residual equal to y.
      - Add the feature most correlated with the residual.
      - Refit on all chosen features, then repeat until k.
  next: [know-feature-importance]
