    visual: null
    snippet: "# scikit-learn 1.9.1\nfrom sklearn.datasets import load_diabetes\nfrom sklearn.linear_model import\
      \ OrthogonalMatchingPursuit\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.pipeline import\
      \ make_pipeline\nfrom sklearn.preprocessing import StandardScaler\nimport numpy as np\n\nX, y = load_diabetes(return_X_y=True)\n\
      X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)\nmodel = make_pipeline(\n    StandardScaler(),\
      \ OrthogonalMatchingPursuit(n_nonzero_coefs=3)\n)\nmodel.fit(X_train, y_train)\ny_pred = model.predict(X_test[:3])\n\
      print('y_pred:', np.round(y_pred, 1))\nprint('coef_:', np.round(\n    model[-1].coef_, 3\n))\n"
    snippet_library: scikit-learn
    guidance:
    - task: regression
      text: Use y_pred for regression metrics on held-out rows. Compare the selected features and residuals before
        interpreting the fit.
    output: "y_pred: [241.6 237.8 156.3]\ncoef_: [  0.      0.     35.963   0.    -11.359   0.      0.      0. \
      \    36.107\n   0.   ]\n"
    next_step: null
  catch_outs:
  - Setting tol overrides n_nonzero_coefs.
  - Scale the columns first, or big units get picked first.
  - Missing values stop the fit. Impute them first.
  key_settings:
    tier1:
    - name: n_nonzero_coefs
      page: null
      controls: Target or maximum number of non-zero coefficients along the LARS path, or chosen by OMP.
      effect: A larger number allows more features into the fit and can capture detail but also noise.
    - name: tol
      page: null
      controls: Maximum squared residual norm used as OMP stopping rule; it overrides n_nonzero_coefs.
      effect: A larger threshold stops earlier with fewer selected features; it may leave more residual error.
    tier2:
    - name: fit_intercept
      page: null
      controls: Whether to estimate an intercept; False assumes the data are already centered.
      effect: Turning it off avoids estimating a baseline, but biases predictions if the data are not centered.
    tier3:
    - name: precompute
      page: null
      controls: Whether to use a Gram matrix (and for OMP, Xy) to speed fitting.
      effect: Precomputation can speed suitable dense or large-target problems, but uses extra memory.
  watch_it_work:
    none: true
  intuition:
    idea: Pick the feature that best explains what is left, k times.
    analogy: Packing a bag by taking, each time, the item that fits the gap best.
    animation: none
    good_at:
    - exact feature count
    - few features
    bad_at:
    - classification
    - many features to keep
    vs_siblings:
    - page: lasso
      note: Lasso sets a penalty. OMP sets a feature count.
    - page: lars
      note: Lars builds a full path. OMP stops at k features.
    read_more:
    - Start with the residual equal to y.
    - Add the feature most correlated with the residual.
    - Refit on all chosen features, then repeat until k.
    goal: Greedily select features and refit least squares until k or the residual tolerance stops the fit.
    steps:
    - Start with an empty selected-feature set and residual y (after intercept handling).
    - Select the feature most correlated with the current residual.
    - Refit least squares jointly on all selected features and recompute the residual.
    - Repeat until n_nonzero_coefs is reached or tol residual norm is met.
    math:
      notation:
      - symbol: X, y
        meaning: Training feature matrix and target vector.
      - symbol: A
        meaning: Set of selected feature indices.
      - symbol: r = y - X_A w_A
        meaning: Residual after fitting selected columns.
      - symbol: k
        meaning: Maximum number of selected coefficients when tol is unset.
      equations:
      - expression: j_next = argmax_{j not in A} |X_j^T r|
        meaning: OMP greedily adds the feature most correlated with what the current fit leaves unexplained.
      - expression: w_A = argmin_v ||y - X_A v||_2^2
        meaning: After each addition, OMP refits least squares jointly on all selected features; it stops at k or
          the residual tolerance.
      prediction: For a new feature row x, return b + sum_j x_j w_j.
  next:
  - know-feature-importance
