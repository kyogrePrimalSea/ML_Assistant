  code:
    - library: scikit-learn
      target: sklearn.naive_bayes.BernoulliNB
      why_this_library: The scikit-learn estimator for this method.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.datasets import load_breast_cancer
        from sklearn.model_selection import train_test_split
        from sklearn.naive_bayes import BernoulliNB

        X, y = load_breast_cancer(return_X_y=True)
        X = (X > np.median(X, axis=0)).astype(int)
        X_train, X_test, y_train, y_test = train_test_split(
            X, y, random_state=0
        )

        model = BernoulliNB()
        model.fit(X_train, y_train)
        print(round(model.score(X_test, y_test), 3))
  what_comes_out:
    items:
      - {name: predict, kind: method, task: classification, shape: "(n_samples,)",
         note: "Class with the highest probability."}
      - {name: predict_proba, kind: method, task: classification, shape: "(n_samples, n_classes)",
         note: "One column per class, in classes_ order."}
      - {name: predict_log_proba, kind: method, task: classification, shape: "(n_samples, n_classes)",
         note: "Log of predict_proba, same column order."}
      - {name: score, kind: method, task: classification, shape: "float",
         note: "Accuracy on the data given."}
      - {name: class_log_prior_, kind: attribute, task: classification, shape: "(n_classes,)",
         note: "Log of each class's share of the rows."}
      - {name: feature_log_prob_, kind: attribute, task: classification, shape: "(n_classes, n_features)",
         note: "Log chance each feature is yes, per class."}
      - {name: classes_, kind: attribute, task: classification, shape: "(n_classes,)",
         note: "Labels, in the order of the probability columns."}
      - {name: n_features_in_, kind: attribute, task: null, shape: "int",
         note: "Columns seen during fit."}
    next_step: "ROC AUC needs predict_proba[:, 1], not the labels."
    snippet: |
      # scikit-learn 1.9.1
      import numpy as np
      from sklearn.datasets import load_breast_cancer
      from sklearn.naive_bayes import BernoulliNB

      X, y = load_breast_cancer(return_X_y=True)
      X = (X > np.median(X, axis=0)).astype(int)
      model = BernoulliNB()
      model.fit(X, y)
      print(model.predict_proba(X[:3]).shape)
      print(model.predict_log_proba(X[:3]).shape)
      print(model.class_log_prior_.shape)
      print(model.feature_log_prob_.shape)
      print(model.classes_)
    snippet_library: scikit-learn
    visual: null
