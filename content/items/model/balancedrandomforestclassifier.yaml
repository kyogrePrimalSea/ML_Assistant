  catch_outs:
  - Accuracy looks fine on lopsided data. Use balanced accuracy.
  - Predict gives labels. Use predict_proba for ROC or PR curves.
  - Text columns fail. Encode them first.
  key_settings:
    tier1:
    - name: n_estimators
      page: n-estimators
      controls: Maximum number of balanced trees to fit.
      effect: More trees can stabilise votes but increase training and prediction cost.
    - name: max_depth
      page: max-depth
      controls: Maximum depth of each decision tree.
      effect: Deeper trees capture more interactions but can overfit and cost more.
    - name: sampling_strategy
      page: null
      controls: Which classes and target counts the under-sampler uses per tree.
      effect: More aggressive balancing discards more majority rows; the chosen counts affect class coverage.
    - name: class_weight
      page: null
      controls: Additional class weights applied within the trees.
      effect: Higher minority weight increases its split/loss influence on top of balanced sampling.
    tier2:
    - name: max_features
      page: null
      controls: Number or share of features considered at each split.
      effect: Fewer candidates decorrelate trees but may hide useful predictors.
    - name: max_samples
      page: null
      controls: Rows drawn for a tree when bootstrap is enabled.
      effect: Smaller samples reduce fit cost but can make trees less informed.
    - name: bootstrap
      page: null
      controls: Whether each tree also bootstraps its balanced sample.
      effect: Enables bootstrap/OOB behavior but adds another sampling stage.
    - name: min_samples_split
      page: null
      controls: Minimum rows required to split an internal node.
      effect: Higher values make trees shallower and can reduce overfitting.
    tier3:
    - name: min_samples_leaf
      page: null
      controls: Minimum rows required in a leaf.
      effect: Larger leaves smooth predictions but may miss small patterns.
    - name: replacement
      page: null
      controls: Whether the internal under-sampler draws majority rows with replacement.
      effect: Replacement can repeat selected rows; without it each selected row is unique.
    - name: ccp_alpha
      page: null
      controls: Minimal cost-complexity pruning strength for each tree.
      effect: Higher alpha prunes more branches and may underfit.
    - name: criterion
      page: null
      controls: Impurity measure used to choose tree splits.
      effect: Gini and entropy can rank splits differently; this can change each tree.
  watch_it_work:
    none: true
  intuition:
    idea: Many trees, each grown on a balanced sample of the rows.
    analogy: A panel of judges, each shown an even mix of both outcomes.
    animation: none
    good_at:
    - rare classes
    - tabular data
    - non-linear effects
    bad_at:
    - tiny data
    - extrapolation
    - raw text
    vs_siblings:
    - page: random-forest
      note: Same trees. This one balances each tree's sample.
    - page: balancedbaggingclassifier
      note: Balanced bagging around any base model.
    - page: easyensembleclassifier
      note: Bags boosted models instead of trees.
    read_more:
    - Split the rows into the rare and common classes.
    - Draw a balanced sample for each tree.
    - Grow each tree, then combine the trees' votes.
    goal: Build each decision tree from a fresh class-balanced under-sample, then aggregate tree probabilities.
    steps:
    - For each tree, draw a balanced training subset using RandomUnderSampler
    - Fit one randomized decision tree to that subset
    - Average class probabilities from all trees and select the largest class probability
    - Resampling is repeated per tree; it does not alter prediction rows.
    math:
      notation:
      - symbol: j
        meaning: Tree index.
      - symbol: S_j
        meaning: Balanced row sample used to fit tree j.
      - symbol: p_j(c|x)
        meaning: Tree j probability for class c at input x.
      - symbol: J
        meaning: Number of fitted trees.
      equations:
      - expression: p(c|x)=J⁻¹Σ_j p_j(c|x); ŷ=argmax_c p(c|x)
        meaning: The forest averages balanced-tree probabilities, then chooses the most probable class.
      prediction: predict_proba averages tree probabilities in classes_ order; predict returns the highest-probability class.
  next:
