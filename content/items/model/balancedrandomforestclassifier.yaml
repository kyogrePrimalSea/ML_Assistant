  code:
  - library: imbalanced-learn
    target: imblearn.ensemble.BalancedRandomForestClassifier
    why_this_library: Balanced sampling inside each tree, with the scikit-learn API.
    snippet: |
      # imbalanced-learn 0.14.2
      from imblearn.ensemble import BalancedRandomForestClassifier
      from sklearn.datasets import make_classification
      from sklearn.model_selection import train_test_split

      X, y = make_classification(
          n_samples=160, n_features=5, n_informative=3, n_redundant=0,
          weights=[0.9, 0.1], random_state=42,
      )
      X_train, X_test, y_train, y_test = train_test_split(
          X, y, test_size=0.25, stratify=y, random_state=42
      )
      model = BalancedRandomForestClassifier(
          n_estimators=8, random_state=42, n_jobs=1
      )
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test[:3])
      y_proba = model.predict_proba(X_test[:3])
      print("y_pred:", y_pred)
      print("y_proba:")
      print(y_proba.round(3))
      print("classes_:", model.classes_)
      print("tree count:", len(model.estimators_))
      print("tree 0 balanced rows:", len(model.samplers_[0].sample_indices_))
      print("feature_importances_ shape:", model.feature_importances_.shape)
    output: |
      y_pred: [0 0 0]
      y_proba:
      [[1. 0.]
       [1. 0.]
       [1. 0.]]
      classes_: [0 1]
      tree count: 8
      tree 0 balanced rows: 24
      feature_importances_ shape: (5,)
  what_comes_out:
    items:
    - name: predict
      kind: method
      task: classification
      shape: (n_samples,)
      object_type: numpy.ndarray
      example: '[0, 1, 0]'
      shape_explanation: One prediction per input row. n_samples is the number of rows; this example has shape (3,).
      note: Labels chosen from the fitted class scores/probabilities.
    - name: predict_proba
      kind: method
      task: classification
      shape: (n_samples, n_classes)
      object_type: numpy.ndarray
      example: '[[0.80, 0.20], [0.35, 0.65], [0.90, 0.10]]'
      shape_explanation: A table with n_samples rows and n_classes columns. The example has 3 rows and 2 classes, shape (3, 2).
      note: One probability column per class, ordered as classes_.
    - name: predict_log_proba
      kind: method
      task: classification
      shape: (n_samples, n_classes)
      object_type: numpy.ndarray
      example: '[[-0.22, -1.61], [-1.05, -0.43], [-0.11, -2.30]]'
      shape_explanation: A table with n_samples rows and n_classes columns. The example has 3 rows and 2 classes, shape (3, 2).
      note: Natural logs of predict_proba; columns stay in classes_ order.
    - name: classes_
      kind: attribute
      task: classification
      shape: (n_classes,)
      object_type: numpy.ndarray
      example: '[0, 1]'
      shape_explanation: A one-dimensional array with n_classes labels. This two-class example has shape (2,).
      note: Labels in probability-column order.
    - name: estimators_
      kind: attribute
      task: null
      shape: (n_estimators,)
      object_type: list[DecisionTreeClassifier]
      example: '[DecisionTreeClassifier(...), DecisionTreeClassifier(...)]'
      shape_explanation: A fitted list contains n_estimators trees; this concrete fictional example shows 2 tree objects.
      note: One fitted tree for each ensemble member.
    - name: samplers_
      kind: attribute
      task: null
      shape: (n_estimators,)
      object_type: list[RandomUnderSampler]
      example: '[RandomUnderSampler(...), RandomUnderSampler(...)]'
      shape_explanation: A fitted list contains one sampler per tree; this concrete fictional example shows 2 sampler objects.
      note: Fitted sampler for each tree; sample_indices_ identifies its balanced training rows.
    - name: feature_importances_
      kind: attribute
      task: null
      shape: (n_features,)
      object_type: numpy.ndarray
      example: '[0.28, 0.11, 0.24, 0.19, 0.18]'
      shape_explanation: One value per input feature. n_features is the number of columns; this example has shape (5,).
      note: Mean impurity-based importance across fitted trees.
    next_step: null
