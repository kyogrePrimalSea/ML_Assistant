    - tabular data
    - missing values
    - larger data
    avoid_when:
    - tiny data
    - images or text
    - need a simple formula
  prep:
  - step:
      family: transform.scale.rescale
    status: not_needed
    why: Trees split on order, not size.
    condition: null
    unless: null
  - step:
      family: clean.impute
    status: not_needed
    why: Missing values are handled natively.
    condition: null
    unless: null
  - step:
      family: transform.encode.features
    status: recommended
    why: Category dtype works as is. Text needs encoding.
    condition:
      has_categoricals: true
    unless: null
  - step:
      family: transform.rebalance.weight
    status: recommended
    why: Use class_weight when classes are lopsided.
    condition:
      imbalanced: true
      task_type:
      - classification
    unless: null
  - step:
      page: train-test-split
    status: recommended
    why: Hold out rows to score honestly.
    condition: null
    unless: null
  code:
  - library: scikit-learn
    target: sklearn.ensemble.HistGradientBoostingRegressor
    why_this_library: No extra install. Early stopping is built in.
    snippet: "# scikit-learn 1.9.1\nimport numpy as np\nfrom sklearn.datasets import make_regression\nfrom sklearn.ensemble\
      \ import HistGradientBoostingRegressor\nfrom sklearn.model_selection import train_test_split\n\nX, y = make_regression(n_samples=500,\
      \ n_features=8, noise=10, random_state=0)\nX_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)\n\
      model = HistGradientBoostingRegressor(\n    max_iter=200, learning_rate=0.05, early_stopping=True,\n    n_iter_no_change=15,\
      \ random_state=0,\n)\nmodel.fit(X_train, y_train)\ny_pred = model.predict(X_test[:5])\nprint(\"y_pred:\",\
      \ np.round(y_pred, 1))\nprint(\"n_iter_:\", model.n_iter_)\n"
    output: 'y_pred: [  22.9 -101.2   -7.   109.9  104.1]

      n_iter_: 200

      '
  what_comes_out:
    items:
    - name: predict_proba
      kind: method
      task: classification
      shape: (n_samples, n_classes)
      object_type: numpy.ndarray
      example: '[[0.91, 0.09], [0.18, 0.82]]'
      shape_explanation: Rows are cases and columns follow classes_. This example has 2 cases and 2 classes, shape
        (2, 2).
      note: Probabilities are returned for classifier models.
    - name: predict
      kind: method
      task: classification
      shape: (n_samples,)
      object_type: numpy.ndarray
      example: '[0, 1]'
      shape_explanation: One class label per case. n_samples is the number of rows; this example has 2 labels, shape
        (2,).
      note: Labels follow classes_.
    - name: predict
      kind: method
      task: regression
      shape: (n_samples,)
      object_type: numpy.ndarray
      example: '[245.0, 318.5]'
      shape_explanation: One numeric prediction per case. n_samples is the number of rows; this example has 2 values,
        shape (2,).
      note: Regression returns one value per row.
    - name: decision_function
      kind: method
      task: classification
      shape: (n_samples,); (n_samples,n_classes)
      object_type: numpy.ndarray
      example: '[-2.3, 1.5]'
      shape_explanation: This fictional binary example has one raw score for each of 2 rows, shape (2,). Multiclass
        adds a class axis, shape (n_samples,n_classes).
      note: The example is binary; multiclass gives raw scores for each class.
    - name: classes_
      kind: attribute
      task: classification
      shape: (n_classes,)
      object_type: numpy.ndarray
      example: '[0, 1]'
      shape_explanation: One label per class. n_classes is the class count; this example contains 2 labels, shape
        (2,).
      note: The probability columns use this order.
    - name: n_iter_
      kind: attribute
      task: null
      shape: scalar
      object_type: int
      example: '18'
      shape_explanation: A scalar integer is the number of boosting rounds actually fitted.
      note: Can be less than max_iter when early stopping activates.
    - name: train_score_
      kind: attribute
      task: null
      shape: (n_iter + 1,)
      object_type: numpy.ndarray
      example: '[0.69, 0.62, 0.54]'
      shape_explanation: One training loss score per recorded iteration, including the initial score. This example
        has 3 entries, shape (3,).
      note: Recorded only when early stopping is enabled.
    - name: validation_score_
      kind: attribute
      task: null
      shape: (n_iter + 1,)
      object_type: numpy.ndarray
      example: '[0.71, 0.64, 0.58]'
      shape_explanation: One validation loss score per recorded iteration, including the initial score. This example
        has 3 entries, shape (3,).
      note: Validation trace used by early stopping.
    next_step: null
    snippet: "# scikit-learn 1.9.1\nimport numpy as np\nfrom sklearn.datasets import load_breast_cancer, load_diabetes\n\
      from sklearn.ensemble import (\n    HistGradientBoostingClassifier, HistGradientBoostingRegressor\n)\nfrom\
      \ sklearn.model_selection import train_test_split\n\nX, y = load_breast_cancer(return_X_y=True)\nX_train,\
      \ X_test, y_train, y_test = train_test_split(X, y, random_state=0)\nclf = HistGradientBoostingClassifier(\n\
      \    max_iter=30, early_stopping=True, random_state=0,\n).fit(X_train, y_train)\ny_proba = clf.predict_proba(X_test[:3])\n\
      y_score = clf.decision_function(X_test[:3])\ny_pred = clf.predict(X_test[:3])\nprint(\"classes_:\", clf.classes_)\n\
      print(\"y_proba:\", np.round(y_proba, 3))\nprint(\"binary raw score:\", np.round(y_score, 3))\nprint(\"y_pred:\"\
      , y_pred)\nprint(\"n_iter_:\", clf.n_iter_)\nprint(\"train_score_ shape:\", clf.train_score_.shape)\nprint(\"\
      validation_score_ shape:\", clf.validation_score_.shape)\n\nXd, yd = load_diabetes(return_X_y=True)\nreg =\
      \ HistGradientBoostingRegressor(max_iter=30, random_state=0).fit(Xd, yd)\nprint(\"regression y_pred:\", np.round(reg.predict(Xd[:3]),\
      \ 1))\n"
    snippet_library: scikit-learn
    visual: both
    output: "classes_: [0 1]\ny_proba: [[0.96  0.04 ]\n [0.078 0.922]\n [0.031 0.969]]\nbinary raw score: [-3.17\
      \   2.467  3.447]\ny_pred: [0 1 1]\nn_iter_: 30\ntrain_score_ shape: (31,)\nvalidation_score_ shape: (31,)\n\
      regression y_pred: [192.   78.9 156.7]\n"
    guidance:
    - task: classification
      text: Use predict_proba[:, 1] for binary ROC AUC and PR; decision_function gives binary raw scores, while
        predict labels serve accuracy and confusion matrices.
    - task: regression
      text: Use numeric predict output to score held-out targets with regression metrics; this example does not
        transform the target.
  catch_outs:
  - The tree count is max_iter, not n_estimators.
  - Early stopping is automatic only above 10,000 rows.
  - Tree size is capped by max_leaf_nodes (31) first.
  - Text columns fail. Use category dtype or encode them.
  key_settings:
    tier1:
    - name: max_iter
      page: n-estimators
      controls: Maximum boosting iterations, with trees added per round.
      effect: More rounds can improve fit but take longer and may overfit.
    - name: learning_rate
      page: learning-rate
      controls: Multiplicative shrinkage applied to each tree leaf value.
      effect: Smaller steps are conservative but usually need more iterations.
    - name: max_leaf_nodes
      page: null
      controls: Maximum number of leaves in each fitted tree.
      effect: More leaves capture more detail but increase overfitting risk.
    - name: n_iter_no_change
      page: early-stopping
      controls: Number of recent validation scores checked for early stopping.
      effect: A smaller patience stops sooner; it may stop before a later improvement.
    tier2:
    - name: max_depth
      page: max-depth
      controls: Maximum number of edges from root to deepest leaf.
      effect: A smaller depth limits interactions and tree complexity.
    - name: min_samples_leaf
      page: null
      controls: Minimum training rows required in a leaf.
      effect: Larger leaves smooth predictions but can miss local patterns.
    - name: l2_regularization
      page: null
      controls: L2 penalty on leaves with small Hessian values.
      effect: More penalty discourages fragile leaf updates but can underfit.
    tier3:
    - name: early_stopping
      page: early-stopping
      controls: Whether training stops when validation score stops improving.
      effect: Enabled stopping saves work and limits overfit; the holdout reduces fit data.
    - name: max_features
      page: null
      controls: Proportion of features randomly considered at each node split.
      effect: Smaller fractions decorrelate trees but may exclude a useful feature.
    - name: max_bins
      page: null
      controls: Maximum number of bins used for non-missing feature values (at most 255).
      effect: Fewer bins speed training and reduce split resolution; one extra bin is reserved for missing values.
  watch_it_work:
    dataset: ames
    control:
      name: max_iter
      min: 1
      max: 200
      step: 1
      default: 50
  intuition:
    idea: Bin each column into 255 steps, then boost small trees on the bins.
    analogy: Sorting heights into shoe-size buckets before comparing people.
    animation: model/boosting-sequence
    good_at:
    - missing values
    - larger data
    - tabular data
    bad_at:
    - tiny data
    - extrapolation
    - raw text
    vs_siblings:
    - page: gradient-boosting
      note: Same idea, exact splits. Does not take NaN.
    - page: xgboost
      note: More settings (gamma, reg_alpha). Needs a separate install.
    - page: lightgbm
      note: Same binning idea. Caps leaves with num_leaves.
    read_more:
    - Each feature is binned; up to max_bins ordinary bins plus a missing-value bin are used.
    - Histograms aggregate gradient and Hessian sums for candidate splits.
    - Missing values follow the child direction learned during training.
    goal: Use binned feature values to build gradient-boosted trees faster while retaining native missing-value
      handling.
    steps:
    - Before fitting, map each feature’s non-missing values into at most max_bins ordered bins.
    - Reserve a separate bin for missing values and learn which child receives them at each split.
    - Compute gradients and Hessians, then build trees from aggregated bin statistics.
    - Shrink and add each tree; validation scores can stop training before max_iter.
    math:
      notation:
      - symbol: F_m(x)
        meaning: Current prediction after m boosting rounds.
      - symbol: h_m(x)
        meaning: New tree fitted at round m.
      - symbol: eta
        meaning: Learning rate multiplying each tree output.
      - symbol: g_i,h_i
        meaning: First and second loss derivatives for row i.
      - symbol: b(x_j)
        meaning: Binned value for feature j.
      equations:
      - expression: F_m(x)=F_{m-1}(x)+eta*h_m(x)
        meaning: The model adds each new tree with shrinkage; histogram bin statistics determine candidate split
          gains.
      - expression: G_B=sum_{i:b(x_ij)=B} g_i; H_B=sum_{i:b(x_ij)=B} h_i
        meaning: Rows in the same feature bin contribute summed gradients and Hessians, avoiding a scan over every
          distinct value.
      prediction: Regression returns numeric scores; binary scores map through the logistic link.
  next:
  - model-overfitting
  - know-feature-importance
