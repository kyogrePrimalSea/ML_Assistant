    columns: same
slots:
  header: {}
  solves:
    hero:
      kind: model
      dataset: ames
      shape: fit_line
    line: Gradient boosting on binned columns. Fast, takes NaN.
  quick_facts:
    data_size: Medium to large tables
  use_avoid:
