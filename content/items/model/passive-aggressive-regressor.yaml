      condition: {has_categoricals: true}
      unless: null
  code:
    - library: scikit-learn
      target: sklearn.linear_model.PassiveAggressiveRegressor
      why_this_library: Has partial_fit, so it can learn from streams.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_diabetes
        from sklearn.linear_model import PassiveAggressiveRegressor
        from sklearn.model_selection import train_test_split
        from sklearn.pipeline import make_pipeline
        from sklearn.preprocessing import StandardScaler

        X, y = load_diabetes(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = make_pipeline(
            StandardScaler(),
            PassiveAggressiveRegressor(C=1.0, random_state=0),
        )
        model.fit(X_train, y_train)
        print(round(model.score(X_test, y_test), 3))
  what_comes_out:
    items:
      - {name: predict, kind: method, task: null, shape: "(n_samples,)",
         note: "One predicted value per row."}
      - {name: score, kind: method, task: null, shape: "float",
         note: "R squared. 1 is perfect; 0 is no better than the mean."}
      - {name: coef_, kind: attribute, task: null, shape: "(n_features,)",
         note: "One weight per input column. Averaged if average is on."}
      - {name: intercept_, kind: attribute, task: null, shape: "(1,)",
         note: "The offset added to every prediction."}
      - {name: n_iter_, kind: attribute, task: null, shape: "int",
         note: "Passes over the data used. At max_iter, it stopped early."}
      - {name: n_features_in_, kind: attribute, task: null, shape: "int",
         note: "Number of input columns seen in fit."}
      - {name: feature_names_in_, kind: attribute, task: null, shape: "(n_features_in_,)",
         note: "Column names. Only set when fit on a DataFrame."}
    next_step: Undo any log target before reporting errors in original units.
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.datasets import load_diabetes
      from sklearn.linear_model import PassiveAggressiveRegressor
      from sklearn.model_selection import train_test_split
      from sklearn.pipeline import make_pipeline
      from sklearn.preprocessing import StandardScaler

      X, y = load_diabetes(return_X_y=True)
      X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

      model = make_pipeline(StandardScaler(),
                            PassiveAggressiveRegressor(random_state=0))
      model.fit(X_train, y_train)
      pa = model[-1]
      print(model.predict(X_test).shape)
      print(pa.coef_.shape)
      print(pa.intercept_.shape)
      print(pa.n_iter_)
      print(pa.n_features_in_)
    snippet_library: scikit-learn
    visual: null
  catch_outs:
    - early_stopping is off by default. Turn it on for a validation split.
    - shuffle is on by default. Set random_state for repeatable runs.
    - fit starts fresh each call unless warm_start is True.
