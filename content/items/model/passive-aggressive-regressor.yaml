  watch_it_work: {none: true}
  intuition:
    idea: Take a step only when a row misses by more than epsilon.
    analogy: A coach who changes the plan only after a clear miss.
    animation: none
    good_at: [streaming data, numeric targets, one row at a time]
    bad_at: [curved relationships, needs p-values]
    vs_siblings:
      - {page: sgd-regressor, note: "Also linear, learns in small batches. Has a learning rate."}
      - {page: linear-svr, note: "Also linear. Fits the whole set in one call."}
    read_more:
      - Start with a line through the middle of the data.
      - Step only when a row misses by more than epsilon.
      - Repeat over the data, shuffled each pass.
