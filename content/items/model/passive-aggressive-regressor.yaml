    target: sklearn.linear_model.PassiveAggressiveRegressor
    why_this_library: Has partial_fit, so it can learn from streams.
    snippet: "# scikit-learn 1.9.1\nfrom sklearn.datasets import load_diabetes\nfrom sklearn.linear_model\
      \ import PassiveAggressiveRegressor\nfrom sklearn.model_selection import train_test_split\nfrom\
      \ sklearn.pipeline import make_pipeline\nfrom sklearn.preprocessing import StandardScaler\n\nX,\
      \ y = load_diabetes(return_X_y=True)\nX_train, X_test, y_train, y_test = train_test_split(X, y,\
      \ random_state=0)\nmodel = make_pipeline(\n    StandardScaler(),\n    PassiveAggressiveRegressor(C=1.0,\
      \ random_state=0),\n)\nmodel.fit(X_train, y_train)\npa = model[-1]\ny_pred = model.predict(X_test[:3])\n\
      print(\"y_pred:\", y_pred.round(1))\nprint(\"coef_ shape:\", pa.coef_.shape)\nprint(\"n_iter_:\"\
      , pa.n_iter_)\n"
    output: 'y_pred: [237.2 264.7 163.8]

      coef_ shape: (10,)

      n_iter_: 10

      '
  what_comes_out:
