  code:
  - library: scipy
    target: scipy.optimize.curve_fit
    why_this_library: The scipy fitter for any formula you write.
    snippet: |
      # scipy 1.18.1
      import numpy as np
      from scipy.optimize import curve_fit

      def decay(x, a, b, c):
          return a * np.exp(-b * x) + c

      x = np.linspace(0, 3, 12)
      noise = np.array([0.02, -0.01, 0.01, -0.02, 0.01, 0.0,
                        -0.01, 0.02, -0.01, 0.01, -0.02, 0.01])
      y = decay(x, 2.5, 0.8, 0.5) + noise
      popt, pcov = curve_fit(decay, x, y, p0=[2.0, 1.0, 0.4])
      perr = np.sqrt(np.diag(pcov))
      y_fit = decay(x, *popt)
      print("popt:", np.round(popt, 3))
      print("pcov shape:", pcov.shape)
      print("parameter errors:", np.round(perr, 4))
      print("fitted y first 3:", np.round(y_fit[:3], 3))
    output: |
      popt: [2.501 0.812 0.511]
      pcov shape: (3, 3)
      parameter errors: [0.0192 0.0176 0.0204]
      fitted y first 3: [3.012 2.515 2.116]
  what_comes_out:
    items:
    - name: popt
      kind: return
      task: null
      shape: (n_params,)
      object_type: numpy.ndarray
      example: '[2.5, 0.8, 0.5]'
      shape_explanation: One fitted value per parameter in the order of the function signature. This example has 3 parameters, so shape (3,).
      note: Tuple result from curve_fit; values minimize squared residuals.
    - name: pcov
      kind: return
      task: null
      shape: (n_params, n_params)
      object_type: numpy.ndarray
      example: '[[0.001, 0.0, 0.0], [0.0, 0.002, 0.0], [0.0, 0.0, 0.001]]'
      shape_explanation: A square covariance matrix for fitted parameters. With 3 parameters, the example shape is (3, 3).
      note: Diagonal entries are variances; square roots give approximate standard errors, not confidence intervals.
    - name: f(x, *popt)
      kind: return
      task: regression
      shape: (n_samples,)
      object_type: numpy.ndarray
      example: '[3.0, 2.3, 1.8]'
      shape_explanation: Calling the supplied function with popt gives one fitted value per input x. There are 12 x values in the snippet, so the full prediction array has shape (12,).
      note: Caller-built predictions; curve_fit returns popt and pcov, not a prediction method.
    next_step: Use sqrt(diag(pcov)) for approximate errors; call f(x, *popt) to predict.
    visual: null
    snippet: |
