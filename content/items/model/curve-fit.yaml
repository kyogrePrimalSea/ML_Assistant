slots:
  header: {}
  solves:
    hero: {kind: model, dataset: airline-passengers, shape: fit_line}
    line: Tunes a formula's numbers until its curve matches the data.
  quick_facts:
    data_size: Small to medium tables
  use_avoid:
    use_when: [known formula, few parameters, error bars needed]
    avoid_when: [no formula, many parameters, unknown shape]
  prep:
    - step: {family: clean.impute}
      status: required
      why: Raises an error on NaN.
      condition: {has_missing: true}
      unless: null
    - step: {family: transform.scale.rescale}
      status: recommended
      why: Keeps fitted parameters on similar scales.
      condition: null
      unless: null
  code:
  - library: scipy
    target: scipy.optimize.curve_fit
    why_this_library: The scipy fitter for any formula you write.
    snippet: |
      # scipy 1.18.1
      import numpy as np
      from scipy.optimize import curve_fit
      from sklearn.datasets import make_regression


      def decay(x, a, b, c):
          return a * np.exp(-b * x) + c


      x = np.linspace(0, 4, 50)
      _, noise = make_regression(n_samples=50, noise=1.0, random_state=0)
      y = 2.5 * np.exp(-1.3 * x) + 0.5 + 0.05 * noise / noise.std()
      popt, pcov = curve_fit(decay, x, y, p0=[1, 1, 0])
      print(np.round(popt, 2))
  what_comes_out:
    items:
      - {name: popt, kind: return, task: null, shape: "(n_params,)",
         note: "Fitted values, in the order of the formula's arguments."}
      - {name: pcov, kind: return, task: null, shape: "(n_params, n_params)",
         note: "Covariance. Its diagonal gives each parameter's variance."}
    next_step: Take the square root of pcov's diagonal for errors.
    visual: null
  catch_outs:
    - Default p0 is all ones. A poor guess may not converge.
    - Parameters on very different scales converge badly.
    - NaN or infinite values raise an error by default.
