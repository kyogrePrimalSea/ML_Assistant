      pcov shape: (3, 3)
      parameter errors: [0.0192 0.0176 0.0204]
      fitted y first 3: [3.012 2.515 2.116]
    guidance:
    - task: regression
      text: For curve_fit, compute fitted predictions by calling your supplied function with popt. Treat pcov as approximate parameter covariance, not a confidence interval.
  catch_outs:
  - Default p0 is all ones. A poor guess may not converge.
  - Parameters on very different scales converge badly.
  - NaN or infinite values raise an error by default.
  key_settings:
    tier1:
    - name: p0
      page: null
      controls: Sets the starting value for each unknown model parameter.
      effect: A closer starting guess can help convergence; a poor guess may find a bad local solution.
    - name: bounds
      page: null
      controls: Sets lower and upper limits for every fitted parameter.
      effect: Bounds enforce plausible values but constrain the solution and select a bounded method.
    - name: sigma
      page: null
      controls: Weights residuals using observation uncertainty or covariance.
      effect: Smaller uncertainty gives an observation more influence; incorrect errors distort fit and covariance.
    - name: absolute_sigma
      page: null
      controls: Chooses whether sigma has absolute scale or only relative weights.
      effect: True keeps the supplied scale in pcov; false rescales it using residual variance.
    tier2:
    - name: method
      page: null
      controls: Chooses lm, trf, or dogbox optimization.
      effect: lm is efficient when unconstrained; trf/dogbox support bounds, while lm needs enough observations.
    - name: jac
      page: null
      controls: Supplies derivatives of the model with respect to its parameters.
      effect: A good Jacobian can improve speed and accuracy; otherwise finite differences are estimated.
    - name: check_finite
      page: null
      controls: Checks inputs for NaN or infinity before fitting.
      effect: Checking catches invalid data; disabling it may silently produce nonsensical results.
    tier3:
    - name: nan_policy
      page: null
      controls: 'Chooses how NaNs are handled: default, raise, or omit.'
      effect: Omitting rows changes the fitted sample; raising fails early on missing values.
    - name: full_output
      page: null
      controls: Requests optimizer diagnostics in addition to popt and pcov.
      effect: Extra diagnostics help inspect convergence but add returned tuple values.
  watch_it_work:
    none: true
  intuition:
    idea: Adjust the numbers in a known formula until its curve sits closest to the points.
    analogy: Turning the dials of a machine you understand until its output matches the readings.
    animation: none
    good_at:
    - known formulas
    - few parameters
    - error estimates
    bad_at:
    - unknown shape
    - many parameters
    vs_siblings:
    - page: least-squares
      note: Lower-level solver. Adds robust losses.
    goal: Fit the parameters of a supplied nonlinear formula by minimizing its weighted squared residuals.
    steps:
    - Write a model function with the independent input first and unknown parameters afterward.
    - Choose an initial value for each parameter and optional bounds or observation uncertainties.
    - Evaluate residuals between observed values and the function at each parameter trial.
    - Let a nonlinear least-squares method update parameters until it converges.
    - Evaluate the fitted function at desired x values and inspect approximate parameter covariance.
    math:
      notation:
      - symbol: x_i
        meaning: Independent input for observation i.
      - symbol: y_i
        meaning: Observed response for observation i.
      - symbol: f(x_i,theta)
        meaning: User-supplied model prediction at x_i and parameter vector theta.
      - symbol: theta
        meaning: Vector of n_params unknown model parameters.
      - symbol: r_i
        meaning: Residual f(x_i,theta)-y_i.
      - symbol: sigma_i
        meaning: Optional uncertainty scale for observation i.
      equations:
      - expression: theta_hat=argmin_theta sum_i (r_i/sigma_i)^2
        meaning: The fit chooses parameters that minimize weighted squared residuals; without sigma, weights are equal.
      - expression: yhat(x)=f(x,theta_hat)
        meaning: Predictions are made by calling the supplied formula with fitted parameters.
      - expression: perr_j=sqrt(pcov[j,j])
        meaning: The square root of a covariance diagonal gives an approximate parameter standard error, not a confidence interval.
      prediction: curve_fit returns popt and approximate pcov. Call f(x, *popt) to predict.
    read_more:
    - Write the formula with its unknown numbers.
    - Give a starting guess in p0.
    - Minimise the squared errors numerically.
    - Read popt for values and pcov for error bars.
  next: []
