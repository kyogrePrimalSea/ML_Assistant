id: gls
plain_name: GLS
code_name: GLS
aliases:
- generalized least squares
- correlated errors
stage: model
family: model.linear.ols
tracks:
- standard
archetype: model
question_tags:
- correlated errors
- time order
- autocorrelation
targets:
- statsmodels.regression.linear_model.GLS
pairs_with:
- ljung-box
clashes: []
source_urls:
- https://www.statsmodels.org/stable/generated/statsmodels.regression.linear_model.GLS.html
library_versions:
  statsmodels: 0.15.0
reviewed: false
rules:
  task_types:
  - regression
  blocked_when: []
  fits_on_data: true
  shape_effect:
    rows: same
    columns: same
slots:
  header: {}
  solves:
    hero:
      kind: model
      dataset: airline-passengers
      shape: fit_line
    line: A straight line where errors can be linked across rows.
  quick_facts:
    none: true
  use_avoid:
    use_when:
    - errors linked over time
    - known error structure
    avoid_when:
    - errors look independent
    - error structure unknown
    - rows in groups
  prep:
  - step:
      family: clean.impute
    status: required
    why: Statsmodels rejects NaN in the inputs.
    condition:
      has_missing: true
    unless: null
  - step:
      family: transform.encode.features
    status: required
    why: Text categories must become numbers.
    condition:
      has_categoricals: true
    unless: null
  - step:
      family: transform.scale.rescale
    status: not_needed
    why: Scaling changes the coefficients, not the predictions.
    condition: null
    unless: null
  - step:
      family: split.time
    status: recommended
    why: Keep rows in time order when splitting.
    condition:
      time_ordered: true
    unless: null
  code:
  - library: statsmodels
    target: statsmodels.regression.linear_model.GLS
    why_this_library: Takes an error covariance matrix directly.
    snippet: '# statsmodels 0.15.0

      import numpy as np

      import statsmodels.api as sm

      from sklearn.datasets import make_regression


      X, y = make_regression(n_samples=120, n_features=2, noise=10, random_state=0)

      idx = np.arange(len(y))

      sigma = 0.5 ** np.abs(np.subtract.outer(idx, idx))

      exog = sm.add_constant(X)

      results = sm.GLS(y, exog, sigma=sigma).fit()

      y_pred = results.predict(exog[:3])

      print(''y_pred:'', y_pred.round(1))

      print(''params:'', results.params.round(2))

      print(''pvalues:'', results.pvalues.round(3))'
    output: 'y_pred: [ 29.6 -20.1  14.8]

      params: [-1.21 12.34 26.7 ]

      pvalues: [0.551 0.    0.   ]

      '
  what_comes_out:
    items:
    - name: predict
      kind: method
      task: regression
      shape: (n_samples,)
      object_type: numpy.ndarray
      example: '[29.6, -20.1, 14.8]'
      shape_explanation: 'A one-dimensional array: n_samples is the number of design rows predicted. This example
        has three predictions, shape (3,); the trailing comma marks one dimension.'
      note: Fitted Results.predict gives one value per design row.
    - name: params
      kind: return
      task: null
      shape: (n_parameters,)
      object_type: numpy.ndarray
      example: '[-1.21, 12.34, 26.7]'
      shape_explanation: 'A one-dimensional array: n_parameters counts fitted coefficients, including the constant
        column. This example has three entries, shape (3,); the trailing comma marks one dimension.'
      note: Statsmodels Results.params; coefficients follow design-column order.
    - name: pvalues
      kind: return
      task: null
      shape: (n_parameters,)
      object_type: numpy.ndarray
      example: '[0.551, 0.0, 0.0]'
      shape_explanation: 'A one-dimensional array: n_parameters counts coefficient tests. This example has three
        p-values, shape (3,); the trailing comma marks one dimension.'
      note: Statsmodels Results.pvalues tests each coefficient under the fitted model.
    visual: regression_preds
    guidance:
    - task: regression
      text: Check residuals and the supplied weights or covariance structure before interpreting uncertainty.
    snippet: '# statsmodels 0.15.0

      import numpy as np

      import statsmodels.api as sm

      from sklearn.datasets import make_regression


      X, y = make_regression(n_samples=120, n_features=2, noise=10, random_state=0)

      idx = np.arange(len(y))

      sigma = 0.5 ** np.abs(np.subtract.outer(idx, idx))

      exog = sm.add_constant(X)

      results = sm.GLS(y, exog, sigma=sigma).fit()

      y_pred = results.predict(exog[:3])

      print(''y_pred:'', y_pred.round(1))

      print(''params:'', results.params.round(2))

      print(''pvalues:'', results.pvalues.round(3))'
    snippet_library: statsmodels
    output: 'y_pred: [ 29.6 -20.1  14.8]

      params: [-1.21 12.34 26.7 ]

      pvalues: [0.551 0.    0.   ]

      '
    next_step: Use held-out rows to check predictions and residuals.
  catch_outs:
  - Sigma must match the row order of the data.
  - Sigma is supplied, not estimated. A wrong guess misleads.
  - Missing values stop the fit. Impute them first.
  key_settings:
    tier1:
    - name: sigma
      page: null
      controls: The supplied error covariance structure across observations.
      effect: A wrong structure produces a poor weighting of errors and misleading inference.
    tier2:
    - name: hasconst
      page: null
      controls: Whether the design matrix already contains a constant.
      effect: A wrong declaration changes model degrees of freedom and statistics.
    - name: missing
      page: null
      controls: Whether to ignore, drop, or raise on missing values.
      effect: Dropping rows changes the sample; raising stops the fit.
    tier3: []
  watch_it_work:
    none: true
  intuition:
    idea: Least squares that allows errors to be linked across rows.
    analogy: Counting one complaint once when many people repeat it.
    animation: none
    good_at:
    - errors linked over time
    - a known error structure
    - readable effects
    bad_at:
    - unknown error structure
    - rows in groups
    vs_siblings:
    - page: linear-regression
      note: Same line, but assumes independent errors.
    - page: wls
      note: Reweights rows, but ignores links between them.
    goal: Fit a straight line while accounting for the supplied covariance links among row errors.
    steps: &id001
    - Describe how errors link, as sigma.
    - Whiten the data using that structure.
    - Fit ordinary least squares on the whitened data.
    math:
      notation:
      - symbol: y
        meaning: response vector
      - symbol: X
        meaning: design matrix
      - symbol: b
        meaning: coefficient vector
      - symbol: Sigma
        meaning: supplied error covariance matrix
      equations:
      - expression: minimise (y - Xb)^T Sigma^-1 (y - Xb)
        meaning: GLS weights residual directions using the inverse error covariance.
      - expression: predict y_new = X_new b
        meaning: Predictions multiply the new design matrix by fitted coefficients.
      prediction: For new rows, multiply their design matrix by the fitted coefficient vector.
    read_more: *id001
  next: []
