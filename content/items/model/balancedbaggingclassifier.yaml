  catch_outs:
  - Accuracy looks fine on lopsided data. Use balanced accuracy.
  - Predict gives labels. Use predict_proba for ROC or PR curves.
  - No decision_function with the default base. Check the base first.
  - Text columns fail. Encode them first.
  key_settings:
    tier1:
    - name: sampling_strategy
      page: null
      controls: Class counts targeted by the sampler before each base estimator fits.
      effect: More aggressive balancing discards more majority rows, changing what each model sees.
    - name: sampler
      page: null
      controls: Resampling method inserted before the base estimator.
      effect: Different samplers change the training distribution and add computation.
    - name: estimator
      page: null
      controls: Base classifier fitted in each sampled pipeline.
      effect: More expressive models can capture more structure but overfit or cost more.
    - name: n_estimators
      page: n-estimators
      controls: Number of sampled base-estimator pipelines to fit.
      effect: More pipelines can stabilise votes and probabilities but increase cost.
    tier2:
    - name: max_features
      page: null
      controls: Number or share of columns drawn for each base estimator.
      effect: Fewer columns decorrelate models but may omit useful signals.
    - name: max_samples
      page: null
      controls: Rows drawn for each outer bag before the sampler runs.
      effect: Smaller bags lower cost but can reduce class and pattern coverage.
    - name: replacement
      page: null
      controls: Whether the sampler draws selected rows with replacement.
      effect: Repeated rows may add variance; without replacement each sampler draw is unique.
    tier3:
    - name: bootstrap
      page: null
      controls: Whether outer bag rows are drawn with replacement.
      effect: Bootstrap creates varied bags; turning it off uses distinct rows per outer draw.
    - name: bootstrap_features
      page: null
      controls: Whether outer feature subsets are drawn with replacement.
      effect: Replacement can repeat a feature within a draw; otherwise selected features are distinct.
    - name: oob_score
      page: null
      controls: Whether out-of-bag rows estimate generalisation score.
      effect: Adds an internal check but requires bootstrap and may be noisy on rare classes.
  watch_it_work:
