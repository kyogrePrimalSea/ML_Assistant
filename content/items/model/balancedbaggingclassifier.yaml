    analogy: Several referees, each shown an even mix of both outcomes.
    animation: none
    good_at: [rare classes, tabular data, any base model]
    bad_at: [tiny data, extrapolation, raw text]
    vs_siblings:
      - {page: bagging, note: "Same bagging idea. This one balances each bag."}
      - {page: balancedrandomforestclassifier, note: "Trees only. Balances each tree's sample."}
      - {page: easyensembleclassifier, note: "Bags AdaBoost learners on balanced samples."}
    read_more:
      - Draw a balanced sample of the rows.
      - Fit one base model on that sample.
      - Repeat, then combine the models' votes.
