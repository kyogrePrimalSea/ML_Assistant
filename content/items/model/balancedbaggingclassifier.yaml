  intuition:
    idea: Many models, each fit on a balanced sample of the rows.
    analogy: Several referees, each shown an even mix of both outcomes.
    animation: none
    good_at:
    - rare classes
    - tabular data
    - any base model
    bad_at:
    - tiny data
    - extrapolation
    - raw text
    vs_siblings:
    - page: bagging
      note: Same bagging idea. This one balances each bag.
    - page: balancedrandomforestclassifier
      note: Trees only. Balances each tree's sample.
    - page: easyensembleclassifier
      note: Bags AdaBoost learners on balanced samples.
    read_more:
    - Draw a balanced sample of the rows.
    - Fit one base model on that sample.
    - Repeat, then combine the models' votes.
    goal: For each outer bag, sample rows, run an imbalanced-learn sampler, then fit the chosen base classifier.
    steps:
    - Draw an outer row and feature subset using bagging settings
    - Apply the configured sampler inside that subset
    - Fit the chosen base estimator on the resampled rows in a pipeline
    - Repeat for each bag, then aggregate estimator probabilities or votes
    - The estimator can be any compatible classifier, not only a tree.
    math:
      notation:
      - symbol: j
        meaning: Outer bag index.
      - symbol: B_j
        meaning: Rows drawn in outer bag j.
      - symbol: R_j
        meaning: Sampler applied to outer bag j.
      - symbol: g_j
        meaning: Base classifier fitted after sampling.
      - symbol: p_j(c|x)
        meaning: Pipeline j probability for class c.
      - symbol: J
        meaning: Number of fitted pipelines.
      equations:
      - expression: p(c|x)=J⁻¹Σ_j p_j(c|x); g_j fits R_j(B_j)
        meaning: Each pipeline samples an outer bag, resamples it, fits a base model, then votes by probability.
      prediction: predict_proba averages probabilities; predict returns labels. Default tree pipelines have no decision_function.
