id: decision-tree-classifier
plain_name: DecisionTreeClassifier
code_name: DecisionTreeClassifier
aliases: [decision tree]
stage: model
family: model.trees.single
tracks: [standard]
archetype: model
question_tags: [readable rules, tabular data, overfitting]
targets: [sklearn.tree.DecisionTreeClassifier]
pairs_with: [treeexplainer]
clashes: []
source_urls: ['https://scikit-learn.org/stable/modules/generated/sklearn.tree.DecisionTreeClassifier.html']
library_versions: {scikit-learn: 1.9.1}
reviewed: false
rules:
  task_types: [classification]
  blocked_when: []
  fits_on_data: true
  shape_effect: {rows: same, columns: same}
slots:
  header: {}
  solves:
    hero: {kind: model, dataset: breast-cancer, shape: boundary}
    line: "One tree of if-then rules that a person can read."
  quick_facts:
    data_size: Tabular data
  use_avoid:
    use_when: [rules a person can follow, tabular data, explaining each decision]
    avoid_when: [accuracy is the top goal, images or text, very noisy data]
  prep:
    - step: {family: transform.scale.rescale}
      status: not_needed
      why: Trees split on order, not size.
      condition: null
      unless: null
    - step: {family: clean.impute}
      status: not_needed
      why: Missing values are handled natively.
      condition: null
      unless: null
    - step: {family: transform.encode.features}
      status: required
      why: Text categories must become numbers.
      condition: {has_categoricals: true}
      unless: null
    - step: {family: transform.rebalance.weight}
      status: recommended
      why: Use class_weight='balanced' when classes are lopsided.
      condition: {imbalanced: true, task_type: [classification]}
      unless: {setting: class_weight, value: balanced}
  code:
    - library: scikit-learn
      target: sklearn.tree.DecisionTreeClassifier
      why_this_library: The single tree in scikit-learn, easiest to read.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.model_selection import train_test_split
        from sklearn.tree import DecisionTreeClassifier

        X, y = load_breast_cancer(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(
            X, y, random_state=0
        )

        model = DecisionTreeClassifier(max_depth=3, random_state=0)
        model.fit(X_train, y_train)
        print(round(model.score(X_test, y_test), 3))
  what_comes_out:
    items:
      - {name: predict, kind: method, task: classification, shape: "(n_samples,)",
         note: "Class labels, one per row."}
      - {name: predict_proba, kind: method, task: classification, shape: "(n_samples, n_classes)",
         note: "Share of training rows per class in the leaf each row lands in."}
      - {name: predict_log_proba, kind: method, task: classification, shape: "(n_samples, n_classes)",
         note: "Log of the class probabilities, same column order."}
      - {name: score, kind: method, task: classification, shape: "float",
         note: "Accuracy on the data given. Misleading when classes are lopsided."}
      - {name: feature_importances_, kind: attribute, task: null, shape: "(n_features,)",
         note: "One score per input column."}
      - {name: classes_, kind: attribute, task: classification, shape: "(n_classes,)",
         note: "Class labels, in the column order of predict_proba."}
      - {name: n_features_in_, kind: attribute, task: null, shape: "int",
         note: "Number of input columns seen in fit."}
      - {name: feature_names_in_, kind: attribute, task: null, shape: "(n_features,)",
         note: "Column names, only if fit got a DataFrame."}
    next_step: ROC AUC works, but probabilities come in steps, one per leaf.
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.datasets import load_breast_cancer
      from sklearn.model_selection import train_test_split
      from sklearn.tree import DecisionTreeClassifier

      X, y = load_breast_cancer(return_X_y=True)
      X_train, X_test, y_train, y_test = train_test_split(
          X, y, random_state=0
      )

      model = DecisionTreeClassifier(max_depth=3, random_state=0)
      model.fit(X_train, y_train)
      print(model.predict_proba(X_test).shape)
      print(model.classes_)
      print(model.feature_importances_.shape)
    snippet_library: scikit-learn
    visual: proba_table
  catch_outs:
    - Deep trees overfit. Set max_depth or min_samples_leaf.
    - Missing values are fine, but text columns fail.
    - Predict gives labels. Use predict_proba for ROC or PR curves.
  key_settings:
    tier1:
      - {name: max_depth, page: max-depth}
      - {name: min_samples_leaf, page: null}
      - {name: class_weight, page: null}
      - {name: min_impurity_decrease, page: null}
    tier2:
      - {name: max_features, page: null}
      - {name: ccp_alpha, page: null}
      - {name: min_samples_split, page: null}
      - {name: criterion, page: null}
      - {name: monotonic_cst, page: null}
    tier3:
      - {name: splitter, page: null}
      - {name: max_leaf_nodes, page: null}
      - {name: min_weight_fraction_leaf, page: null}
  watch_it_work: {none: true}
  intuition:
    idea: Ask yes-or-no questions about one feature at a time.
    analogy: A flowchart a clinic nurse could follow.
    animation: none
    good_at: [readable rules, tabular data, explaining decisions]
    bad_at: [overfitting by default, small changes in data, extrapolation]
    vs_siblings:
      - {page: random-forest, note: "Many trees, averaged. More accurate, less readable."}
      - {page: decision-tree-regressor, note: "Same tree, predicting a number instead."}
    read_more:
      - Find the feature and cut that splits the rows best.
      - Repeat on each side of the cut.
      - Stop at max_depth or when the leaves are pure.
  next: [model-overfitting, know-feature-importance]
