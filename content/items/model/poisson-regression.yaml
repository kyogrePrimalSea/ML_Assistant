      - {name: max_iter, page: null}
    tier3:
      - {name: offset, page: null}
      - {name: missing, page: null}
  watch_it_work: {none: true}
  intuition:
    idea: Model the average count as exp of a line, so predictions stay positive.
    analogy: Like compound interest, where each step multiplies rather than adds.
    animation: none
    good_at: [count targets, rates per exposure, positive predictions]
    bad_at: [continuous targets, overdispersed counts]
    vs_siblings:
      - {page: negative-binomial-regression, note: "Adds a spread term, alpha, for overdispersed counts."}
      - {page: tweedie-regressor, note: "Allows amounts and exact zeros, not just counts."}
      - {page: glm, note: "Same Poisson family, through the GLM interface."}
    read_more:
      - Start from the log of the average count.
      - Minimise the deviance in scikit-learn, or maximise likelihood in statsmodels.
      - Read each coefficient as a multiplier on the count.
  next: [but-count-zeros, but-pvalues]
