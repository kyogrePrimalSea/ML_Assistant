  code:
  - library: scikit-learn
    target: sklearn.naive_bayes.MultinomialNB
    why_this_library: Models counts per feature and class.
    snippet: "# scikit-learn 1.9.1\nimport numpy as np\nfrom sklearn.naive_bayes import MultinomialNB\n\nX_train\
      \ = np.array([\n    [4, 0, 1, 0], [3, 1, 0, 0], [2, 0, 0, 1], [4, 1, 0, 0],\n    [0, 3, 0, 1], [0, 2, 1, 1],\
      \ [0, 4, 0, 0], [1, 2, 0, 1],\n])\ny_train = np.array([\"fruit\"] * 4 + [\"vehicle\"] * 4)\nX_query = np.array([[3,\
      \ 0, 0, 0], [0, 3, 1, 0], [1, 1, 0, 1]])\nmodel = MultinomialNB(alpha=1.0).fit(X_train, y_train)\ny_proba\
      \ = model.predict_proba(X_query)\ny_pred = model.predict(X_query)\nprint(\"classes:\", model.classes_)\nprint(\"\
      probabilities:\", y_proba.round(3))\nprint(\"labels:\", y_pred)\n"
    output: "classes: ['fruit' 'vehicle']\nprobabilities: [[0.997 0.003]\n [0.013 0.987]\n [0.43  0.57 ]]\nlabels:\
      \ ['fruit' 'vehicle' 'vehicle']\n"
  what_comes_out:
    items:
    - name: predict
      kind: method
      task: classification
      shape: (n_samples,)
      object_type: numpy.ndarray
      example: '[''fruit'', ''vehicle'', ''fruit'']'
      shape_explanation: Three input rows produce three predicted labels, shape (3,). The trailing comma means one
        array axis.
      note: One predicted class label for each input row.
    - name: predict_proba
      kind: method
      task: classification
      shape: (n_samples, n_classes)
      object_type: numpy.ndarray
      example: '[[0.91, 0.09], [0.12, 0.88], [0.73, 0.27]]'
      shape_explanation: Rows are 3 input cases and columns are the 2 classes in classes_ order, shape (3, 2).
      note: Normalized class probabilities; columns follow classes_.
    - name: predict_log_proba
      kind: method
      task: classification
      shape: (n_samples, n_classes)
      object_type: numpy.ndarray
      example: '[[-0.09, -2.41], [-2.12, -0.13], [-0.31, -1.31]]'
      shape_explanation: Three case rows and two class columns give shape (3, 2); values are log probabilities.
      note: Log of normalized posterior probabilities.
    - name: predict_joint_log_proba
      kind: method
      task: classification
      shape: (n_samples, n_classes)
      object_type: numpy.ndarray
      example: '[[-4.21, -6.53], [-6.24, -4.25], [-4.43, -5.43]]'
      shape_explanation: Three input rows by two class scores gives shape (3, 2); columns use classes_ order.
      note: Adds class log prior to class-conditional log likelihood; ComplementNB returns complement scores.
    - name: classes_
      kind: attribute
      task: classification
      shape: (n_classes,)
      object_type: numpy.ndarray
      example: '[''fruit'', ''vehicle'']'
      shape_explanation: There are two class labels, so this one-dimensional array has shape (2,).
      note: Defines class-column order for probability and log-score methods.
    - name: class_log_prior_
      kind: attribute
      task: classification
      shape: (n_classes,)
      object_type: numpy.ndarray
      example: '[-0.69, -0.69]'
      shape_explanation: One log prior per class; the two-class example has shape (2,).
      note: Log class priors used in class scoring.
    - name: feature_count_
      kind: attribute
      task: classification
      shape: (n_classes, n_features)
      object_type: numpy.ndarray
      example: '[[12, 3], [2, 11]]'
      shape_explanation: Rows are 2 classes and columns are 2 features, shape (2, 2).
      note: Weighted or unweighted training counts for each class-feature pair.
    - name: feature_log_prob_
      kind: attribute
      task: classification
      shape: (n_classes, n_features)
      object_type: numpy.ndarray
      example: '[[-0.2, -1.8], [-1.7, -0.3]]'
      shape_explanation: Rows are 2 classes and columns are 2 features, shape (2, 2).
      note: Multinomial/Bernoulli conditional logs; ComplementNB stores complement weights.
    next_step: null
    visual: proba_table
    guidance:
    - task: classification
      text: Provide non-negative counts or frequencies. Use probabilities for probability metrics and labels for
        class metrics.
    snippet: "# scikit-learn 1.9.1\nimport numpy as np\nfrom sklearn.naive_bayes import MultinomialNB\n\nX = np.array([\n\
      \    [4,0,1,0],[3,1,0,0],[2,0,0,1],[4,1,0,0],\n    [0,3,0,1],[0,2,1,1],[0,4,0,0],[1,2,0,1],\n])\ny = np.array([\"\
      fruit\"] * 4 + [\"vehicle\"] * 4)\nquery = np.array([[3,0,0,0],[0,3,1,0],[1,1,0,1]])\nmodel = MultinomialNB(alpha=1.0).fit(X,\
      \ y)\nprint(\"labels:\", model.predict(query))\nprint(\"probability shape:\", model.predict_proba(query).shape)\n\
      print(\"log probability shape:\", model.predict_log_proba(query).shape)\nprint(\"joint log shape:\", model.predict_joint_log_proba(query).shape)\n\
      print(\"classes_:\", model.classes_)\nprint(\"class_log_prior_:\", model.class_log_prior_.round(3))\nprint(\"\
      feature_count_ shape:\", model.feature_count_.shape)\nprint(\"feature_log_prob_ shape:\", model.feature_log_prob_.shape)\n"
    snippet_library: scikit-learn
    output: 'labels: [''fruit'' ''vehicle'' ''vehicle'']

      probability shape: (3, 2)

      log probability shape: (3, 2)

      joint log shape: (3, 2)

      classes_: [''fruit'' ''vehicle'']

      class_log_prior_: [-0.693 -0.693]

      feature_count_ shape: (2, 4)

      feature_log_prob_ shape: (2, 4)

      '
  catch_outs:
  - Negative values fail in fit. Keep counts zero or above.
  - NaN fails in fit. Impute before the model.
  - alpha=0 turns smoothing off. Unseen words then get zero probability.
  key_settings:
    tier1:
    - name: alpha
      page: null
      controls: Additive smoothing for class-feature counts; may be scalar or per feature.
      effect: More smoothing prevents zero likelihoods but flattens feature probabilities.
    - name: class_prior
      page: null
      controls: Explicit prior probability for each class.
      effect: Known priors can reflect deployment rates; wrong priors bias class scores.
    tier2:
    - name: force_alpha
      page: null
      controls: Whether to keep alpha unchanged when it is extremely close to zero.
      effect: Keeping tiny alpha can cause numerical issues; clipping changes the requested smoothing.
    - name: fit_prior
      page: null
      controls: Whether to learn class priors from label frequencies.
      effect: False uses uniform priors; this removes frequency imbalance from class scoring.
    tier3: []
  watch_it_work:
    none: true
  intuition:
    idea: Count how often each feature appears in each class.
    analogy: Tallying word counts per topic.
    animation: none
    good_at:
    - word counts
    - class probabilities
    bad_at:
    - negative values
    - numeric measurements
    vs_siblings:
    - page: complement-nb
      note: Same counts. ComplementNB uses the other classes.
    - page: categorical-nb
      note: Category codes, not counts.
    read_more:
    - The feature model is multinomial counts, commonly word occurrences in documents.
    - alpha smooths class-feature counts before probabilities are normalized.
    - The model requires non-negative values; it does not require counts to sum to one.
    goal: Classify non-negative count or frequency vectors with a multinomial feature likelihood per class.
    steps:
    - Sum each feature’s training counts separately within each class.
    - Add alpha smoothing to class-feature counts and normalize them into feature probabilities.
    - For a query row, multiply feature probabilities according to its counts, in log space.
    - Add the class log prior, normalize scores for probabilities, and choose the largest class score.
    math:
      notation:
      - symbol: x_j
        meaning: Non-negative count or frequency of feature j in a row.
      - symbol: theta_cj
        meaning: Smoothed probability of feature j in class c.
      - symbol: N_cj
        meaning: Training count of feature j in class c.
      - symbol: alpha
        meaning: Additive count smoothing.
      - symbol: pi_c
        meaning: Prior probability of class c.
      equations:
      - expression: theta_cj = (N_cj + alpha) / sum_l(N_cl + alpha)
        meaning: Smoothing gives each feature a nonzero class-conditional probability.
      - expression: log P(c,x) = log pi_c + sum_j x_j log(theta_cj)
        meaning: The row count multiplies each feature log probability before adding the class prior.
      prediction: Use non-negative counts or frequencies. Probabilities are normalized; joint log scores are not.
  next:
  - evaluate-how-good
