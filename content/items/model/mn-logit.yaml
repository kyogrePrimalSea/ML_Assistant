    target: statsmodels.discrete.discrete_model.MNLogit
    why_this_library: Models multiclass probabilities against a reference class and reports inference.
    snippet: "# statsmodels 0.15.0\nimport numpy as np\nimport statsmodels.api as sm\nfrom sklearn.datasets import\
      \ make_classification\n\nX, y = make_classification(\n    n_samples=300, n_features=4, n_informative=3,\n\
      \    n_redundant=0, n_classes=3, random_state=0,\n)\nX = sm.add_constant(X)\nresult = sm.MNLogit(y, X).fit(disp=False)\n\
      y_proba = result.predict(X[:3])\ny_pred = y_proba.argmax(axis=1)\nprint('y_pred labels:', y_pred)\nprint('y_proba:',\
      \ np.round(y_proba, 3))\nprint('params shape:', result.params.shape)\nprint('pvalues first parameter:', np.round(result.pvalues[0],\
      \ 3))"
    output: "y_pred labels: [2 0 0]\ny_proba: [[0.001 0.021 0.978]\n [0.743 0.249 0.008]\n [0.96  0.038 0.002]]\n\
      params shape: (5, 2)\npvalues first parameter: [0.259 0.772]\n"
  what_comes_out:
    items:
    - name: predict
      kind: method
      task: classification
      shape: (n_samples, n_classes)
      object_type: numpy.ndarray
      example: '[[0.70, 0.20, 0.10], [0.15, 0.65, 0.20], [0.10, 0.25, 0.65]]'
      shape_explanation: 'A two-dimensional probability table: rows are n_samples and columns are n_classes. This
        fictional example assumes 3 cases and 3 classes, shape (3, 3); each row sums to one.'
      note: Statsmodels predicts one probability per class; use probabilities for ROC AUC or PR.
    - name: params
