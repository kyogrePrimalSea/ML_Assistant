      shape: (n_parameters, n_classes - 1)
      object_type: numpy.ndarray
      example: '[[0.03, 0.2], [0.001, 0.01], [0.4, 0.02]]'
      shape_explanation: A two-dimensional table aligned with params. This fictional example has 3 parameters and
        2 non-base classes, shape (3, 2).
      note: Statsmodels coefficient tests for each class contrast.
    - name: llf
      kind: return
      task: null
      shape: scalar
      object_type: float
      example: '-187.3'
      shape_explanation: A scalar is one value with no dimensions. This fictional example is the fitted log-likelihood.
      note: Log-likelihood for the fitted multinomial model.
    next_step: null
    snippet: "# statsmodels 0.15.0\nimport numpy as np\nimport statsmodels.api as sm\nfrom sklearn.datasets import\
      \ make_classification\n\nX, y = make_classification(\n    n_samples=300, n_features=4, n_informative=3,\n\
      \    n_redundant=0, n_classes=3, random_state=0,\n)\nX = sm.add_constant(X)\nresult = sm.MNLogit(y, X).fit(disp=False)\n\
      y_proba = result.predict(X[:3])\ny_pred = y_proba.argmax(axis=1)\nprint('y_pred labels:', y_pred)\nprint('y_proba:',\
      \ np.round(y_proba, 3))\nprint('params shape:', result.params.shape)\nprint('pvalues first parameter:', np.round(result.pvalues[0],\
      \ 3))"
    snippet_library: statsmodels
    visual: proba_table
    guidance:
    - task: classification
      text: Use predict_proba or continuous decision scores for ROC AUC and PR curves. Use predicted labels for
        accuracy or a confusion matrix.
    output: "y_pred labels: [2 0 0]\ny_proba: [[0.001 0.021 0.978]\n [0.743 0.249 0.008]\n [0.96  0.038 0.002]]\n\
      params shape: (5, 2)\npvalues first parameter: [0.259 0.772]\n"
  catch_outs:
  - Missing values raise an error unless missing is drop.
  - Separable classes can fail to converge. Check mle_retvals.
  key_settings:
    tier1:
    - name: missing
      page: null
      controls: 'Statsmodels handling of missing observations: none, drop, or raise.'
      effect: Dropping rows changes the estimation sample; raising stops when missing values are found.
    tier2:
    - name: check_rank
      page: null
      controls: Whether statsmodels checks the design matrix rank when determining model degrees of freedom.
      effect: Skipping the check can save setup time for wide designs but may hide rank problems.
    tier3: []
  watch_it_work:
    none: true
  intuition:
    idea: One score per class, with one base class fixed at zero.
    analogy: Ranking several candidates by points, then turning points into shares.
    animation: none
    good_at:
    - several classes
    - p-values per class
    bad_at:
    - curved boundaries
    - separable classes
    vs_siblings:
    - page: logistic-regression
      note: Statsmodels Logit is two classes only. MNLogit takes three or more.
    read_more: &id001
    - Choose a reference class and assign each other class a linear score.
    - Convert the class scores into probabilities with softmax.
    - Choose all class coefficients together by multinomial maximum likelihood.
    - Read each output row as probabilities for all classes.
    goal: Estimate class-specific linear log-odds against a reference class and convert the scores into multiclass
      probabilities.
    math:
      notation:
      - symbol: x_i
        meaning: Feature vector for case i.
      - symbol: J
        meaning: Number of outcome classes.
      - symbol: '0'
        meaning: Reference class whose score is fixed at zero.
      - symbol: b_j
        meaning: Coefficient vector for non-reference class j.
      - symbol: p_ij
        meaning: Probability that case i belongs to class j.
      - symbol: i
        meaning: Case index.
      - symbol: r
        meaning: Class index in the probability sum.
      - symbol: 1(condition)
        meaning: One when the condition is true, otherwise zero.
      equations:
      - expression: eta_i0 = 0; eta_ij = x_i^T b_j for j=1,...,J-1
        meaning: Each non-reference class gets a linear score relative to the base class.
      - expression: p_ij = exp(eta_ij) / sum_r exp(eta_ir)
        meaning: Softmax converts all J class scores, including the base score, into probabilities summing to one.
      - expression: maximize sum_i sum_j 1(y_i=j) log(p_ij)
        meaning: Multinomial maximum likelihood rewards probability assigned to each observed class.
      prediction: MNLogit returns probabilities by row and class. Use argmax for labels; parameters compare non-base
        classes.
    steps: *id001
  next: []
