      task: null
      shape: (n_parameters, n_classes - 1)
      object_type: numpy.ndarray
      example: '[[0.4, -0.2], [1.1, 0.6], [-0.5, 0.9]]'
      shape_explanation: 'A two-dimensional table: rows are n_parameters, including the constant if present, and
        columns are non-base classes. This fictional example has 3 parameters and 3 classes, shape (3, 2).'
      note: Statsmodels coefficients compare each non-base class with the reference class.
    - name: pvalues
