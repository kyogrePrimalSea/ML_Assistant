  code:
  - library: scikit-learn
    target: sklearn.dummy.DummyClassifier
    why_this_library: The scikit-learn baseline classifier.
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.datasets import make_classification
      from sklearn.dummy import DummyClassifier
      from sklearn.model_selection import train_test_split

      X, y = make_classification(n_samples=300, weights=[0.8, 0.2],
                                 random_state=0)
      X_train, X_test, y_train, y_test = train_test_split(X, y,
                                                          random_state=0)
      dummy = DummyClassifier(strategy="prior").fit(X_train, y_train)
      print(round(dummy.score(X_test, y_test), 3))
  what_comes_out:
    items:
      - {name: predict, kind: method, task: classification, shape: "(n_samples,)",
         note: "The most common class, for every row."}
      - {name: predict_proba, kind: method, task: classification, shape: "(n_samples, n_classes)",
         note: "Class frequencies seen in y, same for every row."}
      - {name: classes_, kind: attribute, task: classification, shape: "(n_classes,)",
         note: "Class labels seen in y, in column order."}
      - {name: class_prior_, kind: attribute, task: classification, shape: "(n_classes,)",
         note: "Class frequencies seen in y during fit."}
    next_step: Use its score as the bar every model must beat.
    visual: null
  catch_outs:
    - On skewed data, accuracy is just the majority share.
    - Strategies stratified and uniform need random_state for repeatable output.
    - Pick the strategy first. The default prior predicts the majority class.
