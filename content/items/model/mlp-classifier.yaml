  intuition:
    idea: Layers of weighted sums, each followed by a bend, learn a curved boundary.
    analogy: A stack of simple voters, each passing a summary up the chain.
    animation: none
    good_at:
    - complex patterns
    - plenty of rows
    - scaled numeric inputs
    bad_at:
    - tiny data
    - explaining the answer
    - quick baselines
    vs_siblings:
    - page: mlp-regressor
      note: Same network. Predicts a number, not a class.
    goal: Adjust layered weights to learn class outputs from scaled inputs and return labels or probabilities.
    steps:
    - Scale features using training rows.
    - Initialize weight matrices and biases between input, hidden, and output layers.
    - Pass each row through affine transforms and hidden activations.
    - Measure classification loss and backpropagate gradients to update parameters.
    - Stop when convergence, validation early stopping, or max_iter ends training.
    math:
      notation:
      - symbol: a_0=x
        meaning: Input vector.
      - symbol: W_l,b_l
        meaning: Weights and bias at layer l.
      - symbol: phi
        meaning: Hidden activation.
      - symbol: z_k
        meaning: Output score for class k.
      - symbol: p_k
        meaning: Probability for class k.
      equations:
      - expression: a_l=phi(a_(l-1) W_l+b_l)
        meaning: Each layer transforms activations with learned weights, bias, and nonlinearity.
      - expression: L=-sum_k 1[y=k] log(p_k)+alpha/(2n) sum_l ||W_l||_F^2
        meaning: Training reduces classification log loss plus L2 weight regularization.
      - expression: p_1=sigmoid(z) for binary, or p_k=softmax(z)_k for multiclass; predict(x)=classes_[argmax_k p_k]
        meaning: Binary output uses sigmoid; multiclass uses softmax. predict returns the highest-probability class.
      prediction: predict returns labels; predict_proba gives class probabilities in classes_ order.
    read_more:
    - Multiply inputs by weights and add a bias.
    - Pass the result through an activation.
    - Repeat for each hidden layer, then output class probabilities.
