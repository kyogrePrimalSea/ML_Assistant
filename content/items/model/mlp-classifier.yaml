    snippet: |
      # scikit-learn 1.9.1
      import warnings, numpy as np, pandas as pd
      from sklearn.datasets import make_classification
      from sklearn.exceptions import ConvergenceWarning
      from sklearn.model_selection import train_test_split
      from sklearn.neural_network import MLPClassifier
      from sklearn.preprocessing import StandardScaler
      warnings.filterwarnings('ignore',category=ConvergenceWarning)
      X,y=make_classification(
          n_samples=100, n_features=4, n_informative=3, n_redundant=0,
          weights=[.7,.3], random_state=0,
      )
      Xt,Xv,yt,yv=train_test_split(X,y,test_size=.25,stratify=y,random_state=0)
      s=StandardScaler().fit(Xt)
      columns=['feature_a','feature_b','feature_c','feature_d']
      Xt=pd.DataFrame(s.transform(Xt),columns=columns)
      Xv=pd.DataFrame(s.transform(Xv),columns=columns)
      m=MLPClassifier(
          hidden_layer_sizes=(6,3), max_iter=250, random_state=0
      ).fit(Xt,yt)
      y_pred=m.predict(Xv[:3])
      y_proba=m.predict_proba(Xv[:3])
      y_log_proba=m.predict_log_proba(Xv[:3])
      print('y_pred:',y_pred)
      print('y_proba:')
      print(np.round(y_proba,3))
      print('log proba shape:',y_log_proba.shape)
      print('classes_:',m.classes_)
      print('coefs:',[w.shape for w in m.coefs_])
      print('biases:',[b.shape for b in m.intercepts_])
      print('loss/iterations:',round(m.loss_,3),m.n_iter_)
      print('accuracy:',round(m.score(Xv,yv),3))
      print('features:',m.n_features_in_,m.feature_names_in_)
    output: |
      y_pred: [0 0 0]
      y_proba:
      [[0.678 0.322]
       [0.633 0.367]
       [0.664 0.336]]
      log proba shape: (3, 2)
      classes_: [0 1]
      coefs: [(4, 6), (6, 3), (3, 1)]
      biases: [(6,), (3,), (1,)]
      loss/iterations: 0.563 250
      accuracy: 0.72
      features: 4 ['feature_a' 'feature_b' 'feature_c' 'feature_d']
  what_comes_out:
    items:
    - name: predict
      kind: method
      task: classification
      shape: (n_samples,)
      object_type: numpy.ndarray
      example: '[0, 1, 0]'
      shape_explanation: One label per row; three predictions give shape (3,).
      note: Class labels, not probability scores.
    - name: predict_proba
      kind: method
      task: classification
      shape: (n_samples, n_classes)
      object_type: numpy.ndarray
      example: '[[0.8, 0.2], [0.1, 0.9]]'
      shape_explanation: Rows are cases, columns are classes; this is shape (2, 2).
      note: Columns follow classes_.
    - name: predict_log_proba
      kind: method
      task: classification
      shape: (n_samples, n_classes)
      object_type: numpy.ndarray
      example: '[[-0.223, -1.609], [-2.303, -0.105]]'
      shape_explanation: Same case/class layout as probabilities; this example is (2, 2).
      note: Log probabilities, not probabilities themselves.
    - name: classes_
      kind: attribute
      task: classification
      shape: (n_classes,)
      object_type: numpy.ndarray
      example: '[0, 1]'
      shape_explanation: One label per class; shape (2,) here.
      note: Probability-column order.
    - name: coefs_
      kind: attribute
      task: null
      shape: list of n_layers - 1 matrices
      object_type: list[numpy.ndarray]
      example: '[(4, 6), (6, 3), (3, 1)]'
      shape_explanation: One matrix connects each adjacent pair of layers. Four inputs, hidden widths 6 and 3, and the single binary output unit give these shapes.
      note: Learned weights; not causal effects.
    - name: intercepts_
      kind: attribute
      task: null
      shape: list of n_layers - 1 vectors
      object_type: list[numpy.ndarray]
      example: '[(6,), (3,), (2,)]'
      shape_explanation: One bias vector per non-input layer, with length equal to layer width.
      note: Added to weighted sums.
    - name: n_iter_
      kind: attribute
      task: null
      shape: scalar
      object_type: int
      example: '250'
      shape_explanation: One integer iteration count.
      note: May stop before max_iter.
    - name: score
      kind: method
      task: classification
      shape: scalar
      object_type: float
      example: '0.87'
      shape_explanation: One scalar with no array dimensions.
      note: Classifier score is accuracy.
    next_step: ROC AUC needs predict_proba[:, 1], not the labels.
