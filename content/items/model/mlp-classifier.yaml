  catch_outs:
  - Fit the scaler on training rows only, or test rows leak in.
  - Training stops at max_iter even when it has not converged.
  - Early stopping is off by default; set early_stopping=True to use it.
  key_settings:
    tier1:
    - name: hidden_layer_sizes
      page: null
      controls: Sets number and width of hidden layers.
      effect: More units add capacity and training cost.
    - name: learning_rate_init
      page: learning-rate
      controls: Sets initial step size for sgd/adam.
      effect: Large steps may destabilize training; small steps take longer.
    - name: alpha
      page: null
      controls: Sets L2 weight penalty.
      effect: More regularization may control overfit but reduce fit.
    - name: early_stopping
      page: null
      controls: Uses validation accuracy to stop training.
      effect: Reserves validation rows and can stop before max_iter.
    tier2:
    - name: activation
      page: null
      controls: Chooses hidden-layer nonlinearity.
      effect: Changes the shape of learnable decision boundaries.
    - name: solver
      page: null
      controls: Chooses lbfgs, sgd, or adam.
      effect: Solvers differ in convergence and minibatch behavior.
    - name: max_iter
      page: null
      controls: Caps optimization iterations.
      effect: More iterations permit further fitting but take longer.
    tier3:
    - name: batch_size
      page: null
      controls: Sets stochastic optimizer minibatch size.
      effect: Small batches are noisy; large batches use more memory.
    - name: validation_fraction
      page: null
      controls: Sets held-out share when early_stopping is enabled.
      effect: More validation improves monitoring but leaves fewer fitting rows.
    - name: n_iter_no_change
      page: null
      controls: Sets tolerated iterations without sufficient validation/loss improvement.
      effect: Lower values stop sooner; higher values allow longer plateaus.
