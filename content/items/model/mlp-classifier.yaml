         note: "Columns seen during fit."}
      - {name: feature_names_in_, kind: attribute, task: null, shape: "(n_features,)",
         note: "Column names. Set only when fit on a DataFrame."}
    next_step: "ROC AUC needs predict_proba[:, 1], not the labels."
    snippet: |
      # scikit-learn 1.9.1
      import pandas as pd
      from sklearn.datasets import load_breast_cancer
      from sklearn.neural_network import MLPClassifier
      from sklearn.preprocessing import StandardScaler

      data = load_breast_cancer(as_frame=True)
      X = pd.DataFrame(
          StandardScaler().fit_transform(data.data),
          columns=data.feature_names,
      )
      model = MLPClassifier(hidden_layer_sizes=(32,), max_iter=500, random_state=0)
      model.fit(X, data.target)
      print(model.predict_proba(X[:3]).shape)
      print(model.predict_log_proba(X[:3]).shape)
      print(model.classes_)
      print(model.n_iter_)
    snippet_library: scikit-learn
    visual: null
