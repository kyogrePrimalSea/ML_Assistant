      print("estimator_weights_:", model.estimator_weights_.round(3))
    snippet_library: imbalanced-learn
    visual: proba_table
    guidance:
    - task: classification
      text: Use labels for confusion matrices, probabilities for probabilistic ranking, and balanced metrics when class counts differ.
