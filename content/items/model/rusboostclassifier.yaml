slots:
  header: {}
  solves:
    hero:
      kind: model
      dataset: breast-cancer
      shape: boundary
    line: Boosting, with the common class under-sampled each round.
  quick_facts:
    data_size: Tabular data, one rare class
  use_avoid:
    use_when:
    - one class is rare
    - tabular data
    - want boosting
    avoid_when:
    - classes already balanced
    - images or text
    - missing values present
  prep:
  - step:
      family: transform.scale.rescale
    status: recommended
    why: Needed if the base learner is not a tree.
    condition: null
    unless: null
  - step:
      family: clean.impute
    status: required
    why: Missing values stop fit. Impute them first.
    condition: null
    unless: null
  - step:
      family: transform.encode.features
    status: required
    why: Text categories must become numbers.
    condition:
      has_categoricals: true
    unless: null
  - step:
      family: transform.rebalance.over
    status: not_needed
    why: Nothing is copied. Each round under-samples instead.
    condition: null
    unless: null
  - step:
      family: transform.rebalance.under
    status: not_needed
    why: Each round already under-samples the common class.
    condition: null
    unless: null
  code:
  - library: imbalanced-learn
    target: imblearn.ensemble.RUSBoostClassifier
    why_this_library: Under-samples each boosting round, so no new rows.
    snippet: |
      # imbalanced-learn 0.14.2
      from imblearn.ensemble import RUSBoostClassifier
      from sklearn.datasets import make_classification
      from sklearn.model_selection import train_test_split
      from sklearn.tree import DecisionTreeClassifier

      X, y = make_classification(
          n_samples=160, n_features=5, n_informative=3, n_redundant=0,
          weights=[0.9, 0.1], random_state=42,
      )
      X_train, X_test, y_train, y_test = train_test_split(
          X, y, test_size=0.25, stratify=y, random_state=42
      )
      model = RUSBoostClassifier(
          estimator=DecisionTreeClassifier(max_depth=1, random_state=42),
          n_estimators=8, learning_rate=0.1, random_state=42,
      )
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test[:3])
      y_proba = model.predict_proba(X_test[:3])
      y_score = model.decision_function(X_test[:3])
      print("y_pred:", y_pred)
      print("y_proba:")
      print(y_proba.round(3))
      print("y_score:", y_score.round(3))
      print("classes_:", model.classes_)
      print("boosting rounds fitted:", len(model.estimators_))
      print("round 0 sampled rows:", len(model.samplers_[0].sample_indices_))
      print("estimator_weights_:", model.estimator_weights_.round(3))
    output: |
      y_pred: [0 0 0]
      y_proba:
      [[0.881 0.119]
       [0.881 0.119]
       [0.881 0.119]]
      y_score: [-2. -2. -2.]
      classes_: [0 1]
      boosting rounds fitted: 8
      round 0 sampled rows: 24
      estimator_weights_: [0.337 0.164 0.262 0.141 0.229 0.121 0.109 0.108]
  what_comes_out:
    items:
    - name: predict
      kind: method
      task: classification
      shape: (n_samples,)
      object_type: numpy.ndarray
      example: '[0, 1, 0]'
      shape_explanation: One prediction per input row. n_samples is the number of rows; this example has shape (3,).
      note: Labels chosen from the fitted class scores/probabilities.
    - name: predict_proba
      kind: method
      task: classification
      shape: (n_samples, n_classes)
      object_type: numpy.ndarray
      example: '[[0.80, 0.20], [0.35, 0.65], [0.90, 0.10]]'
      shape_explanation: A table with n_samples rows and n_classes columns. The example has 3 rows and 2 classes, shape (3, 2).
      note: One probability column per class, ordered as classes_.
    - name: decision_function
      kind: method
      task: classification
      shape: (n_samples,) or (n_samples,n_classes)
      object_type: numpy.ndarray
      example: '[-0.6, 0.3, -0.8]'
      shape_explanation: Binary output has one signed score per row, shape (3,). Multiclass output has one score per row and class.
      note: Raw ensemble score, not a probability; positive binary scores favor classes_[1].
    - name: classes_
      kind: attribute
      task: classification
      shape: (n_classes,)
      object_type: numpy.ndarray
      example: '[0, 1]'
      shape_explanation: A one-dimensional array with n_classes labels. This two-class example has shape (2,).
      note: Labels in probability-column order.
    - name: estimators_
      kind: attribute
      task: null
      shape: (n_fitted_estimators,)
      object_type: list[Classifier]
      example: '[DecisionTreeClassifier(...), DecisionTreeClassifier(...)]'
      shape_explanation: One fitted weak classifier per completed round; this concrete example shows 2 classifiers.
      note: Weak learners fitted across boosting rounds; early stopping may make the list shorter than n_estimators.
    - name: samplers_
      kind: attribute
      task: null
      shape: (n_fitted_estimators,)
      object_type: list[RandomUnderSampler]
      example: '[RandomUnderSampler(...), RandomUnderSampler(...)]'
      shape_explanation: One sampler per completed round; this concrete example shows 2 samplers.
      note: Fitted under-sampler for each boosting round.
    - name: estimator_weights_
      kind: attribute
      task: null
      shape: (n_estimators,)
      object_type: numpy.ndarray
      example: '[1.0, 0.6, 0.3]'
      shape_explanation: One weight per boosting round. This example shows 3 weights, so its shape is (3,).
      note: Boosting contribution weight for each fitted weak learner.
    - name: feature_importances_
      kind: attribute
      task: null
      shape: (n_features,)
      object_type: numpy.ndarray
      example: '[0.28, 0.11, 0.24, 0.19, 0.18]'
      shape_explanation: One value per input feature. n_features is the number of columns; this example has shape (5,).
      note: Importance aggregated from the fitted weak learners.
    next_step: null
    snippet: |
      # imbalanced-learn 0.14.2
      from imblearn.ensemble import RUSBoostClassifier
      from sklearn.datasets import make_classification
      from sklearn.model_selection import train_test_split
      from sklearn.tree import DecisionTreeClassifier

      X, y = make_classification(
