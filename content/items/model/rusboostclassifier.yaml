id: rusboostclassifier
plain_name: RUSBoostClassifier
code_name: RUSBoostClassifier
aliases:
- rus boost
stage: model
family: model.trees.balanced
tracks:
- standard
archetype: model
question_tags:
- rare class
- imbalanced classes
- tabular data
targets:
- imblearn.ensemble.RUSBoostClassifier
pairs_with: []
clashes: []
