  catch_outs:
  - Accuracy looks fine on lopsided data. Use balanced accuracy.
  - Missing values stop fit. Impute them first.
  - learning_rate and n_estimators trade off. Tune them together.
  key_settings:
    tier1:
    - name: sampling_strategy
      page: null
      controls: Class counts used by the under-sampler at each boosting round.
      effect: More aggressive balancing removes more majority rows from every round.
    - name: estimator
      page: null
      controls: Weak classifier fitted after each round’s under-sampling.
      effect: More complex learners fit each sample better but can overfit and slow boosting.
    - name: learning_rate
      page: learning-rate
      controls: Scales each boosted learner’s contribution.
      effect: Smaller values are conservative and usually need more rounds.
    tier2:
    - name: n_estimators
      page: n-estimators
      controls: Maximum number of boosting rounds.
      effect: More rounds can improve fit but cost time and can overfit.
    - name: replacement
      page: null
      controls: Whether the per-round under-sampler samples majority rows with replacement.
      effect: Replacement allows repeats; without replacement each selected row is unique.
    tier3: []
  watch_it_work:
    none: true
  intuition:
    idea: Boosting rounds, each under-sampling the common class.
    analogy: Coaches who each study a fair set of the hard cases.
    animation: none
    good_at:
    - rare classes
    - tabular data
    - boosted accuracy
    bad_at:
    - tiny data
    - images or text
    - missing values
    vs_siblings:
    - page: ada-boost
      note: Same boosting. Adds under-sampling each round.
    - page: easyensembleclassifier
      note: Bags boosted models instead of boosting once.
    read_more:
    - Start with equal weight on every row.
    - Under-sample the common class, then fit a learner.
    - Re-weight the mistakes and repeat.
    goal: At every boosting round, under-sample the majority class, fit a weak learner, then update boosting weights.
    steps:
    - Begin with observation weights
    - Under-sample the majority class for the current round
    - Fit a weak classifier to that balanced subset
    - Update boosting weights so later learners focus more on mistakes, then combine learner scores
    - Stop at the maximum rounds or when the boosting fit terminates early.
    math:
      notation:
      - symbol: t
        meaning: Boosting round index.
      - symbol: S_t
        meaning: Balanced sample drawn for boosting round t.
      - symbol: h_t
        meaning: Weak classifier fitted at round t.
      - symbol: α_t
        meaning: Boosting weight determined by round t errors.
      - symbol: η
        meaning: learning_rate scaling each learner contribution.
      - symbol: F_t
        meaning: Combined score after round t.
      equations:
      - expression: F_t(x)=F_(t−1)(x)+ηα_t h_t(x)
        meaning: Each weak learner adds a weighted vote after its round-specific resampling.
      prediction: decision_function returns boosted scores; predict_proba returns class probabilities and predict returns labels.
  next:
  - but-imbalanced-score
  - but-wrong-cutoff
