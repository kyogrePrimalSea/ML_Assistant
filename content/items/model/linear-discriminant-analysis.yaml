    analogy: A single fence across a field that keeps the groups apart.
    animation: none
    good_at: [similar spread, small data, reducing dimensions]
    bad_at: [curved boundaries, different spreads, raw categories]
    vs_siblings:
      - {page: quadratic-discriminant-analysis, note: "Same family. Each class gets its own spread."}
    read_more:
      - Estimate each class mean.
      - Pool the spread shared by all classes.
      - Draw the straight line that separates the class means best.
  next: []
