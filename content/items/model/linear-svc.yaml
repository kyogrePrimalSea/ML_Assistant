id: linear-svc
plain_name: LinearSVC
code_name: LinearSVC
aliases: [linear svm, linear svc, svm with a straight line]
stage: model
family: model.awkward.big
tracks: [standard]
archetype: model
question_tags: [large data, text data, margin-based]
targets: [sklearn.svm.LinearSVC]
pairs_with: [linearexplainer]
clashes: []
source_urls: ['https://scikit-learn.org/stable/modules/generated/sklearn.svm.LinearSVC.html']
library_versions: {scikit-learn: 1.9.1}
reviewed: false
rules:
  task_types: [classification]
  blocked_when: []
  fits_on_data: true
  shape_effect: {rows: same, columns: same}
slots:
  header: {}
  solves:
    hero: {kind: model, dataset: breast-cancer, shape: boundary}
    line: Draws one straight line that separates two classes.
  quick_facts: {data_size: Large or text data}
  use_avoid:
    use_when: [large data, text features, straight boundary]
    avoid_when: [needs probabilities, curved boundary]
  prep:
    - step: {family: transform.scale.rescale}
      status: recommended
      why: Margins depend on feature size.
      condition: null
      unless: null
    - step: {family: clean.impute}
      status: required
      why: Linear models reject missing values.
      condition: {has_missing: true}
      unless: null
    - step: {family: transform.encode.features}
      status: required
      why: Text categories must become numbers.
      condition: {has_categoricals: true}
      unless: null
    - step: {family: transform.rebalance.weight}
      status: recommended
      why: Use class_weight when classes are lopsided.
      condition: {imbalanced: true, task_type: [classification]}
      unless: null
  code:
    - library: scikit-learn
      target: sklearn.svm.LinearSVC
      why_this_library: Same fit and score API as other scikit-learn models.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.model_selection import train_test_split
        from sklearn.pipeline import make_pipeline
        from sklearn.preprocessing import StandardScaler
        from sklearn.svm import LinearSVC

        X, y = load_breast_cancer(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = make_pipeline(StandardScaler(), LinearSVC(C=1.0, random_state=0))
        model.fit(X_train, y_train)
        print(round(model.score(X_test, y_test), 3))
  what_comes_out:
    items:
      - {name: predict, kind: method, task: null, shape: "(n_samples,)",
         note: "Class labels for each row."}
      - {name: decision_function, kind: method, task: classification, shape: "(n_samples,) for two classes",
         note: "Signed score. Above 0 means classes_[1]."}
      - {name: score, kind: method, task: null, shape: "float",
         note: "Accuracy on the rows you pass in."}
      - {name: coef_, kind: attribute, task: null, shape: "(1, n_features) for two classes",
         note: "One weight per input column."}
      - {name: intercept_, kind: attribute, task: null, shape: "(1,) for two classes",
         note: "The offset added to every score."}
      - {name: classes_, kind: attribute, task: classification, shape: "(n_classes,)",
         note: "Labels, in the order decision_function uses them."}
      - {name: n_iter_, kind: attribute, task: null, shape: "int",
         note: "Solver passes used. At max_iter, it may not have converged."}
      - {name: n_features_in_, kind: attribute, task: null, shape: "int",
         note: "Number of input columns seen in fit."}
    next_step: ROC and PR curves take decision scores. There are no probabilities.
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.datasets import load_breast_cancer
      from sklearn.model_selection import train_test_split
      from sklearn.pipeline import make_pipeline
      from sklearn.preprocessing import StandardScaler
      from sklearn.svm import LinearSVC

      X, y = load_breast_cancer(return_X_y=True)
      X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

      model = make_pipeline(StandardScaler(), LinearSVC(random_state=0))
      model.fit(X_train, y_train)
      svc = model[-1]
      print(model.predict(X_test).shape)
      print(model.decision_function(X_test).shape)
      print(svc.coef_.shape)
      print(svc.intercept_.shape)
      print(svc.classes_)
      print(svc.n_iter_)
      print(svc.n_features_in_)
    snippet_library: scikit-learn
    visual: null
  catch_outs:
    - No predict_proba. Use decision_function to rank rows.
    - Scale features first, or the margin is set by the largest column.
    - Text and missing values fail. Encode and impute first.
  key_settings:
    tier1:
      - {name: C, page: null}
      - {name: class_weight, page: null}
      - {name: loss, page: null}
    tier2:
      - {name: penalty, page: null}
      - {name: fit_intercept, page: null}
      - {name: dual, page: null}
    tier3:
      - {name: max_iter, page: null}
      - {name: tol, page: null}
      - {name: intercept_scaling, page: null}
  watch_it_work: {none: true}
  intuition:
    idea: Find one straight line with the widest gap between two classes.
    analogy: A ruler laid between two piles, sitting in the widest clear gap.
    animation: none
    good_at: [large data, text features, linear boundaries]
    bad_at: [probabilities, curved boundaries]
    vs_siblings:
      - {page: sgd-classifier, note: "Same kind of line, trained in small steps. Handles streams."}
      - {page: ridge-classifier, note: "Ridge regression on labels, not a margin."}
    read_more:
      - Start with any line through the data.
      - Score each row by its distance from the line.
      - Move the line to widen the gap, then stop.
  next: [know-feature-importance]
