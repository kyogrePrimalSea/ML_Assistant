  code:
    - library: scikit-learn
      target: sklearn.neighbors.KNeighborsRegressor
      why_this_library: The scikit-learn estimator for this method.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_diabetes
        from sklearn.model_selection import train_test_split
        from sklearn.neighbors import KNeighborsRegressor
        from sklearn.pipeline import make_pipeline
        from sklearn.preprocessing import StandardScaler

        X, y = load_diabetes(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(
            X, y, random_state=0
        )

        model = make_pipeline(
            StandardScaler(),
            KNeighborsRegressor(n_neighbors=5),
        )
        model.fit(X_train, y_train)
        print(round(model.score(X_test, y_test), 3))
  what_comes_out:
    items:
      - {name: predict, kind: method, task: regression, shape: "(n_samples,)",
         note: "Average target of the k nearest training rows."}
      - {name: kneighbors, kind: method, task: null, shape: "2 arrays of (n_samples, k)",
         note: "Distances and row numbers of the k nearest rows."}
      - {name: score, kind: method, task: regression, shape: "float",
         note: "R squared. 1.0 is perfect; 0 matches the mean."}
      - {name: n_samples_fit_, kind: attribute, task: null, shape: "int",
         note: "Training rows kept for lookup."}
      - {name: n_features_in_, kind: attribute, task: null, shape: "int",
         note: "Columns seen during fit."}
      - {name: feature_names_in_, kind: attribute, task: null, shape: "(n_features,)",
         note: "Column names. Set only when fit on a DataFrame."}
    next_step: "Score on held-out rows, not on the rows used to fit."
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.datasets import load_diabetes
      from sklearn.neighbors import KNeighborsRegressor

      data = load_diabetes(as_frame=True)
      model = KNeighborsRegressor(n_neighbors=5)
      model.fit(data.data, data.target)
      print(model.predict(data.data[:3]).shape)
      dist, idx = model.kneighbors(data.data[:3])
      print(dist.shape, idx.shape)
      print(model.n_samples_fit_)
      print(model.feature_names_in_[:3])
    snippet_library: scikit-learn
    visual: null
  catch_outs:
