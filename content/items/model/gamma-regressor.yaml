  code:
    - library: scikit-learn
      target: sklearn.linear_model.GammaRegressor
      why_this_library: Gamma GLM with a log link, in the scikit-learn API.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.datasets import make_regression
        from sklearn.linear_model import GammaRegressor
        from sklearn.model_selection import train_test_split

        X, y = make_regression(n_samples=500, n_features=5, noise=10,
                               random_state=0)
        y = np.exp(y / y.std())  # positive, right-skewed target
        X_train, X_test, y_train, y_test = train_test_split(
            X, y, random_state=0)

        model = GammaRegressor(alpha=0.1, max_iter=300)
        model.fit(X_train, y_train)
        print(round(model.score(X_test, y_test), 3))
  what_comes_out:
    items:
      - {name: predict, kind: method, task: regression, shape: "(n_samples,)",
         note: "Always above zero. The log link keeps them positive."}
      - {name: score, kind: method, task: regression, shape: float,
         note: "Share of deviance explained, the D² score."}
      - {name: coef_, kind: attribute, task: null, shape: "(n_features,)",
         note: "One weight per column, on the log scale."}
      - {name: intercept_, kind: attribute, task: null, shape: float,
         note: "Baseline on the log scale."}
      - {name: n_iter_, kind: attribute, task: null, shape: int,
         note: "Solver steps used. Compare with max_iter."}
      - {name: n_features_in_, kind: attribute, task: null, shape: int,
         note: "Number of columns seen at fit time."}
    next_step: Use exp(coef_) to read each effect as a multiplier.
    snippet: |
      # scikit-learn 1.9.1
      import numpy as np
      from sklearn.datasets import make_regression
      from sklearn.linear_model import GammaRegressor

      X, y = make_regression(n_samples=200, n_features=3, noise=10,
                             random_state=0)
      y = np.exp(y / y.std())
      model = GammaRegressor().fit(X, y)
      pred = model.predict(X)
      print(pred.shape)
      print(bool(pred.min() > 0))
      print(np.exp(model.coef_).round(3))
    snippet_library: scikit-learn
    visual: regression_preds
  catch_outs:
    - Target must be above zero. Zero or negative values raise an error.
    - Missing values raise an error. Impute before fitting.
    - score returns D², not R². Read it as deviance explained.
    - alpha is an L2 penalty on the weights, not a learning rate.
