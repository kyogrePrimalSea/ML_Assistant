  watch_it_work: {none: true}
  intuition:
    idea: Model the mean on a log scale. Spread grows with the square of the mean.
    analogy: Like a bill that varies by a percentage, so bigger bills vary more in dollars.
    animation: none
    good_at: [positive amounts, skewed targets, multiplicative effects]
    bad_at: [zero or negative targets, counts, text or images]
    vs_siblings:
      - {page: poisson-regression, note: "Counts, not amounts. Poisson spread equals the mean."}
      - {page: tweedie-regressor, note: "Allows exact zeros. Gamma needs strictly positive targets."}
      - {page: glm, note: "Statsmodels version, with p-values."}
    read_more:
      - Pick a log link, so the mean is exp of a line.
      - Minimise the deviance, with an L2 penalty on the weights.
      - Read each coefficient as a multiplier on the mean.
  next: [but-fan-errors]
