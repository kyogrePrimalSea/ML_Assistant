id: ridge-classifier
plain_name: RidgeClassifier
code_name: RidgeClassifier
aliases:
- ridge classifier
stage: model
family: model.awkward.big
tracks:
- standard
archetype: model
question_tags:
- many classes
- fast baseline
targets:
- sklearn.linear_model.RidgeClassifier
pairs_with:
- linearexplainer
clashes: []
source_urls:
- https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.RidgeClassifier.html
library_versions:
  scikit-learn: 1.9.1
reviewed: false
rules:
  task_types:
  - classification
  blocked_when: []
  fits_on_data: true
  shape_effect:
    rows: same
    columns: same
slots:
  header: {}
  solves:
    hero:
      kind: model
      dataset: breast-cancer
      shape: boundary
    line: Fits a ridge regression to the labels, then picks the top score.
  quick_facts:
    data_size: Small to large tables
  use_avoid:
    use_when:
    - many classes
    - correlated features
    - fast baseline
    avoid_when:
    - needs probabilities
    - curved boundary
  prep:
  - step:
      family: transform.scale.rescale
    status: recommended
    why: The penalty treats columns of different size unequally.
    condition: null
    unless: null
  - step:
      family: clean.impute
    status: required
    why: Linear models reject missing values.
    condition:
      has_missing: true
    unless: null
  - step:
      family: transform.encode.features
    status: required
    why: Text categories must become numbers.
    condition:
      has_categoricals: true
    unless: null
  - step:
      family: transform.rebalance.weight
    status: recommended
    why: Use class_weight when classes are lopsided.
    condition:
      imbalanced: true
      task_type:
      - classification
    unless: null
  code:
  - library: scikit-learn
    target: sklearn.linear_model.RidgeClassifier
    why_this_library: Same fit and score API as other scikit-learn models.
    snippet: "# scikit-learn 1.9.1\nfrom sklearn.datasets import load_breast_cancer\nfrom sklearn.linear_model\
      \ import RidgeClassifier\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.pipeline\
      \ import make_pipeline\nfrom sklearn.preprocessing import StandardScaler\n\nX, y = load_breast_cancer(return_X_y=True)\n\
      X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)\nmodel = make_pipeline(\n\
      \    StandardScaler(),\n    RidgeClassifier(alpha=1.0, solver=\"lsqr\"),\n)\nmodel.fit(X_train,\
      \ y_train)\nclf = model[-1]\ny_pred = model.predict(X_test[:3])\ny_score = model.decision_function(X_test[:3])\n\
      print(\"class labels:\", y_pred)\nprint(\"decision scores:\", y_score.round(2))\nprint(\"classes_:\"\
      , clf.classes_)\nprint(\"coef_ shape:\", clf.coef_.shape)\nprint(\"n_iter_:\", clf.n_iter_)\n"
    output: 'class labels: [0 1 1]

      decision scores: [-0.63  0.6   0.92]

      classes_: [0 1]

      coef_ shape: (30,)

      n_iter_: [29]

      '
  what_comes_out:
    items:
    - name: predict
      kind: method
      task: classification
      shape: (n_samples,)
      object_type: numpy.ndarray
      example: '[0, 1, 1]'
      shape_explanation: One predicted label per row. n_samples is the number of input rows; these three
        labels have shape (3,).
      note: Predicted labels; labels correspond to classes_.
    - name: decision_function
      kind: method
      task: classification
      shape: (n_samples,) or (n_samples, n_classes)
      object_type: numpy.ndarray
      example: '[0.82, -0.43, 1.18]'
      shape_explanation: For binary classification there is one signed score per row, shape (3,). For
        multiclass there is one score per row and class.
      note: Raw decision scores, not probabilities; binary scores are signed.
    - name: classes_
      kind: attribute
      task: classification
      shape: (n_classes,)
      object_type: numpy.ndarray
      example: '[0, 1]'
      shape_explanation: A one-dimensional array with n_classes labels. This two-class example has shape
        (2,).
      note: Class labels in score/probability column order.
    - name: coef_
      kind: attribute
      task: null
      shape: (n_features,) or (n_classes,n_features)
      object_type: numpy.ndarray
      example: '[0.2, -0.1, 0.4]'
      shape_explanation: For binary labels, RidgeClassifier has one coefficient per feature in a vector.
        Multiclass has one row per class; this binary example shows 3 features, shape (3,).
      note: One row of coefficients per binary boundary or multiclass one-versus-rest class.
    - name: intercept_
      kind: attribute
      task: null
      shape: (1,) binary; (n_classes,) multiclass
      object_type: numpy.ndarray
      example: '[0.3]'
      shape_explanation: One score offset per fitted target. Binary fitting has one encoded target, so
        this example has shape (1,).
      note: One offset per fitted decision boundary.
    - name: n_iter_
      kind: attribute
      task: null
      shape: (n_targets,)
      object_type: numpy.ndarray
      example: '[29]'
      shape_explanation: A one-dimensional array with one iteration count per fitted target. n_targets
        is the number of encoded target columns; this binary example has shape (1,).
      note: Number of iterations; lsqr records one count per fitted target.
    next_step: null
    snippet: "# scikit-learn 1.9.1\nfrom sklearn.datasets import load_breast_cancer\nfrom sklearn.linear_model\
      \ import RidgeClassifier\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.pipeline\
      \ import make_pipeline\nfrom sklearn.preprocessing import StandardScaler\n\nX, y = load_breast_cancer(return_X_y=True)\n\
      X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)\nmodel = make_pipeline(\n\
      \    StandardScaler(),\n    RidgeClassifier(alpha=1.0, solver=\"lsqr\"),\n)\nmodel.fit(X_train,\
      \ y_train)\nclf = model[-1]\ny_pred = model.predict(X_test[:3])\ny_score = model.decision_function(X_test[:3])\n\
      print(\"class labels:\", y_pred)\nprint(\"decision scores:\", y_score.round(2))\nprint(\"classes_:\"\
      , clf.classes_)\nprint(\"coef_ shape:\", clf.coef_.shape)\nprint(\"n_iter_:\", clf.n_iter_)\n"
    snippet_library: scikit-learn
    visual: null
    output: 'class labels: [0 1 1]

      decision scores: [-0.63  0.6   0.92]

      classes_: [0 1]

      coef_ shape: (30,)

      n_iter_: [29]

      '
    guidance:
    - task: classification
      text: Use labels for accuracy and confusion matrices. Use decision scores for ranking; use probabilities
        only when the chosen loss supports them.
  catch_outs:
  - No predict_proba. Use decision_function to rank rows.
  - Scale features first, so alpha treats each column alike.
  - Missing values and text fail. Impute and encode first.
  key_settings:
    tier1:
    - name: alpha
      page: null
      controls: L2 penalty strength in the squared-error fit to encoded class targets.
      effect: Higher alpha shrinks weights more and may simplify but underfit.
    - name: class_weight
      page: null
      controls: Per-class multipliers applied to training examples.
      effect: Higher weight makes errors for that class count more.
    - name: solver
      page: null
      controls: Numerical method for solving the regularised least-squares system.
      effect: Solvers differ in speed, convergence, and whether n_iter_ is available.
    tier2:
    - name: fit_intercept
      page: null
      controls: Whether to estimate a constant class-score offset.
      effect: Turning it off forces score functions through zero.
    - name: positive
      page: null
      controls: Whether fitted coefficients are constrained to be nonnegative.
      effect: The constraint can improve interpretability but may worsen fit; solver support is limited.
    - name: max_iter
      page: null
      controls: Maximum iterations for iterative solvers.
      effect: Higher limits allow convergence but take longer.
    tier3:
    - name: tol
      page: null
      controls: Convergence tolerance for iterative solvers.
      effect: Tighter tolerance can improve the solve at additional cost.
  watch_it_work:
    none: true
  intuition:
    idea: Fit a ridge regression to the labels, then pick the top score.
    analogy: Rating each class on a scale, then taking the highest rating.
    animation: none
    good_at:
    - many classes
    - correlated features
    - fast fitting
    bad_at:
    - probabilities
    - curved boundaries
    vs_siblings:
    - page: linear-svc
      note: Margin-based line. RidgeClassifier fits to the labels.
    - page: logistic-regression
      note: Gives probabilities. Use it when you need them.
    - page: ridge
      note: Same penalty, for number targets.
    read_more:
    - Turn the labels into -1 and 1 targets, one per class.
    - Fit one ridge regression to those targets.
    - Read the scores and pick the highest class.
    goal: Fit regularised least-squares scores against encoded class targets, then choose the largest
      class score.
    steps:
    - Map class labels to target columns
    - Fit a ridge regression to those targets with an L2 penalty
    - Compute one score per class and assign the class with the highest score
    - The scores are margins, not calibrated probabilities.
    math:
      notation:
      - symbol: x_i
        meaning: Feature vector for row i.
      - symbol: t_ic
        meaning: Encoded target value for class c.
      - symbol: W
        meaning: Matrix of class coefficient vectors.
      - symbol: b
        meaning: Class-score offsets.
      - symbol: α
        meaning: L2 penalty strength.
      - symbol: s_c
        meaning: Score for class c.
      - symbol: t_i
        meaning: Encoded target vector for observation i.
      - symbol: W
        meaning: Coefficient vector or matrix for class scores.
      - symbol: α
        meaning: L2 penalty strength.
      equations:
      - expression: min_(W,b) Σ_i||t_i−Wᵀx_i−b||² + α||W||²
        meaning: Ridge fits encoded class targets with squared error and L2 shrinkage.
      prediction: predict picks the class with the highest decision score; scores are margins, not probabilities.
  next:
  - know-feature-importance
