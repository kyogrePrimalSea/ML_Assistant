  prep:
    - step: {family: explore.stationarity}
      status: recommended
      why: Check stability first to choose the differencing order.
      condition: null
      unless: null
    - step: {family: split.time}
      status: recommended
      why: Test on the latest months, never on random rows.
      condition: null
      unless: null
  code:
    - library: statsmodels
      target: statsmodels.tsa.statespace.sarimax.SARIMAX
      why_this_library: Fit, predict and forecast in one object.
      snippet: |
        # statsmodels 0.15.0
        import numpy as np
        from statsmodels.tsa.statespace.sarimax import SARIMAX

        rng = np.random.default_rng(0)
        t = np.arange(144)
        y = 100 + 0.8 * t + 10 * np.sin(2 * np.pi * t / 12)
        y = y + rng.normal(0, 2, 144)

        model = SARIMAX(
            y[:132], order=(1, 0, 0), seasonal_order=(1, 0, 0, 12)
        )
        res = model.fit(disp=False)
        print(np.round(res.predict(132, 143), 1).tolist())
  what_comes_out:
    items:
      - {name: predict, kind: method, task: regression, shape: "(n_obs,) or (n_steps,)",
         note: "Fitted values in sample, forecasts past the end."}
      - {name: score, kind: method, task: null, shape: "(n_params,)",
         note: "Score function evaluated at the given params."}
      - {name: measurement_error, kind: attribute, task: null, shape: "bool",
         note: "False by default. Set True to model noisy observations."}
      - {name: state_error, kind: attribute, task: null, shape: "bool",
         note: "True for this model. Read it, do not set it."}
    next_step: null
    visual: null
  catch_outs:
    - Forecasts need future values of the outside drivers, too.
    - Pass exog to the model and again to predict.
  key_settings:
