slots:
  header: {}
  solves:
    hero: {kind: model, dataset: airline-passengers, shape: fit_line}
    line: Past values and outside drivers, with seasons built in.
  quick_facts:
    data_size: 2+ seasons, e.g. 24 monthly points
  use_avoid:
    use_when: [seasonal series, outside drivers like price]
