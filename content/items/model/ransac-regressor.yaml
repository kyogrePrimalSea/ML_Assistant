  catch_outs:
  - Random draws change the result unless random_state is set.
  - A non-linear estimator needs min_samples set by hand.
  - The default threshold is the MAD of y. Set residual_threshold to tune it.
  key_settings:
    tier1:
    - name: min_samples
      page: null
      controls: Minimum observations used to fit each candidate.
      effect: Larger subsets are more stable but harder to draw free of outliers.
    - name: residual_threshold
      page: null
      controls: Maximum residual loss for an observation to count as an inlier.
      effect: Higher thresholds admit more rows; lower thresholds demand tighter consensus.
    - name: max_trials
      page: null
      controls: Maximum random candidate subsets.
      effect: More trials improve the chance of finding a clean subset but take longer.
    - name: loss
      page: null
      controls: Residual loss used to compare with the threshold.
      effect: Changing loss changes which deviations qualify as inliers.
    tier2:
    - name: estimator
      page: null
      controls: Base estimator fitted to each subset and final consensus.
      effect: A more complex estimator changes the model shape and required subset size.
    - name: stop_probability
      page: null
      controls: Probability target for finding an outlier-free subset.
      effect: Higher confidence may require more trials.
    - name: is_data_valid
      page: null
      controls: Optional check that a sampled subset is usable.
      effect: Rejecting more samples can avoid invalid fits but increase skipped trials.
    tier3:
    - name: stop_score
      page: null
      controls: Score at which the search can stop.
      effect: A higher threshold can terminate earlier if reached.
    - name: stop_n_inliers
      page: null
      controls: Inlier count that ends the search.
      effect: A lower target can stop before a stronger consensus is found.
    - name: max_skips
      page: null
      controls: Maximum invalid or rejected trials.
      effect: A larger limit tolerates more skipped samples but takes longer.
    - name: is_model_valid
      page: null
      controls: Optional check on each fitted candidate.
      effect: Rejecting candidates enforces constraints but can leave fewer trials.
  watch_it_work:
    none: true
  intuition:
    idea: Fit small random samples, then keep the line most points agree with.
    analogy: A judge who hears many small groups and trusts the group that agrees most.
    animation: none
    good_at:
    - many outliers
    - a clean subset
    - gross errors
    bad_at:
    - tiny data
    - results that change without random_state
    vs_siblings:
    - page: huber-regressor
      note: Down-weights outliers. No random draws. Few outliers.
    - page: theil-sen-regression
      note: Median of slopes. Suited to small data.
    read_more:
    - Draw a small random sample of rows.
    - Fit a line to just that sample.
    - Count the rows close to that line as inliers.
    - Keep the best line, then refit it on its inliers.
    goal: Random subset consensus isolates a majority pattern; results depend on sampling, threshold and
      subset size.
    steps:
    - Draw a minimally sized subset and fit the base estimator
    - Classify rows as inliers when their residual is within the threshold
    - Score candidate models by consensus, retain the best, and refit the estimator on its inliers
    - Stop at a trial, probability, score, or inlier-count condition.
    math:
      notation:
      - symbol: h
        meaning: Candidate estimator fitted on a random subset.
      - symbol: ℓ
        meaning: Residual loss used by the estimator.
      - symbol: τ
        meaning: Residual threshold for inlier membership.
      equations:
      - expression: inlier_i = 1 when ℓ(y_i,h(x_i)) ≤ τ
        meaning: Candidates are ranked by the rows whose residuals fall within threshold τ.
      prediction: predict delegates to estimator_ refit on inliers and returns one target value per input
        row.
  next: []
