  code:
  - library: scikit-learn
    target: sklearn.linear_model.RANSACRegressor
    why_this_library: The scikit-learn estimator with this name.
    snippet: '# scikit-learn 1.9.1

      from sklearn.datasets import make_regression

      from sklearn.linear_model import RANSACRegressor


      X, y = make_regression(n_samples=200, n_features=2, noise=4.0, random_state=0)

      y[:40] += 200

      model = RANSACRegressor(random_state=0).fit(X, y)

      y_pred = model.predict(X[:3])

      print("y_pred:", y_pred.round(1))

      print("inlier_mask_ shape:", model.inlier_mask_.shape)

      print("inliers:", int(model.inlier_mask_.sum()))

      print("n_trials_:", model.n_trials_, type(model.n_trials_).__name__)

      '
    output: 'y_pred: [-31.8   2.9  37.5]

      inlier_mask_ shape: (200,)

      inliers: 160

      n_trials_: 7 int

      '
