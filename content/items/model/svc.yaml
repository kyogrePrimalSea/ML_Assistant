slots:
  header: {}
  solves:
    hero: {kind: model, dataset: breast-cancer, shape: boundary}
    line: "Draws the widest gap between classes, with a kernel."
  quick_facts:
    data_size: "Up to about 10,000 rows"
  use_avoid:
    use_when: ["clean scaled data", "curved boundary", "up to 10,000 rows"]
    avoid_when: ["large data", "probabilities by default", "images or text"]
  prep:
    - step: {family: transform.scale.rescale}
      status: required
      why: "Margins need comparable scales; strong on scaled data."
      condition: null
      unless: null
  code:
    - library: scikit-learn
      target: sklearn.svm.SVC
      why_this_library: "Built into scikit-learn; no extra install."
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.model_selection import train_test_split
        from sklearn.pipeline import make_pipeline
        from sklearn.preprocessing import StandardScaler
        from sklearn.svm import SVC

        X, y = load_breast_cancer(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = make_pipeline(
            StandardScaler(),
            SVC(kernel="rbf", C=1.0),
        )
        model.fit(X_train, y_train)
        print(round(model.score(X_test, y_test), 3))
  what_comes_out:
    items:
      - {name: predict, kind: method, task: classification, shape: "(n_samples,)",
         note: "Class labels."}
      - {name: decision_function, kind: method, task: classification, shape: "(n_samples,) for two classes",
         note: "Signed score per row. Above 0 means classes_[1]."}
      - {name: score, kind: method, task: classification, shape: "float",
         note: "Accuracy on the data you pass in."}
      - {name: support_vectors_, kind: attribute, task: null, shape: "(n_SV, n_features)",
         note: "The rows the model kept as support vectors."}
      - {name: classes_, kind: attribute, task: classification, shape: "(n_classes,)",
         note: "Class labels, in the order decision_function uses."}
    next_step: "Set probability=True before fit to get predict_proba."
    visual: null
  catch_outs:
    - "predict_proba is missing unless probability=True is set before fit."
    - "Unscaled features scored 0.94 here; scaled features scored 0.97."
    - "Up to about 10,000 rows; training slows past that."
  key_settings:
