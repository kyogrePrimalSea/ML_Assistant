  code:
  - library: imbalanced-learn
    target: imblearn.ensemble.EasyEnsembleClassifier
    why_this_library: Bag of balanced AdaBoost learners in one call.
    snippet: |
      # imbalanced-learn 0.14.2
      from imblearn.ensemble import EasyEnsembleClassifier
      from sklearn.datasets import make_classification
      from sklearn.model_selection import train_test_split

      X, y = make_classification(
          n_samples=160, n_features=5, n_informative=3, n_redundant=0,
          weights=[0.9, 0.1], random_state=42,
      )
      X_train, X_test, y_train, y_test = train_test_split(
          X, y, test_size=0.25, stratify=y, random_state=42
      )
      model = EasyEnsembleClassifier(n_estimators=5, random_state=42, n_jobs=1)
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test[:3])
      y_proba = model.predict_proba(X_test[:3])
      y_score = model.decision_function(X_test[:3])
      print("y_pred:", y_pred)
      print("y_proba:")
      print(y_proba.round(3))
      print("y_score:", y_score.round(3))
      print("classes_:", model.classes_)
      print("balanced ensembles:", len(model.estimators_))
      print("outer draw size:", len(model.estimators_samples_[0]))
      first_pipe = model.estimators_[0]
      sampled = first_pipe.named_steps["sampler"].sample_indices_
      print("first balanced subset rows:", len(sampled))
    output: |
      y_pred: [0 0 0]
      y_proba:
      [[0.619 0.381]
       [0.583 0.417]
       [0.575 0.425]]
      y_score: [-0.487 -0.339 -0.309]
      classes_: [0 1]
      balanced ensembles: 5
      outer draw size: 120
      first balanced subset rows: 24
  what_comes_out:
    items:
    - name: predict
      kind: method
      task: classification
      shape: (n_samples,)
      object_type: numpy.ndarray
      example: '[0, 1, 0]'
      shape_explanation: One prediction per input row. n_samples is the number of rows; this example has shape (3,).
      note: Labels chosen from the fitted class scores/probabilities.
    - name: predict_proba
      kind: method
      task: classification
      shape: (n_samples, n_classes)
      object_type: numpy.ndarray
      example: '[[0.80, 0.20], [0.35, 0.65], [0.90, 0.10]]'
      shape_explanation: A table with n_samples rows and n_classes columns. The example has 3 rows and 2 classes, shape (3, 2).
      note: One probability column per class, ordered as classes_.
    - name: decision_function
      kind: method
      task: classification
      shape: (n_samples,) or (n_samples,n_classes)
      object_type: numpy.ndarray
      example: '[-0.6, 0.3, -0.8]'
      shape_explanation: Binary output has one signed score per row, shape (3,). Multiclass output has one score per row and class.
      note: Raw ensemble score, not a probability; positive binary scores favor classes_[1].
    - name: classes_
      kind: attribute
      task: classification
      shape: (n_classes,)
      object_type: numpy.ndarray
      example: '[0, 1]'
      shape_explanation: A one-dimensional array with n_classes labels. This two-class example has shape (2,).
      note: Labels in probability-column order.
    - name: estimators_
      kind: attribute
      task: null
      shape: (n_estimators,)
      object_type: list[Pipeline]
      example: '[Pipeline(steps=[(''sampler'', RandomUnderSampler(...)), (''classifier'', AdaBoostClassifier(...))]), Pipeline(steps=[(''sampler'', RandomUnderSampler(...)), (''classifier'', AdaBoostClassifier(...))])]'
      shape_explanation: A fitted list contains n_estimators pipelines; this concrete fictional example shows 2. Each pipeline has sampler and classifier steps.
      note: Each fitted pipeline contains a sampler followed by an AdaBoost classifier.
    - name: estimators_samples_
      kind: attribute
      task: null
      shape: (n_estimators,) of index arrays
      object_type: list[numpy.ndarray]
      example: '[[0, 2, 5, 9], [1, 3, 6, 8]]'
      shape_explanation: This concrete list shows 2 estimators, each with 4 outer training-row indices. The full fitted list has n_estimators arrays.
      note: Outer bag row indices before each pipeline sampler; these are training metadata.
    - name: n_features_in_
      kind: attribute
      task: null
      shape: scalar
      object_type: int
      example: '5'
      shape_explanation: A scalar integer count of original input columns.
      note: Number of columns presented to fit.
    next_step: null
