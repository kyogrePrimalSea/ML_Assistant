  catch_outs:
  - Missing values stop fit. Impute them first.
  - Accuracy looks fine on lopsided data. Use balanced accuracy.
  - Text columns fail. Encode them first.
  key_settings:
    tier1:
    - name: sampling_strategy
      page: null
      controls: Class counts targeted by each independent random under-sample.
      effect: More balancing discards more majority examples; too few can lose useful information.
    - name: estimator
      page: null
      controls: AdaBoost classifier trained on each balanced subset.
      effect: A stronger inner learner can fit more structure but raises cost and overfit risk.
    - name: replacement
      page: null
      controls: Whether majority rows can be drawn more than once in each subset.
      effect: Replacement may repeat rows; without it the subset contains distinct selected rows.
    - name: n_estimators
      page: n-estimators
      controls: Number of independent balanced AdaBoost ensembles to bag.
      effect: More learners can stabilise averaged predictions but cost more to fit and predict.
    tier2: []
    tier3: []
  watch_it_work:
    none: true
  intuition:
    idea: Many AdaBoost models, each trained on a balanced sample of the rows.
    analogy: Several tutors, each coaching a fair mix of students.
    animation: none
    good_at:
    - rare classes
    - tabular data
    - boosted learners
    bad_at:
    - tiny data
    - images or text
    - need a simple formula
    vs_siblings:
    - page: balancedbaggingclassifier
      note: Same bagging idea. Works with any base model.
    - page: ada-boost
      note: One boosted model. This bags many on balanced samples.
    - page: rusboostclassifier
      note: Boosting that under-samples each round.
    read_more:
    - Draw a balanced sample of the rows.
    - Fit a small AdaBoost model on it.
    - Repeat, then combine the models.
    goal: Bag several AdaBoost classifiers, each trained on its own balanced random under-sample.
    steps:
    - Draw an independent balanced subset of training rows for each outer learner
    - Fit an AdaBoost classifier on that subset
    - Average the outer learners’ probabilities and combine their margins for scores
    - Unlike RUSBoost, each learner sees a separate balanced subset rather than resampling every boosting round.
    math:
      notation:
      - symbol: j
        meaning: Outer balanced-subset learner index.
      - symbol: S_j
        meaning: Balanced training subset for outer learner j.
      - symbol: A_j
        meaning: AdaBoost model fitted on subset S_j.
      - symbol: p_j(c|x)
        meaning: Outer learner j probability for class c.
      - symbol: J
        meaning: Number of fitted outer learners.
      equations:
      - expression: p(c|x)=J⁻¹Σ_j p_j(c|x)
        meaning: The ensemble averages probabilities from AdaBoost pipelines trained on separate balanced subsets.
      prediction: predict_proba averages balanced-learner probabilities; decision_function returns scores, not labels or sampled rows.
