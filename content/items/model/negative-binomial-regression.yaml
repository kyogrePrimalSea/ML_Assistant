  watch_it_work: {none: true}
  intuition:
    idea: Counts whose spread can grow faster than the mean, using one extra number.
    analogy: Like daily sales that swing more than a steady count would.
    animation: none
    good_at: [overdispersed counts, count targets, p-values]
    bad_at: [continuous targets, text or images, only predictions needed]
    vs_siblings:
      - {page: poisson-regression, note: "Same counts. Poisson spread equals the mean."}
      - {page: glm, note: "GLM uses alpha 1 unless you set it. This page estimates it."}
    read_more:
      - Start with a Poisson fit as a baseline.
      - Estimate the extra spread, alpha, from the data.
      - If alpha is near zero, Poisson was enough.
