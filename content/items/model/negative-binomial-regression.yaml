slots:
  header: {}
  solves:
    hero: {kind: model, dataset: airline-passengers, shape: fit_line}
    line: A line for counts that spread wider than Poisson allows.
  quick_facts:
    data_size: Fits in memory
  use_avoid:
    use_when: [count target, counts spread wide, need p-values]
    avoid_when: [continuous target, text or images, only predictions needed]
  prep:
    - step: {family: transform.scale.rescale}
      status: not_needed
      why: "Unpenalised fit: scaling changes units, not the results."
      condition: null
      unless: null
    - step: {family: clean.impute}
      status: required
      why: NaN raises an error. Drop or impute first.
      condition: {has_missing: true}
      unless: null
    - step: {family: transform.encode.features}
      status: required
      why: Text categories must become numbers.
      condition: {has_categoricals: true}
      unless: null
  code:
    - library: statsmodels
      target: statsmodels.discrete.discrete_model.NegativeBinomial
      why_this_library: Estimates the extra spread, alpha, from the data.
      snippet: |
        # statsmodels 0.15.0
        import numpy as np
        import statsmodels.api as sm
        from sklearn.datasets import make_regression

        X, _ = make_regression(n_samples=500, n_features=3, random_state=0)
        rate = np.exp(0.5 * X[:, 0] - 0.3 * X[:, 1])
        rng = np.random.default_rng(0)
        counts = rng.negative_binomial(n=2, p=2 / (2 + rate))
        model = sm.NegativeBinomial(counts, sm.add_constant(X))
        result = model.fit(disp=False)
        print(result.params.round(3))  # last value is alpha
  what_comes_out:
    items:
      - {name: fit, kind: method, task: regression, shape: results object,
         note: "Holds params, with alpha as the last one."}
      - {name: predict, kind: method, task: regression, shape: "(n_samples,)",
         note: "Predicted mean count per row."}
      - {name: endog, kind: attribute, task: null, shape: "(n_samples,)",
         note: "The counts the model was fit on."}
      - {name: exog, kind: attribute, task: null, shape: "(n_samples, n_features)",
         note: "The design matrix, with the constant if added."}
    next_step: A dispersion near zero means Poisson would fit as well.
    snippet: |
      # statsmodels 0.15.0
      import numpy as np
      import statsmodels.api as sm
      from sklearn.datasets import make_regression

      X, _ = make_regression(n_samples=500, n_features=3, random_state=0)
      rate = np.exp(0.5 * X[:, 0] - 0.3 * X[:, 1])
      rng = np.random.default_rng(0)
      counts = rng.negative_binomial(n=2, p=2 / (2 + rate))
      Xc = sm.add_constant(X)
      result = sm.NegativeBinomial(counts, Xc).fit(disp=False)
      print(result.params.round(3))
      print(result.predict(Xc).shape)
    snippet_library: statsmodels
    visual: regression_preds
  catch_outs:
    - The last parameter is alpha, the extra spread. It is not a coefficient.
    - Add a constant with sm.add_constant, or there is no intercept.
    - NaN raises an error. Drop or impute before fitting.
