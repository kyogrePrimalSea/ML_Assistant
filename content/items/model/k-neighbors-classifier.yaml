  code:
    - library: scikit-learn
      target: sklearn.neighbors.KNeighborsClassifier
      why_this_library: "Built into scikit-learn; no extra install."
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.model_selection import train_test_split
        from sklearn.neighbors import KNeighborsClassifier
        from sklearn.pipeline import make_pipeline
        from sklearn.preprocessing import StandardScaler

        X, y = load_breast_cancer(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = make_pipeline(
            StandardScaler(),
            KNeighborsClassifier(n_neighbors=5),
        )
        model.fit(X_train, y_train)
        print(round(model.score(X_test, y_test), 3))
  what_comes_out:
    items:
      - {name: predict, kind: method, task: null, shape: "(n_samples,)",
         note: "Class labels from the nearest rows."}
      - {name: predict_proba, kind: method, task: classification, shape: "(n_samples, n_classes)",
         note: "Share of the nearest rows in each class."}
      - {name: kneighbors, kind: method, task: null, shape: "(distances, indices)",
         note: "Distances and row numbers of the nearest rows."}
      - {name: score, kind: method, task: null, shape: "float",
         note: "Accuracy on the data you pass in."}
      - {name: classes_, kind: attribute, task: classification, shape: "(n_classes,)",
         note: "Class labels, in predict_proba column order."}
    next_step: "Try a few n_neighbors values and compare the scores."
    visual: proba_table
  catch_outs:
