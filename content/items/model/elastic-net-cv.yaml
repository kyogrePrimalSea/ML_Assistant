  shape_effect: {rows: same, columns: same}
slots:
  header: {}
  solves:
    hero: {kind: model, dataset: ames, shape: fit_line}
    line: A line that drops weak features and picks its own strength.
  quick_facts: {none: true}
  use_avoid:
    use_when: [drop features, keep correlated ones, settings picked for you]
    avoid_when: [classification targets, curved patterns]
  prep:
    - step: {family: clean.impute}
      status: required
      why: Scikit-learn rejects NaN in X.
      condition: {has_missing: true}
      unless: null
    - step: {family: transform.encode.features}
      status: required
      why: Text categories must become numbers.
      condition: {has_categoricals: true}
      unless: null
    - step: {family: transform.scale.rescale}
      status: required
      why: The penalty depends on units. Scale first.
      condition: null
      unless: null
    - step: {page: train-test-split}
      status: recommended
      why: Keep a test set the penalty search never saw.
      condition: null
      unless: null
  code:
    - library: scikit-learn
      target: sklearn.linear_model.ElasticNetCV
      why_this_library: Built into scikit-learn, with cross-validation inside.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_diabetes
        from sklearn.linear_model import ElasticNetCV
        from sklearn.model_selection import train_test_split
        from sklearn.pipeline import make_pipeline
        from sklearn.preprocessing import StandardScaler

        X, y = load_diabetes(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(
            X, y, random_state=0
        )

        model = make_pipeline(
            StandardScaler(), ElasticNetCV(cv=5, random_state=0)
        )
        model.fit(X_train, y_train)
        print(int((model[-1].coef_ != 0).sum()))
  what_comes_out:
    items:
      - {name: predict, kind: method, task: null, shape: "(n_samples,)", note: "One predicted value per row."}
      - {name: score, kind: method, task: null, shape: float, note: "R squared on the data you pass in."}
      - {name: coef_, kind: attribute, task: null, shape: "(n_features,)", note: "One weight per input column. Zero means dropped."}
      - {name: intercept_, kind: attribute, task: null, shape: float, note: "Intercept of the fitted line."}
      - {name: alpha_, kind: attribute, task: null, shape: float, note: "Overall penalty strength that cross-validation picked."}
      - {name: l1_ratio_, kind: attribute, task: null, shape: float, note: "L1 share of the penalty that was picked."}
    next_step: Pass alpha_ and l1_ratio_ to ElasticNet to refit with fixed settings.
    visual: null
  catch_outs:
    - Only the alphas on the path are tried.
    - Scale the columns first, or the penalty is unfair.
    - Missing values stop the fit. Impute them first.
  key_settings:
    tier1:
      - {name: l1_ratio, page: null}
      - {name: cv, page: null}
      - {name: alphas, page: null}
    tier2:
      - {name: fit_intercept, page: null}
      - {name: tol, page: null}
      - {name: selection, page: null}
      - {name: eps, page: null}
    tier3:
      - {name: positive, page: null}
      - {name: precompute, page: null}
      - {name: copy_X, page: null}
      - {name: max_iter, page: null}
  watch_it_work: {none: true}
  intuition:
    idea: Try many penalty strengths with cross-validation, then keep the best.
    analogy: A test kitchen that tries several recipes and keeps the one that tastes best.
    animation: none
    good_at: [drop features, correlated features, no hand-tuned settings]
    bad_at: [classification, curved patterns]
    vs_siblings:
      - {page: elastic-net, note: "Same penalty, but you set alpha and l1_ratio yourself."}
      - {page: lasso-cv, note: "Lasso penalty only. No l1_ratio to pick."}
    read_more:
      - Each alpha on the path gets a cross-validated score.
      - The best settings are kept as alpha_ and l1_ratio_.
      - The final weights are fitted at those settings.
  next: [model-overfitting, know-feature-importance]
