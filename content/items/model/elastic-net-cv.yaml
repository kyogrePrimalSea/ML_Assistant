    unless: null
  - step:
      family: transform.encode.features
    status: required
    why: Text categories must become numbers.
    condition:
      has_categoricals: true
    unless: null
  - step:
      family: transform.scale.rescale
    status: required
    why: The penalty depends on units. Scale first.
    condition: null
    unless: null
  - step:
      page: train-test-split
    status: recommended
    why: Keep a test set the penalty search never saw.
    condition: null
    unless: null
  code:
  - library: scikit-learn
    target: sklearn.linear_model.ElasticNetCV
    why_this_library: Built into scikit-learn, with cross-validation inside.
    snippet: "# scikit-learn 1.9.1\nfrom sklearn.datasets import load_diabetes\nfrom sklearn.linear_model import\
      \ ElasticNetCV\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.pipeline import make_pipeline\n\
      from sklearn.preprocessing import StandardScaler\n\nX, y = load_diabetes(return_X_y=True)\nX_train, X_test,\
      \ y_train, y_test = train_test_split(\n    X, y, random_state=0\n)\n\nmodel = make_pipeline(\n    StandardScaler(),\
      \ ElasticNetCV(cv=5, random_state=0)\n)\nmodel.fit(X_train, y_train)\nprint(int((model[-1].coef_ != 0).sum()))\n\
      y_pred = model.predict(X_test[:5])\nprint('y_pred:', ', '.join(f'{v:.1f}' for v in y_pred))\n"
    output: '10

      y_pred: 234.6, 243.0, 164.7, 121.2, 182.0

      '
  what_comes_out:
    items:
    - name: predict
      kind: method
      task: regression
      shape: (n_samples,)
      note: One predicted value per row.
      object_type: numpy.ndarray
      example: '[146.2, 92.1, 155.8]'
      shape_explanation: One value is returned for each input row. n_samples is the number of rows; this example
        has 3 values, so its shape is (3,).
    - name: score
      kind: method
      task: regression
      shape: scalar
      note: R squared on the data you pass in.
      object_type: float
      example: '0.72'
      shape_explanation: A scalar is one value with no array dimensions. The example is one R-squared score.
    - name: coef_
      kind: attribute
      task: null
      shape: (n_features,)
      note: One weight per input column. Zero means dropped.
      object_type: numpy.ndarray
      example: '[0.0, 12.4, -3.1]'
      shape_explanation: A one-dimensional array with one coefficient per feature. n_features is the number of input
        columns; this example has 3 values, shape (3,).
    - name: intercept_
      kind: attribute
      task: null
      shape: scalar
      note: Intercept of the fitted line.
      object_type: float
      example: '152.0'
      shape_explanation: A scalar is one fitted intercept value, with no array dimensions.
    - name: alpha_
      kind: attribute
      task: null
      shape: scalar
      note: Overall penalty strength that cross-validation picked.
      object_type: float
      example: '0.05'
      shape_explanation: A scalar is the one penalty strength selected by cross-validation.
    - name: l1_ratio_
      kind: attribute
      task: null
      shape: scalar
      note: L1 share of the penalty that was picked.
      object_type: float
      example: '0.5'
      shape_explanation: A scalar is the selected L1 share of the ElasticNet penalty.
    - name: mse_path_
      kind: attribute
      task: null
      shape: (n_l1_ratio, n_alphas, n_folds)
      note: Fold mean squared errors for each alpha and l1_ratio candidate.
      object_type: numpy.ndarray
      example: '[[[3200.0, 3400.0], [2800.0, 2900.0]], [[3100.0, 3300.0], [2700.0, 2850.0]]]'
      shape_explanation: For several l1_ratio values, axes are ratios, alpha candidates, then CV folds. This example
        has shape (2, 2, 2). With one l1_ratio, the leading ratio axis is omitted, giving (n_alphas, n_folds), such
        as a 2 by 2 table.
    - name: alphas_
      kind: attribute
      task: null
      shape: (n_l1_ratio, n_alphas)
      note: Alpha candidates evaluated for each l1_ratio.
      object_type: numpy.ndarray
      example: '[[10.0, 1.0], [8.0, 0.8]]'
      shape_explanation: For several l1_ratio values, rows are ratios and columns are alpha candidates. This example
        has shape (2, 2). With one ratio, the ratio axis is omitted and alphas_ has shape (n_alphas,).
    visual: null
    snippet: "# scikit-learn 1.9.1\nfrom sklearn.datasets import load_diabetes\nfrom sklearn.linear_model import\
      \ ElasticNetCV\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.pipeline import make_pipeline\n\
      from sklearn.preprocessing import StandardScaler\nimport numpy as np\n\nX, y = load_diabetes(return_X_y=True)\n\
      X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)\nmodel = make_pipeline(\n    StandardScaler(),\n\
      \    ElasticNetCV(cv=5, l1_ratio=[0.3, 0.5, 0.7], random_state=0),\n)\nmodel.fit(X_train, y_train)\ny_pred\
      \ = model.predict(X_test[:3])\nprint('y_pred:', np.round(y_pred, 1))\nprint('coef_:', np.round(model[-1].coef_,\
      \ 3))\nprint('alpha_:', round(model[-1].alpha_, 4))\nprint('l1_ratio_:', round(model[-1].l1_ratio_, 2))\n\
      print('mse_path_ shape:', model[-1].mse_path_.shape)\nprint('alphas_ shape:', model[-1].alphas_.shape)\n"
    snippet_library: scikit-learn
    guidance:
    - task: regression
      text: Use y_pred for regression metrics on held-out rows. Compare the selected features and residuals before
        interpreting the fit.
    output: "y_pred: [235.1 243.6 164.8]\ncoef_: [ -1.094  -8.51   27.032  13.286  -3.131  -4.79  -10.062   4.182\
      \  23.048\n   2.363]\nalpha_: 0.3058\nl1_ratio_: 0.7\nmse_path_ shape: (3, 100, 5)\nalphas_ shape: (3, 100)\n"
    next_step: null
  catch_outs:
  - Only the alphas on the path are tried.
  - Scale the columns first, or the penalty is unfair.
  - Missing values stop the fit. Impute them first.
  key_settings:
    tier1:
    - name: l1_ratio
      page: null
      controls: Share of the ElasticNet penalty assigned to L1; the remainder is L2.
      effect: Near 1 can zero more coefficients; near 0 shrinks without sparse selection.
    - name: cv
      page: null
      controls: Cross-validation splitting strategy or number of folds used to score candidates.
      effect: More or structured folds can give a more relevant estimate, but increase computation.
    - name: alphas
      page: null
      controls: Penalty values tested along the regularization path; an integer requests an automatically generated
        path.
      effect: A broader or denser candidate set searches more choices but takes longer; the best value is limited
        to the path.
    tier2:
    - name: fit_intercept
      page: null
      controls: Whether to estimate an intercept; False assumes the data are already centered.
      effect: Turning it off avoids estimating a baseline, but biases predictions if the data are not centered.
    - name: tol
      page: null
      controls: Optimization stopping tolerance, checked against coefficient updates and the dual gap.
      effect: A larger tolerance can stop sooner with a less precise solution; a smaller one takes more work.
    - name: selection
      page: null
      controls: Whether coordinate descent visits features cyclically or chooses one randomly at each update.
      effect: Random updates can converge faster in some cases; use random_state for reproducible random selection.
    - name: eps
      page: null
      controls: Ratio of the smallest to largest alpha on the automatically generated path.
      effect: A smaller ratio extends the search to weaker regularization; it may add candidates and computation.
    tier3:
    - name: positive
      page: null
      controls: Whether fitted coefficients are constrained to be non-negative.
      effect: The constraint can encode a known direction, but rules out useful negative effects.
    - name: precompute
      page: null
      controls: Whether to use a Gram matrix (and for OMP, Xy) to speed fitting.
      effect: Precomputation can speed suitable dense or large-target problems, but uses extra memory.
    - name: copy_X
      page: null
      controls: Whether to copy X before fitting; False may allow X to be overwritten.
      effect: Copying protects the input at a memory cost; disabling the copy can save memory.
    - name: max_iter
      page: null
      controls: Maximum coordinate descent iterations.
      effect: A larger limit can allow convergence but takes longer; reaching the limit can leave an unfinished
        fit.
  watch_it_work:
    none: true
  intuition:
    idea: Try many penalty strengths with cross-validation, then keep the best.
    analogy: A test kitchen that tries several recipes and keeps the one that tastes best.
    animation: none
    good_at:
    - drop features
    - correlated features
    - no hand-tuned settings
    bad_at:
    - classification
    - curved patterns
    vs_siblings:
    - page: elastic-net
      note: Same penalty, but you set alpha and l1_ratio yourself.
    - page: lasso-cv
      note: Lasso penalty only. No l1_ratio to pick.
    read_more:
    - Each alpha on the path gets a cross-validated score.
    - The best settings are kept as alpha_ and l1_ratio_.
    - The final weights are fitted at those settings.
    goal: Choose alpha and l1_ratio from candidate values by cross-validated mean squared error, then refit the
      best ElasticNet.
    steps:
    - Build candidate alpha paths for each supplied l1_ratio.
    - Fit ElasticNet at each alpha/mix pair across the CV folds and measure held-out mean squared error.
    - Average fold errors for each pair and choose the lowest-error pair.
    - Refit on all supplied training rows at alpha_ and l1_ratio_.
    math:
      notation:
      - symbol: n, p
        meaning: Number of training rows and input features.
      - symbol: x_ij, y_i
        meaning: Feature j and observed target for training row i.
      - symbol: w_j, b
        meaning: Coefficient for feature j and fitted intercept.
      - symbol: alpha
        meaning: Overall regularization strength.
      - symbol: r
        meaning: l1_ratio, the fraction assigned to the L1 penalty.
      equations:
      - expression: minimise (1/(2n)) sum_i (y_i - b - sum_j x_ij w_j)^2 + alpha*r*sum_j|w_j| + alpha*(1-r)/2*sum_j
          w_j^2
        meaning: L1 can zero coefficients; L2 shrinks them and tends to retain groups of correlated features.
      - expression: (alpha_, r_) = argmin_{alpha,r} (1/K) sum_{k=1}^K MSE_k(alpha,r)
        meaning: ElasticNetCV picks the tested alpha and L1 share with lowest mean fold error, then refits on all
          rows.
      prediction: For a new feature row x, return b + sum_j x_j w_j.
  next:
  - model-overfitting
  - know-feature-importance
