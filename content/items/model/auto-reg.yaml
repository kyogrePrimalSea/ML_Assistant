  code:
    - library: statsmodels
      target: statsmodels.tsa.ar_model.AutoReg
      why_this_library: The statsmodels class for this model.
      snippet: |
        # statsmodels 0.15.0
        import numpy as np
        from sklearn.datasets import make_regression
        from statsmodels.tsa.ar_model import AutoReg

        _, shocks = make_regression(
            n_samples=200, n_features=3, noise=1.0, random_state=0
        )
        shocks = shocks / shocks.std()
        y = np.zeros(200)
        for t in range(1, 200):
            y[t] = 0.7 * y[t - 1] + shocks[t]

        res = AutoReg(y, lags=2).fit()
        print(res.params.round(2))
  what_comes_out:
    items:
      - {name: fit, kind: method, task: null, shape: "results object", note: "Returns the fitted results. Use them to forecast."}
