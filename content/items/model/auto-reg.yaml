      - {name: ar_lags, kind: attribute, task: null, shape: "list of int", note: "The lags kept in the model."}
      - {name: deterministic, kind: attribute, task: null, shape: "object", note: "Trend and seasonal terms added to the model."}
    next_step: Plot the forecast against the real series before trusting it.
    visual: null
  catch_outs:
    - Estimation drops the first lags of the series, so fewer rows are fitted.
    - hold_back removes early observations from the estimation sample.
    - If deterministic is given, it replaces trend and seasonal.
