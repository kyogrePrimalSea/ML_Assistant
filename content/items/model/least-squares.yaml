  code:
  - library: scipy
    target: scipy.optimize.least_squares
    why_this_library: The scipy solver, with bounds and robust losses.
    snippet: |
      # scipy 1.18.1
      import numpy as np
      from scipy.optimize import least_squares

      A = np.array([
          [1.0, 0.0], [1.0, 1.0], [1.0, 2.0],
          [1.0, 3.0], [1.0, 4.0], [1.0, 5.0],
      ])
      y = np.array([1.0, 0.8, 2.4, 3.1, 3.7, 30.0])
      def residuals(theta):
          return A @ theta - y

      result = least_squares(
          residuals, x0=np.zeros(2), bounds=(-10, 10),
          loss="soft_l1", f_scale=1.0,
      )
      y_fit = A @ result.x
      print("OptimizeResult:")
      print("x:", np.round(result.x, 3))
      print("fun shape and values:", result.fun.shape, np.round(result.fun, 3))
      print("cost:", round(result.cost, 4))
      print("jac shape:", result.jac.shape)
      print("status/success:", result.status, result.success)
      print("fitted y:", np.round(y_fit, 3))
    output: |
      OptimizeResult:
      x: [0.029 1.21 ]
      fun shape and values: (6,) [ -0.971   0.438   0.048   0.557   1.167 -23.923]
      cost: 24.1131
      jac shape: (6, 2)
      status/success: 2 True
      fitted y: [0.029 1.238 2.448 3.657 4.867 6.077]
  what_comes_out:
    items:
    - name: x
      kind: return
      task: null
      shape: (n,)
      object_type: numpy.ndarray
      example: '[1.2, 0.6]'
      shape_explanation: The solution vector has n entries, one per optimized parameter. This example has 2 parameters, shape (2,).
      note: Read from the returned OptimizeResult as result.x.
    - name: fun
      kind: return
      task: null
      shape: (m,)
      object_type: numpy.ndarray
      example: '[0.1, -0.2, 0.0, 0.4]'
      shape_explanation: One residual per residual-function output. m counts residuals; the fictional example has 4, shape (4,).
      note: Final residual vector from result.fun, not the scalar objective.
    - name: cost
      kind: return
      task: null
      shape: scalar
      object_type: numpy.float64
      example: '0.15'
      shape_explanation: One scalar objective value, with no array axes.
      note: result.cost is half the chosen summed loss; linear loss gives half the squared-residual sum.
    - name: jac
      kind: return
      task: null
      shape: (m, n)
      object_type: numpy.ndarray
      example: '[[1.0, 0.0], [1.0, 1.0], [1.0, 2.0]]'
      shape_explanation: Rows are residuals and columns are optimized parameters. With 4 residuals and 2 parameters, shape is (4, 2).
      note: Read result.jac; robust losses modify it so J.T @ J approximates the loss Hessian.
    - name: status
      kind: return
      task: null
      shape: scalar
      object_type: int
      example: '1'
      shape_explanation: One integer termination code, not an array. Positive status codes indicate a convergence condition.
      note: Read from result.status; see message for the reason.
    - name: success
      kind: return
      task: null
      shape: scalar
      object_type: bool
      example: 'True'
      shape_explanation: One true/false value, with no array dimensions.
      note: Read from result.success; false means the solver did not satisfy a convergence condition.
    - name: A @ result.x
      kind: return
      task: regression
      shape: (m,)
      object_type: numpy.ndarray
      example: '[1.1, 1.5, 2.0, 2.6]'
      shape_explanation: Multiplying the design matrix A by the fitted parameter vector gives one model value per design row. Here A has 6 rows, so the prediction vector has shape (6,).
      note: Caller-built predictions; least_squares returns result.x and residual diagnostics, not predictions.
    next_step: Check result.success, then calculate predictions with result.x.
    visual: null
