  prep:
    - step: {family: clean.impute}
      status: required
      why: NaN residuals stop the fit.
      condition: {has_missing: true}
      unless: null
    - step: {family: transform.scale.rescale}
      status: recommended
      why: Similar input scales help the solver converge.
      condition: null
      unless: null
  code:
  - library: scipy
    target: scipy.optimize.least_squares
    why_this_library: The scipy solver, with bounds and robust losses.
    snippet: |
      # scipy 1.18.1
      import numpy as np
      from scipy.optimize import least_squares
      from sklearn.datasets import make_regression

      X, y = make_regression(n_samples=100, n_features=2, noise=5.0,
                             random_state=0)
      y[:5] += 100  # a few gross outliers


      def residuals(w):
          return X @ w - y


      res = least_squares(residuals, x0=np.zeros(2), bounds=(-200, 200),
                          loss="soft_l1")
      print(res.x.round(2))
  what_comes_out:
    items:
      - {name: x, kind: return, task: null, shape: "(n,)",
         note: "Solution: the fitted parameter values."}
      - {name: cost, kind: return, task: null, shape: "float",
         note: "Cost at the solution, using the chosen loss."}
      - {name: fun, kind: return, task: null, shape: "(m,)",
         note: "Residuals at the solution."}
    next_step: Read result.x for the values and result.cost for the loss.
    visual: null
  catch_outs:
    - The default loss is linear. Set loss for robust fits.
    - The lm method ignores bounds. Use trf or dogbox.
    - A poor starting point x0 can reach a local minimum.
