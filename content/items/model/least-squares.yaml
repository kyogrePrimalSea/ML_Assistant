  catch_outs:
  - The default loss is linear. Set loss for robust fits.
  - The lm method ignores bounds. Use trf or dogbox.
  - A poor starting point x0 can reach a local minimum.
  key_settings:
    tier1:
    - name: loss
      page: null
      controls: Chooses linear least squares or a robust loss such as soft_l1 or huber.
      effect: Robust losses reduce the influence of large residuals, but change cost interpretation.
    - name: bounds
      page: null
      controls: Sets lower and upper limits on each optimized variable.
      effect: Bounds enforce constraints; the initial point must be feasible and the solution may land on a bound.
    - name: method
      page: null
      controls: Chooses trf, dogbox, or lm algorithm.
      effect: trf supports bounds and sparse problems; lm is unconstrained and requires at least as many residuals as parameters.
    - name: jac
      page: null
      controls: Chooses numerical differentiation or supplies the residual Jacobian.
      effect: A reliable Jacobian improves steps; sparse patterns can reduce work.
    tier2:
    - name: x_scale
      page: null
      controls: Sets characteristic scale for each optimization variable.
      effect: Scaling makes trust-region steps comparable across differently sized parameters.
    - name: max_nfev
      page: null
      controls: Caps residual function evaluations.
      effect: A higher cap may allow convergence but takes longer.
    - name: tr_solver
      page: null
      controls: Chooses exact or iterative trust-region subproblem solver.
      effect: Exact can suit small dense Jacobians; lsmr can reduce memory for large sparse problems.
    - name: callback
      page: null
      controls: Runs user code after iterations and can stop optimization.
      effect: Callbacks support monitoring or early stopping, but add work and can interrupt convergence.
    tier3:
    - name: ftol
      page: null
      controls: Sets termination tolerance for relative cost change.
      effect: Looser tolerance may stop sooner with a less settled objective.
    - name: xtol
      page: null
      controls: Sets termination tolerance for parameter-step size.
      effect: Looser tolerance may stop while parameters could still move.
    - name: gtol
      page: null
      controls: Sets termination tolerance for the scaled gradient.
      effect: Looser tolerance accepts a less stationary solution.
    - name: f_scale
      page: null
      controls: Sets the inlier/outlier transition scale for robust losses.
      effect: Larger values treat more residuals as inliers; smaller values downweight large residuals sooner.
  watch_it_work:
    none: true
  intuition:
    idea: Adjust the numbers to make the residuals as small as possible, within limits.
    analogy: Tuning knobs that each have a stop at a set limit.
    animation: none
    good_at:
    - bounds on values
    - robust losses
    - custom formulas
    bad_at:
    - p-values
    - poor starting points
    vs_siblings:
    - page: curve-fit
      note: Simpler interface on top of this solver. Fewer options.
    goal: Find parameter values that minimize a residual-based objective, optionally with bounds and robust loss.
    steps:
    - Define a function that maps a parameter vector to m residuals.
    - Choose an initial parameter vector and optional bounds.
    - At each iteration, estimate or compute the Jacobian of residuals with respect to parameters.
    - Use the selected trust-region or LM method to reduce linear or robust least-squares cost.
    - Stop when a tolerance or evaluation limit is reached and inspect the returned OptimizeResult.
    - Construct model predictions separately by applying the fitted parameters to the model function.
    math:
      notation:
      - symbol: theta
        meaning: Vector of n optimized parameters.
      - symbol: r(theta)
        meaning: Vector of m residuals returned by the user function.
      - symbol: J
        meaning: Jacobian with m residual rows and n parameter columns.
      - symbol: rho
        meaning: Selected loss function applied to squared residuals.
      - symbol: f_scale
        meaning: Scale that sets the transition for robust losses.
      equations:
      - expression: J_ij=partial r_i(theta)/partial theta_j
        meaning: Each Jacobian entry measures how one residual changes with one fitted parameter.
      - expression: cost(theta)=1/2 sum_i rho(r_i(theta)^2)
        meaning: The solver minimizes half the sum of the selected loss over residuals.
      - expression: yhat=g(theta_hat)
        meaning: If the residuals came from a model g, predictions are made by evaluating that model at the returned solution.
      prediction: least_squares returns OptimizeResult, not an estimator. Use result.x in your model; result.fun stores residuals.
    read_more:
    - Write the residuals as a function of the parameters.
    - Start from x0 and step to a lower cost.
    - Stop when the change falls below ftol, xtol or gtol.
  next: []
