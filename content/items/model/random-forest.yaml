id: random-forest
plain_name: Random forest
code_name: RandomForestRegressor / RandomForestClassifier
aliases:
- random forests
stage: model
family: model.trees.bagging
tracks:
- standard
archetype: model
question_tags:
- tabular data
- overfitting
targets:
- sklearn.ensemble.RandomForestRegressor
- sklearn.ensemble.RandomForestClassifier
pairs_with:
- treeexplainer
clashes: []
source_urls:
- https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.RandomForestRegressor.html
- https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.RandomForestClassifier.html
- https://scikit-learn.org/stable/modules/ensemble.html
library_versions:
  scikit-learn: 1.9.1
reviewed: false
rules:
  task_types:
  - regression
  - classification
  blocked_when: []
  fits_on_data: true
  shape_effect:
    rows: same
    columns: same
slots:
  header: {}
  solves:
    hero:
      kind: model
      dataset: ames
      shape: fit_line
    line: Many trees, each on a random sample, combined into one.
  quick_facts:
    none: true
  use_avoid:
    use_when:
    - tabular data
    - first model to try
    - need feature importances
    avoid_when:
    - needs one readable model
    - text or images
    - needs a formula
  prep:
  - step:
      family: clean.impute
    status: not_needed
    why: Trees here take missing values natively.
    condition: null
    unless: null
  - step:
      family: transform.scale.rescale
    status: not_needed
    why: Trees split on order, not size.
    condition: null
    unless: null
  - step:
      family: transform.encode.features
    status: required
    why: Text categories must become numbers.
    condition:
      has_categoricals: true
    unless: null
  - step:
      family: transform.rebalance.weight
    status: recommended
    why: Use class_weight when classes are lopsided.
    condition:
      imbalanced: true
      task_type:
      - classification
    unless: null
  - step:
      page: train-test-split
    status: recommended
    why: Keep a test set. Out-of-bag score needs bootstrap=True.
    condition: null
    unless: null
  code:
  - library: scikit-learn
    target: sklearn.ensemble.RandomForestRegressor
    why_this_library: Bootstrap rows and feature subsets make diverse trees whose predictions are averaged.
    snippet: "# scikit-learn 1.9.1\nimport numpy as np\nfrom sklearn.datasets import load_diabetes\nfrom sklearn.ensemble\
      \ import RandomForestRegressor\nfrom sklearn.model_selection import train_test_split\n\nX, y = load_diabetes(return_X_y=True)\n\
      X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)\nmodel = RandomForestRegressor(\n\
      \    n_estimators=30, oob_score=True, n_jobs=1, random_state=0\n)\nmodel.fit(X_train, y_train)\ny_pred = model.predict(X_test[:3])\n\
      print('y_pred:', np.round(y_pred, 1))\nprint('R2:', round(model.score(X_test, y_test), 3))\nprint('OOB R2:',\
      \ round(model.oob_score_, 3))"
    output: 'y_pred: [250.2 258.  165.8]

      R2: 0.19

      OOB R2: 0.411

      '
  - library: scikit-learn
    target: sklearn.ensemble.RandomForestClassifier
    why_this_library: Bootstrap rows and feature subsets make diverse trees whose class probabilities are averaged.
    snippet: "# scikit-learn 1.9.1\nimport numpy as np\nfrom sklearn.datasets import load_breast_cancer\nfrom sklearn.ensemble\
      \ import RandomForestClassifier\nfrom sklearn.model_selection import train_test_split\n\nX, y = load_breast_cancer(return_X_y=True)\n\
      X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)\nmodel = RandomForestClassifier(\n\
      \    n_estimators=30, oob_score=True, n_jobs=1, random_state=0\n)\nmodel.fit(X_train, y_train)\ny_pred = model.predict(X_test[:3])\n\
      y_proba = model.predict_proba(X_test[:3])\nprint('y_pred labels:', y_pred)\nprint('y_proba:', np.round(y_proba,\
      \ 3))\nprint('accuracy:', round(model.score(X_test, y_test), 3))\nprint('OOB accuracy:', round(model.oob_score_,\
      \ 3))"
    output: "y_pred labels: [0 1 1]\ny_proba: [[0.933 0.067]\n [0.1   0.9  ]\n [0.    1.   ]]\naccuracy: 0.958\n\
      OOB accuracy: 0.965\n"
  what_comes_out:
    items:
    - name: predict
      kind: method
      task: regression
      shape: (n_samples,) or (n_samples, n_outputs)
      object_type: numpy.ndarray
      example: '[12.4, -3.1, 8.0]'
      shape_explanation: For one regression target, this is one numeric prediction per row. This fictional example
        has n_samples=3, shape (3,); multiple targets add an n_outputs column axis.
      note: Regression values are averaged across the trees or base estimators.
    - name: predict
      kind: method
      task: classification
      shape: (n_samples,) or (n_samples, n_outputs)
      object_type: numpy.ndarray
      example: '[0, 1, 1]'
      shape_explanation: For one classification output, this is one class label per row. This fictional example
        has n_samples=3, shape (3,); multiple outputs add a column per output.
      note: Class label with greatest mean tree probability; multi-output predicts one label per output.
    - name: predict_proba
      kind: method
      task: classification
      shape: (n_samples, n_classes)
      object_type: numpy.ndarray
      example: '[[0.8, 0.2], [0.1, 0.9], [0.3, 0.7]]'
      shape_explanation: Rows are cases and columns follow classes_. This fictional single-output example has 3
        cases and 2 classes, shape (3, 2).
      note: Forest classifiers average tree probabilities; multi-output classification returns a list of probability
        arrays.
    - name: classes_
      kind: attribute
      task: classification
      shape: (n_classes,)
      object_type: numpy.ndarray
      example: '[0, 1]'
      shape_explanation: One label per class. This fictional single-output example has two classes, shape (2,);
        the trailing comma marks one dimension.
      note: For multi-output classification, classes_ is a list with one class array per output.
    - name: feature_importances_
      kind: attribute
      task: null
      shape: (n_features,)
      object_type: numpy.ndarray
      example: '[0.6, 0.3, 0.1]'
      shape_explanation: One normalized score per input feature. This fictional example assumes n_features=3 and
        has shape (3,).
      note: Mean impurity reduction across trees; can favor high-cardinality features.
    - name: estimators_
      kind: attribute
      task: null
      shape: (n_estimators,)
      object_type: list of fitted trees
      example: '[DecisionTreeRegressor(...), DecisionTreeRegressor(...)]'
      shape_explanation: A list containing one fitted tree per forest member. This fictional example depicts two
        members, so its concrete length is 2.
      note: Trees are independent members; inspect one tree to see its own rules.
    - name: oob_score_
      kind: attribute
      task: null
      shape: scalar
      object_type: float
      example: '0.71'
      shape_explanation: A scalar is one value with no array axes. This fictional example is one out-of-bag score.
      note: R squared for regression or accuracy for classification; requires bootstrap=True and oob_score=True.
    - name: oob_decision_function_
      kind: attribute
      task: classification
      shape: (n_samples, n_classes)
      object_type: numpy.ndarray
      example: '[[0.8, 0.2], [0.1, 0.9], [0.3, 0.7]]'
      shape_explanation: Rows are cases and columns are classes. This fictional single-output example has shape
        (3, 2); multi-output adds an output axis.
      note: Out-of-bag class probabilities; available only with bootstrap=True.
    next_step: null
    visual: both
    guidance:
    - task: regression
      text: Check regression predictions on held-out rows; tree predictions are piecewise constant and do not extrapolate.
    - task: classification
      text: Use probabilities for ROC AUC or PR curves. Use labels for accuracy and confusion matrices.
    snippet: "# scikit-learn 1.9.1\nimport numpy as np\nfrom sklearn.datasets import load_breast_cancer, load_diabetes\n\
      from sklearn.ensemble import RandomForestClassifier, RandomForestRegressor\nfrom sklearn.model_selection import\
      \ train_test_split\n\nXd, yd = load_diabetes(return_X_y=True)\nXd_tr, Xd_te, yd_tr, yd_te = train_test_split(Xd,\
      \ yd, random_state=0)\nreg = RandomForestRegressor(\n    n_estimators=30,\n    oob_score=True,\n    n_jobs=1,\n\
      \    random_state=0,\n)\nreg.fit(Xd_tr, yd_tr)\ny_pred = reg.predict(Xd_te[:3])\nprint('regression y_pred:',\
      \ np.round(y_pred, 1))\nprint('regression oob_score_:', round(reg.oob_score_, 3))\nXc, yc = load_breast_cancer(return_X_y=True)\n\
      Xc_tr, Xc_te, yc_tr, yc_te = train_test_split(Xc, yc, random_state=0)\nclf = RandomForestClassifier(\n   \
      \ n_estimators=30,\n    oob_score=True,\n    n_jobs=1,\n    random_state=0,\n)\nclf.fit(Xc_tr, yc_tr)\ny_pred\
      \ = clf.predict(Xc_te[:3])\ny_proba = clf.predict_proba(Xc_te[:3])\nprint('classification y_pred:', y_pred)\n\
      print('classification y_proba:', np.round(y_proba, 3))\nprint('classification oob_score_:', round(clf.oob_score_,\
      \ 3))\nprint(\n    'classification oob probabilities:',\n    np.round(clf.oob_decision_function_[:3], 3),\n\
      )\nprint('estimators_ count:', len(clf.estimators_))"
    snippet_library: scikit-learn
    output: "regression y_pred: [250.2 258.  165.8]\nregression oob_score_: 0.411\nclassification y_pred: [0 1 1]\n\
      classification y_proba: [[0.933 0.067]\n [0.1   0.9  ]\n [0.    1.   ]]\nclassification oob_score_: 0.965\n\
      classification oob probabilities: [[0. 1.]\n [0. 1.]\n [1. 0.]]\nestimators_ count: 30\n"
  catch_outs:
  - oob_score needs bootstrap=True, which is the default here.
  - Text columns fail. Encode them first.
  key_settings:
    tier1:
    - name: n_estimators
      page: n-estimators
      controls: Number of independently randomized trees in the forest.
      effect: More trees usually stabilize the average, with higher training time and memory.
    - name: max_depth
      page: max-depth
      controls: Maximum levels each constituent tree may grow.
      effect: Shallower trees reduce variance but can underfit.
    - name: max_features
      page: null
      controls: Number or fraction of columns sampled at each tree split.
      effect: Smaller subsets diversify trees but can increase bias.
    - name: min_samples_leaf
      page: null
      controls: Minimum training rows per leaf in every tree.
      effect: Larger leaves smooth individual trees and reduce overfit, but can miss detail.
    tier2:
    - name: class_weight
      page: null
      controls: Relative class costs used when fitting classifier trees.
      effect: Higher weight makes errors for that class count more.
    - name: criterion
      page: null
      controls: Split impurity or regression error measure used inside each tree.
      effect: The criterion changes which local splits are preferred.
    - name: max_samples
      page: null
      controls: Rows drawn for each bootstrap tree, when bootstrap=True.
      effect: Smaller samples diversify members but can weaken each tree.
    - name: oob_score
      page: null
      controls: Whether to score predictions made only by trees that omitted each training row.
      effect: Provides a built-in validation estimate without a separate split; costs extra prediction work.
    - name: bootstrap
      page: null
      controls: Whether each tree receives a row sample drawn with replacement.
      effect: Bootstrap decorrelates trees and enables OOB estimates; disabling gives each tree all rows.
    tier3:
    - name: min_samples_split
      page: null
      controls: Minimum rows required before a tree node may split.
      effect: Larger values limit tree growth and smooth the forest.
    - name: min_weight_fraction_leaf
      page: null
      controls: Minimum fraction of total weight required in each leaf.
      effect: Larger values avoid tiny weighted leaves but may miss small groups.
    - name: max_leaf_nodes
      page: null
      controls: Maximum leaves per constituent tree.
      effect: A smaller cap reduces complexity but can underfit.
    - name: min_impurity_decrease
      page: null
      controls: Minimum impurity reduction required for a tree split.
      effect: A higher threshold creates smaller trees and may miss useful patterns.
    - name: ccp_alpha
      page: null
      controls: Cost-complexity pruning strength applied to each tree.
      effect: Larger values prune more and may underfit.
    - name: monotonic_cst
      page: null
      controls: Per-feature monotonic constraints for the forest prediction.
      effect: Constraints encode known direction but reduce flexibility; multi-output classification is unsupported.
  watch_it_work:
    none: true
  intuition:
    idea: Many trees, each trained on a random sample of rows.
    analogy: A panel of experts, each shown a different sample of cases.
    animation: none
    good_at:
    - tabular data
    - feature importances
    - missing values
    bad_at:
    - text or images
    - one readable rule
    vs_siblings:
    - page: extra-trees
      note: Bootstrap is off by default there, so each tree sees all rows.
    - page: bagging
      note: Bagging takes any base model. Random forest uses trees.
    - page: decision-tree-classifier
      note: One tree. A forest averages many.
    read_more: &id001
    - Draw a bootstrap sample of training rows for each tree.
    - At each split, sample candidate features and choose the best split among them.
    - Grow the trees independently using their stopping rules.
    - Average regression values or class probabilities across the trees.
    goal: Reduce tree instability by averaging bootstrap-trained trees that also sample candidate features at every
      split.
    steps: *id001
    math:
      notation:
      - symbol: b=1,...,B
        meaning: Index of a tree among B fitted trees.
      - symbol: T_b(x)
        meaning: Prediction from tree b for input x.
      - symbol: p_bk(x)
        meaning: Tree b probability for class k.
      - symbol: S_b
        meaning: Bootstrap sample used to fit tree b.
      - symbol: F_b,node
        meaning: Random feature subset offered at a node.
      - symbol: B
        meaning: Number of fitted trees.
      - symbol: x
        meaning: Input row to predict.
      - symbol: k
        meaning: Class index.
      equations:
      - expression: 'regression: f(x) = (1/B) sum_b T_b(x)'
        meaning: A regression forest averages the numerical prediction from each tree.
      - expression: 'classification: p_k(x) = (1/B) sum_b p_bk(x)'
        meaning: A classifier forest averages each tree’s class probabilities, then selects the largest class probability.
      prediction: Trees bootstrap rows, sample features at splits, then average outputs. Each sampled split uses
        its best threshold.
  next:
  - model-overfitting
  - know-feature-importance
