      - {name: cache_size, page: null}
  watch_it_work: {none: true}
  intuition:
    idea: "Fit a curve so most points sit inside a tube; points outside it set the fit."
    analogy: "A rope pinned to the points, slack inside a tube."
    animation: none
    good_at: ["curved trends", "up to 10,000 rows", "scaled features"]
    bad_at: ["large data", "images or text", "a simple formula"]
    vs_siblings:
      - {page: nu-svr, note: "NuSVR sets nu instead of epsilon."}
      - {page: kernel-ridge, note: "Kernel ridge has no tube; every point counts."}
    read_more:
