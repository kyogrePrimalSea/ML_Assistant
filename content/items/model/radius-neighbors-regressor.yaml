  code:
    - library: scikit-learn
      target: sklearn.neighbors.RadiusNeighborsRegressor
      why_this_library: The scikit-learn estimator for this method.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_diabetes
        from sklearn.model_selection import train_test_split
        from sklearn.neighbors import RadiusNeighborsRegressor
        from sklearn.pipeline import make_pipeline
        from sklearn.preprocessing import StandardScaler

        X, y = load_diabetes(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(
            X, y, random_state=0
        )

        model = make_pipeline(
            StandardScaler(),
            RadiusNeighborsRegressor(radius=3.0),
        )
        model.fit(X_train, y_train)
        print(round(model.score(X_test, y_test), 3))
  what_comes_out:
    items:
      - {name: predict, kind: method, task: regression, shape: "(n_samples,)",
         note: "Average target of the training rows in range."}
      - {name: radius_neighbors, kind: method, task: null, shape: "2 ragged arrays, one per row",
         note: "Distances and row numbers within the radius."}
      - {name: score, kind: method, task: regression, shape: "float",
