  what_comes_out:
    items:
    - name: predict
      kind: method
      task: regression
      shape: (n_samples,)
      note: Average target of the training rows in range.
      object_type: numpy.ndarray
      example: '[0.25, 0.40, 0.65]'
      shape_explanation: One predicted value per query row; three values give n_samples=3 and shape (3,).
    - name: radius_neighbors
      kind: method
      task: null
