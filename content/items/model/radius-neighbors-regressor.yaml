      task: regression
      shape: scalar
      note: R² on supplied data; 1 is perfect and 0 matches the mean baseline.
      object_type: float
      example: '0.82'
      shape_explanation: A scalar is one value with no array dimensions; 0.82 is one score.
    - name: n_samples_fit_
      kind: attribute
      task: null
      shape: scalar
      note: Training rows kept for lookup.
      object_type: int
      example: '442'
      shape_explanation: A scalar integer is one count, not an array; this fictional example is one count.
    - name: n_features_in_
      kind: attribute
      task: null
      shape: scalar
      note: Columns seen during fit.
      object_type: int
      example: '2'
      shape_explanation: A scalar integer is one count, not an array; this fictional example is one count.
    - name: feature_names_in_
      kind: attribute
      task: null
      shape: (n_features,)
      note: Column names. Set only when fit on a DataFrame.
      object_type: numpy.ndarray
      example: '[''feature_a'', ''feature_b'']'
      shape_explanation: One name per input feature; this two-name fictional example has shape (2,) and
        n_features=2.
    next_step: Check for NaN predictions before scoring; they mean no neighbors.
    snippet: '# scikit-learn 1.9.1

      from sklearn.datasets import load_diabetes

      from sklearn.neighbors import RadiusNeighborsRegressor


      data = load_diabetes(as_frame=True)

      model = RadiusNeighborsRegressor(radius=3.0).fit(data.data, data.target)

      y_pred = model.predict(data.data[:3])

      distances, indices = model.radius_neighbors(data.data[:3])

      print("y_pred shape:", y_pred.shape)

      print("neighbour counts:", [len(row) for row in indices])

      print("first neighbour indices:", indices[0][:5])

      print("n_samples_fit_:", model.n_samples_fit_)

      '
    snippet_library: scikit-learn
    visual: null
    output: 'y_pred shape: (3,)

      neighbour counts: [442, 442, 442]

      first neighbour indices: [ 46 224 160  20 235]

      n_samples_fit_: 442

      '
  catch_outs:
  - Radius is in the same units as the features, so rescaling changes it.
  - Rows with no training row in range get NaN, with a warning.
  - Dense areas use many rows and sparse areas use few.
  key_settings:
    tier1:
    - name: radius
      page: null
      controls: Maximum distance for a training row to count as a neighbour.
      effect: A larger radius includes more rows; a smaller one may leave queries with none.
    - name: weights
      page: null
      controls: Uniform or inverse-distance influence among in-radius rows.
      effect: Distance weights emphasize close rows.
    - name: metric
      page: null
      controls: Distance formula used to test the radius.
      effect: Changing it changes which rows fall inside the radius.
    tier2:
    - name: algorithm
      page: null
      controls: 'Search implementation: auto, ball_tree, kd_tree, or brute.'
      effect: Choice changes search speed and memory.
    - name: leaf_size
      page: null
      controls: Tree leaf size for ball-tree or kd-tree searches.
      effect: Changes tree memory and speed.
    - name: p
      page: null
      controls: Minkowski distance power; 1 is Manhattan and 2 is Euclidean.
      effect: Changing p changes in-radius membership.
    tier3:
    - name: metric_params
      page: null
      controls: Extra keyword parameters for the selected metric.
      effect: Metric-specific parameters alter distance calculations.
    - name: n_jobs
      page: null
      controls: Parallel jobs for neighbour searches.
      effect: More workers can speed searches while using more CPU.
  watch_it_work:
    none: true
  intuition:
    idea: Predict from every training row within a set distance.
    analogy: Asking everyone living within a mile what they paid.
    animation: none
    good_at:
    - uneven density
    - local patterns
    - distance rules
    bad_at:
    - many features
    - large tables
    - extrapolation
    vs_siblings:
    - page: k-neighbors-regressor
      note: Fixed count of neighbors instead of a fixed distance.
    goal: Estimate a target from every training row no farther away than a chosen radius.
    math:
      notation:
      - symbol: x
        meaning: query row
      - symbol: R(x)
        meaning: training rows with d(x,x_i) ≤ radius
      - symbol: d_i
        meaning: distance from x to training row i
      - symbol: y_i
        meaning: observed target for row i
      - symbol: w_i
        meaning: uniform or inverse-distance weight
      equations:
      - expression: 'R(x)={i : d(x,x_i) ≤ r}'
        meaning: Membership is determined by the configured radius r, not by a fixed neighbour count.
      - expression: ŷ(x)=Σ_{i∈R(x)} w_i y_i / Σ_{i∈R(x)} w_i
        meaning: Average targets of all in-radius rows; an empty R(x) raises an error.
      prediction: Unlike k-neighbour regression, the number of neighbours varies by query. No in-radius
        rows causes predict to raise.
    read_more: &id001
    - Compute the configured distance from the query to each training row.
    - Keep every row whose distance is at most radius.
    - Average the retained target values using uniform or distance weights; fail if none qualify.
    steps: *id001
  next: []
