  code:
    - library: statsmodels
      target: statsmodels.tsa.statespace.structural.UnobservedComponents
      why_this_library: The statsmodels class for this model.
      snippet: |
        # statsmodels 0.15.0
        import numpy as np
        from sklearn.datasets import make_regression
        from statsmodels.tsa.statespace.structural import UnobservedComponents

        _, noise = make_regression(
            n_samples=120, n_features=1, noise=2.0, random_state=0
        )
        series = 0.1 * np.arange(120) + noise  # a trend plus noise

        model = UnobservedComponents(
            series,
            level=True,
            stochastic_level=True,
            trend=True,
            stochastic_trend=True,
        )
        res = model.fit(disp=False)
        print(res.params.round(2))
