  code:
    - library: statsmodels
      target: statsmodels.tsa.exponential_smoothing.ets.ETSModel
      why_this_library: Same smoothing idea, fitted as a statistical model.
      snippet: |
        # statsmodels 0.15.0
        import numpy as np
        from statsmodels.tsa.exponential_smoothing.ets import ETSModel

        rng = np.random.default_rng(0)
        t = np.arange(144)
        y = 100 + 0.8 * t + 10 * np.sin(2 * np.pi * t / 12)
        y = y + rng.normal(0, 2, 144)

        model = ETSModel(
            y[:132], error="add", trend="add", seasonal="add",
            seasonal_periods=12,
        )
        res = model.fit(disp=False)
        print(np.round(res.predict(132, 143), 1).tolist())
  what_comes_out:
    items:
      - {name: predict, kind: method, task: regression, shape: "(n_obs,) or (n_steps,)",
         note: "Fitted values in sample, forecasts past the end."}
      - {name: score, kind: method, task: null, shape: "(n_params,)",
         note: "Score vector of the likelihood at the given params."}
      - {name: endog_names, kind: attribute, task: null, shape: "str",
         note: "Name of the series. 'y' when the input has no name."}
      - {name: exog_names, kind: attribute, task: null, shape: "None",
         note: "None here. ETS takes no outside drivers."}
    next_step: null
