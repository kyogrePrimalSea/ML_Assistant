id: extra-trees
plain_name: Extra trees
code_name: ExtraTreesRegressor / ExtraTreesClassifier
aliases:
- extremely randomized trees
stage: model
family: model.trees.bagging
tracks:
- standard
archetype: model
question_tags:
- tabular data
- overfitting
targets:
- sklearn.ensemble.ExtraTreesRegressor
- sklearn.ensemble.ExtraTreesClassifier
pairs_with:
