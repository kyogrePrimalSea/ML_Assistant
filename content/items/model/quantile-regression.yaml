    condition: null
    unless: null
  - step:
      family: clean.impute
    status: required
    why: NaN raises an error in both libraries.
    condition:
      has_missing: true
    unless: null
  - step:
      family: transform.encode.features
    status: required
    why: Text categories must become numbers.
    condition:
      has_categoricals: true
    unless: null
  code:
  - library: scikit-learn
    target: sklearn.linear_model.QuantileRegressor
    why_this_library: Scikit-learn API, with the quantile set in the constructor.
    snippet: '# scikit-learn 1.9.1

      import numpy as np

      from sklearn.datasets import make_regression

      from sklearn.linear_model import QuantileRegressor

      from sklearn.model_selection import train_test_split


      X, y = make_regression(n_samples=500, n_features=5, noise=10, random_state=0)

      X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

      model = QuantileRegressor(quantile=0.9, alpha=0).fit(X_train, y_train)

      y_pred = model.predict(X_test[:5])

      print("y_pred:", np.round(y_pred, 2))

      print("share below:", round((y_test <= model.predict(X_test)).mean(), 2))

      '
    output: 'y_pred: [-103.54    3.98  124.82 -157.97  -42.39]

      share below: 0.91

      '
  - library: statsmodels
    target: statsmodels.regression.quantile_regression.QuantReg
    why_this_library: Statsmodels sets the quantile in fit, not the constructor.
    snippet: '# statsmodels 0.15.0

      import statsmodels.api as sm

      from sklearn.datasets import make_regression


      X, y = make_regression(n_samples=500, n_features=3, noise=10, random_state=0)

      Xc = sm.add_constant(X)

      result = sm.QuantReg(y, Xc).fit(q=0.9)

      y_pred = result.predict(Xc[:5])

      print("y_pred:", y_pred.round(2))

      print("params:", result.params.round(2))

      print("pvalues:", result.pvalues.round(3))

      '
    output: 'y_pred: [ 12.5   59.08 -72.02 -21.34 -19.28]

      params: [12.99  0.14 55.86 11.03]

      pvalues: [0.    0.872 0.    0.   ]

      '
  what_comes_out:
    items:
    - name: predict
      kind: method
      task: regression
      shape: (n_samples,)
      object_type: numpy.ndarray
      example: '[2.4, 5.1, 3.2]'
      shape_explanation: One predicted response per input row. n_samples is the number of rows; this example has
        3 values, shape (3,).
      note: Predicts the selected conditional quantile q in original response units; no inverse link is applied.
    - name: score
      kind: method
      task: regression
      shape: scalar
      object_type: float
      example: '0.72'
      shape_explanation: A scalar is one R-squared value, with no array dimensions.
      note: R squared, not pinball loss; score does not directly assess quantile calibration.
    - name: coef_
      kind: attribute
      task: null
      shape: (n_features,)
      object_type: numpy.ndarray
      example: '[0.2, -0.1, 0.4]'
      shape_explanation: One coefficient per input feature. n_features is the number of columns; the example has
        3 coefficients, shape (3,).
      note: Coefficients shift the selected conditional quantile in original response units; there is no inverse
        link.
    - name: intercept_
      kind: attribute
      task: null
      shape: scalar
      object_type: float
      example: '0.3'
      shape_explanation: A scalar is one intercept value, with no array dimensions.
      note: Intercept is the fitted quantile at zero-valued features, in original response units.
    - name: n_iter_
      kind: attribute
      task: null
      shape: scalar
      object_type: int
      example: '12'
      shape_explanation: A scalar integer counts solver iterations for this one fitted target; it has no array dimensions.
      note: Compare with max_iter to see whether the solver hit its limit.
    - name: n_features_in_
      kind: attribute
      task: null
      shape: scalar
      object_type: int
      example: '3'
      shape_explanation: A scalar integer counts fitted input columns; it has no array dimensions.
      note: Number of columns seen during fit.
    - name: params
      kind: return
      task: null
      shape: (n_parameters,)
      object_type: numpy.ndarray
      example: '[12.0, 0.2, 0.5, -0.1]'
      shape_explanation: A one-dimensional array with one fitted value per design parameter. With 3 features and
        a constant, n_parameters is 4; shape (4,).
      note: result.params is ordered as the constant, then the three feature coefficients in Xc.
    - name: pvalues
      kind: return
      task: null
      shape: (n_parameters,)
      object_type: numpy.ndarray
      example: '[0.8, 0.01, 0.04, 0.02]'
      shape_explanation: One p-value per design parameter in the same order as params. Three features plus the constant
        give 4 values, shape (4,).
      note: result.pvalues reports inference in constant-first Xc column order.
    snippet: '# scikit-learn 1.9.1

      import numpy as np

      from sklearn.datasets import make_regression

      from sklearn.linear_model import QuantileRegressor

      X, y = make_regression(n_samples=200, n_features=3, noise=10, random_state=0)

      model = QuantileRegressor(quantile=0.9, alpha=0).fit(X, y)

      y_pred = model.predict(X[:3])

      print("y_pred:", y_pred.round(2))

      print("share below:", round((y <= model.predict(X)).mean(), 2))

      print("coef_:", model.coef_.round(2))

      '
    snippet_library: scikit-learn
    visual: regression_preds
    next_step: null
    guidance:
    - task: regression
      text: Sklearn exposes coef_ and R-squared but no p-values. Statsmodels QuantReg results expose params and
        pvalues for inference.
    output: 'y_pred: [ 32.66 -81.13 213.73]

      share below: 0.9

      coef_: [24.83 59.26 57.21]

      '
  catch_outs:
  - Quantile must be strictly between 0 and 1. The default 0.5 is the median.
  - Each quantile needs its own fit.
  - Missing values raise an error here.
  key_settings:
    tier1:
    - name: quantile
      page: null
      controls: Conditional quantile q to estimate, strictly between 0 and 1.
      effect: Higher q moves the fitted line toward the upper tail; q=0.5 targets the conditional median.
    - name: alpha
      page: null
      controls: Strength of the L1 penalty on coefficient size.
      effect: A larger value shrinks coefficients more; for NB family it also changes variance, so check which API
        owns it.
    tier2:
    - name: fit_intercept
      page: null
      controls: Whether to add an intercept to the linear predictor.
      effect: Turning it off assumes the response relation is already centered on the chosen link scale.
    tier3:
    - name: solver
      page: null
      controls: Linear-programming solver used by QuantileRegressor.
      effect: HiGHS solvers are recommended for speed; different methods can vary in runtime and convergence.
    - name: solver_options
      page: null
      controls: Additional options forwarded to scipy.optimize.linprog.
      effect: Can tune solver behaviour, but invalid or aggressive options can prevent convergence.
  watch_it_work:
    none: true
  intuition:
    idea: Fit a line that a chosen share of points falls below.
    analogy: Like a price cut-off, where 90 percent of houses sell below it.
    animation: none
    good_at:
    - prediction bands
    - the median
    - skewed targets
    bad_at:
    - the average
    - text or images
    vs_siblings:
    - page: linear-regression
      note: Fits the average. Quantile fits a chosen percentile.
    - page: huber-regressor
      note: Robust average. Quantile fits a chosen percentile.
    read_more:
    - Pick a quantile. 0.5 is the median.
    - Points above the line cost q. Points below cost 1 minus q.
    - Solve as a linear program, with the highs solver by default.
    goal: Estimate a chosen conditional percentile by penalizing under- and over-prediction asymmetrically.
    steps:
    - Choose q strictly between zero and one; q=0.5 targets the conditional median.
    - Minimize pinball loss, which weights under-prediction by q and over-prediction by 1-q.
    - Sklearn adds an L1 penalty via alpha; statsmodels QuantReg fits the quantile loss through its own API.
    - Fit separate models for separate quantiles, then compare their predictions as a band.
    math:
      notation:
      - symbol: y_i
        meaning: Observed response for row i.
      - symbol: q
        meaning: Chosen quantile strictly between 0 and 1.
      - symbol: yhat_i
        meaning: Predicted conditional q quantile.
      - symbol: u_i=y_i-yhat_i
        meaning: 'Residual: positive means under-prediction; negative means over-prediction.'
      - symbol: alpha
        meaning: L1 penalty strength in sklearn QuantileRegressor.
      equations:
      - expression: rho_q(u)=u*(q-I(u<0)); minimize sum_i rho_q(y_i-yhat_i) + alpha*||beta||_1
        meaning: Positive residuals cost q per unit; negative residuals cost 1-q, placing about q of outcomes below
          the fitted quantile.
      prediction: predict returns the fitted conditional q quantile on the original response scale; it is not transformed
        by a link.
  next:
  - evaluate-how-good
