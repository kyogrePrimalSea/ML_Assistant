      shape_explanation: A scalar is one value with no dimensions. This is the selected penalty strength.
      note: Chosen from alphas by cross-validation.
    visual: regression_preds
    guidance:
    - task: regression
      text: Use predictions on held-out rows for error metrics; score is R squared on the rows you pass in.
    snippet: '# scikit-learn 1.9.1

      from sklearn.datasets import make_regression

      from sklearn.linear_model import RidgeCV

      from sklearn.pipeline import make_pipeline

      from sklearn.preprocessing import StandardScaler


      X, y = make_regression(n_samples=200, n_features=8, noise=10, random_state=0)

      model = make_pipeline(StandardScaler(), RidgeCV(alphas=[0.1, 1.0, 10.0]))

      model.fit(X, y)

      y_pred = model.predict(X[:3])

      print(''y_pred:'', y_pred.round(1))

      print(''alpha:'', model[-1].alpha_)

      print(''R2:'', round(model.score(X, y), 3))'
    snippet_library: scikit-learn
    output: 'y_pred: [ 217.1 -284.2 -265.5]

      alpha: 0.1

      R2: 0.996

      '
    next_step: Use held-out rows to check predictions and residuals.
  catch_outs:
  - Only the values in alphas are tried.
  - Scale the columns first, or the penalty is unfair.
  - Missing values stop the fit. Impute them first.
  key_settings:
    tier1:
    - name: alphas
      page: null
      controls: Candidate penalty strengths to compare.
      effect: The chosen value cannot fall outside this list.
    - name: cv
      page: null
      controls: Cross-validation strategy; None uses efficient leave-one-out generalized cross-validation.
      effect: More folds cost more fitting work; splits affect the chosen alpha.
    tier2:
    - name: scoring
      page: null
      controls: Metric used to choose among candidate penalties.
      effect: A metric poorly matched to the goal selects a poor penalty.
    - name: alpha_per_target
      page: null
      controls: Whether to choose a separate penalty for each target.
      effect: Separate choices can fit targets differently.
    tier3:
    - name: store_cv_results
      page: null
      controls: Whether to retain per-sample results; requires cv=None.
      effect: Stored results use additional memory.
    - name: gcv_mode
      page: null
      controls: Computation mode for generalized cross-validation.
      effect: The faster mode depends on whether samples or features are fewer.
    - name: fit_intercept
      page: null
      controls: Whether to fit a constant baseline term.
      effect: Turning it off assumes inputs and target are centered.
  watch_it_work:
    none: true
  intuition:
    idea: Try several penalty strengths and keep the best by cross-validation.
    analogy: Taste a sauce at several salt levels, then keep the best one.
    animation: none
    good_at:
    - correlated features
    - no hand-tuned alpha
    - stable slopes
    bad_at:
    - picking a few features
    - curved patterns
    vs_siblings:
    - page: ridge
      note: Same penalty, but you set alpha yourself.
    - page: linear-regression
      note: No penalty, and no alpha to pick.
    goal: Choose a Ridge penalty from candidate values by cross-validation, then fit the final linear predictor.
    steps: &id001
    - Each alpha in alphas gets a cross-validated score.
    - The best alpha is kept as alpha_.
    - The final slopes are fitted at that alpha.
    math:
      notation:
      - symbol: alpha
        meaning: candidate penalty strength
      - symbol: CV(alpha)
        meaning: cross-validation score for that penalty
      - symbol: x_ij
        meaning: feature j for row i
      - symbol: y_i
        meaning: observed target for row i
      - symbol: b_j
        meaning: coefficient for feature j
      - symbol: alpha
        meaning: candidate penalty strength
      equations:
      - expression: minimise_b sum_i (y_i - sum_j x_ij b_j)^2 + alpha sum_j b_j^2
        meaning: For each candidate, Ridge trades squared residual error against squared coefficient size.
      - expression: alpha_ = argmin over alpha in alphas of CV-error(alpha)
        meaning: It selects the candidate with lowest CV error by default, or the best configured scoring value.
      prediction: Use the chosen alpha_ to fit final Ridge coefficients; predict with y-hat = b_0 + X_new b.
    read_more: *id001
  next:
  - but-wobbly-coefs
