id: ridge-cv
plain_name: RidgeCV
code_name: RidgeCV
aliases: [cross-validated ridge, ridge with cv]
stage: model
family: model.linear.shrink
tracks: [standard]
archetype: model
question_tags: [correlated features, pick alpha, cross-validation]
targets: [sklearn.linear_model.RidgeCV]
pairs_with: []
clashes: []
source_urls: ['https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.RidgeCV.html']
library_versions: {scikit-learn: 1.9.1}
reviewed: false
rules:
  task_types: [regression]
  blocked_when: []
  fits_on_data: true
  shape_effect: {rows: same, columns: same}
slots:
  header: {}
  solves:
    hero: {kind: model, dataset: ames, shape: fit_line}
    line: Ridge, with the penalty strength picked for you.
  quick_facts: {none: true}
  use_avoid:
    use_when: [correlated features, no hand-tuned alpha]
    avoid_when: [only a few features matter, curved patterns]
  prep:
    - step: {family: clean.impute}
      status: required
      why: Scikit-learn rejects NaN in X.
      condition: {has_missing: true}
      unless: null
    - step: {family: transform.encode.features}
      status: required
      why: Text categories must become numbers.
      condition: {has_categoricals: true}
      unless: null
    - step: {family: transform.scale.rescale}
      status: required
      why: The penalty depends on units. Scale first.
      condition: null
      unless: null
    - step: {page: train-test-split}
      status: recommended
      why: Keep a test set the alpha search never saw.
      condition: null
      unless: null
  code:
    - library: scikit-learn
      target: sklearn.linear_model.RidgeCV
      why_this_library: Picks alpha by cross-validation, built in.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import make_regression
        from sklearn.linear_model import RidgeCV
        from sklearn.pipeline import make_pipeline
        from sklearn.preprocessing import StandardScaler

        X, y = make_regression(n_samples=200, n_features=8, noise=10, random_state=0)
        model = make_pipeline(StandardScaler(), RidgeCV(alphas=[0.1, 1.0, 10.0]))
        model.fit(X, y)
        print(model[-1].alpha_)
  what_comes_out:
    items:
    - {name: predict, kind: method, task: regression, shape: "(n_samples,)", note: One predicted value per row.}
    - {name: score, kind: method, task: regression, shape: float, note: R squared on the data you pass in.}
    - {name: coef_, kind: attribute, task: null, shape: "(n_features,)", note: Slopes at the chosen alpha.}
    - {name: alpha_, kind: attribute, task: null, shape: float, note: The alpha that cross-validation picked.}
    - {name: best_score_, kind: attribute, task: null, shape: float, note: Best cross-validated score.}
    next_step: Read alpha_ to see the penalty that was chosen.
    visual: regression_preds
  catch_outs:
    - Only the values in alphas are tried.
    - Scale the columns first, or the penalty is unfair.
    - Missing values stop the fit. Impute them first.
  key_settings:
    tier1:
    - {name: alphas, page: null}
    - {name: cv, page: null}
    tier2:
    - {name: scoring, page: null}
    - {name: alpha_per_target, page: null}
    tier3:
    - {name: store_cv_results, page: null}
    - {name: gcv_mode, page: null}
    - {name: fit_intercept, page: null}
  watch_it_work: {none: true}
  intuition:
    idea: Try several penalty strengths and keep the best by cross-validation.
    analogy: Taste a sauce at several salt levels, then keep the best one.
    animation: none
    good_at: [correlated features, no hand-tuned alpha, stable slopes]
    bad_at: [picking a few features, curved patterns]
    vs_siblings:
      - {page: ridge, note: "Same penalty, but you set alpha yourself."}
      - {page: linear-regression, note: "No penalty, and no alpha to pick."}
    read_more:
      - Each alpha in alphas gets a cross-validated score.
      - The best alpha is kept as alpha_.
      - The final slopes are fitted at that alpha.
  next: [but-wobbly-coefs]
