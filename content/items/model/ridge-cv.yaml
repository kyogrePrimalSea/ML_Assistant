      object_type: numpy.ndarray
      example: '[0.4, -1.2, 2.0]'
      shape_explanation: 'A one-dimensional array: n_features is the number of input columns. The example shows
        three of the n_features entries; the trailing comma marks one dimension.'
      note: One coefficient per input column.
    - name: intercept_
      kind: attribute
      task: null
      shape: scalar
      object_type: float
