  code:
    - library: statsmodels
      target: statsmodels.tsa.statespace.varmax.VARMAX
      why_this_library: The statsmodels class for this model.
      snippet: |
        # statsmodels 0.15.0
        import numpy as np
        from sklearn.datasets import make_regression
        from statsmodels.tsa.statespace.varmax import VARMAX

        _, shocks = make_regression(
            n_samples=200, n_features=3, n_targets=2, noise=1.0, random_state=0
        )
        shocks = shocks / shocks.std(axis=0)
        data = np.zeros((200, 2))
        coefs = np.array([[0.5, 0.2], [0.1, 0.4]])
        for t in range(1, 200):
            data[t] = coefs @ data[t - 1] + shocks[t]

        model = VARMAX(data, order=(1, 0), trend="c")
        res = model.fit(disp=False)
        print(round(res.aic, 1))
  what_comes_out:
