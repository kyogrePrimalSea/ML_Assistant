  catch_outs:
  - Cost grows with the subsets it tries. Cap max_subpopulation.
  - Set random_state to get the same subsets each run.
  - NaN inputs stop the fit. Impute first.
  key_settings:
    tier1:
    - name: n_subsamples
      page: null
      controls: Subset size used for each least-squares candidate.
      effect: Larger subsets can improve efficiency but reduce robustness.
    - name: max_subpopulation
      page: null
      controls: Maximum number of candidate subsets considered.
      effect: A lower cap saves computation but reduces candidate coverage.
    - name: fit_intercept
      page: null
      controls: Whether candidates include an intercept.
      effect: Turning it off forces the fit through zero.
    tier2:
    - name: max_iter
      page: null
      controls: Maximum spatial-median iterations.
      effect: More iterations allow convergence but take longer.
    - name: tol
      page: null
      controls: Spatial-median convergence tolerance.
      effect: Tighter tolerance may refine the estimate at added cost.
    tier3:
    - name: random_state
      page: null
      controls: Seed for subset sampling.
      effect: A fixed seed makes sampled subsets reproducible.
    - name: n_jobs
      page: null
      controls: Parallel workers for subset fits.
      effect: More workers may reduce elapsed time while using more resources.
    - name: verbose
      page: null
      controls: Amount of progress output.
      effect: Higher verbosity prints more diagnostics.
  watch_it_work:
    none: true
  intuition:
    idea: Fit lines through many small subsets, then take the median of them.
    analogy: Asking every pair of friends for a rough slope and taking the middle answer.
    animation: none
    good_at:
    - small data
    - outliers
    - median slopes
    bad_at:
    - big data
    - many features
    - speed
    vs_siblings:
    - page: ransac-regressor
      note: Random subsets. Suited to many outliers.
    - page: huber-regressor
      note: Down-weights outliers rather than taking medians.
    read_more:
    - Fit least squares on many small subsets of rows.
    - Take the spatial median of those fits.
    - Use that median as the final line.
    goal: A spatial median aggregates subset coefficient vectors; SciPy’s 1D function uses pairwise median
      slopes.
    steps:
    - Fit least-squares coefficients on many sampled row subsets.
    - Take the spatial median of the candidate coefficient vectors.
    - Subsampling caps computation but makes results depend on selected subsets.
    math:
      notation:
      - symbol: S
        meaning: One sampled subset of observations.
      - symbol: θ_S
        meaning: Least-squares parameter vector fitted on subset S.
      - symbol: θ*
        meaning: Spatial median of candidate parameter vectors.
      - symbol: '||·||₂'
        meaning: Euclidean distance.
      equations:
      - expression: θ* = argmin_θ Σ_S ||θ−θ_S||₂
        meaning: The spatial median minimises total distance to the subset coefficient vectors.
      prediction: y_pred = x @ coef_ + intercept_; returns one prediction per row from spatial-median
        coefficients.
  next: []
