  code:
  - library: scikit-learn
    target: sklearn.linear_model.TheilSenRegressor
    why_this_library: The scikit-learn version, with subsampling options.
    snippet: '# scikit-learn 1.9.1

      from sklearn.datasets import make_regression

      from sklearn.linear_model import TheilSenRegressor


      X, y = make_regression(n_samples=60, n_features=1, noise=5.0, random_state=0)

      y[:6] += 150

      model = TheilSenRegressor(random_state=0).fit(X, y)

      y_pred = model.predict(X[:3])

      print("y_pred:", y_pred.round(1))

      print("slope:", round(model.coef_[0], 2))

      print("breakdown_:", round(model.breakdown_, 2))

      '
    output: 'y_pred: [ 6.1 14.4 -4.2]

      slope: 28.75

      breakdown_: 0.29

      '
  - library: scipy
    target: scipy.stats.theilslopes
    why_this_library: The scipy version, with a confidence interval on the slope.
    snippet: '# scipy 1.18.1

      from scipy.stats import theilslopes

      from sklearn.datasets import make_regression


      X, y = make_regression(n_samples=60, n_features=1, noise=5.0, random_state=0)

      y[:6] += 150

      res = theilslopes(y, X[:, 0])

      y_pred = res.slope * X[:3, 0] + res.intercept

      print("y_pred:", y_pred.round(1))

      print("slope:", round(res.slope, 2))

      '
    output: 'y_pred: [ 6.4 14.7 -4. ]

      slope: 28.8

      '
