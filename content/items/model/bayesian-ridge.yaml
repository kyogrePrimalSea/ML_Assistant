      family: transform.scale.rescale
    status: recommended
    why: One shared weight precision depends on feature scale.
    condition: null
    unless: null
  code:
  - library: scikit-learn
    target: sklearn.linear_model.BayesianRidge
    why_this_library: Sets its own regularisation from the data.
    snippet: '# scikit-learn 1.9.1

      from sklearn.datasets import load_diabetes

      from sklearn.linear_model import BayesianRidge

      from sklearn.model_selection import train_test_split


      X, y = load_diabetes(return_X_y=True)

      X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

      model = BayesianRidge().fit(X_train, y_train)

      y_pred, y_std = model.predict(X_test[:3], return_std=True)

      print("y_pred:", y_pred.round(1))

      print("y_std:", y_std.round(1))

      print("shapes:", y_pred.shape, y_std.shape)

      '
    output: 'y_pred: [238.4 247.8 164.6]

      y_std: [54.2 54.  53.8]

      shapes: (3,) (3,)

      '
  what_comes_out:
    items:
    - name: predict
      kind: method
      task: regression
      shape: (n_samples,)
      object_type: numpy.ndarray
      example: '[154.2, 120.5, 92.7]'
      shape_explanation: A one-dimensional array with one posterior mean for each input row. n_samples
        is the number of rows; this example has shape (3,).
      note: Posterior predictive mean, one value per row.
    - name: predict(..., return_std=True)[1]
      kind: return
      task: regression
      shape: (n_samples,)
      object_type: numpy.ndarray
      example: '[54.2, 54.0, 53.8]'
      shape_explanation: A one-dimensional array with one uncertainty value per input row. n_samples is
        the number of rows; this example has shape (3,).
      note: 'Second returned array: one predictive standard deviation per input row.'
    - name: coef_
      kind: attribute
      task: null
      shape: (n_features,)
      object_type: numpy.ndarray
      example: '[0.42, -0.18, 0.73]'
      shape_explanation: A one-dimensional array with one entry per input feature. n_features is the number
        of columns; this example has shape (3,).
      note: Posterior coefficient mean, one per feature.
    - name: sigma_
      kind: attribute
      task: null
      shape: (n_features, n_features)
      object_type: numpy.ndarray
      example: '[[0.12, 0.01], [0.01, 0.08]]'
      shape_explanation: A square matrix with one row and column per feature. This example illustrates
        2 features and shape (2, 2).
      note: Posterior covariance matrix of the coefficients.
    - name: alpha_
      kind: attribute
      task: null
      shape: scalar
      object_type: float
      example: '0.12'
      shape_explanation: A scalar is one value, with no array dimensions. The example shows that single
        value.
      note: Estimated observation-noise precision.
    - name: lambda_
      kind: attribute
      task: null
      shape: scalar
      object_type: float
      example: '0.04'
      shape_explanation: A scalar is one value, with no array dimensions. The example shows that single
        value.
      note: Estimated shared coefficient precision.
    - name: n_iter_
      kind: attribute
      task: null
      shape: scalar
      object_type: int
      example: '12'
      shape_explanation: A scalar is one value, with no array dimensions. The example shows that single
        value.
      note: Number of evidence iterations run.
    next_step: null
    snippet: '# scikit-learn 1.9.1

      from sklearn.datasets import load_diabetes

      from sklearn.linear_model import BayesianRidge

      from sklearn.model_selection import train_test_split


      X, y = load_diabetes(return_X_y=True)

      X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

      model = BayesianRidge().fit(X_train, y_train)

      y_pred, y_std = model.predict(X_test[:3], return_std=True)

      print("y_pred:", y_pred.round(1))

      print("y_std:", y_std.round(1))

      print("shapes:", y_pred.shape, y_std.shape)

      '
    snippet_library: scikit-learn
    visual: regression_preds
    guidance:
    - task: regression
      text: Use return_std=True when you need predictive spread; it returns a standard deviation alongside
        the mean.
    output: 'y_pred: [238.4 247.8 164.6]

      y_std: [54.2 54.  53.8]

      shapes: (3,) (3,)

      '
  catch_outs:
  - Missing values raise an error. Impute first.
  - Text columns fail. Encode them first.
  - The default predict returns only the mean.
  key_settings:
    tier1:
    - name: fit_intercept
      page: null
      controls: Whether to estimate a constant offset.
      effect: Turning it off forces the line through zero.
    - name: max_iter
      page: null
      controls: Maximum evidence-update iterations.
      effect: More iterations allow convergence but take longer.
    tier2:
    - name: alpha_init
      page: null
      controls: Initial noise precision.
      effect: Changes the starting noise assumption; convergence may take more updates.
    - name: lambda_init
      page: null
      controls: Initial shared coefficient precision.
      effect: Changes starting shrinkage and may affect convergence.
    tier3:
    - name: tol
      page: null
      controls: Convergence tolerance.
      effect: A tighter tolerance can refine estimates but may require more iterations.
    - name: alpha_1
      page: null
      controls: Shape hyperparameter of the Gamma prior on noise precision.
      effect: Changing it changes the prior regularisation on estimated noise precision.
    - name: lambda_1
      page: null
      controls: Shape hyperparameter of the Gamma prior on weight precision.
      effect: Changing it changes prior regularisation on shared coefficient shrinkage.
    - name: compute_score
      page: null
      controls: Whether to store the marginal log-likelihood at each iteration.
      effect: Enabling it adds diagnostic history and computation.
  watch_it_work:
    none: true
  intuition:
    idea: Ridge where the penalty strength is learned from the data.
    analogy: A ruler that sets its own stiffness after seeing the wood.
    animation: none
    good_at:
    - spread per prediction
    - linear effects
    - self-tuning
    bad_at:
    - curved effects
    - classification targets
    vs_siblings:
    - page: ard-regression
      note: ARD gives each weight its own precision, so it can prune.
    read_more:
    - Put a prior on the weights.
    - Estimate noise and weight precision from the data.
    - Repeat until tol or max_iter stops it.
    goal: Gaussian priors share one weight precision; uncertainty comes from the posterior and noise.
    steps:
    - Put a Gaussian prior on the coefficients and an independent Gaussian noise model on targets
    - Update their precision estimates from the data by evidence maximisation
    - Repeat coefficient and precision updates until the tolerance or iteration limit.
    math:
      notation:
      - symbol: i
        meaning: Observation index.
      - symbol: x_i
        meaning: Feature vector for observation i.
      - symbol: y_i
        meaning: Observed target for observation i.
      - symbol: ε_i
        meaning: Observation-level error.
      - symbol: w
        meaning: Coefficient vector.
      - symbol: b
        meaning: Intercept.
      - symbol: α
        meaning: Estimated precision of observation noise.
      - symbol: λ
        meaning: Shared precision of the coefficient prior.
      - symbol: I
        meaning: Identity matrix.
      equations:
      - expression: y | w, α ~ N(xᵀw+b, α⁻¹), w | λ ~ N(0, λ⁻¹I)
        meaning: The shared prior shrinks coefficients; evidence updates noise and weight precision.
      prediction: y_pred = x @ coef_ + intercept_; return_std=True also returns one predictive standard
        deviation per row.
  next:
  - model-overfitting
