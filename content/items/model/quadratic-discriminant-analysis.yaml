  code:
    - library: scikit-learn
      target: sklearn.discriminant_analysis.QuadraticDiscriminantAnalysis
      why_this_library: The scikit-learn estimator for this method.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.discriminant_analysis import QuadraticDiscriminantAnalysis
        from sklearn.model_selection import train_test_split
        from sklearn.pipeline import make_pipeline
        from sklearn.preprocessing import StandardScaler

        X, y = load_breast_cancer(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(
            X, y, random_state=0
        )

        model = make_pipeline(
            StandardScaler(),
            QuadraticDiscriminantAnalysis(reg_param=0.3),
        )
        model.fit(X_train, y_train)
        print(round(model.score(X_test, y_test), 3))
  what_comes_out:
    items:
      - {name: predict, kind: method, task: classification, shape: "(n_samples,)",
         note: "Class with the highest probability."}
      - {name: predict_proba, kind: method, task: classification, shape: "(n_samples, n_classes)",
         note: "One column per class, in classes_ order."}
      - {name: predict_log_proba, kind: method, task: classification, shape: "(n_samples, n_classes)",
         note: "Log of predict_proba, same column order."}
      - {name: decision_function, kind: method, task: classification, shape: "(n_samples,) for two classes",
         note: "Score before the probability. Above 0 means class 1."}
      - {name: score, kind: method, task: classification, shape: "float",
         note: "Accuracy on the data given."}
      - {name: means_, kind: attribute, task: null, shape: "(n_classes, n_features)",
         note: "Mean of each class, one row per class."}
      - {name: n_features_in_, kind: attribute, task: null, shape: "int",
         note: "Columns seen during fit."}
      - {name: feature_names_in_, kind: attribute, task: null, shape: "(n_features,)",
         note: "Column names. Set only when fit on a DataFrame."}
    next_step: "ROC AUC needs predict_proba[:, 1], not the labels."
    snippet: |
      # scikit-learn 1.9.1
      import pandas as pd
      from sklearn.datasets import load_breast_cancer
      from sklearn.discriminant_analysis import QuadraticDiscriminantAnalysis
      from sklearn.preprocessing import StandardScaler

      data = load_breast_cancer(as_frame=True)
      X = pd.DataFrame(
          StandardScaler().fit_transform(data.data),
          columns=data.feature_names,
      )
      model = QuadraticDiscriminantAnalysis(reg_param=0.3)
      model.fit(X, data.target)
      print(model.predict_proba(X[:3]).shape)
      print(model.decision_function(X[:3]).shape)
      print(model.n_features_in_)
      print(model.feature_names_in_[:3])
    snippet_library: scikit-learn
    visual: null
  catch_outs:
    - "Collinear columns can make a class covariance singular and raise LinAlgError."
    - "The default reg_param of 0 failed on the breast cancer data."
    - "Each class has its own spread, so it needs more rows than LDA."
