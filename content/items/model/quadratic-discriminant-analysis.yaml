    guidance:
    - task: classification
      text: Use class labels for accuracy and probabilities/scores for ranking; check the shared-versus-class-specific covariance assumption.
  catch_outs:
  - Collinear columns can make a class covariance singular and raise LinAlgError.
  - The default reg_param of 0 failed on the breast cancer data.
  - Each class has its own spread, so it needs more rows than LDA.
  key_settings:
    tier1:
    - name: reg_param
      page: null
      controls: Moves class covariances toward identity.
      effect: More regularization helps with limited or collinear class samples but reduces class-specific detail.
    - name: priors
      page: null
      controls: Sets class prior probabilities.
      effect: Shifts class posterior scores and predicted regions.
    - name: store_covariance
      page: null
      controls: Stores one estimated covariance matrix per class.
      effect: Allows inspection at extra memory cost.
    tier2:
    - name: solver
      page: null
      controls: Chooses the numerical decomposition approach.
      effect: Solver choices alter numerical behavior and which covariance controls are supported.
    - name: shrinkage
      page: null
      controls: Requests covariance shrinkage where supported.
      effect: Can stabilize estimates but makes class spreads more alike.
    - name: covariance_estimator
      page: null
      controls: Supplies a custom covariance estimation method.
      effect: Changes each class spread and must support the expected estimator interface.
    - name: tol
      page: null
      controls: Sets the rank-deficiency cutoff.
      effect: Higher tolerance flags weak covariance directions sooner.
    tier3: []
  watch_it_work:
    none: true
  intuition:
    idea: Give each class its own spread, so the boundary can curve.
    analogy: A separate fence around each group, not one shared fence.
    animation: none
    good_at:
    - different spreads
    - curved boundaries
    - many rows
    bad_at:
    - few rows per class
    - collinear columns
    - a simple line
    vs_siblings:
    - page: linear-discriminant-analysis
      note: Same family. One shared spread and a straight boundary.
    goal: Estimate a separate covariance for each class and choose the largest quadratic discriminant score.
    steps:
    - Estimate a mean and covariance separately from each class.
    - Regularize each class covariance when reg_param is nonzero.
    - Score each class using its covariance-aware distance, determinant, and prior.
    - Choose the class with highest score; different covariances create quadratic boundaries.
    math:
      notation:
      - symbol: x
        meaning: Input feature vector.
      - symbol: mu_k
        meaning: Mean vector for class k.
      - symbol: Sigma_k
        meaning: Covariance estimated from class k only.
      - symbol: pi_k
        meaning: Prior probability for class k.
      - symbol: delta_k(x)
        meaning: Quadratic class score.
      equations:
      - expression: delta_k(x)=-1/2 log|Sigma_k|-1/2(x-mu_k)^T Sigma_k^{-1}(x-mu_k)+log(pi_k)
        meaning: Each class has its own covariance, so class-score differences can be quadratic.
      - expression: predict(x)=argmax_k delta_k(x)
        meaning: Choose the class with the largest quadratic score.
      prediction: predict returns one label per row; predict_proba gives posterior columns. Binary decision_function is a signed score.
    read_more:
    - Estimate each class mean and spread.
    - Score each class with its own shape.
    - Pick the class with the highest score.
  next: []
