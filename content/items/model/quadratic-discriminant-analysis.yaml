  code:
  - library: scikit-learn
    target: sklearn.discriminant_analysis.QuadraticDiscriminantAnalysis
    why_this_library: The scikit-learn estimator for this method.
    snippet: |
      # scikit-learn 1.9.1
      import numpy as np
      from sklearn.datasets import load_breast_cancer
      from sklearn.discriminant_analysis import QuadraticDiscriminantAnalysis
      from sklearn.model_selection import train_test_split
      X,y=load_breast_cancer(return_X_y=True)
      X=X[:,:3]
      Xt,Xv,yt,yv=train_test_split(X,y,test_size=.25,stratify=y,random_state=0)
      m=QuadraticDiscriminantAnalysis(reg_param=.1,store_covariance=True).fit(Xt,yt)
      y_pred=m.predict(Xv[:3])
      y_proba=m.predict_proba(Xv[:3])
      y_score=m.decision_function(Xv[:3])
      print('y_pred:',y_pred)
      print('y_proba:')
      print(np.round(y_proba,3))
      print('y_score:',np.round(y_score,3))
      print('classes_:',m.classes_,'priors_:',np.round(m.priors_,3))
      print('means:',m.means_.shape,'covariances:',
            len(m.covariance_),m.covariance_[0].shape)
      print('accuracy:',round(m.score(Xv,yv),3))
    output: |
      y_pred: [1 0 0]
      y_proba:
      [[0.067 0.933]
       [1.    0.   ]
       [0.998 0.002]]
      y_score: [  2.629 -10.236  -6.062]
      classes_: [0 1] priors_: [0.373 0.627]
      means: (2, 3) covariances: 2 (3, 3)
      accuracy: 0.881
  what_comes_out:
    items:
    - name: predict
      kind: method
      task: classification
      shape: (n_samples,)
      object_type: numpy.ndarray
      example: '[0, 1, 0]'
      shape_explanation: One label per input row; three labels give shape (3,).
      note: Chooses the class with the largest quadratic discriminant score.
    - name: predict_proba
      kind: method
      task: classification
      shape: (n_samples, n_classes)
      object_type: numpy.ndarray
      example: '[[0.9, 0.1], [0.2, 0.8]]'
      shape_explanation: Rows are cases and columns are classes; two by two gives shape (2, 2).
      note: Columns follow classes_ order.
    - name: decision_function
      kind: method
      task: classification
      shape: (n_samples,) or (n_samples,n_classes)
      object_type: numpy.ndarray
      example: '[-2.1, 1.7, -0.8]'
      shape_explanation: 'This fictional example is binary: one score per row gives shape (3,). With multiple classes, scores form an (n_samples, n_classes) matrix.'
      note: Binary positive scores favor classes_[1]; multiclass has one score per class.
    - name: classes_
      kind: attribute
      task: classification
      shape: (n_classes,)
      object_type: numpy.ndarray
      example: '[0, 1]'
      shape_explanation: One label per class; shape (2,) here.
      note: Probability-column order.
    - name: means_
      kind: attribute
      task: null
      shape: (n_classes, n_features)
      object_type: numpy.ndarray
      example: '[[1.2, 0.4], [2.1, 0.9]]'
      shape_explanation: One row per class, one column per feature; this example is (2, 2).
      note: Class-specific means.
    - name: covariance_
      kind: attribute
      task: null
      shape: list of n_classes square matrices
      object_type: list[numpy.ndarray]
      example: '[[[1.0, 0.2], [0.2, 0.8]], [[0.7, 0.1], [0.1, 1.2]]]'
      shape_explanation: One square covariance per class; two classes and two features mean two (2, 2) matrices.
      note: Present only with store_covariance=True; one class-specific covariance per class.
    - name: priors_
      kind: attribute
      task: null
      shape: (n_classes,)
      object_type: numpy.ndarray
      example: '[0.7, 0.3]'
      shape_explanation: One prior per class; shape (2,) for two classes.
      note: Defaults to training class frequencies.
    - name: score
      kind: method
      task: classification
      shape: scalar
      object_type: float
      example: '0.88'
      shape_explanation: One number, no array dimensions.
      note: Classification score is accuracy.
    next_step: ROC AUC needs predict_proba[:, 1], not the labels.
    snippet: |
