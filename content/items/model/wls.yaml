targets:
- statsmodels.regression.linear_model.WLS
pairs_with:
- breusch-pagan
clashes: []
source_urls:
- https://www.statsmodels.org/stable/generated/statsmodels.regression.linear_model.WLS.html
library_versions:
  statsmodels: 0.15.0
reviewed: false
rules:
  task_types:
  - regression
  blocked_when: []
  fits_on_data: true
  shape_effect:
    rows: same
    columns: same
slots:
  header: {}
  solves:
    hero:
      kind: model
      dataset: ames
      shape: fit_line
    line: A straight line where some rows count for more.
  quick_facts:
    none: true
  use_avoid:
    use_when:
    - rows with known noise levels
    - weights you can justify
    avoid_when:
    - weights unknown
    - curved patterns
    - rows in groups
  prep:
  - step:
      family: clean.impute
    status: required
    why: Statsmodels rejects NaN in the inputs.
    condition:
      has_missing: true
    unless: null
  - step:
      family: transform.encode.features
    status: required
    why: Text categories must become numbers.
    condition:
      has_categoricals: true
    unless: null
  - step:
      family: transform.scale.rescale
    status: not_needed
    why: Scaling changes the coefficients, not the predictions.
    condition: null
    unless: null
  - step:
      page: train-test-split
    status: recommended
    why: A held-out set checks the fit on new rows.
    condition: null
    unless: null
  code:
  - library: statsmodels
    target: statsmodels.regression.linear_model.WLS
    why_this_library: Takes a weights array directly.
    snippet: '# statsmodels 0.15.0

      import numpy as np

      import statsmodels.api as sm

      from sklearn.datasets import make_regression


      X, y = make_regression(n_samples=200, n_features=3, noise=10, random_state=0)

      weights = np.linspace(0.5, 2.0, num=len(y))

      results = sm.WLS(y, sm.add_constant(X), weights=weights).fit()

      y_pred = results.predict(sm.add_constant(X[:3]))

      print(''y_pred:'', y_pred.round(1))

      print(''params:'', results.params.round(2))

      print(''pvalues:'', results.pvalues.round(3))'
    output: 'y_pred: [ 21.3 -94.  203.8]

      params: [-0.28 25.2  60.29 57.2 ]

      pvalues: [0.685 0.    0.    0.   ]

      '
  what_comes_out:
    items:
    - name: predict
      kind: method
      task: regression
      shape: (n_samples,)
      object_type: numpy.ndarray
      example: '[21.3, -94.0, 203.8]'
      shape_explanation: 'A one-dimensional array: n_samples is the number of design rows predicted. This example
        has three predictions, shape (3,); the trailing comma marks one dimension.'
      note: Fitted Results.predict gives one value per design row.
    - name: params
      kind: return
      task: null
      shape: (n_parameters,)
      object_type: numpy.ndarray
      example: '[-0.28, 25.2, 60.29, 57.2]'
      shape_explanation: 'A one-dimensional array: n_parameters counts fitted coefficients, including the constant
        column. This example has four entries, shape (4,); the trailing comma marks one dimension.'
      note: Statsmodels Results.params; coefficients follow design-column order.
    - name: pvalues
      kind: return
      task: null
      shape: (n_parameters,)
      object_type: numpy.ndarray
      example: '[0.685, 0.0, 0.0, 0.0]'
      shape_explanation: 'A one-dimensional array: n_parameters counts coefficient tests. This example has four
        p-values, shape (4,); the trailing comma marks one dimension.'
      note: Statsmodels Results.pvalues tests each coefficient under the fitted model.
    visual: regression_preds
    guidance:
    - task: regression
      text: Check residuals and the supplied weights or covariance structure before interpreting uncertainty.
    snippet: '# statsmodels 0.15.0

      import numpy as np

      import statsmodels.api as sm

      from sklearn.datasets import make_regression


      X, y = make_regression(n_samples=200, n_features=3, noise=10, random_state=0)

      weights = np.linspace(0.5, 2.0, num=len(y))

      results = sm.WLS(y, sm.add_constant(X), weights=weights).fit()

      y_pred = results.predict(sm.add_constant(X[:3]))

      print(''y_pred:'', y_pred.round(1))

      print(''params:'', results.params.round(2))

      print(''pvalues:'', results.pvalues.round(3))'
    snippet_library: statsmodels
    output: 'y_pred: [ 21.3 -94.  203.8]

      params: [-0.28 25.2  60.29 57.2 ]

      pvalues: [0.685 0.    0.    0.   ]

      '
    next_step: Use held-out rows to check predictions and residuals.
  catch_outs:
  - Missing values stop the fit. Impute them first.
  - Weights are never learned. A wrong guess gives a wrong fit.
  key_settings:
    tier1:
    - name: weights
      page: null
      controls: Relative observation weights; statsmodels weights observations inversely to error variance.
      effect: Large weights pull the fit more; unjustified weights bias the fit.
    tier2:
    - name: missing
      page: null
      controls: Whether to ignore, drop, or raise on missing values.
      effect: Dropping rows changes the sample; raising stops the fit.
    tier3:
    - name: hasconst
      page: null
      controls: Whether the design matrix already contains a constant.
      effect: A wrong declaration changes model degrees of freedom and statistics.
  watch_it_work:
    none: true
  intuition:
    idea: Least squares, where each row's error counts by its weight.
    analogy: A poll where some answers count for more.
    animation: none
    good_at:
    - rows with known noise levels
    - explaining each effect
    - a fast baseline
    bad_at:
    - unknown weights
    - curved patterns
    - rows in groups
    vs_siblings:
    - page: linear-regression
      note: Same line, but every row counts equally.
    - page: gls
      note: Also handles linked errors, not only unequal weights.
    goal: Fit a straight line that gives more influence to rows assigned larger justified weights.
    steps: &id001
    - Each row gets a weight.
    - Rows with big weights pull the line harder.
    - Rows with small weights are allowed to miss.
    math:
      notation:
      - symbol: i
        meaning: row index
      - symbol: w_i
        meaning: supplied positive weight for row i
      - symbol: y_i
        meaning: observed target for row i
      - symbol: y-hat_i
        meaning: fitted prediction for row i
      equations:
      - expression: minimise sum_i w_i (y_i - y-hat_i)^2
        meaning: Weighted least squares makes high-weight residuals count more.
      prediction: For new rows, multiply the supplied design matrix by the fitted coefficient vector.
    read_more: *id001
  next: []
