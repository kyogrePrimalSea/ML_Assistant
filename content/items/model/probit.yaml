    snippet_library: statsmodels
    visual: proba_table
    guidance:
    - task: classification
      text: Use predict_proba or continuous decision scores for ROC AUC and PR curves. Use predicted labels for
        accuracy or a confusion matrix.
    output: 'y_pred labels: [0 0 0]

      y_proba class 1: [0. 0. 0.]

      params: [ 6.1240e+00  3.5330e+00 -1.9800e-01 -3.3300e-01 -2.4000e-02 -6.3912e+01]

