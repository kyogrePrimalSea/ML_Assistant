  catch_outs:
  - Missing values raise an error unless missing is drop.
  - Many correlated columns can make the matrix singular.
  - Check mle_retvals converged before reading p-values.
  key_settings:
    tier1:
    - name: missing
      page: null
      controls: 'Statsmodels handling of missing observations: none, drop, or raise.'
      effect: Dropping rows changes the estimation sample; raising stops when missing values are found.
    tier2:
    - name: offset
      page: null
      controls: A known value added to the latent linear predictor with coefficient fixed at one.
      effect: A misspecified offset shifts every predicted probability.
    - name: check_rank
      page: null
      controls: Whether statsmodels checks the design matrix rank when determining model degrees of freedom.
      effect: Skipping the check can save setup time for wide designs but may hide rank problems.
    tier3: []
  watch_it_work:
    none: true
  intuition:
    idea: Like logit, but the S-curve is the normal curve.
    analogy: Same yes-no scale as logit, with a bell-shaped weight.
    animation: none
    good_at:
    - probabilities
    - p-values
    - binary outcomes
    bad_at:
    - three or more classes
    - curved boundaries
    vs_siblings:
    - page: logistic-regression
      note: Logistic curve instead of normal curve.
    read_more: &id001
    - Build a weighted sum of the input features.
    - Map the sum through the standard-normal CDF to get class-1 probability.
    - Choose coefficients by maximizing the binary likelihood.
    - Use the fitted Results object for probabilities and inference.
    goal: Estimate a binary outcome model whose probability follows the standard-normal CDF of a linear predictor.
    math:
      notation:
      - symbol: x_i
        meaning: Feature vector for case i.
      - symbol: y_i
        meaning: Binary target, coded 0 or 1.
      - symbol: z_i
        meaning: Linear predictor b_0 + x_i^T b, plus any offset.
      - symbol: Phi
        meaning: Cumulative distribution function of a standard normal variable.
      - symbol: p_i
        meaning: Probability that case i belongs to class 1.
      - symbol: b
        meaning: Coefficient vector for the input features.
      - symbol: b_0
        meaning: Intercept in the linear predictor.
      equations:
      - expression: p_i = Phi(z_i)
        meaning: The normal CDF maps the latent predictor to a class-1 probability.
      - expression: maximize sum_i [y_i log(p_i) + (1-y_i) log(1-p_i)]
        meaning: Probit maximum likelihood chooses coefficients that assign high probability to observed labels.
      prediction: predict gives class-1 probabilities; threshold to get labels. Results provide coefficients and
        p-values.
    steps: *id001
  next: []
