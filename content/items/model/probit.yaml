  code:
  - library: statsmodels
    target: statsmodels.discrete.discrete_model.Probit
    why_this_library: Uses a standard-normal CDF link and returns likelihood-based inference.
    snippet: '# statsmodels 0.15.0

      import numpy as np

      import statsmodels.api as sm

      from sklearn.datasets import load_breast_cancer


      X, y = load_breast_cancer(return_X_y=True)

      X = sm.add_constant(X[:, :5])

      result = sm.Probit(y, X).fit(disp=False)

      y_proba = result.predict(X[:3])

      y_pred = (y_proba >= 0.5).astype(int)

      print(''y_pred labels:'', y_pred)

      print(''y_proba class 1:'', np.round(y_proba, 3))

      print(''params:'', np.round(result.params, 3))

      print(''pvalues:'', np.round(result.pvalues, 3))'
    output: 'y_pred labels: [0 0 0]

      y_proba class 1: [0. 0. 0.]

      params: [ 6.1240e+00  3.5330e+00 -1.9800e-01 -3.3300e-01 -2.4000e-02 -6.3912e+01]

      pvalues: [0.169 0.    0.    0.001 0.001 0.   ]

      '
  what_comes_out:
    items:
    - name: predict
      kind: method
      task: classification
      shape: (n_samples,)
      object_type: numpy.ndarray
      example: '[0.82, 0.27, 0.61]'
      shape_explanation: Statsmodels Probit returns the probability of class 1 for each row. This fictional example
        has n_samples=3 values, so shape (3,); the trailing comma marks one dimension.
      note: These are probabilities, not class labels; threshold only when labels are needed.
    - name: params
      kind: return
      task: null
      shape: (n_parameters,)
      object_type: numpy.ndarray
      example: '[0.2, 0.4, -1.2]'
      shape_explanation: 'A one-dimensional fitted coefficient array: n_parameters includes the constant in exog
        if added. This fictional example assumes n_parameters=3 and has shape (3,).'
      note: Statsmodels Results.params; coefficients use the probit latent-index scale.
    - name: pvalues
      kind: return
      task: null
      shape: (n_parameters,)
      object_type: numpy.ndarray
      example: '[0.4, 0.02, 0.001]'
      shape_explanation: A one-dimensional array of coefficient tests. This fictional example assumes n_parameters=3
        and has shape (3,).
      note: Statsmodels Results.pvalues; inference depends on model assumptions.
    - name: bse
      kind: return
      task: null
      shape: (n_parameters,)
      object_type: numpy.ndarray
      example: '[0.3, 0.2, 0.4]'
      shape_explanation: A one-dimensional array of coefficient standard errors. This fictional example assumes
        n_parameters=3 and has shape (3,).
      note: Statsmodels Results.bse aligns with params and pvalues.
    - name: llf
      kind: return
      task: null
      shape: scalar
      object_type: float
      example: '-42.7'
      shape_explanation: A scalar is one value with no array dimensions. This fictional example is one fitted log-likelihood.
      note: Log-likelihood at the fitted Probit coefficients.
    next_step: null
    snippet: '# statsmodels 0.15.0

      import numpy as np

