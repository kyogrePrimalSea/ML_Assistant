  code:
    - library: statsmodels
      target: statsmodels.tsa.regime_switching.markov_regression.MarkovRegression
      why_this_library: The statsmodels class for this model.
      snippet: |
        # statsmodels 0.15.0
        from sklearn.datasets import make_regression
        from statsmodels.tsa.regime_switching.markov_regression import (
            MarkovRegression,
        )

        _, y = make_regression(n_samples=300, n_features=1, noise=1.0, random_state=0)
        y = (y - y.mean()) / y.std()
        y[150:] += 3  # the level jumps halfway through

        model = MarkovRegression(y, k_regimes=2, switching_variance=True)
        res = model.fit(disp=False)
        print(res.params.round(2))
  what_comes_out:
