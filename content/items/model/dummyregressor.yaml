    why_this_library: The standard baseline in scikit-learn.
    snippet: "# scikit-learn 1.9.1\nimport numpy as np, pandas as pd\nfrom sklearn.dummy import DummyRegressor\nX=pd.DataFrame(\n    np.arange(20).reshape(10,2), columns=['age','fare']\n)\ny=np.arange(10,dtype=float)*10+10\nm=DummyRegressor(strategy='quantile',quantile=.75).fit(X,y)\ny_pred=m.predict(X[:3])\nprint('y_pred:',y_pred)\nprint('constant_:',m.constant_)\nprint('R2:',round(m.score(X,y),3))\nprint('n_features_in_:',m.n_features_in_)\nprint('feature_names_in_:',m.feature_names_in_)\n"
    output: 'y_pred: [77.5 77.5 77.5]

      constant_: [[77.5]]

      R2: -0.614

      n_features_in_: 2

      feature_names_in_: [''age'' ''fare'']

      '
  what_comes_out:
    items:
    - name: predict
      kind: method
      task: regression
      shape: (n_samples,)
      object_type: numpy.ndarray
      example: '[77.5, 77.5, 77.5]'
      shape_explanation: One repeated numeric value per row; three predictions give shape (3,).
      note: Repeats the fitted statistic, independent of features.
    - name: score
      kind: method
      task: regression
      shape: scalar
      object_type: float
      example: '0.0'
      shape_explanation: One scalar with no array dimensions; may be negative.
      note: R² against the evaluation target mean.
    - name: constant_
      kind: attribute
      task: null
      shape: (1, n_outputs)
      object_type: numpy.ndarray
      example: '[[77.5]]'
      shape_explanation: One row of fitted constants and one column per output; one output gives (1, 1).
      note: Stores the chosen training-target statistic.
    - name: n_features_in_
      kind: attribute
      task: null
      shape: scalar
      object_type: int
      example: '2'
      shape_explanation: One integer number of input columns.
      note: Metadata only; features are ignored.
    - name: feature_names_in_
      kind: attribute
      task: null
      shape: (n_features_in_,)
      object_type: numpy.ndarray of str
      example: '[''age'', ''fare'']'
      shape_explanation: One name per feature; present only for all-string names at fit.
      note: Recorded, not used for prediction.
    - name: n_outputs_
      kind: attribute
      task: null
      shape: scalar
      object_type: int
      example: '1'
      shape_explanation: One integer target-output count.
      note: This example has one output.
    next_step: A real model should beat this score on new data.
