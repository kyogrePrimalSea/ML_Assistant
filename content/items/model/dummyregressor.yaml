    snippet_library: scikit-learn
    guidance:
    - task: regression
      text: Compare held-out R² and error metrics with a feature-independent baseline.
  catch_outs:
  - Predicts the same value whatever the features say.
  - A negative score means worse than predicting the mean.
  key_settings:
    tier1:
    - name: strategy
      page: null
      controls: Chooses mean, median, quantile, or constant.
      effect: Mean minimizes squared error; median minimizes absolute error. Quantile and constant use chosen values.
    - name: quantile
      page: null
      controls: Selects quantile from 0 to 1 when strategy=quantile.
      effect: Higher values move the prediction up the target distribution; 0.5 is the median.
    - name: constant
      page: null
      controls: Supplies value repeated by strategy=constant.
      effect: Predictions use that fixed value without consulting features.
    tier2: []
    tier3: []
  watch_it_work:
    none: true
  intuition:
    idea: Ignore the features and predict one fixed number.
    analogy: Guessing the average height of a class without looking at anyone.
    animation: none
    good_at:
    - a sanity check
    - a score to beat
    bad_at:
    - any real prediction
    - using feature information
    vs_siblings: []
    goal: Fit one target statistic and repeat it as a feature-independent numeric baseline.
    steps:
    - Read training targets and ignore feature values.
    - Compute mean, median, selected quantile, or supplied constant.
    - Store the value and repeat it for each new row.
    - Compare held-out R² or error metrics with a model that uses features.
    math:
      notation:
      - symbol: y_i
        meaning: Training target.
      - symbol: q
        meaning: Requested quantile in [0,1].
      - symbol: c
        meaning: Fitted constant.
      - symbol: yhat(x)
        meaning: Prediction for row x.
      equations:
      - expression: c=quantile_q(y_1,...,y_n); yhat(x)=c
        meaning: Quantile strategy computes one training-target quantile and repeats it.
      - expression: R^2=1-sum_i(y_i-yhat_i)^2/sum_i(y_i-mean(y))^2
        meaning: R² is relative to predicting the evaluation target mean and can be negative.
      prediction: 'predict repeats one numeric statistic per row: mean, median, quantile, or supplied constant.'
    read_more:
    - 'Pick a rule: mean, median, constant or quantile.'
    - Fit stores the value; predict repeats it.
    - Compare your real model's score to this one.
  next: []
