    condition: null
    unless: null
  - step:
      family: split.time
    status: recommended
    why: Test on the latest rows, never shuffled.
    condition: null
    unless: null
  code:
  - library: statsmodels
    target: statsmodels.tsa.vector_ar.var_model.VAR
    why_this_library: The statsmodels class for this model.
    snippet: "# statsmodels 0.15.0\nimport numpy as np\nfrom statsmodels.tsa.vector_ar.var_model import VAR\n\n\
      rng = np.random.default_rng(7)\nnobs = 80\ntime = np.arange(nobs)\nexog = np.sin(time / 6)[:, None]\nshocks\
      \ = rng.normal(scale=0.25, size=(nobs, 2))\nendog = np.zeros((nobs, 2))\nar = np.array([[0.45, 0.10], [0.12,\
      \ 0.35]])\nbeta = np.array([0.30, -0.20])\nfor t in range(1, nobs):\n    endog[t] = ar @ endog[t - 1] + beta\
      \ * exog[t, 0] + shocks[t]\nfuture_exog = np.sin(np.arange(nobs, nobs + 3) / 6)[:, None]\nresult = VAR(endog,\
      \ exog=exog).fit(maxlags=2, trend=\"c\")\ny_pred = result.forecast(\n    result.endog[-result.k_ar:], steps=3,\
      \ exog_future=future_exog\n)\nprint(\"lag order:\", result.k_ar)\nprint(\"forecast shape:\", y_pred.shape)\n\
      print(\"forecast:\", np.round(y_pred, 2))\n"
    output: "lag order: 2\nforecast shape: (3, 2)\nforecast: [[ 0.31 -0.17]\n [ 0.22 -0.19]\n [ 0.23 -0.28]]\n"
  what_comes_out:
    items:
    - name: forecast
      kind: return
      task: regression
      shape: (steps, k_series)
      object_type: numpy.ndarray
      example: '[[0.12, -0.08], [0.18, -0.04], [0.20, -0.03]]'
      shape_explanation: Rows are 3 future steps and columns are 2 series, shape (3, 2). Each row forecasts all
        series at that horizon.
      note: Forecast begins after the last observed row and requires future exog when the model used exog.
    - name: forecast_interval
      kind: return
      task: regression
      shape: 3 x (steps, k_series)
      object_type: tuple[numpy.ndarray,...]
      example: ([[0.1, -0.1], [0.2, 0.0]], [[-0.3, -0.4], [-0.2, -0.3]], [[0.5, 0.3], [0.6, 0.3]])
      shape_explanation: The tuple contains point, lower, and upper matrices. Each concrete matrix has 2 future-step
        rows and 2 series columns, shape (2, 2).
      note: Bands are per-series forecast intervals, not a covariance matrix.
    - name: fittedvalues
      kind: return
      task: regression
      shape: (n_obs - p, k_series)
      object_type: numpy.ndarray
      example: '[[0.1, -0.1], [0.2, 0.0]]'
      shape_explanation: With fictional n_obs=4, p=2 leaves n_obs-p=2 fitted rows; 2 series columns give shape (2,
        2).
      note: Each equation uses lagged values from all series plus optional exog.
    - name: sigma_u
      kind: return
      task: null
      shape: (k_series, k_series)
      object_type: numpy.ndarray
      example: '[[0.24, 0.03], [0.03, 0.19]]'
      shape_explanation: Rows and columns index the 2 series; this square matrix holds contemporaneous innovation
        covariance.
      note: Off-diagonal entries capture correlated equation errors.
    - name: coefs
      kind: return
      task: null
      shape: (p, k_series, k_series)
      object_type: numpy.ndarray
      example: '[[[0.4, 0.1], [0.2, 0.3]], [[0.1, 0.0], [-0.1, 0.2]]]'
      shape_explanation: This example has 2 lag matrices (p=2); each maps 2 lagged series to 2 current series, so
        shape (2, 2, 2).
      note: Lag matrix l multiplies the vector y at lag l+1.
    next_step: null
    visual: regression_preds
    snippet: "# statsmodels 0.15.0\nimport numpy as np\nfrom statsmodels.tsa.vector_ar.var_model import VAR\n\n\
      rng = np.random.default_rng(7)\nnobs = 80\ntime = np.arange(nobs)\nexog = np.sin(time / 6)[:, None]\nshocks\
      \ = rng.normal(scale=0.25, size=(nobs, 2))\nendog = np.zeros((nobs, 2))\nar = np.array([[0.45, 0.10], [0.12,\
      \ 0.35]])\nbeta = np.array([0.30, -0.20])\nfor t in range(1, nobs):\n    endog[t] = ar @ endog[t - 1] + beta\
      \ * exog[t, 0] + shocks[t]\nfuture_exog = np.sin(np.arange(nobs, nobs + 3) / 6)[:, None]\nresult = VAR(endog,\
      \ exog=exog).fit(maxlags=2, trend=\"c\")\ninitial = result.endog[-result.k_ar:]\nforecast = result.forecast(initial,\
      \ steps=3, exog_future=future_exog)\npoint, lower, upper = result.forecast_interval(\n    initial, steps=3,\
      \ exog_future=future_exog\n)\nprint(\"series names:\", result.names)\nprint(\"fittedvalues shape:\", result.fittedvalues.shape)\n\
      print(\"forecast:\", np.round(forecast, 2))\nprint(\"interval shapes:\", point.shape, lower.shape, upper.shape)\n\
      print(\"innovation covariance:\")\nprint(np.round(result.sigma_u, 3))\nprint(\"AR coefficient shape:\", result.coefs.shape)\n"
    snippet_library: statsmodels
    guidance:
    - task: regression
      text: Forecast rows follow time order. Keep multivariate series columns together and provide future exog where
        the model uses it.
    output: "series names: ['y1', 'y2']\nfittedvalues shape: (78, 2)\nforecast: [[ 0.31 -0.17]\n [ 0.22 -0.19]\n\
      \ [ 0.23 -0.28]]\ninterval shapes: (3, 2) (3, 2) (3, 2)\ninnovation covariance:\n[[0.049 0.003]\n [0.003 0.049]]\n\
      AR coefficient shape: (2, 2, 2)\n"
  catch_outs:
  - endog must be 2-D, with one column per series.
  - Choose the lag order with select_order, not by eye.
  - Each extra lag adds parameters for every series.
  key_settings:
    tier1:
    - name: freq
      page: null
      controls: Frequency metadata associated with the supplied date index.
      effect: Correct frequency makes date-based indexing meaningful; it does not change fitted lag coefficients.
    - name: missing
      page: null
      controls: How the model checks or handles missing observations.
      effect: Dropping rows changes time spacing; raising catches gaps, while none skips checks.
    tier2:
    - name: exog
      page: null
      controls: Time-aligned external regressors added to every series equation.
      effect: Relevant external drivers can improve forecasts; future values must be known or forecast.
    tier3:
    - name: dates
      page: null
      controls: Datetime labels aligned one-for-one with rows of the series matrix.
      effect: Meaningful dates enable date-based forecasts; misaligned dates mislabel times.
  watch_it_work:
    none: true
  intuition:
    idea: Each series is predicted from past values of all series.
    analogy: Like several friends whose moods depend on each other's past mood.
    animation: none
    good_at:
    - several linked series
    - short memory
    - a simple fit
    bad_at:
    - one series alone
    - shifting patterns
    - moving-average effects
    vs_siblings:
    - page: varmax
      note: Adds moving-average terms and outside drivers.
    - page: sarimax
      note: Forecasts one series, not several.
    read_more:
    - Rows are times and columns are the jointly modeled series.
    - An AR lag matrix maps all lagged series into all current series.
    - Exogenous inputs are known external drivers; future values are required for multi-step forecasts.
    goal: Predict several related series jointly from their own lagged values and optional external regressors.
    steps:
    - Arrange observations as time rows and series as columns.
    - Choose p lag matrices; each series equation uses lagged values of every series.
    - Estimate the coefficient matrices by ordinary least squares.
    - Use the last p observed rows and any future exog values to forecast every series recursively.
    - Estimate covariance among equation innovations and compute forecast intervals.
    math:
      notation:
      - symbol: y_t
        meaning: Column vector of k series observed at time t.
      - symbol: A_l
        meaning: k-by-k coefficient matrix for lag l.
      - symbol: p
        meaning: Number of autoregressive lags.
      - symbol: u_t
        meaning: Vector of contemporaneous equation innovations.
      - symbol: B x_t
        meaning: Optional effect of aligned exogenous variables.
      - symbol: Sigma_u
        meaning: Covariance matrix of the innovation vector.
      equations:
      - expression: y_t = A_1 y_(t-1) + ... + A_p y_(t-p) + B x_t + u_t
        meaning: Each current series depends on lagged values of all series, external regressors, and a joint shock.
      - expression: yhat_(T+h) = sum_l A_l yhat_(T+h-l) + B x_(T+h)
        meaning: 'Forecasts are recursive: later steps use earlier forecasts and future exog values.'
      prediction: Forecast matrices have time rows and series columns; Sigma_u is same-time innovation covariance.
  next:
  - but-beat-simple
  - but-intervals
