slots:
  header: {}
  solves:
    hero: {kind: model, dataset: breast-cancer, shape: boundary}
    line: "Gives each class a probability from a smooth Gaussian process."
  quick_facts:
    data_size: "Small data"
  use_avoid:
    use_when: ["small data", "class probabilities", "smooth boundary"]
