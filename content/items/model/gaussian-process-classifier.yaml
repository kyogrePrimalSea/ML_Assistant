    snippet: "# scikit-learn 1.9.1\nfrom sklearn.datasets import make_classification\nfrom sklearn.gaussian_process\
      \ import GaussianProcessClassifier\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.pipeline\
      \ import make_pipeline\nfrom sklearn.preprocessing import StandardScaler\n\nX, y = make_classification(\n\
      \    n_samples=100, n_features=4, n_informative=3, n_redundant=0,\n    class_sep=1.2, random_state=0,\n)\n\
      X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)\nmodel = make_pipeline(StandardScaler(),\
      \ GaussianProcessClassifier(\n    max_iter_predict=60, random_state=0,\n)).fit(X_train, y_train)\ngp = model.named_steps[\"\
      gaussianprocessclassifier\"]\nproba = gp.predict_proba(X_test[:3])\nprint(\"classes_:\", gp.classes_)\nprint(\"\
      probability shape:\", proba.shape)\nprint(\"labels:\", gp.predict(X_test[:3]))\nprint(\"kernel_:\", gp.kernel_)\n\
      print(\"LML value:\", round(gp.log_marginal_likelihood_value_, 3))\nprint(\"n_classes_:\", gp.n_classes_)\n"
    snippet_library: scikit-learn
    output: 'classes_: [0 1]

      probability shape: (3, 2)

      labels: [1 0 1]

      kernel_: 1**2 * RBF(length_scale=1)

