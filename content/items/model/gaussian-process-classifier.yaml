      example: '-43.067'
      shape_explanation: One fitted likelihood value is a NumPy float64 scalar, not an array, so it has no array
        dimensions.
      note: Log marginal likelihood at the fitted kernel parameters.
    - name: n_classes_
      kind: attribute
