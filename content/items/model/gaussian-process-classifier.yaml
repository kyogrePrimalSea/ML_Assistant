    target: sklearn.gaussian_process.GaussianProcessClassifier
    why_this_library: Built into scikit-learn; no extra install.
    snippet: "# scikit-learn 1.9.1\nfrom sklearn.datasets import make_classification\nfrom sklearn.gaussian_process\
      \ import GaussianProcessClassifier\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.pipeline\
      \ import make_pipeline\nfrom sklearn.preprocessing import StandardScaler\n\nX, y = make_classification(\n\
      \    n_samples=100, n_features=4, n_informative=3, n_redundant=0,\n    class_sep=1.2, random_state=0,\n)\n\
      X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)\nmodel = make_pipeline(\n    StandardScaler(),\n\
      \    GaussianProcessClassifier(max_iter_predict=60, random_state=0),\n).fit(X_train, y_train)\ny_proba = model.predict_proba(X_test[:3])\n\
      y_pred = model.predict(X_test[:3])\nprint(\"classes:\", model.classes_)\nprint(\"probabilities:\", y_proba.round(3))\n\
      print(\"labels:\", y_pred)\nprint(\"score:\", round(model.score(X_test, y_test), 3))\n"
    output: "classes: [0 1]\nprobabilities: [[0.373 0.627]\n [0.548 0.452]\n [0.318 0.682]]\nlabels: [1 0 1]\nscore:\
      \ 0.84\n"
  what_comes_out:
