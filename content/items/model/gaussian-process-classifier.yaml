  code:
    - library: scikit-learn
      target: sklearn.gaussian_process.GaussianProcessClassifier
      why_this_library: "Built into scikit-learn; no extra install."
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.gaussian_process import GaussianProcessClassifier
        from sklearn.model_selection import train_test_split
        from sklearn.pipeline import make_pipeline
        from sklearn.preprocessing import StandardScaler

        X, y = load_breast_cancer(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = make_pipeline(
            StandardScaler(),
            GaussianProcessClassifier(random_state=0),
        )
        model.fit(X_train, y_train)
        print(round(model.score(X_test, y_test), 3))
  what_comes_out:
    items:
      - {name: predict, kind: method, task: null, shape: "(n_samples,)",
         note: "Class labels, from the classes_ list."}
      - {name: predict_proba, kind: method, task: classification, shape: "(n_samples, n_classes)",
         note: "One column per class, in classes_ order."}
      - {name: score, kind: method, task: null, shape: "float",
         note: "Accuracy on the data you pass in."}
      - {name: classes_, kind: attribute, task: classification, shape: "(n_classes,)",
         note: "Class labels, in the column order of predict_proba."}
      - {name: kernel_, kind: attribute, task: null, shape: "fitted kernel object",
         note: "The kernel after fit, with tuned settings."}
    next_step: "ROC AUC needs predict_proba, not predict."
    visual: proba_table
  catch_outs:
    - "Default kernel is 1.0 * RBF; set kernel to change the shape."
    - "n_restarts_optimizer is 0, so the kernel is tuned from one start."
    - "Stores a copy of the training data by default."
    - "Built for small data; training slows as rows grow."
  key_settings:
    tier1:
