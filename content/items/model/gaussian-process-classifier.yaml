    - name: predict
      kind: method
      task: classification
      shape: (n_samples,)
      object_type: numpy.ndarray
      example: '[0, 1, 1]'
      shape_explanation: One predicted class per each of 3 query rows gives shape (3,).
      note: Labels are selected from classes_; they are not probabilities.
    - name: predict_proba
