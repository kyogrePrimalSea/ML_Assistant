      '
  catch_outs:
  - Default kernel is 1.0 * RBF; set kernel to change the shape.
  - n_restarts_optimizer is 0, so the kernel is tuned from one start.
  - Stores a copy of the training data by default.
  - Built for small data; training slows as rows grow.
  key_settings:
    tier1:
    - name: kernel
      page: null
      controls: Covariance function defining similarity between input rows.
      effect: A suitable kernel captures class-boundary smoothness; an unsuitable one limits the boundary.
    - name: n_restarts_optimizer
      page: null
      controls: Extra starts for maximizing kernel log marginal likelihood.
      effect: More starts can improve the selected kernel parameters but increase fitting time.
    - name: multi_class
      page: null
      controls: 'Strategy for classes beyond two: one-vs-rest or one-vs-one binary GPs.'
      effect: One-vs-one fits more smaller problems and returns labels only; one-vs-rest supports probabilities.
    tier2:
    - name: optimizer
      page: null
      controls: Optimizer for kernel hyperparameters during log-marginal-likelihood maximization.
      effect: None leaves kernel parameters fixed; optimization can reach a local optimum.
    - name: max_iter_predict
      page: null
      controls: Maximum Newton iterations for the Laplace posterior approximation at prediction.
      effect: A lower cap speeds prediction but may leave the approximation less converged.
    tier3:
    - name: copy_X_train
      page: null
      controls: Whether to retain a persistent copy of training inputs.
      effect: Copying costs memory; without it, later external input edits may affect predictions.
    - name: warm_start
      page: null
      controls: Whether later Laplace-mode calculations start from the previous solution.
      effect: Can speed repeated similar calculations; a poor initial solution may slow convergence.
  watch_it_work:
    none: true
  intuition:
    idea: Fit a smooth curve of scores, then turn the scores into class probabilities.
    analogy: A forecaster who also says how sure they are.
    animation: none
    good_at:
    - small data
    - class probabilities
    - smooth boundaries
    bad_at:
    - large data
    - images or text
    - fast training
    vs_siblings:
    - page: svc
      note: SVC has no probabilities unless you turn them on.
    - page: k-neighbors-classifier
      note: Votes from nearby rows; no fitted curve.
    read_more:
    - A logistic likelihood makes the latent posterior non-Gaussian, so scikit-learn uses a Laplace approximation.
    - Default multiclass handling fits one binary GP per class.
    - The dense training calculation scales cubically with rows; multiclass repeats binary fits.
    goal: Infer a smooth latent classification function and turn its approximate posterior into class probabilities.
    steps:
    - Define covariance among rows with a kernel and initialize a zero-mean latent Gaussian process.
    - Use the logistic link for the non-Gaussian Bernoulli class likelihood.
    - Use a Laplace approximation to approximate the posterior over latent values.
    - Optimize kernel hyperparameters by log marginal likelihood, restarting when requested.
    - For multiple classes, combine binary one-vs-rest or one-vs-one classifiers.
    math:
      notation:
      - symbol: f
        meaning: Latent Gaussian-process score at an input.
      - symbol: k(x,x′)
        meaning: Kernel covariance between two inputs.
      - symbol: y in {0,1}
        meaning: Binary class indicator.
      - symbol: sigma(f)
        meaning: Logistic function 1/(1+exp(-f)).
      - symbol: q(f|X,y)
        meaning: Gaussian Laplace approximation to the non-Gaussian posterior.
      equations:
      - expression: f ~ GP(0, k)
        meaning: Before seeing labels, latent scores have a zero-mean Gaussian-process prior.
      - expression: P(y=1|f) = 1/(1 + exp(-f))
        meaning: The logistic link turns a latent score into a Bernoulli class probability.
      - expression: q(f|X,y) approx p(f|X,y)
        meaning: Laplace approximation replaces the intractable posterior with a Gaussian approximation.
      prediction: Approximate logistic posterior gives class probabilities. Dense fitting is cubic; multiclass repeats
        binary fits.
