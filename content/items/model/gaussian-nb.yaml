rules:
  task_types: [classification]
  blocked_when: []
  fits_on_data: true
  shape_effect: {rows: same, columns: same}
slots:
  header: {}
  solves:
    hero: {kind: model, dataset: breast-cancer, shape: boundary}
    line: Naive Bayes with one bell curve per feature and class.
  quick_facts: {none: true}
  use_avoid:
    use_when: [numeric features, quick baseline, class probabilities]
    avoid_when: [category codes, word counts, missing values]
  prep:
    - step: {family: clean.impute}
      status: required
      why: Rejects NaN. Fill gaps first.
      condition: null
      unless: null
    - step: {family: transform.encode.features}
      status: required
      why: Text categories must become numbers.
      condition: {has_categoricals: true}
      unless: null
    - step: {family: transform.scale.rescale}
      status: not_needed
      why: Each feature gets its own mean and variance.
      condition: null
      unless: null
  code:
    - library: scikit-learn
      target: sklearn.naive_bayes.GaussianNB
      why_this_library: Numeric features with few settings to start.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.model_selection import train_test_split
        from sklearn.naive_bayes import GaussianNB

        X, y = load_breast_cancer(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = GaussianNB().fit(X_train, y_train)
        print(round(model.score(X_test, y_test), 3))
  what_comes_out:
    items:
      - {name: predict, kind: method, task: null, shape: "(n_samples,)", note: "Predicted class labels."}
      - {name: predict_proba, kind: method, task: classification, shape: "(n_samples, n_classes)", note: "One column per class, in classes_ order."}
      - {name: predict_log_proba, kind: method, task: classification, shape: "(n_samples, n_classes)", note: "Log of predict_proba, same columns."}
      - {name: score, kind: method, task: null, shape: "float", note: "Accuracy on the data given."}
      - {name: classes_, kind: attribute, task: classification, shape: "(n_classes,)", note: "Class labels, in predict_proba column order."}
      - {name: n_features_in_, kind: attribute, task: null, shape: "int", note: "Number of input columns seen in fit."}
      - {name: feature_names_in_, kind: attribute, task: null, shape: "(n_features,)", note: "Column names seen in fit, if any."}
    next_step: "Check the score against a baseline before trusting it."
    visual: proba_table
  catch_outs:
    - NaN fails in fit. Impute before the model.
    - Non-numeric columns fail. Encode them first.
    - var_smoothing is a share of the largest variance, not an absolute value.
  key_settings:
    tier1:
