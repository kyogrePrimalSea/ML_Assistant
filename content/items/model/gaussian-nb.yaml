    analogy: A typical value and a usual spread for each group.
    animation: none
    good_at: [numeric features, quick baseline]
    bad_at: [category codes, word counts]
    vs_siblings:
      - {page: categorical-nb, note: "Category codes. GaussianNB needs numbers."}
      - {page: multinomial-nb, note: "Counts. GaussianNB models means and spreads."}
    read_more:
      - See the scikit-learn reference page for GaussianNB.
  next: [evaluate-how-good]
