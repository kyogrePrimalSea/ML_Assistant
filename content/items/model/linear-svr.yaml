question_tags: [large data, margin-based regression]
targets: [sklearn.svm.LinearSVR]
pairs_with: [linearexplainer]
clashes: []
source_urls: ['https://scikit-learn.org/stable/modules/generated/sklearn.svm.LinearSVR.html']
library_versions: {scikit-learn: 1.9.1}
reviewed: false
rules:
  task_types: [regression]
  blocked_when: []
  fits_on_data: true
  shape_effect: {rows: same, columns: same}
slots:
  header: {}
  solves:
    hero: {kind: model, dataset: ames, shape: fit_line}
    line: Fits one straight line to a number, ignoring small misses.
  quick_facts: {data_size: Large data}
  use_avoid:
    use_when: [large data, numeric target, straight-line trend]
    avoid_when: [curved relationships, needs p-values]
  prep:
    - step: {family: transform.scale.rescale}
      status: recommended
      why: Margins depend on feature size.
      condition: null
      unless: null
    - step: {family: clean.impute}
      status: required
      why: Linear models reject missing values.
      condition: {has_missing: true}
      unless: null
    - step: {family: transform.encode.features}
      status: required
      why: Text categories must become numbers.
      condition: {has_categoricals: true}
      unless: null
  code:
    - library: scikit-learn
      target: sklearn.svm.LinearSVR
      why_this_library: Same fit and score API as other scikit-learn models.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_diabetes
        from sklearn.model_selection import train_test_split
        from sklearn.pipeline import make_pipeline
        from sklearn.preprocessing import StandardScaler
        from sklearn.svm import LinearSVR

        X, y = load_diabetes(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = make_pipeline(StandardScaler(), LinearSVR(C=1.0, random_state=0))
        model.fit(X_train, y_train)
        print(round(model.score(X_test, y_test), 3))
  what_comes_out:
    items:
      - {name: predict, kind: method, task: null, shape: "(n_samples,)",
         note: "One predicted value per row."}
      - {name: score, kind: method, task: null, shape: "float",
         note: "R squared. 1 is perfect; 0 is no better than the mean."}
      - {name: coef_, kind: attribute, task: null, shape: "(n_features,)",
         note: "One weight per input column."}
      - {name: intercept_, kind: attribute, task: null, shape: "(1,)",
         note: "The offset added to every prediction."}
      - {name: n_iter_, kind: attribute, task: null, shape: "int",
         note: "Solver passes used. At max_iter, it may not have converged."}
      - {name: n_features_in_, kind: attribute, task: null, shape: "int",
         note: "Number of input columns seen in fit."}
      - {name: feature_names_in_, kind: attribute, task: null, shape: "(n_features_in_,)",
         note: "Column names. Only set when fit on a DataFrame."}
    next_step: Undo any log target before reporting errors in original units.
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.datasets import load_diabetes
      from sklearn.model_selection import train_test_split
      from sklearn.pipeline import make_pipeline
      from sklearn.preprocessing import StandardScaler
      from sklearn.svm import LinearSVR

      X, y = load_diabetes(return_X_y=True)
      X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

      model = make_pipeline(StandardScaler(), LinearSVR(random_state=0))
      model.fit(X_train, y_train)
      svr = model[-1]
      print(model.predict(X_test).shape)
      print(svr.coef_.shape)
      print(svr.intercept_.shape)
      print(svr.n_iter_)
      print(svr.n_features_in_)
      print(round(model.score(X_test, y_test), 3))
    snippet_library: scikit-learn
    visual: null
  catch_outs:
    - Scale features first. Unscaled, the diabetes R squared was -0.56.
    - Errors inside epsilon cost nothing, so small misses look perfect.
    - Text and missing values fail. Encode and impute first.
  key_settings:
    tier1:
      - {name: C, page: null}
      - {name: epsilon, page: null}
      - {name: loss, page: null}
    tier2:
      - {name: fit_intercept, page: null}
      - {name: dual, page: null}
    tier3:
      - {name: max_iter, page: null}
      - {name: tol, page: null}
      - {name: intercept_scaling, page: null}
  watch_it_work: {none: true}
  intuition:
    idea: Fit one straight line, and ignore misses smaller than epsilon.
    analogy: A ruler that forgives misses inside a narrow band.
    animation: none
    good_at: [large data, numeric targets, straight-line trends]
    bad_at: [curved relationships, interactions]
    vs_siblings:
      - {page: passive-aggressive-regressor, note: "Also linear. Updates on each miss, one row at a time."}
      - {page: sgd-regressor, note: "Also linear. Trains in small batches on big data."}
    read_more:
      - Start with a line through the middle of the data.
      - Ignore misses smaller than epsilon.
      - Move the line to shrink the larger misses.
  next: [know-feature-importance]
