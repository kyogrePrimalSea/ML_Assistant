reviewed: false
rules:
  task_types: [regression]
  blocked_when: []
  fits_on_data: false
  shape_effect: {rows: same, columns: same}
slots:
  header: {}
  solves:
    hero: {kind: metric, dataset: ames, highlight: [residual spread]}
    line: Share of the target's spread that the model explains, ignoring a constant offset.
  quick_facts:
    facts:
      - {label: Best score, value: "1.0"}
      - {label: Can go below zero, value: "yes: lower values are worse"}
      - {label: Constant target, value: "replaced by 0.0 or 1.0"}
  use_avoid:
    use_when: [regression, constant offset should not count]
    avoid_when: [classification, a constant bias must count]
  prep: []
  code:
    - library: scikit-learn
      target: sklearn.metrics.explained_variance_score
      why_this_library: One call; true values first, then predictions.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.metrics import explained_variance_score
        from sklearn.datasets import make_regression
        from sklearn.linear_model import LinearRegression
        from sklearn.model_selection import train_test_split

        X, y = make_regression(n_samples=200, n_features=3, noise=10, random_state=0)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = LinearRegression().fit(X_train, y_train)
        y_pred = model.predict(X_test)

        print(round(explained_variance_score(y_test, y_pred), 3))
  what_comes_out: {none: true}
  catch_outs:
    - Does not penalise a constant offset; R-squared does.
    - A constant target gives a non-finite score; force_finite handles it.
  key_settings:
    tier1:
      - {name: multioutput, page: null}
      - {name: force_finite, page: null}
    tier2:
