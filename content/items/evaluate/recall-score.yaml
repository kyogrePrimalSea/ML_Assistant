slots:
  header: {}
  solves:
    hero: {kind: metric, dataset: breast-cancer, highlight: [TP, FN]}
    line: Of the rows that really are positive, how many get flagged.
  quick_facts:
    facts:
      - {label: Formula, value: "TP / (TP + FN)"}
      - {label: Range, value: "0 to 1"}
      - {label: Default average, value: binary}
  use_avoid:
    use_when: [missed cases are costly, imbalanced classes]
    avoid_when: [regression, false alarms cost most]
  prep: []
  code:
    - library: scikit-learn
      target: sklearn.metrics.recall_score
      why_this_library: One call; handles binary and multiclass.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.linear_model import LogisticRegression
        from sklearn.metrics import recall_score
        from sklearn.model_selection import train_test_split

        X, y = load_breast_cancer(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = LogisticRegression(max_iter=5000).fit(X_train, y_train)
        y_pred = model.predict(X_test)

        print(recall_score(y_test, y_pred))
  what_comes_out:
    items:
      - {name: recall_score, kind: return, task: classification, shape: float, note: "Share of real positives the model finds."}
    next_step: Read it with precision, since one alone hides the other.
    visual: null
  catch_outs:
    - Ignores false alarms; check precision too.
    - Multiclass needs average set, not binary.
    - No real positives gives 0 and a warning; set zero_division.
