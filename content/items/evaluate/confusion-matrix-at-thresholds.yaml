  use_avoid:
    use_when: [see counts at each cut-off, picking a cut-off]
    avoid_when: [one score is needed, regression]
  prep: []
  code:
    - library: scikit-learn
      target: sklearn.metrics.confusion_matrix_at_thresholds
      why_this_library: One call; gives the four counts for every cut-off.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.linear_model import LogisticRegression
        from sklearn.model_selection import train_test_split
        import numpy as np
        from sklearn.metrics import confusion_matrix_at_thresholds

        X, y = load_breast_cancer(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = LogisticRegression(max_iter=5000).fit(X_train, y_train)
        y_score = model.predict_proba(X_test)[:, 1]

        tns, fps, fns, tps, thresholds = confusion_matrix_at_thresholds(
            y_test, y_score
        )
        i = int(np.argmin(np.abs(thresholds - 0.5)))
        print(thresholds[i], tns[i], fps[i], fns[i], tps[i])
  what_comes_out:
    items:
      - {name: tns, kind: return, task: classification, shape: "array, one per threshold", note: True negatives at each cut-off.}
      - {name: fps, kind: return, task: classification, shape: "array, one per threshold", note: False positives at each cut-off.}
      - {name: fns, kind: return, task: classification, shape: "array, one per threshold", note: False negatives at each cut-off.}
      - {name: tps, kind: return, task: classification, shape: "array, one per threshold", note: True positives at each cut-off.}
      - {name: thresholds, kind: return, task: classification, shape: "array, one per threshold", note: Cut-off behind each row.}
    next_step: Divide the counts to get precision or recall per cut-off.
    visual: null
