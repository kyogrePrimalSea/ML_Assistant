  code:
  - library: scikit-learn
    target: sklearn.calibration.CalibratedClassifierCV
    why_this_library: Wraps any classifier and calibrates its probabilities.
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.calibration import CalibratedClassifierCV
      from sklearn.datasets import load_breast_cancer
      from sklearn.linear_model import LogisticRegression
      from sklearn.metrics import brier_score_loss
      from sklearn.model_selection import train_test_split

      X, y = load_breast_cancer(return_X_y=True)
      X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)
      base = LogisticRegression(max_iter=5000).fit(X_train, y_train)
      before = base.predict_proba(X_test)[:, 1]
      calibrated = CalibratedClassifierCV(
          estimator=LogisticRegression(max_iter=5000),
          method="sigmoid", cv=5,
      ).fit(X_train, y_train)
      after = calibrated.predict_proba(X_test)[:, 1]
      print(round(brier_score_loss(y_test, before), 4),
            round(brier_score_loss(y_test, after), 4))
  what_comes_out:
    items:
    - {name: predict_proba, kind: method, task: null, shape: '(n_samples, n_classes)', note: Calibrated probability for each class.}
    - {name: predict, kind: method, task: null, shape: '(n_samples,)', note: Class label from the calibrated probabilities.}
    - {name: classes_, kind: attribute, task: null, shape: '(n_classes,)', note: Class labels the model knows.}
    - {name: calibrated_classifiers_, kind: attribute, task: null, shape: list, note: 'One per cv fold, or one if ensemble is False.'}
