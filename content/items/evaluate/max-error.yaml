id: max-error
plain_name: Max error
code_name: max_error
aliases: ["worst miss", "largest error", "maximum residual"]
stage: evaluate
family: evaluate.error.units
tracks: [standard, time-series]
archetype: metric
question_tags: ["worst case", "biggest miss"]
targets: [sklearn.metrics.max_error]
pairs_with: []
clashes: []
source_urls: ['https://scikit-learn.org/stable/modules/generated/sklearn.metrics.max_error.html']
library_versions: {scikit-learn: 1.9.1}
reviewed: false
rules:
  task_types: [regression]
  blocked_when: []
  fits_on_data: false
  shape_effect: {rows: same, columns: same}
slots:
  header: {}
  solves:
    hero: {kind: metric, dataset: ames, highlight: ["largest residual"]}
    line: "The single worst miss, in the target's units."
  quick_facts:
    facts:
    - {label: "Best score", value: "0 (perfect)"}
    - {label: "Units", value: "Same as the target"}
  use_avoid:
    use_when: ["regression", "worst case matters"]
    avoid_when: ["several targets at once", "classification"]
  prep: []
  code:
  - library: scikit-learn
    target: sklearn.metrics.max_error
    why_this_library: One call; y_true first, then y_pred.
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.datasets import load_diabetes
      from sklearn.linear_model import LinearRegression
      from sklearn.metrics import max_error
      from sklearn.model_selection import train_test_split

      X, y = load_diabetes(return_X_y=True)
      X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

      model = LinearRegression().fit(X_train, y_train)
      y_pred = model.predict(X_test)

      print(max_error(y_test, y_pred))
  what_comes_out: {none: true}
  catch_outs:
  - "Only one worst case; ignores the rest of the errors."
  - "Multiple targets are not supported."
  key_settings:
    tier1: []
    tier2: []
    tier3: []
  watch_it_work: {none: true}
  intuition:
    text: "Find the single biggest miss and report it."
  next: []
