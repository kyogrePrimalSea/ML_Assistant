  code:
  - library: scikit-learn
    target: sklearn.model_selection.validation_curve
    why_this_library: Returns scores for every setting value and fold.
    snippet: |
      # scikit-learn 1.9.1
      import numpy as np
      from sklearn.datasets import load_diabetes
      from sklearn.model_selection import validation_curve
      from sklearn.tree import DecisionTreeRegressor

      X, y = load_diabetes(return_X_y=True)
      depths = [1, 2, 3, 4, 5, 6, 8, 10]
      train, test = validation_curve(
          DecisionTreeRegressor(random_state=0), X, y,
          param_name="max_depth", param_range=depths, cv=5,
      )
      print(depths[np.argmax(test.mean(axis=1))])
  what_comes_out:
    items:
    - {name: train_scores, kind: return, task: null, shape: '(n_ticks, n_cv_folds)', note: Training scores for each value and fold.}
    - {name: test_scores, kind: return, task: null, shape: '(n_ticks, n_cv_folds)', note: Held-out scores for each value and fold.}
    - {name: from_estimator, kind: method, task: null, shape: display object, note: Runs the sweep and draws the curve.}
    - {name: plot, kind: method, task: null, shape: display object, note: Draws the curve from existing scores.}
