  prep: []
  code:
    - library: scikit-learn
      target: sklearn.metrics.get_scorer_names
      why_this_library: One call lists every built-in name.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.linear_model import LogisticRegression
        from sklearn.metrics import get_scorer_names
        from sklearn.model_selection import cross_val_score

        X, y = load_breast_cancer(return_X_y=True)
        model = LogisticRegression(max_iter=5000)

        names = get_scorer_names()
        f1_names = [name for name in names if name.startswith("f1")]
        scores = cross_val_score(model, X, y, cv=5, scoring=f1_names[0])
        print(f1_names, round(scores.mean(), 3))
  what_comes_out:
    items:
      - {name: names, kind: return, task: null, shape: "list of str", note: Each name works as a scoring= string.}
    next_step: Pick a name from the list and pass it to scoring=.
    visual: null
  catch_outs:
    - Names are strings, not scorer objects; use get_scorer for one.
    - Not every name fits every task; match the name to your task.
