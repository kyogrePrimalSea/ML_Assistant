  prep: []
  code:
    - library: scikit-learn
      target: sklearn.metrics.mean_poisson_deviance
      why_this_library: One call; y_true first, then y_pred.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.datasets import load_diabetes
        from sklearn.linear_model import PoissonRegressor
        from sklearn.metrics import mean_poisson_deviance
        from sklearn.model_selection import train_test_split

        X, y = load_diabetes(return_X_y=True)
        y = np.round(y)  # whole numbers, so the target reads as counts
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = PoissonRegressor(max_iter=1000)
        model.fit(X_train, y_train)
        y_pred = model.predict(X_test)

        print(mean_poisson_deviance(y_test, y_pred))
  what_comes_out:
    items:
      - {name: mean_poisson_deviance, kind: return, task: regression, shape: float, note: "Lower is better; 0 means exact predictions."}
    next_step: Poisson is the Tweedie deviance at power 1.
    visual: null
  catch_outs:
    - Needs y_pred above 0; a zero prediction is rejected.
    - Lower is better, so do not maximise it.
    - Score on the test set, not the training set.
