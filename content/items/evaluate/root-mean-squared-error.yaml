reviewed: false
rules:
  task_types: [regression]
  blocked_when: []
  fits_on_data: false
  shape_effect: {rows: same, columns: same}
slots:
  header: {}
  solves:
    hero: {kind: metric, dataset: ames, highlight: [large residuals]}
    line: Typical size of a miss, with big misses counting more.
  quick_facts:
    facts:
      - {label: Best value, value: "0.0"}
      - {label: Range, value: "0 or more"}
      - {label: Units, value: "same as the target"}
  use_avoid:
    use_when: [regression, big misses are costly, errors in target units]
    avoid_when: [classification, huge misses must not dominate]
  prep: []
  code:
    - library: scikit-learn
      target: sklearn.metrics.root_mean_squared_error
      why_this_library: One call; true values first, then predictions.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.metrics import root_mean_squared_error
        from sklearn.datasets import make_regression
        from sklearn.linear_model import LinearRegression
        from sklearn.model_selection import train_test_split

        X, y = make_regression(n_samples=200, n_features=3, noise=10, random_state=0)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = LinearRegression().fit(X_train, y_train)
        y_pred = model.predict(X_test)

        print(round(root_mean_squared_error(y_test, y_pred), 3))
  what_comes_out: {none: true}
  catch_outs:
    - Squares errors, so one huge miss can dominate.
    - Score is in target units; do not compare across targets.
  key_settings:
    tier1:
      - {name: multioutput, page: null}
