  prep: []
  code:
    - library: scikit-learn
      target: sklearn.metrics.mean_tweedie_deviance
      why_this_library: One call; power picks the distribution.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_diabetes
        from sklearn.linear_model import TweedieRegressor
        from sklearn.metrics import mean_tweedie_deviance
        from sklearn.model_selection import train_test_split

        X, y = load_diabetes(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = TweedieRegressor(power=1.5, max_iter=1000)
        model.fit(X_train, y_train)
        y_pred = model.predict(X_test)

        print(mean_tweedie_deviance(y_test, y_pred, power=1.5))
  what_comes_out:
    items:
      - {name: mean_tweedie_deviance, kind: return, task: regression, shape: float, note: "Lower is better; power sets the loss shape."}
    next_step: Try power 1 or 2 to match your data.
    visual: null
  catch_outs:
    - Power between 0 and 1 is not allowed.
    - Power 1 needs y_true of 0 or more; power 2 needs y_true above 0.
    - Lower is better, so do not maximise it.
