  code:
    - library: scikit-learn
      target: sklearn.metrics.hinge_loss
      why_this_library: One call on decision scores, labels first.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.metrics import hinge_loss
        from sklearn.model_selection import train_test_split
        from sklearn.svm import LinearSVC

        X, y = load_breast_cancer(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = LinearSVC(max_iter=10000).fit(X_train, y_train)
        scores = model.decision_function(X_test)

        print(hinge_loss(y_test, scores))
  what_comes_out: {none: true}
  catch_outs:
    - Pass decision_function scores, not labels or probabilities.
    - Probabilities run without error and give a wrong number.
    - Multiclass with classes missing from y_true needs labels.
