  prep: []
  code:
    - library: scikit-learn
      target: sklearn.metrics.class_likelihood_ratios
      why_this_library: One call; returns both ratios as a pair.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.linear_model import LogisticRegression
        from sklearn.metrics import class_likelihood_ratios
        from sklearn.model_selection import train_test_split

        X, y = load_breast_cancer(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = LogisticRegression(max_iter=5000).fit(X_train, y_train)
        y_pred = model.predict(X_test)

        lr_pos, lr_neg = class_likelihood_ratios(y_test, y_pred)
        print(round(lr_pos, 2), round(lr_neg, 2))
  what_comes_out:
    items:
      - {name: class_likelihood_ratios, kind: return, task: classification, shape: tuple of 2 floats, note: "LR+ first, then LR-."}
    next_step: Compare the two ratios with the confusion matrix counts.
    visual: null
  catch_outs:
    - Binary only; more than two classes raises an error.
    - A division by zero gives nan unless replace_undefined_by is set.
    - Takes predicted labels, so the threshold is already applied.
