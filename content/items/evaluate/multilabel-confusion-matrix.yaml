  code:
    - library: scikit-learn
      target: sklearn.metrics.multilabel_confusion_matrix
      why_this_library: One call; one 2x2 grid per label.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import make_multilabel_classification
        from sklearn.metrics import multilabel_confusion_matrix
        from sklearn.model_selection import train_test_split
        from sklearn.tree import DecisionTreeClassifier

        X, y = make_multilabel_classification(n_samples=300, n_classes=3,
                                              random_state=0)
        X_train, X_test, y_train, y_test = train_test_split(X, y,
                                                            random_state=0)

        model = DecisionTreeClassifier(max_depth=4, random_state=0)
        model.fit(X_train, y_train)
        y_pred = model.predict(X_test)

        print(multilabel_confusion_matrix(y_test, y_pred))
  what_comes_out:
    items:
      - {name: multilabel_confusion_matrix, kind: return, task: classification, shape: "(n_outputs, 2, 2)", note: "One 2x2 per label, in label order."}
    next_step: Pick the label with the most wrong cells, then check its precision.
    visual: null
  catch_outs:
    - "Each grid reads [[TN, FP], [FN, TP]]."
    - Samplewise only applies to multilabel input.
