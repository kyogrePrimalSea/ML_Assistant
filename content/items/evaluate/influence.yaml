    - {label: Input, value: Fitted OLS results}
  use_avoid:
    use_when: [rows pull the line, checking for outliers]
    avoid_when: [models other than OLS, no fitted results]
  prep: []
  code:
  - library: statsmodels
    target: statsmodels.stats.outliers_influence.OLSInfluence
    why_this_library: Gives per-row influence measures from one fit.
    snippet: |
      # statsmodels 0.15.0
      import statsmodels.api as sm
      from sklearn.datasets import load_diabetes
      from statsmodels.stats.outliers_influence import OLSInfluence

      X, y = load_diabetes(return_X_y=True)
      X = sm.add_constant(X)
      results = sm.OLS(y, X).fit()
      influence = OLSInfluence(results)
      cooks_d = influence.cooks_distance[0]
      print(cooks_d.argmax(), round(cooks_d.max(), 3))
  what_comes_out:
    items:
    - {name: cooks_distance, kind: attribute, task: null, shape: two arrays, note: 'Distance per row, with p-values.'}
    - {name: dffits, kind: attribute, task: null, shape: 'array, one per row', note: Change in a row's fit when it is left out.}
    - {name: summary_frame, kind: method, task: null, shape: DataFrame, note: All influence measures in one table.}
    next_step: Check the largest values before dropping any rows.
    visual: null
  catch_outs: [Built for OLS results only., A flagged row is not automatically wrong., Cook's distance comes back as two arrays.]
