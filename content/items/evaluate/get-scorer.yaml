  code:
    - library: scikit-learn
      target: sklearn.metrics.get_scorer
      why_this_library: One call maps a name to its scorer.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.linear_model import LogisticRegression
        from sklearn.metrics import get_scorer
        from sklearn.model_selection import train_test_split

        X, y = load_breast_cancer(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = LogisticRegression(max_iter=5000).fit(X_train, y_train)

        scorer = get_scorer("roc_auc")
        print(round(scorer(model, X_test, y_test), 3))
  what_comes_out:
    items:
      - {name: scorer, kind: return, task: null, shape: "callable(estimator, X, y)", note: Call it with the fitted estimator and data.}
    next_step: Call it on held-out data, or pass the name to scoring=.
    visual: null
  catch_outs:
