id: d2-absolute-error-score
plain_name: D² absolute error
code_name: d2_absolute_error_score
aliases: [median baseline score, absolute error skill]
stage: evaluate
family: evaluate.explained
tracks: [standard, time-series]
archetype: metric
question_tags: [how good is it, regression, beats median guess]
