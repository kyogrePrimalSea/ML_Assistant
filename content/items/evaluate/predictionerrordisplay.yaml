  code:
  - library: scikit-learn
    target: sklearn.metrics.PredictionErrorDisplay
    why_this_library: Draws the plot from predictions you already have.
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.datasets import load_diabetes
      from sklearn.linear_model import Ridge
      from sklearn.metrics import PredictionErrorDisplay
      from sklearn.model_selection import train_test_split

      X, y = load_diabetes(return_X_y=True)
      X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)
      model = Ridge().fit(X_train, y_train)
      y_pred = model.predict(X_test)
      display = PredictionErrorDisplay.from_predictions(
          y_true=y_test, y_pred=y_pred, kind="residual_vs_predicted"
      )
      print(round(abs(y_test - y_pred).mean(), 2))
  what_comes_out:
    items:
    - {name: from_predictions, kind: method, task: null, shape: display object, note: Builds the plot from true and predicted values.}
    - {name: from_estimator, kind: method, task: null, shape: display object, note: 'Predicts with a fitted regressor, then plots.'}
    - {name: plot, kind: method, task: null, shape: display object, note: Draws the figure on axes.}
