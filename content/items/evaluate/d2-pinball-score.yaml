  prep: []
  code:
    - library: scikit-learn
      target: sklearn.metrics.d2_pinball_score
      why_this_library: One call; set alpha to the quantile you predicted.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_diabetes
        from sklearn.linear_model import QuantileRegressor
        from sklearn.metrics import d2_pinball_score
        from sklearn.model_selection import train_test_split

        X, y = load_diabetes(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = QuantileRegressor(quantile=0.9, alpha=0)
        model.fit(X_train, y_train)
        y_pred = model.predict(X_test)

        print(d2_pinball_score(y_test, y_pred, alpha=0.9))
  what_comes_out:
    items:
      - {name: d2_pinball_score, kind: return, task: regression, shape: "float (or one per output)", note: "1.0 is perfect; 0 matches the alpha-quantile guess."}
    next_step: Read it with the pinball loss it is built on.
    visual: null
  catch_outs:
    - Alpha must match the quantile your model predicts.
    - Default alpha 0.5 scores the median, not your quantile.
    - Score on the test set, not the training set.
