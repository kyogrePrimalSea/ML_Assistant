  code:
    - library: scikit-learn
      target: sklearn.metrics.dcg_score
      why_this_library: One call on true labels and scores.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.datasets import load_breast_cancer
        from sklearn.linear_model import LogisticRegression
        from sklearn.metrics import dcg_score
        from sklearn.model_selection import train_test_split
        from sklearn.multiclass import OneVsRestClassifier

        X, y = load_breast_cancer(return_X_y=True)
        # Two labels per row: the diagnosis, and whether feature 0 is large.
        Y = np.column_stack([y, X[:, 0] > np.median(X[:, 0])]).astype(int)
        X_train, X_test, Y_train, Y_test = train_test_split(X, Y, random_state=0)

        model = OneVsRestClassifier(LogisticRegression(max_iter=5000))
        model.fit(X_train, Y_train)
        y_score = model.predict_proba(X_test)

        print(dcg_score(Y_test, y_score))
  what_comes_out: {none: true}
  catch_outs:
    - Scores set the order; pass scores, not predicted labels.
    - A lower log_base gives a sharper discount for lower ranks.
    - ignore_ties True assumes no tied scores.
