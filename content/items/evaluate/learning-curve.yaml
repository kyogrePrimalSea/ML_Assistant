  prep: []
  code:
    - library: scikit-learn
      target: sklearn.model_selection.learning_curve
      why_this_library: Returns the numbers; you choose the plot.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import make_regression
        from sklearn.linear_model import Ridge
        from sklearn.model_selection import learning_curve

        X, y = make_regression(n_samples=300, n_features=10, noise=25, random_state=0)

        sizes, train_scores, val_scores = learning_curve(
            Ridge(), X, y, train_sizes=[0.2, 0.5, 1.0], cv=5
        )
        print(sizes)
        print(train_scores.mean(axis=1).round(2))
        print(val_scores.mean(axis=1).round(2))
  what_comes_out: {none: true}
  catch_outs:
    - Fits the model once per size per fold.
    - Gap between lines means overfitting.
    - Rows are not shuffled unless shuffle is True.
  key_settings:
