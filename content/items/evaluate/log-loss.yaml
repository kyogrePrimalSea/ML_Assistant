  code:
    - library: scikit-learn
      target: sklearn.metrics.log_loss
      why_this_library: One call; pass the full predict_proba output.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.linear_model import LogisticRegression
        from sklearn.metrics import log_loss
        from sklearn.model_selection import train_test_split

        X, y = load_breast_cancer(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = LogisticRegression(max_iter=5000).fit(X_train, y_train)
        y_proba = model.predict_proba(X_test)

        print(log_loss(y_test, y_proba))
  what_comes_out:
    items:
      - {name: loss, kind: return, task: classification, shape: float, note: Mean negative log likelihood per sample.}
    next_step: Check the Brier score for a bounded alternative.
    visual: null
  catch_outs:
    - Probabilities of exactly 0 or 1 are clipped, not rejected.
    - Pass probabilities, not predicted labels.
    - normalize=False returns the sum, not the mean.
