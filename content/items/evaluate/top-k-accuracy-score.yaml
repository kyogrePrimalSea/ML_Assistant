  code:
    - library: scikit-learn
      target: sklearn.metrics.top_k_accuracy_score
      why_this_library: One call; scores need one column per class.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_iris
        from sklearn.linear_model import LogisticRegression
        from sklearn.metrics import top_k_accuracy_score
        from sklearn.model_selection import train_test_split

        X, y = load_iris(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = LogisticRegression(max_iter=5000).fit(X_train, y_train)
        y_score = model.predict_proba(X_test)

        for k in (1, 2):
            print(k, top_k_accuracy_score(y_test, y_score, k=k))
  what_comes_out: {none: true}
  catch_outs:
    - Needs one score column per class, not just predicted labels.
    - k at or above the number of classes gives a perfect 1, with a warning.
    - k of 1 is ordinary accuracy on the top class.
    - normalize=False returns a count of rows, not a share.
