id: residual-normality
plain_name: Residual normality tests
code_name: jarque_bera / omni_normtest
aliases: [Jarque-Bera test, omnibus test, normality test]
stage: evaluate
family: evaluate.diagnostics
tracks: [standard]
archetype: diagnostic
