slots:
  header: {}
  solves:
    hero: {kind: metric, dataset: titanic, highlight: [TP, FP]}
    line: Of the rows flagged positive, how many really are.
  quick_facts:
    facts:
      - {label: Formula, value: TP / (TP + FP)}
      - {label: Range, value: 0 to 1}
      - {label: Default average, value: binary}
  use_avoid:
    use_when: [false alarms are costly, imbalanced classes]
    avoid_when: [regression, missed cases are costly]
  prep: []
  code:
    - library: scikit-learn
      target: sklearn.metrics.precision_score
      why_this_library: One call; handles binary and multiclass.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.linear_model import LogisticRegression
        from sklearn.metrics import precision_score
        from sklearn.model_selection import train_test_split

        X, y = load_breast_cancer(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = LogisticRegression(max_iter=5000).fit(X_train, y_train)
        y_pred = model.predict(X_test)

        print(precision_score(y_test, y_pred))
  catch_outs:
    - Ignores missed positives; check recall too.
    - Multiclass needs average set (not binary).
    - No predicted positives gives 0 and a warning; set zero_division.
  key_settings:
