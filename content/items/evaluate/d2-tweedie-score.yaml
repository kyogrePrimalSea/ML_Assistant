  prep: []
  code:
    - library: scikit-learn
      target: sklearn.metrics.d2_tweedie_score
      why_this_library: One call; set power to match the loss.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_diabetes
        from sklearn.linear_model import TweedieRegressor
        from sklearn.metrics import d2_tweedie_score
        from sklearn.model_selection import train_test_split

        X, y = load_diabetes(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = TweedieRegressor(power=1.5, max_iter=1000)
        model.fit(X_train, y_train)
        y_pred = model.predict(X_test)

        print(d2_tweedie_score(y_test, y_pred, power=1.5))
  what_comes_out:
    items:
      - {name: d2_tweedie_score, kind: return, task: regression, shape: float, note: "1.0 is perfect; 0 matches always predicting the mean."}
    next_step: Read it like R-squared, on the deviance scale.
    visual: null
  catch_outs:
    - Power sets the distribution; power 0 gives plain R-squared.
    - Power 1 needs y_true of 0 or more and y_pred above 0.
    - Score on the test set, not the training set.
