  prep: []
  code:
    - library: scikit-learn
      target: sklearn.metrics.precision_recall_fscore_support
      why_this_library: One call returns all four scores, per class or averaged.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.linear_model import LogisticRegression
        from sklearn.metrics import precision_recall_fscore_support
        from sklearn.model_selection import train_test_split

        X, y = load_breast_cancer(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = LogisticRegression(max_iter=5000).fit(X_train, y_train)
        y_pred = model.predict(X_test)

        precision, recall, fbeta, support = precision_recall_fscore_support(
            y_test, y_pred, average=None
        )
        print(precision, recall, fbeta, support)
  what_comes_out:
    items:
      - {name: precision, kind: return, task: classification, shape: "(n_classes,) if average=None", note: "Share of flagged rows that are right, per class."}
      - {name: recall, kind: return, task: classification, shape: "(n_classes,) if average=None", note: "Share of real cases found, per class."}
      - {name: fbeta_score, kind: return, task: classification, shape: "(n_classes,) if average=None", note: "F-beta, a blend of precision and recall."}
      - {name: support, kind: return, task: classification, shape: "(n_classes,) if average=None", note: "How many true rows sit in each class."}
    next_step: Read the per-class rows before picking one average.
    visual: null
  catch_outs:
    - Returns four values, not one; unpack them or keep the one you need.
    - Default average is None, so you get arrays, not one number.
    - Support is None when average is set.
    - No predicted positives gives 0 and a warning; set zero_division.
