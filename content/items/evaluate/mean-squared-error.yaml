id: mean-squared-error
plain_name: MSE
code_name: mean_squared_error
aliases: ["mse", "squared error"]
stage: evaluate
family: evaluate.error.units
tracks: [standard, time-series]
archetype: metric
question_tags: ["how big are the misses", "training loss"]
targets: [sklearn.metrics.mean_squared_error]
pairs_with: []
clashes: []
source_urls: ['https://scikit-learn.org/stable/modules/generated/sklearn.metrics.mean_squared_error.html']
library_versions: {scikit-learn: 1.9.1}
reviewed: false
rules:
  task_types: [regression]
  blocked_when: []
  fits_on_data: false
  shape_effect: {rows: same, columns: same}
slots:
  header: {}
  solves:
    hero: {kind: metric, dataset: ames, highlight: ["residual"]}
    line: "Average of the squared misses, so big misses weigh more."
  quick_facts:
    facts:
    - {label: "Best score", value: "0 (perfect)"}
    - {label: "Units", value: "Squared target units"}
  use_avoid:
    use_when: ["regression", "training a model", "big misses must cost more"]
    avoid_when: ["classification", "errors in the target's units"]
  prep: []
  code:
  - library: scikit-learn
    target: sklearn.metrics.mean_squared_error
    why_this_library: One call; y_true first, then y_pred.
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.datasets import load_diabetes
      from sklearn.linear_model import LinearRegression
      from sklearn.metrics import mean_squared_error
      from sklearn.model_selection import train_test_split

      X, y = load_diabetes(return_X_y=True)
      X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

      model = LinearRegression().fit(X_train, y_train)
      y_pred = model.predict(X_test)

      print(mean_squared_error(y_test, y_pred))
  what_comes_out: {none: true}
  catch_outs:
  - "Squared units; hard to read next to the target."
  - "One huge miss can dominate the whole score."
  key_settings:
    tier1:
    - {name: multioutput, page: null}
    tier2:
    - {name: sample_weight, page: null}
    tier3: []
  watch_it_work: {none: true}
  intuition:
    text: "Square each miss, then average. Big misses hurt most."
