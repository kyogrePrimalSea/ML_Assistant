  prep: []
  code:
    - library: scikit-learn
      target: sklearn.metrics.cohen_kappa_score
      why_this_library: One call; takes two label lists, no model needed.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.linear_model import LogisticRegression
        from sklearn.metrics import cohen_kappa_score
        from sklearn.model_selection import train_test_split
        from sklearn.tree import DecisionTreeClassifier

        X, y = load_breast_cancer(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        rater_a = LogisticRegression(max_iter=5000).fit(X_train, y_train)
        rater_b = DecisionTreeClassifier(max_depth=3, random_state=0)
        rater_b.fit(X_train, y_train)

        kappa = cohen_kappa_score(rater_a.predict(X_test),
                                  rater_b.predict(X_test))
        print(round(kappa, 3))
  what_comes_out: {none: true}
  catch_outs:
    - Swapping the two raters changes nothing; the score is symmetric.
    - For ordered labels, set weights to linear or quadratic.
    - Can be undefined; replace_undefined_by sets the value.
