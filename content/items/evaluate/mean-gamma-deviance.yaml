slots:
  header: {}
  solves:
    hero: {kind: metric, dataset: ames, highlight: [ratio]}
    line: Average error for positive, skewed amounts; lower is better.
  quick_facts:
    facts:
      - {label: Best value, value: "0.0 (lower is better)"}
      - {label: Range, value: "0 to infinity"}
      - {label: Needs, value: "y_true and y_pred above 0"}
  use_avoid:
    use_when: [positive, skewed amounts]
    avoid_when: [zero or negative targets, classification]
  prep: []
  code:
    - library: scikit-learn
      target: sklearn.metrics.mean_gamma_deviance
      why_this_library: One call; y_true first, then y_pred.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_diabetes
        from sklearn.linear_model import GammaRegressor
        from sklearn.metrics import mean_gamma_deviance
        from sklearn.model_selection import train_test_split

        X, y = load_diabetes(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = GammaRegressor(max_iter=1000)
        model.fit(X_train, y_train)
        y_pred = model.predict(X_test)

        print(mean_gamma_deviance(y_test, y_pred))
  what_comes_out:
    items:
      - {name: mean_gamma_deviance, kind: return, task: regression, shape: float, note: "Lower is better; 0 means exact predictions."}
    next_step: Gamma is the Tweedie deviance at power 2.
    visual: null
  catch_outs:
    - Needs y_true and y_pred above 0; zero or negative values are rejected.
    - Lower is better, so do not maximise it.
    - Score on the test set, not the training set.
