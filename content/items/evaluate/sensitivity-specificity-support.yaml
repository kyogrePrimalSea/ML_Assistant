  code:
    - library: imbalanced-learn
      target: imblearn.metrics.sensitivity_specificity_support
      why_this_library: One call returns both scores and the class counts.
      snippet: |
        # imbalanced-learn 0.14.2
        from imblearn.metrics import sensitivity_specificity_support
        from sklearn.datasets import load_breast_cancer
        from sklearn.linear_model import LogisticRegression
        from sklearn.model_selection import train_test_split

        X, y = load_breast_cancer(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = LogisticRegression(max_iter=5000).fit(X_train, y_train)
        y_pred = model.predict(X_test)

        sens, spec, support = sensitivity_specificity_support(y_test, y_pred)
        print(sens, spec, support, sep="\n")
  what_comes_out:
    items:
      - {name: sensitivity, kind: return, task: null, shape: "array, one value per class", note: "Share of each class's real members caught, in label order."}
      - {name: specificity, kind: return, task: null, shape: "array, one value per class", note: Share of each class's non-members correctly rejected.}
      - {name: support, kind: return, task: null, shape: "int array, one value per class", note: Number of real samples in each class.}
    next_step: null
    visual: null
  catch_outs:
