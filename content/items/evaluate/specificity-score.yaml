  prep: []
  code:
    - library: imbalanced-learn
      target: imblearn.metrics.specificity_score
      why_this_library: One call; binary by default, pos_label picks the class.
      snippet: |
        # imbalanced-learn 0.14.2
        from imblearn.metrics import specificity_score
        from sklearn.datasets import load_breast_cancer
        from sklearn.linear_model import LogisticRegression
        from sklearn.model_selection import train_test_split

        X, y = load_breast_cancer(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = LogisticRegression(max_iter=5000).fit(X_train, y_train)
        y_pred = model.predict(X_test)

        print(specificity_score(y_test, y_pred))
  what_comes_out: {none: true}
  catch_outs:
    - Ignores missed positives; check sensitivity too.
    - With pos_label 1, the negatives are class 0 (malignant in breast cancer).
    - Average defaults to binary; set it for more than two classes.
