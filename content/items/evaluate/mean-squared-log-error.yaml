id: mean-squared-log-error
plain_name: MSLE
code_name: mean_squared_log_error
aliases: ["msle", "log error"]
stage: evaluate
family: evaluate.error.relative
tracks: [standard, time-series]
archetype: metric
question_tags: ["wide range of values", "relative error"]
targets: [sklearn.metrics.mean_squared_log_error]
pairs_with: []
clashes: []
source_urls: ['https://scikit-learn.org/stable/modules/generated/sklearn.metrics.mean_squared_log_error.html']
library_versions: {scikit-learn: 1.9.1}
reviewed: false
rules:
  task_types: [regression]
  blocked_when: []
  fits_on_data: false
  shape_effect: {rows: same, columns: same}
slots:
  header: {}
  solves:
    hero: {kind: metric, dataset: ames, highlight: ["residual"]}
    line: "Squared error on a log scale, so big targets do not dominate."
  quick_facts:
    facts:
    - {label: "Best score", value: "0 (perfect)"}
    - {label: "Units", value: "Squared log units"}
  use_avoid:
    use_when: ["regression", "targets span a wide range"]
    avoid_when: ["values of -1 or less", "classification"]
  prep: []
  code:
  - library: scikit-learn
    target: sklearn.metrics.mean_squared_log_error
    why_this_library: One call; y_true first, then y_pred.
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.datasets import load_diabetes
      from sklearn.linear_model import LinearRegression
      from sklearn.metrics import mean_squared_log_error
      from sklearn.model_selection import train_test_split

      X, y = load_diabetes(return_X_y=True)
      X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

      model = LinearRegression().fit(X_train, y_train)
      y_pred = model.predict(X_test)

      print(mean_squared_log_error(y_test, y_pred))
  what_comes_out: {none: true}
  catch_outs:
  - "Values of -1 or less raise an error."
  - "Squared log units are hard to read; see RMSLE."
  key_settings:
    tier1:
    - {name: multioutput, page: null}
    tier2:
    - {name: sample_weight, page: null}
    tier3: []
  watch_it_work: {none: true}
  intuition:
    text: "Compare the logs of the true and predicted values."
  next: []
