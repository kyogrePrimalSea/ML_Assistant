  prep: []
  code:
  - library: scikit-learn
    target: sklearn.model_selection.permutation_test_score
    why_this_library: Reruns cross-validation on shuffled targets.
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.datasets import load_breast_cancer
      from sklearn.linear_model import LogisticRegression
      from sklearn.model_selection import permutation_test_score
      from sklearn.pipeline import make_pipeline
      from sklearn.preprocessing import StandardScaler

      X, y = load_breast_cancer(return_X_y=True)
      model = make_pipeline(StandardScaler(), LogisticRegression())
      score, perm_scores, pvalue = permutation_test_score(
          model, X, y, scoring="accuracy", cv=5, n_permutations=100,
      )
      print(round(score, 3), round(pvalue, 3))
  what_comes_out:
    items:
    - {name: score, kind: return, task: null, shape: float, note: Cross-validated score on real labels.}
    - {name: permutation_scores, kind: return, task: null, shape: one per permutation, note: One score per shuffle of the targets.}
    - {name: pvalue, kind: return, task: null, shape: float, note: 'Chance of a score this good, from the shuffles.'}
    next_step: 'Small p-value: the model learns more than chance.'
    visual: null
  catch_outs: [Each permutation reruns the full cross-validation., groups limits shuffling to within each group.]
