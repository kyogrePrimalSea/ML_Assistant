  code:
    - library: scikit-learn
      target: sklearn.metrics.brier_score_loss
      why_this_library: One call; probabilities for the positive class.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.linear_model import LogisticRegression
        from sklearn.metrics import brier_score_loss
        from sklearn.model_selection import train_test_split

        X, y = load_breast_cancer(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = LogisticRegression(max_iter=5000).fit(X_train, y_train)
        y_proba = model.predict_proba(X_test)[:, 1]

        print(brier_score_loss(y_test, y_proba))
  what_comes_out:
    items:
      - {name: score, kind: return, task: classification, shape: float, note: Mean squared gap; lower is better.}
    next_step: Compare with log loss, which punishes confident misses harder.
