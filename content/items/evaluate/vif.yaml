  code:
  - library: statsmodels
    target: statsmodels.stats.outliers_influence.variance_inflation_factor
    why_this_library: Computes one VIF per column.
    snippet: |
      # statsmodels 0.15.0
      import numpy as np
      import statsmodels.api as sm
      from sklearn.datasets import load_diabetes
      from statsmodels.stats.outliers_influence import (
          variance_inflation_factor,
      )

      X, y = load_diabetes(return_X_y=True)
      X = sm.add_constant(X)
      vifs = [variance_inflation_factor(X, i) for i in range(1, X.shape[1])]
      print(np.round(vifs, 2))
  what_comes_out:
    items:
    - {name: variance_inflation_factor, kind: return, task: null, shape: float per column, note: Higher means more overlap with the other columns.}
    next_step: 'High values: consider dropping or combining overlapping features.'
