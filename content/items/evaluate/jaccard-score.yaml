  prep: []
  code:
    - library: scikit-learn
      target: sklearn.metrics.jaccard_score
      why_this_library: One call on predicted and true labels.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.linear_model import LogisticRegression
        from sklearn.metrics import jaccard_score
        from sklearn.model_selection import train_test_split

        X, y = load_breast_cancer(return_X_y=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = LogisticRegression(max_iter=5000).fit(X_train, y_train)
        y_pred = model.predict(X_test)

        print(jaccard_score(y_test, y_pred))
  what_comes_out: {none: true}
  catch_outs:
    - Always lower than F1 on the same predictions.
    - Multiclass needs average set; binary is the default.
    - No true or predicted positives gives 0 with a warning.
