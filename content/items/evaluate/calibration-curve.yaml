  prep: []
  code:
  - library: scikit-learn
    target: sklearn.calibration.calibration_curve
    why_this_library: Returns bin values for you to plot.
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.calibration import calibration_curve
      from sklearn.datasets import load_breast_cancer
      from sklearn.linear_model import LogisticRegression
      from sklearn.model_selection import train_test_split

      X, y = load_breast_cancer(return_X_y=True)
      X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)
      model = LogisticRegression(max_iter=5000).fit(X_train, y_train)
      y_prob = model.predict_proba(X_test)[:, 1]
      prob_true, prob_pred = calibration_curve(y_test, y_prob, n_bins=5)
      print(list(zip(prob_pred.round(2).tolist(), prob_true.round(2).tolist())))
  what_comes_out:
    items:
    - {name: prob_pred, kind: return, task: null, shape: '(n_bins,) or fewer', note: Mean predicted probability in each bin.}
    - {name: prob_true, kind: return, task: null, shape: '(n_bins,) or fewer', note: Share of positives in each bin.}
    - {name: from_predictions, kind: method, task: null, shape: display object, note: Draws the curve from labels and probabilities.}
    next_step: If the curve drifts off the diagonal, calibrate the model.
    visual: null
  catch_outs: ['Empty bins are not returned, so you can get fewer points.', More bins need more data., Takes probabilities for the positive class only.]
