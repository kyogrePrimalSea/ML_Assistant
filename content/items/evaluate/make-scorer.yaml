  prep: []
  code:
    - library: scikit-learn
      target: sklearn.metrics.make_scorer
      why_this_library: One call wraps any metric function.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.linear_model import LogisticRegression
        from sklearn.metrics import fbeta_score, make_scorer
        from sklearn.model_selection import cross_val_score

        X, y = load_breast_cancer(return_X_y=True)
        model = LogisticRegression(max_iter=5000)

        f2_scorer = make_scorer(fbeta_score, beta=2)
        scores = cross_val_score(model, X, y, cv=5, scoring=f2_scorer)
        print(round(scores.mean(), 3))
  what_comes_out:
    items:
      - {name: scorer, kind: return, task: null, shape: "callable(estimator, X, y)", note: High is good unless greater_is_better is False.}
    next_step: Pass the scorer to scoring= in cross-validation or search.
    visual: null
  catch_outs:
    - For a loss function, set greater_is_better=False.
    - Extra keyword arguments go to score_func, for example beta.
    - response_method picks predict, predict_proba or decision_function.
