  code:
    - library: scikit-learn
      target: sklearn.feature_selection.GenericUnivariateSelect
      why_this_library: One class for every univariate rule.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.feature_selection import GenericUnivariateSelect, f_classif

        data = load_breast_cancer()
        X, y = data.data, data.target

        selector = GenericUnivariateSelect(
            score_func=f_classif, mode="k_best", param=5)
        X_small = selector.fit_transform(X, y)

        print(X.shape, "->", X_small.shape)
