    hero: {kind: selector, dataset: breast-cancer, columns: [mean radius, mean texture, mean area], kept: [PC1, PC2]}
    line: Packs many columns into a few new ones.
  quick_facts:
    facts:
      - {label: Default n_components, value: "all components kept"}
