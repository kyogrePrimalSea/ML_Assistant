    - step: {family: transform.scale.rescale}
      status: required
      why: Scale first, or large columns dominate.
      condition: null
      unless: null
  code:
    - library: scikit-learn
      target: sklearn.decomposition.PCA
      why_this_library: Fits inside a Pipeline, so no leakage.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.decomposition import PCA
        from sklearn.pipeline import make_pipeline
        from sklearn.preprocessing import StandardScaler

        X, y = load_breast_cancer(return_X_y=True)

        pipe = make_pipeline(StandardScaler(), PCA(n_components=2))
        X_small = pipe.fit_transform(X)  # scale first, then compress

        print(X.shape, "->", X_small.shape)
        print(pipe[-1].explained_variance_ratio_.round(3).tolist())
  what_comes_out:
    items:
      - {name: transform, kind: method, task: null, shape: "(n_samples, n_components)", note: Projects each row onto the new components.}
      - {name: explained_variance_ratio_, kind: attribute, task: null, shape: "(n_components,)", note: Share of spread each component keeps.}
      - {name: components_, kind: attribute, task: null, shape: "(n_components, n_features)", note: Weights that mix the original columns.}
      - {name: inverse_transform, kind: method, task: null, shape: "(n_samples, n_features)", note: Maps components back to the original space.}
    next_step: Feed the components to a model.
    visual: null
  catch_outs:
    - Components mix the original columns, so their meaning is lost.
    - Scale columns first, or large ones dominate.
    - Fit on training rows only.
  key_settings:
    tier1:
