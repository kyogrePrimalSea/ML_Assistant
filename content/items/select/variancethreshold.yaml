  code:
    - library: scikit-learn
      target: sklearn.feature_selection.VarianceThreshold
      why_this_library: Needs no target, so it runs without labels.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.datasets import load_breast_cancer
        from sklearn.feature_selection import VarianceThreshold

        data = load_breast_cancer()
        # Add a column that never changes, to see it go
        X = np.column_stack([data.data, np.ones(len(data.data))])

        selector = VarianceThreshold()
        X_small = selector.fit_transform(X)

        print(X.shape, "->", X_small.shape)
