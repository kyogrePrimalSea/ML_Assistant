id: f-regression
plain_name: F-score for numbers
code_name: f_regression
aliases: [linear regression F-test]
stage: select
family: select.scores
tracks: [standard]
archetype: selector
question_tags: [numeric features, numeric target]
targets: [sklearn.feature_selection.f_regression]
pairs_with: []
clashes: []
source_urls: ['https://scikit-learn.org/stable/modules/generated/sklearn.feature_selection.f_regression.html']
