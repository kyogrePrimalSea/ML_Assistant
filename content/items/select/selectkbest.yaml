  code:
    - library: scikit-learn
      target: sklearn.feature_selection.SelectKBest
      why_this_library: Simple filter that fits inside a Pipeline.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.feature_selection import SelectKBest, f_classif

        data = load_breast_cancer()
        X, y = data.data, data.target

        selector = SelectKBest(score_func=f_classif, k=5)
        X_small = selector.fit_transform(X, y)

        print(X.shape, "->", X_small.shape)
        print(data.feature_names[selector.get_support()].tolist())
  what_comes_out: {none: true}
  catch_outs:
    - Default score_func f_classif only works for classification.
    - For regression, pass f_regression.
    - Fit on training rows only, or scores leak.
