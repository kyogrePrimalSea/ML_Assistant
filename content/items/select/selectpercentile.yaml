      - {name: transform, kind: method, task: null, shape: '(n_samples, n_kept)', note: Keeps only the kept columns.}
      - {name: get_feature_names_out, kind: method, task: null, shape: '(n_kept,)', note: Names of the kept columns.}
      - {name: inverse_transform, kind: method, task: null, shape: '(n_samples, n_features)', note: Puts dropped columns back as zeros.}
      - {name: scores_, kind: attribute, task: null, shape: '(n_features,)', note: Score per column. Higher means a stronger link.}
      - {name: pvalues_, kind: attribute, task: null, shape: '(n_features,)', note: Chance of a score this high with no real link.}
    next_step: Fit on training rows, then pass the kept columns to a model.
    visual: null
  catch_outs:
    - The kept count is a share, so it moves with the column count.
    - At percentile 10, breast cancer keeps 3 of 30 columns.
    - Default score_func f_classif only works for classification.
    - Fit on training rows only, or scores leak.
