slots:
  header: {}
  solves:
    hero:
      kind: selector
      dataset: breast-cancer
      columns: [mean radius, mean texture, mean area, mean smoothness]
      kept: [mean radius, mean area]
    line: Scores each numeric column against a category target.
  quick_facts:
    facts:
    - {label: Scores, value: F-value and p-value}
    - {label: Needs, value: numeric columns}
  use_avoid:
    use_when: [numeric features, category target]
    avoid_when: [curved links, categorical columns]
  prep:
  - step: {page: train-test-split}
    status: required
    why: Score columns on training rows only.
    condition: null
    unless: null
  - step: {family: transform.scale.rescale}
    status: not_needed
    why: F-scores do not change when columns are rescaled.
    condition: null
    unless: null
  code:
  - library: scikit-learn
    target: sklearn.feature_selection.f_classif
    why_this_library: Standard F-test; plugs into SelectKBest.
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.datasets import load_breast_cancer
      from sklearn.feature_selection import f_classif
      from sklearn.model_selection import train_test_split

      data = load_breast_cancer()
      X_train, X_test, y_train, y_test = train_test_split(
          data.data, data.target, random_state=0)

      scores, p_values = f_classif(X_train, y_train)
      top = scores.argsort()[::-1][:3]
      print([str(data.feature_names[i]) for i in top])
  what_comes_out:
    items:
    - {name: f_statistic, kind: return, task: classification, shape: '(n_features,)', note: Score per column. Higher means a bigger gap between classes.}
    - {name: p_values, kind: return, task: classification, shape: '(n_features,)', note: Chance of a score this high with no real link.}
    next_step: Sort by score and keep the top columns.
    visual: null
  catch_outs: ['Each column is scored alone, so pairs can be missed.', 'Fit on training rows only, or scores leak.', Misses curved links; mutual information catches them.]
  key_settings:
