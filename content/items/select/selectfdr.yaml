  code:
    - library: scikit-learn
      target: sklearn.feature_selection.SelectFdr
      why_this_library: Filter that fits inside a Pipeline.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.feature_selection import SelectFdr, f_classif

        data = load_breast_cancer()
        X, y = data.data, data.target

        selector = SelectFdr(score_func=f_classif, alpha=0.05)
        X_small = selector.fit_transform(X, y)

        print(X.shape, "->", X_small.shape)
