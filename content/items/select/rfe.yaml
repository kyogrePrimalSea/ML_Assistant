reviewed: false
rules:
  task_types: [regression, classification]
  blocked_when: []
  fits_on_data: true
  shape_effect: {rows: same, columns: shrinks}
slots:
  header: {}
  solves:
    hero: {kind: selector, dataset: breast-cancer, columns: [worst radius, worst texture, mean smoothness], kept: [worst radius, worst texture]}
    line: Drops the weakest column, refits, and repeats.
  quick_facts:
    facts:
      - {label: Default n_features_to_select, value: "half of the columns"}
      - {label: Learns from data, value: "yes: fit on train only"}
  use_avoid:
    use_when: [many columns, model with coefficients or importances]
    avoid_when: [no coefficients or importances, big data with many columns]
  prep:
    - step: {page: train-test-split}
      status: required
      why: Rank columns on training rows only.
      condition: null
      unless: null
    - step: {family: transform.scale.rescale}
      status: recommended
      why: Coefficient-based estimators need scaled columns.
      condition: null
      unless: null
  code:
    - library: scikit-learn
      target: sklearn.feature_selection.RFE
      why_this_library: Fits inside a Pipeline, so no leakage.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.feature_selection import RFE
        from sklearn.linear_model import LogisticRegression
        from sklearn.pipeline import make_pipeline
        from sklearn.preprocessing import StandardScaler

        data = load_breast_cancer()
        X, y = data.data, data.target

        pipe = make_pipeline(
            StandardScaler(),
            RFE(LogisticRegression(max_iter=5000), n_features_to_select=5),
        )
        X_small = pipe.fit_transform(X, y)

        print(X.shape, "->", X_small.shape)
        print(data.feature_names[pipe[-1].get_support()].tolist())
  what_comes_out:
    items:
      - {name: get_support, kind: method, task: null, shape: "(n_features,)", note: Mask of the kept columns.}
      - {name: transform, kind: method, task: null, shape: "(n_samples, n_selected)", note: Keeps only the selected columns.}
      - {name: ranking_, kind: attribute, task: null, shape: "(n_features,)", note: Rank of each column from the elimination.}
      - {name: n_features_, kind: attribute, task: null, shape: int, note: Number of columns kept.}
    next_step: Train the model on the kept columns.
    visual: null
  catch_outs:
    - You choose how many to keep; RFE does not search for the count.
    - Ranking uses the estimator's own importances.
    - Fit on training rows only.
  key_settings:
    tier1:
      - {name: estimator, page: null}
      - {name: n_features_to_select, page: null}
      - {name: step, page: null}
    tier2:
      - {name: importance_getter, page: null}
    tier3: []
  watch_it_work: {none: true}
  intuition: {text: "Drop the weakest column, refit, and repeat until enough remain."}
  next: []
