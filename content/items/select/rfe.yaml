id: rfe
plain_name: Recursive elimination
code_name: RFE
aliases: [recursive feature elimination]
stage: select
family: select.model-based
tracks: [standard]
archetype: selector
question_tags: [too many columns, keep the strongest]
targets: [sklearn.feature_selection.RFE]
pairs_with: [pipeline]
clashes: []
source_urls:
