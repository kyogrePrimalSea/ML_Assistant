reviewed: false
rules:
  task_types: [regression]
  blocked_when:
  - when: {has_categoricals: true}
    reason: Needs numeric columns; encode categories first.
  fits_on_data: true
  shape_effect: {rows: same, columns: same}
slots:
  header: {}
  solves:
    hero:
      kind: selector
      dataset: ames
      columns: [LotArea, YearBuilt, GrLivArea, BedroomAbvGr]
      kept: [GrLivArea, YearBuilt]
    line: Scores each numeric column by its straight-line link to the target.
  quick_facts:
    facts:
    - {label: Scores, value: signed correlation}
    - {label: Range, value: -1 to 1}
  use_avoid:
    use_when: [numeric features, numeric target]
    avoid_when: [curved links, categorical columns]
  prep:
  - step: {page: train-test-split}
    status: required
    why: Score columns on training rows only.
    condition: null
    unless: null
  - step: {family: transform.scale.rescale}
    status: not_needed
    why: Correlation does not change when columns are rescaled.
    condition: null
    unless: null
  code:
  - library: scikit-learn
    target: sklearn.feature_selection.r_regression
    why_this_library: Simple correlation score; plugs into SelectKBest.
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.datasets import load_diabetes
      from sklearn.feature_selection import r_regression
      from sklearn.model_selection import train_test_split

      data = load_diabetes()
      X_train, X_test, y_train, y_test = train_test_split(
          data.data, data.target, random_state=0)

      scores = r_regression(X_train, y_train)
      top = abs(scores).argsort()[::-1][:3]
      print([str(data.feature_names[i]) for i in top])
  what_comes_out:
    items:
    - {name: correlation_coefficient, kind: return, task: regression, shape: '(n_features,)', note: Signed score per column. Near 1 or -1 means a tight line.}
    next_step: Keep the columns with scores furthest from zero.
    visual: null
  catch_outs: [Negative scores are real; sort by absolute value., Misses curved links; mutual information catches them., 'Fit on training rows only, or scores leak.']
  key_settings:
    tier1:
    - {name: force_finite, page: null}
    - {name: center, page: null}
    tier2: []
    tier3: []
  watch_it_work: {none: true}
  intuition: {text: Measures how closely each column moves in a straight line with the target.}
  next: [but-how-many-features]
