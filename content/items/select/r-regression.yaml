id: r-regression
plain_name: Correlation score
code_name: r_regression
aliases: [Pearson correlation]
stage: select
family: select.scores
tracks: [standard]
archetype: selector
question_tags: [numeric features, numeric target]
targets: [sklearn.feature_selection.r_regression]
pairs_with: []
clashes: []
source_urls: ['https://scikit-learn.org/stable/modules/generated/sklearn.feature_selection.r_regression.html']
