  code:
    - library: scikit-learn
      target: sklearn.decomposition.TruncatedSVD
      why_this_library: Accepts sparse matrices directly.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.decomposition import TruncatedSVD
        from sklearn.preprocessing import KBinsDiscretizer

        X, y = load_breast_cancer(return_X_y=True)
        bins = KBinsDiscretizer(n_bins=5, encode="onehot")
        X_sparse = bins.fit_transform(X)  # sparse one-hot columns

        svd = TruncatedSVD(n_components=2, random_state=0)
        X_small = svd.fit_transform(X_sparse)

        print(X_sparse.shape, "->", X_small.shape)
        print(svd.singular_values_.round(2).tolist())
