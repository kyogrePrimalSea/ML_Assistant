  - library: scikit-learn
    target: sklearn.feature_selection.mutual_info_classif
    why_this_library: Estimates any link, not only straight lines.
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.datasets import load_breast_cancer
      from sklearn.feature_selection import mutual_info_classif
      from sklearn.model_selection import train_test_split

      data = load_breast_cancer()
      X_train, X_test, y_train, y_test = train_test_split(
          data.data, data.target, random_state=0)

      scores = mutual_info_classif(X_train, y_train, random_state=0)
      top = scores.argsort()[::-1][:3]
      print([str(data.feature_names[i]) for i in top])
