  code:
    - library: scikit-learn
      target: sklearn.feature_selection.SelectFromModel
      why_this_library: Works with any model that gives importances.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.ensemble import RandomForestClassifier
        from sklearn.feature_selection import SelectFromModel

        data = load_breast_cancer()
        X, y = data.data, data.target

        selector = SelectFromModel(
            RandomForestClassifier(n_estimators=100, random_state=0),
            max_features=5,
        )
        X_small = selector.fit_transform(X, y)

        print(X.shape, "->", X_small.shape)
        print(data.feature_names[selector.get_support()].tolist())
  what_comes_out:
