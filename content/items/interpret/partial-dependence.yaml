id: partial-dependence
plain_name: Partial dependence
code_name: PartialDependenceDisplay
aliases: [PDP, partial dependence plot, average effect plot]
stage: interpret
family: interpret.effect
tracks: [standard]
archetype: diagnostic
question_tags: [how one feature moves prediction, average effect]
