  use_avoid:
    use_when: [see class regions, two features at once]
    avoid_when: [more than two features, regression task]
  prep: []
  code:
    - library: scikit-learn
      target: sklearn.inspection.DecisionBoundaryDisplay
      why_this_library: "Draws regions for any fitted classifier in one call."
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import make_classification
        from sklearn.inspection import DecisionBoundaryDisplay
        from sklearn.linear_model import LogisticRegression

        X, y = make_classification(
            n_samples=200, n_features=2, n_informative=2, n_redundant=0,
            random_state=0,
        )
        model = LogisticRegression().fit(X, y)

        display = DecisionBoundaryDisplay.from_estimator(
            model, X, xlabel="feature 0", ylabel="feature 1"
        )
        print(type(display.surface_).__name__)
  what_comes_out:
    items:
      - {name: from_estimator, kind: method, task: classification, shape: "DecisionBoundaryDisplay", note: "Draws the regions and returns the display."}
      - {name: plot, kind: method, task: classification, shape: "DecisionBoundaryDisplay", note: "Redraws the regions and returns the display."}
      - {name: surface_, kind: attribute, task: null, shape: "contour set", note: "The drawn region surface."}
      - {name: figure_, kind: attribute, task: null, shape: "matplotlib Figure", note: "Figure the regions are drawn on."}
      - {name: ax_, kind: attribute, task: null, shape: "matplotlib Axes", note: "Axes to add points or labels to."}
    next_step: "Overlay the training points on ax_ to check the fit."
    visual: null
  catch_outs:
    - "Needs exactly two features in X."
    - "response_method picks which model output is drawn."
  key_settings:
