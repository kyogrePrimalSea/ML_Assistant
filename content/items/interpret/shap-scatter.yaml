slots:
  header: {}
  solves:
    hero: {kind: diagnostic, dataset: ames, chart: "SHAP value by feature value, coloured by a second feature"}
    line: Shows one feature's effect, coloured by another feature.
  quick_facts:
    facts:
      - {label: "Default colour", value: "one blue"}
      - {label: "Default histogram", value: "shown"}
      - {label: "Default jitter", value: "auto"}
  use_avoid:
    use_when: [one feature's effect, spotting interactions]
    avoid_when: [whole-model overview]
  prep: []
  code:
    - library: shap
      target: shap.plots.scatter
      why_this_library: "Colours points by a second feature in one call."
      snippet: |
        # shap 0.54.1
        import shap
        from sklearn.datasets import make_regression
        from sklearn.ensemble import RandomForestRegressor

        X, y = make_regression(n_samples=300, n_features=4, noise=10, random_state=0)
        model = RandomForestRegressor(n_estimators=50, random_state=0).fit(X, y)

        names = ["age", "income", "tenure", "score"]
        explainer = shap.TreeExplainer(model, feature_names=names)
        shap_values = explainer(X)
        ax = shap.plots.scatter(shap_values[:, 0], color=shap_values[:, 1], show=False)
        print(ax.get_xlabel())
  what_comes_out:
    items:
      - {name: ax, kind: return, task: null, shape: "matplotlib Axes", note: "Axes the scatter is drawn on."}
    next_step: "Compare with the partial dependence plot for this feature."
    visual: null
  catch_outs:
    - "Pass one feature column, not the whole Explanation."
    - "x_jitter adds random noise to aid readability."
