slots:
  header: {}
  solves:
    hero: {kind: diagnostic, dataset: ames, chart: average curve over one feature}
    line: Partial dependence drawn with SHAP's own plot function.
  quick_facts:
    facts:
      - {label: "Default range", value: "0th to 100th percentile"}
      - {label: "Default histogram", value: "shown"}
  use_avoid:
    use_when: [one feature's average effect, SHAP overlays]
    avoid_when: [two features at once]
  prep: []
  code:
    - library: shap
      target: shap.plots.partial_dependence
      why_this_library: "Plots any callable model with SHAP's own partial dependence."
      snippet: |
        # shap 0.54.1
        import shap
        from sklearn.datasets import make_regression
        from sklearn.ensemble import RandomForestRegressor

        X, y = make_regression(n_samples=300, n_features=4, noise=10, random_state=0)
        model = RandomForestRegressor(n_estimators=50, random_state=0).fit(X, y)

        fig, ax = shap.plots.partial_dependence(0, model.predict, X, show=False)
        print(ax.get_ylabel())
  what_comes_out:
    items:
      - {name: "figure, axes", kind: return, task: null, shape: "tuple", note: "Returns None unless show is False."}
    next_step: "Compare the curve with scikit-learn's partial dependence."
    visual: null
  catch_outs:
    - "Takes one feature index per call."
    - "Returns nothing when show is True, so set show to False to get axes."
