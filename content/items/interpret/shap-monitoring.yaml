  prep:
    - {step: {page: explainer}, status: required, why: Needs SHAP values from an explainer, condition: null, unless: null}
  code:
    - library: shap
      target: shap.plots.monitoring
      why_this_library: Plots one feature's SHAP values across rows.
      snippet: |
        # shap 0.54.1
        import numpy as np
        import shap
        from sklearn.datasets import load_diabetes
        from sklearn.ensemble import RandomForestRegressor

        X, y = load_diabetes(return_X_y=True, as_frame=True)
        model = RandomForestRegressor(n_estimators=50, random_state=0).fit(X, y)

        explainer = shap.TreeExplainer(model)
        shap_values = explainer(X).values
        shap.plots.monitoring(2, shap_values, X.values, feature_names=X.columns,
                              show=False)
        half = len(X) // 2
        print(np.abs(shap_values[:half, 2]).mean().round(2),
              np.abs(shap_values[half:, 2]).mean().round(2))
  what_comes_out: {none: true}
  catch_outs:
    - Rows are plotted in the order you pass them.
    - Shows one feature at a time; pass its index as ind.
  key_settings:
