  use_avoid:
    use_when: [any model, no faster option]
    avoid_when: [large background set, many rows]
  prep: []
  code:
    - library: shap
      target: shap.KernelExplainer
      why_this_library: "Works on any function, at a cost in speed."
      snippet: |
        # shap 0.54.1
        import shap
        from sklearn.datasets import make_classification
        from sklearn.linear_model import LogisticRegression

        X, y = make_classification(n_samples=200, n_features=6, random_state=0)
        model = LogisticRegression().fit(X, y)


        def predict(data):
            return model.predict_proba(data)[:, 1]


        background = shap.kmeans(X, 10)
        explainer = shap.KernelExplainer(predict, background)
        shap_values = explainer.shap_values(X[:5], nsamples=100)
        print(shap_values.shape)
  what_comes_out:
    items:
      - {name: shap_values, kind: method, task: null, shape: "(rows, features)", note: "Estimated values for each row and feature."}
    next_step: "Try PermutationExplainer, which is faster."
    visual: null
  catch_outs:
    - "Slow, so use a small background set."
    - "Results are estimates, not exact values."
