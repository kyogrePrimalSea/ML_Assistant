  prep:
    - {step: {page: explainer}, status: required, why: Needs SHAP values from an explainer, condition: null, unless: null}
  code:
    - library: shap
      target: shap.plots.group_difference
      why_this_library: Compares mean SHAP values across two groups.
      snippet: |
        # shap 0.54.1
        import shap
        from sklearn.datasets import load_diabetes
        from sklearn.ensemble import RandomForestRegressor

        X, y = load_diabetes(return_X_y=True, as_frame=True)
        model = RandomForestRegressor(n_estimators=50, random_state=0).fit(X, y)

        explainer = shap.TreeExplainer(model)
        shap_values = explainer(X)
        high_bmi = (X["bmi"] > X["bmi"].median()).values
        shap.plots.group_difference(
            shap_values.values, high_bmi, feature_names=X.columns, show=False,
        )
        diff = shap_values.values[high_bmi].mean(0)
        diff = diff - shap_values.values[~high_bmi].mean(0)
        print(diff.round(1))
  what_comes_out: {none: true}
  catch_outs:
    - True in the mask is the first group.
    - No significance test; a gap is not proof of a real difference.
