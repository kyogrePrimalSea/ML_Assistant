  prep: []
  code:
    - library: shap
      target: shap.LinearExplainer
      why_this_library: Built for linear models.
      snippet: |
        # shap 0.54.1
        import numpy as np
        import shap
        from sklearn.datasets import make_regression
        from sklearn.linear_model import LinearRegression

        np.set_printoptions(precision=2, suppress=True)

        X, y = make_regression(n_samples=200, n_features=4, noise=10, random_state=0)
        model = LinearRegression().fit(X, y)

        explainer = shap.LinearExplainer(model, X[:100])
        shap_values = explainer.shap_values(X[:5])
        print(shap_values.round(2))
  what_comes_out:
    items:
      - {name: shap_values, kind: method, task: null, shape: "(n_rows, n_features)", note: SHAP values for each row and feature.}
    next_step: Plot them with shap-bar or shap-beeswarm.
    visual: null
  catch_outs:
    - Only for linear models; tree models need TreeExplainer.
    - feature_perturbation is deprecated; set the masker instead.
    - Background data over 100 rows is subsampled to 100.
