  prep: []
  code:
    - library: scikit-learn
      target: sklearn.inspection.permutation_importance
      why_this_library: Works with any fitted model.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import make_regression
        from sklearn.ensemble import RandomForestRegressor
        from sklearn.inspection import permutation_importance
        from sklearn.model_selection import train_test_split

        X, y = make_regression(n_samples=300, n_features=5, n_informative=3,
                               noise=20, random_state=0)
        X_train, X_test, y_train, y_test = train_test_split(
            X, y, random_state=0)
        model = RandomForestRegressor(n_estimators=50, random_state=0)
        model.fit(X_train, y_train)

        result = permutation_importance(
            model, X_test, y_test, n_repeats=10, random_state=0
        )
        print(result.importances_mean.round(2))
  what_comes_out:
    items:
      - {name: result, kind: return, task: null, shape: Bunch of arrays, note: Holds importances_mean and importances_std.}
    next_step: Cross-check correlated features with a second method.
    visual: null
  catch_outs:
    - Correlated features can understate each other's importance.
    - Scores on training data can overstate importance.
    - Random seed changes results unless random_state is set.
