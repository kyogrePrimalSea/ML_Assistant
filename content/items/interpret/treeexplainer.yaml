reviewed: false
rules:
  task_types: [regression, classification]
  blocked_when: []
  fits_on_data: false
  shape_effect: {rows: same, columns: same}
slots:
  header: {}
  solves:
    hero: {kind: diagnostic, dataset: ames, chart: SHAP values for a random forest}
    line: Gives fast, exact SHAP values for tree models.
  quick_facts:
    facts:
      - {label: Model type, value: tree-based}
      - {label: Model output, value: raw by default}
  use_avoid:
    use_when: [tree models, fast SHAP values]
    avoid_when: [linear models, neural networks]
  prep:
    - {step: {family: transform.scale.rescale}, status: not_needed, why: "Trees split on order, not size.", condition: null, unless: null}
  code:
    - library: shap
      target: shap.TreeExplainer
      why_this_library: Built for tree models.
      snippet: |
        # shap 0.54.1
        import numpy as np
        import shap
        from sklearn.datasets import make_regression
        from sklearn.ensemble import RandomForestRegressor

        np.set_printoptions(precision=2, suppress=True)

        X, y = make_regression(n_samples=200, n_features=4, noise=10, random_state=0)
        model = RandomForestRegressor(n_estimators=50, random_state=0).fit(X, y)

        explainer = shap.TreeExplainer(model)
        shap_values = explainer.shap_values(X[:5])
        print(shap_values.round(2))
  what_comes_out:
    items:
      - {name: shap_values, kind: method, task: null, shape: "(n_rows, n_features)", note: SHAP values for each row and feature.}
    next_step: Plot them with shap-bar or shap-beeswarm.
    visual: null
  catch_outs:
    - Tree models only; other models need another explainer.
    - With no data, values follow the tree paths.
    - Output is raw model output unless model_output is changed.
  key_settings:
    tier1:
