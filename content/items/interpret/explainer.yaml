  code:
    - library: shap
      target: shap.Explainer
      why_this_library: Chooses the algorithm for you.
      snippet: |
        # shap 0.54.1
        import numpy as np
        import shap
        from sklearn.datasets import make_regression
        from sklearn.linear_model import LinearRegression

        np.set_printoptions(precision=2, suppress=True)

        X, y = make_regression(n_samples=200, n_features=4, noise=10, random_state=0)
        model = LinearRegression().fit(X, y)

        explainer = shap.Explainer(model, X[:100])
        shap_values = explainer(X[:5])
        print(type(explainer).__name__)
        print(shap_values.values.round(2))
