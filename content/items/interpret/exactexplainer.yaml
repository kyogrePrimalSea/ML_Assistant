  prep: []
  code:
    - library: shap
      target: shap.ExactExplainer
      why_this_library: "Exact values, but cost grows fast with features."
      snippet: |
        # shap 0.54.1
        import shap
        from sklearn.datasets import make_classification
        from sklearn.linear_model import LogisticRegression

        X, y = make_classification(n_samples=200, n_features=6, random_state=0)
        model = LogisticRegression().fit(X, y)


        def predict(data):
            return model.predict_proba(data)[:, 1]


        masker = shap.maskers.Independent(X, max_samples=200)
        explainer = shap.ExactExplainer(predict, masker)
        explanation = explainer(X[:5])
        print(explanation.values.shape)
  what_comes_out:
    items:
      - {name: "explainer(X)", kind: return, task: null, shape: "Explanation: (rows, features)", note: "Values, base values and data."}
    next_step: "Plot the values with a SHAP bar or beeswarm plot."
    visual: null
  catch_outs:
