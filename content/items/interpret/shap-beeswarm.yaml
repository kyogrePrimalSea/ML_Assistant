  code:
    - library: shap
      target: shap.plots.beeswarm
      why_this_library: Plots SHAP values you already computed.
      snippet: |
        # shap 0.54.1
        import numpy as np
        import shap
        from sklearn.datasets import make_regression
        from sklearn.linear_model import LinearRegression

        X, y = make_regression(n_samples=200, n_features=4, noise=10, random_state=0)
        model = LinearRegression().fit(X, y)

        explainer = shap.Explainer(model, X[:100])
        shap_values = explainer(X[:100])
        shap.plots.beeswarm(shap_values)
        print(np.abs(shap_values.values).mean(axis=0).round(2))
