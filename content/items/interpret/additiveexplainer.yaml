  prep: []
  code:
    - library: shap
      target: shap.AdditiveExplainer
      why_this_library: Needs a masker built from the data.
      snippet: |
        # shap 0.54.1
        import numpy as np
        import shap
        from sklearn.datasets import make_regression
        from sklearn.linear_model import LinearRegression

        np.set_printoptions(precision=2, suppress=True)

        X, y = make_regression(n_samples=200, n_features=4, noise=10, random_state=0)
        model = LinearRegression().fit(X, y)

        masker = shap.maskers.Independent(X[:100])
        explainer = shap.AdditiveExplainer(model.predict, masker)
        shap_values = explainer(X[:5])
        print(shap_values.values.round(2))
  what_comes_out:
    items:
      - {name: Explanation, kind: return, task: null, shape: "(n_rows, n_features)", note: Returned when the explainer is called on rows.}
    next_step: Plot it with shap-bar or shap-beeswarm.
    visual: null
  catch_outs:
    - Needs a masker, or the explainer cannot be built.
    - Assumes no interactions between features.
    - Masker data over 100 rows is subsampled to 100.
