  prep: []
  code:
    - library: shap
      target: shap.Explanation
      why_this_library: The object the SHAP plots accept.
      snippet: |
        # shap 0.54.1
        import shap
        from sklearn.datasets import load_diabetes
        from sklearn.ensemble import RandomForestRegressor

        X, y = load_diabetes(return_X_y=True, as_frame=True)
        model = RandomForestRegressor(n_estimators=50, random_state=0).fit(X, y)

        explainer = shap.TreeExplainer(model)
        explanation = explainer(X.iloc[:20])
        print(explanation.shape)
  what_comes_out:
    items:
      - {name: values, kind: attribute, task: null, shape: rows by features, note: The SHAP values themselves}
      - {name: base_values, kind: attribute, task: null, shape: one per row, note: Starting point for each row}
      - {name: data, kind: attribute, task: null, shape: rows by features, note: Feature values the SHAP values explain}
