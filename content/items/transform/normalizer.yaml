  code:
    - library: scikit-learn
      target: sklearn.preprocessing.Normalizer
      why_this_library: Stateless, so it is safe in any Pipeline.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import make_regression
        from sklearn.preprocessing import Normalizer

        X, _ = make_regression(n_samples=5, n_features=3, random_state=0)
        X[:, 0] *= 1000  # one column on a much bigger scale

        normalizer = Normalizer()  # norm="l2" by default, nothing learned
        X_unit = normalizer.fit_transform(X)

        print(X_unit[:2].round(3).tolist())
        print((X_unit ** 2).sum(axis=1).round(3))
