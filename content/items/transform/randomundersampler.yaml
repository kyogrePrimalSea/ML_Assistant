slots:
  header: {}
  solves:
    hero: {kind: resampler, dataset: breast-cancer, classes: [malignant, benign], before: [212, 357], after: [212, 212]}
    line: Drops common rows at random until the classes match.
  quick_facts:
    facts:
      - {label: Removes, value: "common rows, picked at random"}
      - {label: Learns from data, value: "yes: counts each class"}
  use_avoid:
    use_when: [imbalanced classes, quick baseline, category columns]
    avoid_when: [need every common row, regression]
  prep:
    - step: {page: train-test-split}
      status: required
      why: Resample the training rows only.
      condition: null
      unless: null
    - step: {family: transform.scale.rescale}
      status: not_needed
      why: Random picks ignore column scale.
      condition: null
      unless: null
  code:
    - library: imbalanced-learn
      target: imblearn.under_sampling.RandomUnderSampler
      why_this_library: Undersamplers live in imbalanced-learn, not scikit-learn.
      snippet: |
        # imbalanced-learn 0.14.2
        from collections import Counter
        
        from imblearn.under_sampling import RandomUnderSampler
        from sklearn.datasets import load_breast_cancer
        
        X, y = load_breast_cancer(return_X_y=True)
        print("before", Counter(y.tolist()))
        
        rus = RandomUnderSampler(random_state=0)
        X_res, y_res = rus.fit_resample(X, y)
        print("after", Counter(y_res.tolist()))
  what_comes_out:
    items:
      - {name: fit_resample, kind: method, task: null, shape: "two arrays, X and y", note: "Returns resampled X and y."}
      - {name: sample_indices_, kind: attribute, task: null, shape: "1-D array", note: "Row positions that were kept."}
      - {name: sampling_strategy_, kind: attribute, task: null, shape: dict, note: "Target row count per class."}
    next_step: Fit your model on the resampled X and y.
    visual: null
  catch_outs:
    - Resample after the split, on training rows only.
    - Random picks can drop rows that carry the pattern you need.
    - With replacement on, a common row can be picked twice.
  key_settings:
    tier1:
      - {name: sampling_strategy, page: null}
      - {name: replacement, page: null}
    tier2:
      - {name: random_state, page: null}
    tier3: []
  watch_it_work: {none: true}
