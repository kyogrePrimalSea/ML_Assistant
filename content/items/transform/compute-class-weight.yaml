    hero: {kind: resampler, dataset: breast-cancer, classes: [malignant, benign], before: [212, 357], after: [212, 357]}
    line: Makes rare rows count more, without changing the data.
  quick_facts:
    facts:
      - {label: Changes, value: "row weights, not rows"}
      - {label: Learns from data, value: "yes: counts the labels"}
  use_avoid:
