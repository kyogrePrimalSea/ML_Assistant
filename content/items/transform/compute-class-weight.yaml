  code:
    - library: scikit-learn
      target: sklearn.utils.class_weight.compute_class_weight
      why_this_library: Part of scikit-learn; no rows are added or removed.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.datasets import load_breast_cancer
        from sklearn.utils.class_weight import compute_class_weight
        
        X, y = load_breast_cancer(return_X_y=True)
        classes = np.unique(y)
        weights = compute_class_weight("balanced", classes=classes, y=y)
        print(dict(zip(classes.tolist(), weights.round(3).tolist())))
  what_comes_out:
    items:
      - {name: compute_class_weight, kind: return, task: null, shape: "(n_classes,)", note: "One weight per class, in classes order."}
    next_step: Pass the weights to the model as class_weight.
    visual: null
  catch_outs:
    - Compute weights from training labels only.
    - Gives weights only; the rows stay as they are.
    - Use sample_weight when weights must follow each row.
