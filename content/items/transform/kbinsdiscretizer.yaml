  code:
    - library: scikit-learn
      target: sklearn.preprocessing.KBinsDiscretizer
      why_this_library: Learns the bin edges, so test rows reuse them.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_diabetes
        from sklearn.model_selection import train_test_split
        from sklearn.preprocessing import KBinsDiscretizer

        X, y = load_diabetes(return_X_y=True)
        first = X[:, [0]]  # one numeric column, kept 2-D
        first_train, first_test = train_test_split(first, random_state=0)

        binner = KBinsDiscretizer(
            n_bins=3, encode="onehot-dense", strategy="quantile"
        )
        train_binned = binner.fit_transform(first_train)  # learn bin edges here
        test_binned = binner.transform(first_test)        # reuse the same edges

        print(test_binned[:3])
