      condition: {has_categoricals: true}
      unless: null
  code:
    - library: imbalanced-learn
      target: imblearn.under_sampling.OneSidedSelection
      why_this_library: The home of OneSidedSelection; scikit-learn has no resamplers.
      snippet: |
        # imbalanced-learn 0.14.2
        from collections import Counter

        from imblearn.under_sampling import OneSidedSelection
        from sklearn.datasets import load_breast_cancer
        from sklearn.preprocessing import StandardScaler

        X, y = load_breast_cancer(return_X_y=True)
        X = StandardScaler().fit_transform(X)  # neighbour distances need one scale
        print("before", dict(sorted(Counter(y.tolist()).items())))

        X_res, y_res = OneSidedSelection(random_state=0).fit_resample(X, y)
        print("after", dict(sorted(Counter(y_res.tolist()).items())))
  what_comes_out:
    items:
    - {name: fit_resample, kind: method, task: null, shape: "(n_samples_new, n_features)", note: "Returns the cleaned X and y, with fewer rows."}
    - {name: sample_indices_, kind: attribute, task: null, shape: "(n_new_samples,)", note: "Row positions of the samples returned."}
    - {name: sampling_strategy_, kind: attribute, task: null, shape: "dict of class counts", note: "Per-class target counts the sampler used."}
    next_step: Train the model on the cleaned training rows.
    visual: null
