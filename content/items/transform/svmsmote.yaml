id: svmsmote
plain_name: SVMSMOTE
code_name: SVMSMOTE
aliases: ["svm smote", "boundary", "oversampling"]
stage: transform
family: transform.rebalance.over-hard
tracks: [standard]
archetype: resampler
question_tags: ["imbalanced", "rare class", "boundary"]
