    - library: scikit-learn
      target: sklearn.preprocessing.LabelEncoder
      why_this_library: Learns the classes once, so test labels reuse the same codes.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.datasets import load_iris
        from sklearn.model_selection import train_test_split
        from sklearn.preprocessing import LabelEncoder

        X, y = load_iris(return_X_y=True)
        names = np.array(["setosa", "versicolor", "virginica"])[y]  # text labels
        X_train, X_test, y_train, y_test = train_test_split(
            X, names, random_state=0, stratify=names
        )

        encoder = LabelEncoder()
        y_train_int = encoder.fit_transform(y_train)  # learn the classes here
        y_test_int = encoder.transform(y_test)        # reuse the same mapping

        print(encoder.classes_)
        print(y_test_int[:5])
  what_comes_out:
    items:
      - {kind: method, name: transform, note: Each class name becomes its integer code., shape: '(n_samples,)', task: classification}
      - {kind: method, name: fit_transform, note: Learns the classes and encodes them in one step., shape: '(n_samples,)', task: classification}
      - {kind: method, name: inverse_transform, note: Turns integer codes back into class names., shape: '(n_samples,)', task: null}
      - {kind: attribute, name: classes_, note: The class names; position is the code., shape: '(n_classes,)', task: null}
    next_step: Pass the integer codes to the model as y.
