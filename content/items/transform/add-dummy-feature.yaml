        # scikit-learn 1.9.1
        from sklearn.datasets import make_regression
        from sklearn.preprocessing import add_dummy_feature

        X, _ = make_regression(n_samples=5, n_features=2, random_state=0)
        X_plus = add_dummy_feature(X)  # adds a column of 1.0

        print(X_plus.shape)
        print(X_plus[:2].round(2))
