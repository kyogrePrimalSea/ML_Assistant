    - library: scikit-learn
      target: sklearn.preprocessing.TargetEncoder
      why_this_library: Fits inside a Pipeline, with cross fitting built in.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.datasets import make_classification
        from sklearn.preprocessing import TargetEncoder

        X_raw, y = make_classification(n_samples=300, n_features=2, n_redundant=0,
                                       random_state=0)
        zone = np.round(X_raw[:, [0]] * 5).astype(int).astype(str)  # many codes

        encoder = TargetEncoder()
        encoder.fit(zone, y)  # learn the target mean per zone here
        encoded = encoder.transform(zone)

        print(encoded[:5].ravel().round(2))
