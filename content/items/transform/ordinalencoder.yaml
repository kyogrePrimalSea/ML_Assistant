  code:
    - library: scikit-learn
      target: sklearn.preprocessing.OrdinalEncoder
      why_this_library: Fits inside a Pipeline and remembers its categories.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.datasets import make_classification
        from sklearn.preprocessing import OrdinalEncoder

        _, y = make_classification(
            n_samples=200, n_classes=3, n_informative=3, n_redundant=0, random_state=0
        )
        size = np.array(["small", "medium", "large"])[y].reshape(-1, 1)

        encoder = OrdinalEncoder(categories=[["small", "medium", "large"]])
        codes = encoder.fit_transform(size)  # order given: small=0, large=2

        print(codes[:5].ravel())
