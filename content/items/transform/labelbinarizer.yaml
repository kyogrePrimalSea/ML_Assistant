      why_this_library: Learns the classes once, then reuses the same columns.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.datasets import load_iris
        from sklearn.model_selection import train_test_split
        from sklearn.preprocessing import LabelBinarizer

        X, y = load_iris(return_X_y=True)
        names = np.array(["setosa", "versicolor", "virginica"])[y]  # text labels
        X_train, X_test, y_train, y_test = train_test_split(
            X, names, random_state=0, stratify=names
        )

        binarizer = LabelBinarizer()
        y_train_bin = binarizer.fit_transform(y_train)  # learn the classes here
        y_test_bin = binarizer.transform(y_test)        # reuse them, never refit

        print(binarizer.classes_)
        print(y_test_bin[:3])
  what_comes_out:
