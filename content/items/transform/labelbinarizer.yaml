      - {kind: method, name: transform, note: One 0/1 column per class; two classes give one., shape: '(n_samples, n_classes)', task: classification}
      - {kind: method, name: fit_transform, note: Learns the classes and encodes them in one step., shape: '(n_samples, n_classes)', task: classification}
      - {kind: method, name: inverse_transform, note: Turns 0/1 columns back into class names., shape: '(n_samples,)', task: null}
      - {kind: attribute, name: classes_, note: The class names; column order follows them., shape: '(n_classes,)', task: null}
