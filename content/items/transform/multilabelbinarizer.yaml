  code:
    - library: scikit-learn
      target: sklearn.preprocessing.MultiLabelBinarizer
      why_this_library: Learns the labels once, so test rows reuse the same columns.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.datasets import make_multilabel_classification
        from sklearn.model_selection import train_test_split
        from sklearn.preprocessing import MultiLabelBinarizer

        tags = ["action", "comedy", "drama", "horror"]
        _, Y = make_multilabel_classification(
            n_samples=8, n_classes=4, random_state=0
        )
        label_sets = [[tags[j] for j in np.flatnonzero(row)] for row in Y]
        train, test = train_test_split(label_sets, random_state=0)

        binarizer = MultiLabelBinarizer(classes=tags)
        train_bin = binarizer.fit_transform(train)  # learn the labels here
        test_bin = binarizer.transform(test)        # reuse the same columns

        print(binarizer.classes_)
        print(test_bin[:3])
