  code:
    - library: scikit-learn
      target: sklearn.compose.TransformedTargetRegressor
      why_this_library: Undoes the target transform on every prediction.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.compose import TransformedTargetRegressor
        from sklearn.datasets import make_regression
        from sklearn.linear_model import Ridge
        from sklearn.model_selection import train_test_split

        X, y = make_regression(n_samples=300, n_features=5, noise=10, random_state=0)
        y = np.exp(y / 100)  # skewed target, always positive
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        model = TransformedTargetRegressor(
            regressor=Ridge(),
            func=np.log1p,  # model learns on log scale
            inverse_func=np.expm1,  # predictions come back in real units
        )
        model.fit(X_train, y_train)
        print(model.predict(X_test[:3]).round(2))
        print(round(model.score(X_test, y_test), 3))
  what_comes_out:
    items:
      - {name: fit, kind: method, task: regression, shape: "self", note: "Transforms y, then fits the regressor."}
      - {name: predict, kind: method, task: regression, shape: "(n_samples,)", note: "Predicts, then undoes the transform."}
      - {name: regressor_, kind: attribute, task: null, shape: "fitted regressor", note: "The regressor fitted on transformed y."}
      - {name: feature_names_in_, kind: attribute, task: null, shape: "array of column names", note: "Column names seen during fit."}
    next_step: "Compare against a plain fit on the raw target."
    visual: null
  catch_outs:
    - Pass func and inverse_func together, or one transformer alone.
    - check_inverse tests that the inverse undoes the transform.
    - Only the target changes; the features are untouched.
