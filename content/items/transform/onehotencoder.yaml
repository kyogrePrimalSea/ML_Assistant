  code:
    - library: scikit-learn
      target: sklearn.preprocessing.OneHotEncoder
      why_this_library: Fits inside a Pipeline and remembers its categories.
      snippet: |
        # scikit-learn 1.9.1
        import pandas as pd
        from sklearn.preprocessing import OneHotEncoder

        train = pd.DataFrame({"Street": ["Pave", "Grvl", "Pave", "Pave"]})
        test = pd.DataFrame({"Street": ["Pave", "Alley"]})

        encoder = OneHotEncoder(handle_unknown="ignore", sparse_output=False)
        train_encoded = encoder.fit_transform(train)  # learn categories here
        test_encoded = encoder.transform(test)  # unseen "Alley" is all zeros

        print(encoder.get_feature_names_out())
        print(test_encoded)
  what_comes_out: {none: true}
  catch_outs:
    - Fit on training rows only; never fit on the test set.
    - Unseen categories raise an error unless handle_unknown is ignore.
    - Output is sparse by default; set sparse_output=False for a dense array.
    - Columns with many unique values make very wide output.
