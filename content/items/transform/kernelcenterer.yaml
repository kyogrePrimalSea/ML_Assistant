  code:
    - library: scikit-learn
      target: sklearn.preprocessing.KernelCenterer
      why_this_library: Learns the means from the training kernel only.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.datasets import load_iris
        from sklearn.metrics.pairwise import rbf_kernel
        from sklearn.preprocessing import KernelCenterer

        X, _ = load_iris(return_X_y=True)
        K = rbf_kernel(X, gamma=0.5)  # square similarity matrix, one row per flower

        centerer = KernelCenterer()
        K_centred = centerer.fit_transform(K)  # learn the means here

        print(np.abs(K_centred.mean(axis=0)).max() < 1e-9)
