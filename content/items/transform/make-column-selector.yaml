  code:
    - library: scikit-learn
      target: sklearn.compose.make_column_selector
      why_this_library: Picks columns by name or type inside a transformer.
      snippet: |
        # scikit-learn 1.9.1
        import pandas as pd
        from sklearn.compose import make_column_selector as selector
        from sklearn.compose import make_column_transformer
        from sklearn.datasets import load_breast_cancer
        from sklearn.preprocessing import OneHotEncoder, StandardScaler

        X, y = load_breast_cancer(return_X_y=True, as_frame=True)
        X["size"] = pd.qcut(X["mean radius"], 3, labels=["low", "mid", "high"])

        ct = make_column_transformer(
            (StandardScaler(), selector(pattern="^mean")),  # by name
            (OneHotEncoder(), selector(dtype_include="category")),  # by type
        )
        print(ct.fit_transform(X).shape)
