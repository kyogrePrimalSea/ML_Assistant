  code:
    - library: scikit-learn
      target: sklearn.compose.make_column_transformer
      why_this_library: Gives each column group its own steps in one object.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.compose import make_column_transformer
        from sklearn.datasets import load_breast_cancer
        from sklearn.preprocessing import MinMaxScaler, StandardScaler

        X, y = load_breast_cancer(return_X_y=True, as_frame=True)

        ct = make_column_transformer(
            (StandardScaler(), ["mean radius", "mean texture"]),
            (MinMaxScaler(), ["mean area", "mean smoothness"]),
            remainder="drop",
        )
        X_out = ct.fit_transform(X)  # each group gets its own scaler
        print(X_out.shape)
