slots:
  header: {}
  solves:
    hero: {kind: resampler, dataset: breast-cancer, classes: [malignant, benign], before: [212, 357], after: [357, 357]}
    line: "Adds new rare rows for mixed number and category columns."
  quick_facts:
    facts:
      - {label: "Adds", value: "new rare rows"}
      - {label: "Columns", value: "numbers and categories mixed"}
  use_avoid:
    use_when: ["imbalanced classes", "numbers and categories mixed"]
    avoid_when: ["numbers only", "regression"]
  prep:
    - step: {page: train-test-split}
      status: required
      why: "Resample the training rows only."
      condition: null
      unless: null
    - step: {family: transform.encode.features}
      status: not_needed
      why: "Encodes category columns itself."
      condition: {has_categoricals: true}
      unless: null
  code:
    - library: imbalanced-learn
      target: imblearn.over_sampling.SMOTENC
      why_this_library: "The imbalanced-learn sampler; scikit-learn has none."
      snippet: |
        # imbalanced-learn 0.14.2
        from collections import Counter

        import numpy as np
        from imblearn.over_sampling import SMOTENC
        from sklearn.datasets import make_classification

        X, y = make_classification(
            n_samples=1000, weights=[0.9, 0.1], random_state=0
        )
        # first two columns act as categories
        X[:, :2] = np.round(X[:, :2])
        print("before", Counter(y.tolist()))

        sampler = SMOTENC(
            categorical_features=[0, 1], k_neighbors=5, random_state=0
        )
        X_res, y_res = sampler.fit_resample(X, y)
        print("after", Counter(y_res.tolist()))
  what_comes_out:
    items:
      - {name: fit_resample, kind: method, task: null, shape: "X (more rows), y (rows,)", note: "Returns new X and y; training rows only."}
      - {name: sampling_strategy_, kind: attribute, task: null, shape: "dict: class to count", note: "Rows to add per class, set at fit time."}
    next_step: "Train on X_res and y_res; the test set stays as it is."
    visual: null
  catch_outs:
    - "Resample after the split, on training rows only."
    - "Never resample the test set."
    - "Name the category columns in categorical_features."
  key_settings:
    tier1:
      - {name: categorical_features, page: null}
      - {name: sampling_strategy, page: null}
      - {name: k_neighbors, page: null}
