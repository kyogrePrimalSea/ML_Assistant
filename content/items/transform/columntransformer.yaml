  code:
    - library: scikit-learn
      target: sklearn.compose.ColumnTransformer
      why_this_library: Names each step, so you can inspect it later.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.compose import ColumnTransformer
        from sklearn.datasets import load_breast_cancer
        from sklearn.model_selection import train_test_split
        from sklearn.preprocessing import QuantileTransformer, StandardScaler

        X, y = load_breast_cancer(return_X_y=True, as_frame=True)
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        ct = ColumnTransformer(
            transformers=[
                ("scale", StandardScaler(), ["mean radius", "mean texture"]),
                ("rank", QuantileTransformer(n_quantiles=50), ["mean area"]),
            ],
            remainder="drop",
        )
        ct.fit(X_train)  # learn from training rows only
        X_test_t = ct.transform(X_test)
        print(ct.named_transformers_["scale"].mean_.round(2))
        print(X_test_t.shape)
  what_comes_out:
    items:
      - {name: fit, kind: method, task: null, shape: "self", note: "Learns each step from the rows given."}
      - {name: transform, kind: method, task: null, shape: "(n_samples, n_out)", note: "Applies each step, then joins the columns."}
      - {name: get_feature_names_out, kind: method, task: null, shape: "array of names", note: "Names for the joined output columns."}
      - {name: transformers_, kind: attribute, task: null, shape: "list of (name, step, columns)", note: "Fitted steps with their columns."}
      - {name: named_transformers_, kind: attribute, task: null, shape: "Bunch, keyed by step name", note: "Fitted steps, looked up by name."}
      - {name: feature_names_in_, kind: attribute, task: null, shape: "array of column names", note: "Column names seen during fit."}
    next_step: "Put it inside a Pipeline with the model."
    visual: null
  catch_outs:
