id: smote
plain_name: SMOTE
code_name: SMOTE
aliases: [oversampling, synthetic minority, balance classes]
stage: transform
family: Over-sampling
tracks: [standard]
archetype: resampler
question_tags: [imbalanced, rare class]
targets: [imblearn.over_sampling.SMOTE]
pairs_with: [imblearn-pipeline]
clashes: []
source_urls:
  - https://imbalanced-learn.org/stable/references/generated/imblearn.over_sampling.SMOTE.html
library_versions:
  imbalanced-learn: "0.14.2"
reviewed: false
rules:
  task_types: [classification]
  blocked_when: []
  fits_on_data: true
  shape_effect: {rows: grows, columns: same}
slots:
  header: {}
  solves:
    hero: {kind: resampler, dataset: breast-cancer, classes: [malignant, benign], before: [212, 357], after: [357, 357]}
    line: Adds synthetic rows to the rare class.
  quick_facts:
    facts:
      - {label: Adds, value: new rows only}
      - {label: Columns, value: numbers only}
  use_avoid:
    use_when: [imbalanced classes, rare positives]
    avoid_when: [category columns, regression]
  prep:
    - step: {page: train-test-split}
      status: required
      why: Resample the training rows only.
      condition: null
      unless: null
    - step: {family: Categorical encoding, stage: transform}
      status: required
      why: Plain SMOTE needs all-numeric columns.
      condition: {has_categoricals: true}
      unless: null
  code:
    - library: imbalanced-learn
      target: imblearn.over_sampling.SMOTE
      why_this_library: The home of SMOTE; scikit-learn has none.
      snippet: |
        # imbalanced-learn 0.14.2
        from collections import Counter

        from imblearn.over_sampling import SMOTE
        from sklearn.datasets import make_classification

        X, y = make_classification(
            n_samples=1000, weights=[0.9, 0.1], random_state=0
        )
        print("before", Counter(y))

        X_res, y_res = SMOTE(k_neighbors=5, random_state=0).fit_resample(X, y)
        print("after", Counter(y_res))
  what_comes_out: {none: true}
  catch_outs:
    - Resample after the split, on training rows only.
    - Never resample the test set.
    - Use imblearn's Pipeline so it runs at fit time only.
  key_settings:
    tier1:
      - {name: sampling_strategy, page: null}
      - {name: k_neighbors, page: null}
    tier2:
      - {name: random_state, page: null}
    tier3: []
  watch_it_work:
    dataset: breast-cancer
    control: {name: k_neighbors, min: 1, max: 10, step: 1, default: 5}
  intuition:
    text: Pick a rare row, pick a close neighbour, add a new row between them.
  next: []
