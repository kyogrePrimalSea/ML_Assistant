    - library: scikit-learn
      target: sklearn.preprocessing.QuantileTransformer
      why_this_library: Fits inside a Pipeline, so no leakage.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import make_regression
        from sklearn.model_selection import train_test_split
        from sklearn.preprocessing import QuantileTransformer

        X, y = make_regression(n_samples=200, n_features=2, random_state=0)
        X[:, 0] = X[:, 0] ** 3  # heavy tails and outliers in one column
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        qt = QuantileTransformer(n_quantiles=100, random_state=0)
        X_train_q = qt.fit_transform(X_train)  # learn quantiles here
        X_test_q = qt.transform(X_test)  # reuse them, never refit

        print(X_train_q.min(axis=0).round(2))
        print(X_train_q.max(axis=0).round(2))
