      - {name: fit_transform, kind: method, task: null, shape: "(n_samples, n_features)", note: "Learns the min and max, then scales in one step."}
      - {name: inverse_transform, kind: method, task: null, shape: "(n_samples, n_features)", note: Maps scaled values back to original units.}
