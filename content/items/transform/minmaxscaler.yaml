      why_this_library: Fits inside a Pipeline, so no leakage.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import make_regression
        from sklearn.model_selection import train_test_split
        from sklearn.preprocessing import MinMaxScaler

        X, y = make_regression(n_samples=200, n_features=3, random_state=0)
        X[:, 0] *= 1000  # one column on a much bigger scale
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        scaler = MinMaxScaler()  # feature_range defaults to (0, 1)
        X_train_s = scaler.fit_transform(X_train)  # learn min and max here
        X_test_s = scaler.transform(X_test)  # reuse them, never refit

        print(X_train_s.min(axis=0).round(2))
        print(X_train_s.max(axis=0).round(2))
