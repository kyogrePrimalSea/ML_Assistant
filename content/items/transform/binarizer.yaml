  code:
    - library: scikit-learn
      target: sklearn.preprocessing.Binarizer
      why_this_library: Learns nothing, so it cannot leak test rows.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.preprocessing import Binarizer

        X, _ = load_breast_cancer(return_X_y=True)
        radius = X[:, [0]]  # mean radius, kept as a 2-D column

        binarizer = Binarizer(threshold=15.0)
        big = binarizer.fit_transform(radius)  # nothing is learned here

        print(int(big.sum()), "rows have a mean radius above 15")
