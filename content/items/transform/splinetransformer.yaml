      target: sklearn.preprocessing.SplineTransformer
      why_this_library: Fits inside a Pipeline and keeps its knots.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import make_regression
        from sklearn.preprocessing import SplineTransformer

        X, _ = make_regression(n_samples=200, n_features=1, random_state=0)
        spline = SplineTransformer(n_knots=4, degree=3)
        X_spline = spline.fit_transform(X)  # knots are learned here

        print(X_spline.shape)
