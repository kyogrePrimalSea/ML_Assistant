      target: sklearn.preprocessing.PowerTransformer
      why_this_library: Fits inside a Pipeline, so no leakage.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.datasets import make_regression
        from sklearn.model_selection import train_test_split
        from sklearn.preprocessing import PowerTransformer

        X, y = make_regression(n_samples=200, n_features=2, random_state=0)
        X[:, 0] = np.exp(X[:, 0])  # make one column heavily skewed
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        pt = PowerTransformer(method="yeo-johnson")
        X_train_p = pt.fit_transform(X_train)  # learn the lambdas here
        X_test_p = pt.transform(X_test)  # reuse them, never refit

        print(X_train_p.mean(axis=0).round(2))
        print(pt.lambdas_.round(3))
