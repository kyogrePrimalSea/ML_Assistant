  code:
    - library: scikit-learn
      target: sklearn.preprocessing.FunctionTransformer
      why_this_library: Wraps any function as a pipeline step.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.datasets import make_regression
        from sklearn.preprocessing import FunctionTransformer

        X, _ = make_regression(n_samples=200, n_features=2, random_state=0)
        X = np.exp(X)  # skewed, positive values

        log_step = FunctionTransformer(np.log1p)  # no fitting needed
        X_log = log_step.fit_transform(X)

        print(X_log.mean(axis=0).round(2))
  what_comes_out:
    items:
      - {name: transform, kind: method, task: null, shape: "same as X, if func keeps it", note: Applies func to X.}
      - {name: fit_transform, kind: method, task: null, shape: "same as transform", note: "Calls fit, then transform."}
      - {name: inverse_transform, kind: method, task: null, shape: "same as X", note: Uses inverse_func; set one first.}
      - {name: get_feature_names_out, kind: method, task: null, shape: "names for each column", note: Uses feature_names_out if set.}
    next_step: Feed the result to a model or a scaler.
    visual: null
  catch_outs:
