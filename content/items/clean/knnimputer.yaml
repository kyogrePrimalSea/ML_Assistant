    - library: scikit-learn
      target: sklearn.impute.KNNImputer
      why_this_library: Fits inside a Pipeline, so it never sees test rows.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.datasets import make_regression
        from sklearn.impute import KNNImputer
        from sklearn.model_selection import train_test_split

        X, y = make_regression(n_samples=200, n_features=3, random_state=0)
        rng = np.random.default_rng(0)
        X[rng.random(X.shape) < 0.1] = np.nan  # knock out about 10% of values
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        imputer = KNNImputer(n_neighbors=3, weights="distance")
        X_train_f = imputer.fit_transform(X_train)  # keep train rows as neighbours
        X_test_f = imputer.transform(X_test)        # borrow from near train rows

        gap_rows = np.isnan(X_test).any(axis=1)
        print(np.round(X_test_f[gap_rows][0], 2))
