    - library: scikit-learn
      target: sklearn.impute.SimpleImputer
      why_this_library: Fits inside a Pipeline, so it never sees test rows.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.datasets import make_regression
        from sklearn.impute import SimpleImputer
        from sklearn.model_selection import train_test_split

        X, y = make_regression(n_samples=200, n_features=3, random_state=0)
        rng = np.random.default_rng(0)
        X[rng.random(X.shape) < 0.1] = np.nan  # knock out about 10% of values
        X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)

        imputer = SimpleImputer(strategy="median")
        X_train_f = imputer.fit_transform(X_train)  # learn medians from train only
        X_test_f = imputer.transform(X_test)        # reuse them, never refit

        print(imputer.statistics_.round(2))
  what_comes_out:
