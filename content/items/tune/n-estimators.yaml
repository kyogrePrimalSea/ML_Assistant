  - https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.GradientBoostingRegressor.html
  - https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.HistGradientBoostingRegressor.html
  - https://xgboost.readthedocs.io/en/stable/python/python_api.html
  - https://lightgbm.readthedocs.io/en/stable/pythonapi/lightgbm.LGBMRegressor.html
stage: tune
tracks: [standard, time-series]
archetype: hyperparameter
targets: []
applies_to: [gradient-boosting, hist-gradient-boosting, xgboost, lightgbm]
pairs_with: [learning-rate, early-stopping]
clashes: []
library_versions:
  scikit-learn: "1.9.1"
  xgboost: "3.4.1"
  lightgbm: "4.7.0"
reviewed: false
rules:
  task_types: []
  blocked_when: []
  fits_on_data: false
  shape_effect: {rows: same, columns: same}
slots:
  header: {}
  solves:
    hero: {kind: hyperparameter, dataset: ames, sweep: [10, 50, 100, 200]}
    line: How many small trees get added, one after another.
  quick_facts:
    values:
      - {page: gradient-boosting, default: "100", typical_range: 100 to 1000}
      - {page: hist-gradient-boosting, default: 100 (called max_iter), typical_range: 100 to 1000}
      - {page: xgboost, default: "100", typical_range: 100 to 1000}
      - {page: lightgbm, default: "100", typical_range: 100 to 1000}
  use_avoid:
    use_when: [underfitting, with early stopping]
    avoid_when: [no validation set, overfitting]
  prep: []
  code:
    - library: scikit-learn
      target: sklearn.ensemble.GradientBoostingRegressor
      why_this_library: Histogram version calls it max_iter.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import make_regression
        from sklearn.ensemble import (
            GradientBoostingRegressor,
            HistGradientBoostingRegressor,
        )

        X, y = make_regression(n_samples=300, n_features=5, noise=20, random_state=0)

        gb = GradientBoostingRegressor(n_estimators=50, random_state=0).fit(X, y)
        hgb = HistGradientBoostingRegressor(max_iter=50, random_state=0).fit(X, y)
        print(gb.n_estimators_, hgb.n_iter_)
      output: |
        50 50
    - library: xgboost
      target: xgboost.XGBRegressor
      why_this_library: Same name, same sklearn-style fit.
      snippet: |
        # xgboost 3.4.1
        from sklearn.datasets import make_regression
        from xgboost import XGBRegressor

        X, y = make_regression(n_samples=300, n_features=5, noise=20, random_state=0)

        model = XGBRegressor(n_estimators=50).fit(X, y)
        print(model.get_num_boosting_rounds())
      output: |
        50
    - library: lightgbm
      target: lightgbm.LGBMRegressor
      why_this_library: Same name. Fitted count is n_estimators_.
      snippet: |
        # lightgbm 4.7.0
        from lightgbm import LGBMRegressor
        from sklearn.datasets import make_regression

        X, y = make_regression(n_samples=300, n_features=5, noise=20, random_state=0)

        model = LGBMRegressor(n_estimators=50, verbose=-1).fit(X, y)
        print(model.n_estimators_)
      output: |
        50
  what_comes_out:
    items:
      - name: n_estimators_
        kind: attribute
        task: null
        shape: "scalar"
        object_type: int
        example: "47"
        shape_explanation: >-
          A scalar is one value, not an array. It has no rows or columns. The example
          is the single integer 47, so its shape is scalar.
        note: "GradientBoosting, LightGBM. Trees actually fitted; less if early stopping ran."
      - name: n_iter_
        kind: attribute
        task: null
        shape: "scalar"
        object_type: int
        example: "62"
        shape_explanation: >-
          A scalar is one value, not an array. It has no rows or columns. The example
          is the single integer 62, so its shape is scalar.
        note: "HistGradientBoosting. Rounds fitted; early stopping can make it less than max_iter."
      - name: get_num_boosting_rounds
        kind: method
        task: null
        shape: "scalar"
        object_type: int
        example: "100"
        shape_explanation: >-
          A scalar is one value, not an array. It has no rows or columns. The example
          is the single integer 100, so its shape is scalar.
        note: "XGBoost. Echoes n_estimators, even after early stopping cut training short."
    next_step: null
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.datasets import make_regression
      from sklearn.ensemble import (
          GradientBoostingRegressor,
          HistGradientBoostingRegressor,
      )

      X, y = make_regression(n_samples=300, n_features=5, noise=20, random_state=0)
      gb = GradientBoostingRegressor(n_estimators=50, random_state=0).fit(X, y)
      hgb = HistGradientBoostingRegressor(max_iter=50, random_state=0).fit(X, y)
      print("n_estimators_:", gb.n_estimators_)
      print("n_iter_:", hgb.n_iter_)
    output: |
      n_estimators_: 50
      n_iter_: 50
    snippet_library: scikit-learn
    visual: null
  catch_outs:
    - In HistGradientBoosting the name is max_iter.
    - Scikit-learn calls gradient boosting fairly robust to many trees. Still watch a validation score.
    - Lower learning_rate usually needs more trees.
  key_settings:
    tier1: []
    tier2: []
    tier3: []
  watch_it_work:
    dataset: ames
    control: {name: n_estimators, min: 1, max: 200, step: 1, default: 50}
  intuition:
    idea: Sets how many small trees the model adds, one round at a time.
    analogy: Like sanding a board, where each pass removes a little more and you choose how many passes to make.
    animation: none
    goal: Pick a tree count that scores best on rows the model did not train on.
    steps:
      - Start with one simple first prediction for every row.
      - Fit one small tree that moves the predictions toward the target.
      - Scale that tree by the learning rate before adding it.
      - Repeat for each round, up to n_estimators rounds.
      - Train scores tend to keep rising as trees are added.
      - Validation scores can flatten out, so more trees stop helping.
      - Early stopping can end training once validation score stops improving.
      - Compare train and validation scores at several tree counts.
      - Pick the count where validation score stops improving.
    math:
      notation:
        - {symbol: "M", meaning: "The number of trees, set by n_estimators."}
        - {symbol: "m", meaning: "The index of one boosting round, from 1 to M."}
        - {symbol: "F_m(x)", meaning: "The model's prediction for input x after round m."}
        - {symbol: "ν", meaning: "The learning rate, set by learning_rate."}
        - {symbol: "h_m(x)", meaning: "The small tree added in round m."}
      equations:
        - expression: "F_m(x) = F_{m-1}(x) + ν h_m(x)"
          meaning: Each round adds one tree, scaled by the learning rate, to the running prediction.
        - expression: "M = n_estimators"
          meaning: The number of rounds equals the number of trees the model adds.
      prediction: The final prediction is F_M(x), the starting prediction plus M scaled trees.
    good_at: [steady gains with more trees, early stopping, pairs with learning rate]
    bad_at: [choosing without validation, slow training with many trees, judging by train score]
    vs_siblings:
      - {page: learning-rate, note: "Shrinks each tree. Smaller values usually need more trees."}
      - {page: early-stopping, note: "Picks the tree count for you, from a validation score."}
      - {page: max-depth, note: "Sets how big each tree grows, not how many are added."}
    read_more:
      - In gradient boosting, n_estimators is the number of stages, with one tree per stage.
      - The GradientBoosting docs say a large number usually gives better performance.
      - Early stopping in gradient boosting only runs when n_iter_no_change is set.
      - HistGradientBoosting uses max_iter, and enables early stopping by default above 10,000 samples.
      - XGBoost reports the kept round in best_iteration, and LightGBM reports fitted trees in n_estimators_.
  next: [model-overfitting]
