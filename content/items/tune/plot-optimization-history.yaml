  intuition:
    idea: "Each dot is one completed trial's score, and a line tracks the best score so far."
    analogy: "A race board with each lap time as a dot, and a line showing the fastest lap so far."
    animation: none
    goal: "See whether the search is still finding better scores, or has stopped improving."
    steps:
      - "The horizontal axis is the trial number, counted from 0 in the order the trials ran."
      - "The vertical axis is the objective value, named by target_name."
      - "Each dot is one completed trial, at its trial number and its score."
      - "The line is the best value so far, updated after each trial."
      - "The line only moves toward the better direction: down to minimize, up to maximize."
      - "A flat stretch of the line means no new best trial came in that stretch."
      - "A dot sitting on the line is a trial that set a new best."
      - "If the line still moves at the last trial, the last trial set a new best."
    math:
      notation:
        - {symbol: "t", meaning: "A trial number. The line is drawn at every trial number."}
        - {symbol: "i", meaning: "A completed trial number, at or before t."}
        - {symbol: "v_i", meaning: "The objective value of completed trial i."}
        - {symbol: "b_t", meaning: "The best value so far after trial t. This is the line."}
      equations:
        - expression: "b_t = min of v_i over completed trials i <= t"
          meaning: "For minimize, the best so far is the smallest completed value up to trial t."
        - expression: "b_t = max of v_i over completed trials i <= t"
          meaning: "For maximize, the best so far is the largest completed value up to trial t."
      prediction: "The line only moves toward the better direction, down for minimize and up for maximize."
    good_at: ["search progress over trials", "whether recent trials still improved", "comparing searches on one axis"]
    bad_at: ["which settings each trial used", "pruned and failed trials", "how much each trial cost"]
    vs_siblings:
      - {page: plot-intermediate-values, note: "Shows steps inside each trial, not one score per trial."}
      - {page: plot-timeline, note: "Shows when trials ran, not their scores."}
      - {page: plot-edf, note: "Shows how completed scores are spread, not the order they ran in."}
    read_more:
      - "Trial numbers start at 0 and follow the order the trials ran."
      - "Only completed trials get a dot."
      - "Trials that break a constraint are left out of the best value line."
      - "Setting target removes the best value line and plots the value you pick."
  next: [but-when-stop-search]
