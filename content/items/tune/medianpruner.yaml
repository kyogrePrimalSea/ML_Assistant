    visual: null
  catch_outs:
  - Pruning waits until n_startup_trials trials have finished.
  - Pruning is off until step n_warmup_steps.
  - Your objective must call trial.report and should_prune.
  - Pruned trials are not the best; judge the finished ones.
  key_settings:
    tier1:
    - name: n_startup_trials
      page: null
      controls: Trials that must finish before any trial can be pruned. Default is 5.
      effect: A higher number avoids judging on too few trials, but more trials run to the end.
    - name: n_warmup_steps
      page: null
      controls: Steps at the start of each trial that are never pruned. Default is 0.
      effect: Use it when early steps are noisy. Pruning cannot happen before this step.
    tier2:
    - name: interval_steps
      page: null
      controls: Steps between pruning checks, counted after the warmup. Default is 1.
      effect: A larger interval checks less often, so a weak trial may run longer before it stops.
    - name: n_min_trials
      page: null
      controls: Trials that must have reported at a step before a check runs. Default is 1.
      effect: A higher number stops the check from judging against too few other trials.
    tier3: []
  watch_it_work:
    none: true
  intuition:
    idea: Stop a trial whose best result so far is below the median of earlier trials at that step.
    analogy: A race where any runner behind the middle of the pack at the same lap is dropped.
    animation: none
    goal: Spend steps on settings that look promising, and stop the rest early.
    steps:
    - Run the first trials in full, as set by n_startup_trials.
    - After each step, take the trial's best reported value so far.
    - Find the median of the earlier trials' values at that same step.
    - Prune the trial if its best value is below that median.
    - Otherwise, let the trial run on to the next step.
    - Record the trial as PRUNED, or as COMPLETE when it finishes.
    math:
      notation:
      - symbol: s
        meaning: The current step, counting from 0.
      - symbol: t
        meaning: The trial being checked.
      - symbol: b_t(s)
        meaning: Trial t's best reported value up to step s. Highest is best when maximizing.
      - symbol: M(s)
        meaning: The median of completed trials' reported values at step s.
      equations:
      - expression: prune t if b_t(s) < M(s)   (maximize)
        meaning: A trial below the median at the same step is stopped.
      - expression: M(s) = median of the values reported at step s by completed trials
        meaning: The middle value among earlier trials at the same step. NaN values are ignored.
      prediction: A pruned trial stops at step s with state PRUNED. A trial that stays above the median runs on.
    good_at:
    - many trials
    - steps reported each time
    - no tuning of the rule
    bad_at:
    - few trials
    - noisy early steps
    vs_siblings:
    - page: percentilepruner
      note: Same idea with a cut-off you choose, not the median.
    - page: successivehalvingpruner
      note: Judges trials at fixed rung steps, not every step.
    - page: wilcoxonpruner
      note: Compares fold by fold, for per-fold scores.
    read_more:
    - Report a value at each step with trial.report.
    - Let should_prune decide, and raise optuna.TrialPruned when it returns True.
    - The reference page lists every argument and the NaN rule.
