  code:
    - library: optuna
      target: optuna.samplers.NSGAIIISampler
      why_this_library: Optuna sampler. Pass it to create_study with directions.
      snippet: |
        # optuna 5.0.0
        import optuna
        from sklearn.datasets import make_regression
        from sklearn.linear_model import ElasticNet
        from sklearn.model_selection import cross_val_score

        optuna.logging.set_verbosity(optuna.logging.WARNING)
        X, y = make_regression(
            n_samples=200, n_features=8, n_informative=3, noise=10, random_state=0
        )
        SCORING = "neg_mean_squared_error"


        def objective(trial):
            alpha = trial.suggest_float("alpha", 0.01, 10.0)
            l1_ratio = trial.suggest_float("l1_ratio", 0.0, 1.0)
            model = ElasticNet(alpha=alpha, l1_ratio=l1_ratio)
            error = -cross_val_score(model, X, y, cv=3, scoring=SCORING).mean()
            kept = int((model.fit(X, y).coef_ != 0).sum())
            return float(error), kept


        sampler = optuna.samplers.NSGAIIISampler(population_size=10, seed=0)
        study = optuna.create_study(
            sampler=sampler, directions=["minimize", "minimize"]
        )
        study.optimize(objective, n_trials=40)
        print(len(study.best_trials))
        print(sorted(int(t.values[1]) for t in study.best_trials))
  what_comes_out:
    items:
      - {name: best_trials, kind: return, task: null, shape: list of FrozenTrial, note: The trade-offs that no other trial beats.}
    next_step: Plot the trade-offs with plot_pareto_front.
    visual: null
  catch_outs:
    - Pass directions, one entry per goal.
    - Each objective returns its values in the same order as directions.
    - best_trials is a set of trade-offs, not one winner.
