  watch_it_work:
    none: true
  intuition:
    idea: Like NSGA-II, but it spreads kept trade-offs using reference points.
    analogy: A referee who keeps finalists spread across a map of target points.
    animation: none
    goal: Find trade-offs across many goals that stay spread out, not bunched up.
    steps:
    - Score the first generation of random trials on every goal.
    - Group the trials into fronts, with the best trade-offs first.
    - Pick parents from the best fronts.
    - Cross over and mutate parents to make child settings.
    - Score the children on every goal.
    - On a front that only partly fits, keep trials nearest the sparsest reference points.
    - Repeat until n_trials is used up.
    - Return the final front as best_trials.
    math:
      notation:
      - symbol: k
        meaning: The number of goals, one per entry in directions.
      - symbol: f_i
        meaning: The value of goal i for one trial, with i from 1 to k.
      - symbol: t
        meaning: One trial in the study.
      - symbol: B
        meaning: The set of trials returned as best_trials.
      equations:
      - expression: t has values (f_1, ..., f_k)
        meaning: Each trial reports one number per goal, in directions order.
      - expression: 'B = {t : no other trial is at least as good on every goal and better on one}'
        meaning: best_trials keeps every trial that no other trial beats.
      prediction: With many goals, B tends to be large, so read it as a set of options.
    good_at:
    - many goals at once
    - spread of trade-offs
    bad_at:
    - one goal only
    - few tries
    vs_siblings:
    - page: nsgaiisampler
      note: Same genetic idea, built for two or three goals.
    - page: tpesampler
      note: Suggested in the docs for under 1000 trials.
    read_more:
    - Sort trials into fronts, as in NSGA-II.
    - Reference points spread the survivors across the goals.
    - Use reference_points to steer toward your preferences.
