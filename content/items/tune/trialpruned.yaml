          A one-dimensional list with one FrozenTrial for each trial, pruned or not. The trailing comma in (n_trials,) means one dimension. n_trials is the number of trials run. The example has 2 trials, so its concrete shape is (2,).
        note: "Every trial, pruned ones included, in trial-number order."
