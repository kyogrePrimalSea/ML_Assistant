  code:
    - library: optuna
      target: optuna.TrialPruned
      why_this_library: The exception Optuna reads to mark a trial pruned.
      snippet: |
        # optuna 5.0.0
        import optuna
        from collections import Counter
        from sklearn.datasets import make_regression
        from sklearn.linear_model import SGDRegressor
        from sklearn.model_selection import train_test_split

        optuna.logging.set_verbosity(optuna.logging.WARNING)
        X, y = make_regression(
            n_samples=300, n_features=8, noise=15, random_state=0
        )
        X_train, X_val, y_train, y_val = train_test_split(
            X, y, random_state=0
        )


        def objective(trial):
            alpha = trial.suggest_float("alpha", 1e-3, 1e3, log=True)
            model = SGDRegressor(alpha=alpha, random_state=0)
            for step in range(10):
                model.partial_fit(X_train, y_train)
                score = model.score(X_val, y_val)
                trial.report(score, step)
                if step == 0 and score < 0.5:  # our rule: stop weak starts
                    raise optuna.TrialPruned()
            return score


        study = optuna.create_study(
            direction="maximize",
            sampler=optuna.samplers.TPESampler(seed=0),
            pruner=optuna.pruners.NopPruner(),
        )
        study.optimize(objective, n_trials=20)
        states = Counter(t.state.name for t in study.trials)
        print("states:", dict(sorted(states.items())))
        print(states["PRUNED"], "of", len(study.trials), "trials pruned")
      output: |
        states: {'COMPLETE': 13, 'PRUNED': 7}
        7 of 20 trials pruned
  what_comes_out: {none: true}
  catch_outs:
    - A pruned trial keeps its last reported value, but best_trial ignores it.
    - Returning normally makes the trial COMPLETE, even after a bad score.
    - Pruned trials still appear in study.trials, with state PRUNED.
    - Only your code can stop a trial when the pruner is NopPruner.
  key_settings:
    tier1: []
    tier2: []
    tier3: []
  watch_it_work: {none: true}
  intuition:
    idea: Raise TrialPruned from your own code to end a trial that is clearly losing.
    analogy: A referee who stops one match early after a foul that breaks the rules.
    animation: none
    goal: Stop one trial on a rule you write, and let Optuna record it as PRUNED.
    steps:
      - Report the score for each step with trial.report.
      - Check your own rule after each report.
      - Use the raise when your rule says stop, or when should_prune() returns True.
      - Raise optuna.TrialPruned() to end the trial early.
      - Optuna marks the trial PRUNED and keeps its last reported value.
      - Other trials carry on as normal.
    math:
      notation:
        - {symbol: "s", meaning: "The step number, counting from 0."}
        - {symbol: "v_s", meaning: "The score the trial reported at step s."}
      equations:
        - expression: "stop = (s == 0) and (v_0 < 0.5)"
          meaning: This is the rule written in the snippet, not a setting of the library.
        - expression: "state = PRUNED if TrialPruned is raised, else COMPLETE"
          meaning: Raising ends the trial as pruned. Returning normally completes it.
      prediction: "The snippet's rule stopped 7 of 20 trials at step 0. The rest ran all 10 steps and completed."
    good_at: [own stop rule, hopeless starts]
    bad_at: [built-in pruner is enough, no per-step scores]
    vs_siblings:
      - {page: thresholdpruner, note: "A built-in fixed line. Raise TrialPruned for any rule you write."}
      - {page: patientpruner, note: "A built-in stall rule. This one is your own code."}
      - {page: noppruner, note: "Stops nothing by itself, so your rule is the only stop."}
    read_more:
      - Call should_prune() when a built-in pruner is set, and raise on its answer.
      - Return normally to keep a trial as COMPLETE.
  next: []
