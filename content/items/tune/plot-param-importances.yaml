        - {symbol: "J", meaning: "The number of settings in the plot."}
        - {symbol: "p_j", meaning: "The importance of setting j, as the evaluator returns it."}
        - {symbol: "Σ_j", meaning: "Add the following quantity over every setting j."}
      equations:
        - expression: "p_j ≥ 0"
          meaning: "No importance is negative."
        - expression: "Σ_j p_j = 1.0"
          meaning: "By default the bars add up to one whole."
      prediction: "Each bar's length is p_j, so the longest bar is the setting with the largest share."
    steps:
