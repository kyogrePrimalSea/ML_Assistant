        controls: The algorithm that measures each setting's importance. None uses PedAnovaImportanceEvaluator.
        effect: A different evaluator measures importance in its own way, so the bars can change.
      - name: params
        page: null
        controls: The settings to assess. None assesses every setting in completed trials.
        effect: With the default evaluator, conditional settings are included when params is None.
    tier2:
      - name: target
        page: null
        controls: The value used to measure importance. None uses the objective value for one objective.
        effect: With target None, a multi-objective study plots all objectives. A target plots one.
      - name: target_name
        page: null
        controls: The name shown in the legend. Set metric names on the study override it when target is None.
        effect: Changes the label only, not the bars.
