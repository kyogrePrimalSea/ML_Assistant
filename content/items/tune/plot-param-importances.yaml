    idea: "One bar per setting, with bar length showing how important the evaluator judges it for the score."
    analogy: "Like a team ranking which ingredients changed the taste most, longest bar first."
    animation: none
    goal: "See which settings matter most for the score, so you know what to tune first."
    math:
