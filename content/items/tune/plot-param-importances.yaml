      - "Each bar is one setting's importance, as the evaluator measures it."
      - "A longer bar means a more important setting."
      - "The bars are sorted, with the longest at the top."
      - "The legend names the score the bars were measured on."
      - "Compare the bars with each other, since the docs give no fixed scale."
