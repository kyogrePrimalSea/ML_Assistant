  catch_outs:
    - Needs plotly installed.
    - The code example output is made up. It was not run here.
    - Plots the objective value unless target is set.
    - The default evaluator is PedAnovaImportanceEvaluator; pass evaluator to change it.
    - The bar lengths are the values that get_param_importances returns.
    - The bars are never negative. By default they add up to 1.0.
    - The docs give no fixed threshold for a big or small bar.
