  code:
    - library: optuna
      target: optuna.pruners.NopPruner
      why_this_library: Pass it as pruner= to optuna.create_study.
      snippet: |
        # optuna 5.0.0
        import optuna
        from collections import Counter
        from sklearn.datasets import make_classification
        from sklearn.linear_model import SGDClassifier
        from sklearn.model_selection import train_test_split

        optuna.logging.set_verbosity(optuna.logging.WARNING)
        X, y = make_classification(n_samples=600, n_features=10, random_state=0)
        X_train, X_val, y_train, y_val = train_test_split(X, y, random_state=0)


        def objective(trial):
            alpha = trial.suggest_float("alpha", 1e-5, 1.0, log=True)
            clf = SGDClassifier(alpha=alpha, random_state=0)
            for step in range(30):
                clf.partial_fit(X_train, y_train, classes=[0, 1])
                score = clf.score(X_val, y_val)
                trial.report(score, step)
                if trial.should_prune():
                    raise optuna.TrialPruned()
            return score


        pruner = optuna.pruners.NopPruner()
        study = optuna.create_study(
            direction="maximize",
            sampler=optuna.samplers.TPESampler(seed=0),
            pruner=pruner,
        )
        study.optimize(objective, n_trials=20)
        states = Counter(t.state.name for t in study.trials)
        print("states:", dict(sorted(states.items())))
        print(states["PRUNED"], "of", len(study.trials), "trials pruned")
      output: |
        states: {'COMPLETE': 20}
        0 of 20 trials pruned
  what_comes_out:
    items:
      - name: prune
        kind: method
        task: null
        shape: "scalar"
        object_type: bool
        example: "False"
        shape_explanation: >-
          A single True or False, not an array. It is always False. Optuna calls
          prune() after each report. The example is one False, so its shape is
          scalar.
        note: "Always False. Optuna calls it; your code uses should_prune()."
      - name: trial.should_prune()
        kind: return
        task: null
        shape: "scalar"
        object_type: bool
        example: "False"
        shape_explanation: >-
          A single True or False, not an array. It is always False, so no trial
          stops here. The example is one False, so its shape is scalar.
        note: "Always False, so the trial never stops here."
      - name: trial.state
        kind: return
        task: null
        shape: "scalar"
        object_type: optuna.trial.TrialState
        example: "TrialState.COMPLETE"
        shape_explanation: >-
          One enum member, not an array. With NopPruner it is COMPLETE for every
          trial that finishes its steps. The example is one member, so its shape
          is scalar.
        note: "COMPLETE for every trial that runs all its steps."
    next_step: Compare the state counts with a pruned run to see what pruning saved.
    snippet: |
      # optuna 5.0.0
      import optuna

      optuna.logging.set_verbosity(optuna.logging.WARNING)
      study = optuna.create_study(pruner=optuna.pruners.NopPruner())
      trial = study.ask()
      for step, value in enumerate([0.1, 5.0, 1000.0]):
          trial.report(value, step)
          print("step", step, "value", value, "should_prune:", trial.should_prune())
    snippet_library: optuna
    output: |
      step 0 value 0.1 should_prune: False
      step 1 value 5.0 should_prune: False
      step 2 value 1000.0 should_prune: False
    visual: null
  catch_outs:
    - It is not the default. A study without a pruner uses MedianPruner.
    - should_prune() always returns False, whatever the reported value.
    - Every trial runs all its steps, so costly objectives take longer.
