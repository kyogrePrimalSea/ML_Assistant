  watch_it_work: {none: true}
  intuition:
    idea: One number per setting for how much it matters to the score, sorted with the largest first.
    analogy: Like splitting one pie between the settings, where a bigger slice means that setting mattered more.
    animation: none
    goal: Which settings changed the score the most, so you know which ones to keep tuning?
    steps:
      - Pass a finished study to get_param_importances.
      - Only completed trials are used.
      - Each key is a setting name, and each value is its importance.
      - The dict is sorted from the largest value to the smallest.
      - A higher value means that setting is more important.
      - By default the values add to 1, so each one is a share of the whole.
      - Different evaluators can rank the settings in a different order.
    math:
      notation:
        - {symbol: "I_i", meaning: "The raw importance the evaluator gives setting i."}
        - {symbol: "S", meaning: "The total of the raw importances of all settings."}
        - {symbol: "n", meaning: "The number of settings in the returned dict."}
        - {symbol: "p_i", meaning: "The value returned for setting i when normalize is True."}
      equations:
        - expression: "S = sum of I_j over all settings j"
          meaning: "S adds up the raw importances of every setting."
        - expression: "p_i = I_i / S when S is not 0"
          meaning: "Each returned value is its share of the total, so the values add to 1."
        - expression: "p_i = 1 / n when S = 0"
          meaning: "If every raw importance is 0, the settings share the total equally."
      prediction: "With normalize=False the values are the raw I_i, and they need not add to 1."
    good_at: [ranking many settings, shares of the whole, numbers you can sort]
    bad_at: [which direction helps, why a setting matters, settings seen in few trials]
    vs_siblings:
      - {page: plot-param-importances, note: "The same numbers, drawn as a bar chart."}
    read_more:
      - The default PED-ANOVA evaluator asks how much each setting matters for reaching the best trials.
      - fANOVA fits a random forest to the trials, and needs sklearn.
      - Mean decrease impurity also uses a random forest, and needs sklearn.
      - normalize=False shows raw values and prints an experimental warning.
