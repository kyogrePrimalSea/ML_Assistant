  - library: optuna
    target: optuna.importance.get_param_importances
    why_this_library: Returns numbers. The plot page shows the same ranking as a chart.
    snippet: |
      # optuna 5.0.0
      import optuna
      from sklearn.datasets import make_regression
      from sklearn.ensemble import RandomForestRegressor
      from sklearn.model_selection import cross_val_score

      optuna.logging.set_verbosity(optuna.logging.WARNING)
      X, y = make_regression(n_samples=300, n_features=8, noise=15, random_state=0)


      def objective(trial):
          model = RandomForestRegressor(
              n_estimators=trial.suggest_int("n_estimators", 10, 80),
              max_depth=trial.suggest_int("max_depth", 2, 12),
              min_samples_leaf=trial.suggest_int("min_samples_leaf", 1, 10),
              random_state=0,
          )
          return cross_val_score(model, X, y, cv=3, scoring="r2").mean()


      study = optuna.create_study(
          direction="maximize",
          sampler=optuna.samplers.TPESampler(seed=0),
      )
      study.optimize(objective, n_trials=30)
      importances = optuna.importance.get_param_importances(study)
      print({name: round(value, 2) for name, value in importances.items()})
    output: |
      {'min_samples_leaf': 0.65, 'n_estimators': 0.34, 'max_depth': 0.0}
  what_comes_out:
    items:
    - name: get_param_importances
      kind: return
      task: null
      shape: dict of setting to float
      object_type: dict
      example: "{'max_depth': 0.6, 'min_samples_leaf': 0.4}"
      shape_explanation: >-
        A dictionary has no rows or columns. Each key is a setting name from the
        study. Each value is an importance number, not a score. The example has 2
        keys, so the study had 2 settings. Keys are sorted from most to least
        important.
      note: "Sorted from most to least important. Sums to 1 by default."
    next_step: Read the keys from the top. The first key is the most important.
    snippet: |
      # optuna 5.0.0
      import optuna
      from optuna.importance import FanovaImportanceEvaluator
      from optuna.importance import get_param_importances
      from sklearn.datasets import make_regression
      from sklearn.ensemble import RandomForestRegressor
      from sklearn.model_selection import cross_val_score

      optuna.logging.set_verbosity(optuna.logging.WARNING)
      X, y = make_regression(n_samples=300, n_features=8, noise=15,
                             random_state=0)


      def objective(trial):
          model = RandomForestRegressor(
              n_estimators=trial.suggest_int("n_estimators", 10, 80),
              max_depth=trial.suggest_int("max_depth", 2, 12),
              min_samples_leaf=trial.suggest_int("min_samples_leaf", 1, 10),
              random_state=0,
          )
          return cross_val_score(model, X, y, cv=3, scoring="r2").mean()


      study = optuna.create_study(
          direction="maximize",
          sampler=optuna.samplers.TPESampler(seed=0),
      )
      study.optimize(objective, n_trials=30)
      ped = get_param_importances(study)
      fanova = get_param_importances(
          study, evaluator=FanovaImportanceEvaluator(seed=0)
      )
      raw = get_param_importances(study, normalize=False)
      only = get_param_importances(study, params=["max_depth"])
      print("type:", type(ped).__name__)
      print("ped order:", list(ped))
      print("ped sum:", round(sum(ped.values()), 3))
      print("fanova order:", list(fanova))
      print("raw sum:", round(sum(raw.values()), 4))
      print("params=['max_depth']:", only)
    snippet_library: optuna
    output: |
      type: dict
      ped order: ['min_samples_leaf', 'n_estimators', 'max_depth']
      ped sum: 1.0
      fanova order: ['max_depth', 'min_samples_leaf', 'n_estimators']
      raw sum: 0.0314
      params=['max_depth']: {'max_depth': 1.0}
    visual: null
  catch_outs:
    - Values sum to 1 unless normalize is False.
    - Only completed trials are used to rank the settings.
    - With no finished trials, the result is an empty dict.
    - A name in params that no completed trial used raises a ValueError.
    - The default PED-ANOVA evaluator includes conditional settings. Other evaluators leave them out.
