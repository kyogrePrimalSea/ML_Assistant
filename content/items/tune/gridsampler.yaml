  - library: optuna
    target: optuna.samplers.GridSampler
    why_this_library: Optuna sampler. Takes the grid as search_space.
    snippet: |
      # optuna 5.0.0
      import optuna
      from sklearn.datasets import make_regression
      from sklearn.linear_model import ElasticNet
      from sklearn.model_selection import cross_val_score

      optuna.logging.set_verbosity(optuna.logging.WARNING)

      X, y = make_regression(
          n_samples=200, n_features=8, n_informative=3, noise=10, random_state=0
      )
      SCORING = "neg_mean_squared_error"
      search_space = {"alpha": [0.01, 0.1, 1.0, 10.0], "l1_ratio": [0.1, 0.5, 0.9]}


      def objective(trial):
          alpha = trial.suggest_categorical("alpha", search_space["alpha"])
          l1_ratio = trial.suggest_categorical("l1_ratio", search_space["l1_ratio"])
          model = ElasticNet(alpha=alpha, l1_ratio=l1_ratio)
          return -cross_val_score(model, X, y, cv=3, scoring=SCORING).mean()


      sampler = optuna.samplers.GridSampler(search_space, seed=0)
      study = optuna.create_study(sampler=sampler, direction="minimize")
      study.optimize(objective, n_trials=12)
      print(len(study.trials))
      print({k: round(v, 3) for k, v in study.best_params.items()})
    output: |
      12
      {'alpha': 0.01, 'l1_ratio': 0.9}
