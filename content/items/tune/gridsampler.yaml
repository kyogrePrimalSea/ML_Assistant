  catch_outs:
  - Every value you want tried must be in search_space.
  - Only the listed values are tried, never values in between.
  - The study stops by itself after the last combination.
  - Set seed to shuffle the order when n_trials is below the grid size.
  - Distributed runs can suggest the same combination twice.
  key_settings:
    tier1:
    - name: search_space
      page: null
      controls: The values to try for each setting, as a dict of lists.
      effect: Every extra value multiplies the number of trials.
    tier2:
    - name: seed
      page: null
      controls: Fixes a random order for visiting the grid.
      effect: Helps when n_trials is smaller than the grid, so tries spread out.
    tier3: []
  watch_it_work:
    none: true
  intuition:
    idea: Try each combination in a fixed grid once, then stop.
    analogy: Walking every cell of a fixed grid on a map, one cell at a time.
    animation: none
    goal: Find the best combination of listed values, with no values in between.
    steps:
    - List the values to try for each setting in search_space.
    - Build every combination of those values.
    - Run one trial per combination, in order, or shuffled when seed is set.
    - Score each trial with the objective.
    - Stop once every combination has been tried.
    - Keep the trial with the lowest value.
    math:
      notation:
      - symbol: p
        meaning: The number of settings in search_space.
      - symbol: n_1 ... n_p
        meaning: How many values you listed for each setting.
      - symbol: C
        meaning: The number of combinations, one trial each.
      - symbol: v_c
        meaning: The value the objective returned for combination c.
      - symbol: c*
        meaning: The winning combination, stored as best_params.
      equations:
      - expression: C = n_1 × n_2 × ... × n_p
        meaning: Every extra value in any list multiplies the number of combinations.
      - expression: c* = argmin over c of v_c
        meaning: The winner is the combination with the smallest value.
      prediction: 4 alpha values x 3 l1_ratio values = 12 trials, so the study stops after 12.
    good_at:
    - small grids
    - every combination needed
    - reproducible runs
    bad_at:
    - many settings
    - continuous settings
    - fine values between points
    vs_siblings:
    - page: bruteforcesampler
      note: Same full sweep, but the objective defines the space.
    - page: qmcsampler
      note: Spreads a set number of tries evenly, not every grid cell.
    - page: randomsampler
      note: Random draws from ranges, not a fixed list.
    read_more:
    - List a few values for each setting.
    - Each combination is tried once, in order.
    - The study stops when the grid is used up.
    - Keep the trial with the lowest value.
