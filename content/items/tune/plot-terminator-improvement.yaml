  catch_outs:
    - Needs plotly and torch installed; the default evaluator needs torch.
    - The code example output is made up. It was not run here.
    - The default RegretBoundEvaluator is experimental, and its interface may change.
    - Pass improvement_evaluator to change how improvement is estimated.
    - Trials below min_n_trials are drawn in a lighter colour.
    - The docs give no threshold for when to stop.
  key_settings:
    tier1:
      - name: improvement_evaluator
        page: null
        controls: The object that estimates the objective improvement. None uses RegretBoundEvaluator.
        effect: A different evaluator gives different estimates. BestValueStagnationEvaluator returns trials left.
      - name: plot_error
        page: null
        controls: Whether the error from error_evaluator is drawn as a line. Default is False.
        effect: Adds a line next to the improvement, so the two can be read together.
    tier2:
      - name: error_evaluator
        page: null
        controls: The object that estimates the error. None uses CrossValidationErrorEvaluator.
        effect: Only drawn when plot_error is True.
      - name: min_n_trials
        page: null
        controls: The minimum number of trials before stopping is considered. Default is 20.
        effect: Improvements for trials below this count are drawn in a lighter colour.
    tier3: []
  watch_it_work: {none: true}
  intuition:
    idea: An estimate of how much the best value could still improve, drawn after each trial.
    analogy: Like asking whether another hour of hunting for a parking spot is likely to beat the one you already found.
    animation: none
    goal: Is more search still likely to improve the best setting found so far?
    steps:
      - The horizontal axis is the trial number.
      - The vertical axis is the estimated improvement, as the improvement evaluator reports it.
      - Each point is one trial, from the first completed trial onward.
      - The first points, up to min_n_trials, are drawn faded.
      - A line that drops over trials means the estimate of room left is shrinking.
      - The plot sets no cut-off value, so the stop decision is yours.
    good_at: [judging whether to keep searching, seeing the trend over trials, spotting a flat estimate]
    bad_at: [an exact score, a stop or go threshold, the best setting itself]
    vs_siblings:
      - {page: plot-optimization-history, note: "Shows the best value found so far, not the room left."}
      - {page: terminator, note: "The automatic stopping mechanism for the study."}
    read_more:
      - The default estimate uses RegretBoundEvaluator, which is experimental and needs torch.
      - BestValueStagnationEvaluator counts the trials left before a stagnation limit.
      - Passing plot_error=True adds a line from error_evaluator.
      - min_n_trials sets how many early points are drawn faded.
