      # optuna 5.0.0
      import collections

      import optuna
      from sklearn.datasets import make_classification
      from sklearn.linear_model import SGDClassifier
      from sklearn.model_selection import KFold

      optuna.logging.set_verbosity(optuna.logging.WARNING)
      X, y = make_classification(n_samples=600, n_features=10, random_state=0)
      folds = list(KFold(n_splits=10, shuffle=True, random_state=0).split(X))


      def objective(trial):
          alpha = trial.suggest_float("alpha", 1e-5, 1.0, log=True)
          scores = []
          for fold, (train, test) in enumerate(folds):
              clf = SGDClassifier(alpha=alpha, random_state=0)
              clf.fit(X[train], y[train])
              scores.append(clf.score(X[test], y[test]))
              trial.report(scores[-1], fold)
              if trial.should_prune():
                  raise optuna.TrialPruned()
          return sum(scores) / len(scores)


      study = optuna.create_study(
          direction="maximize",
          sampler=optuna.samplers.TPESampler(seed=0),
          pruner=optuna.pruners.WilcoxonPruner(p_threshold=0.1),
      )
      study.optimize(objective, n_trials=20)
      print("best_value:", round(study.best_value, 3))
      for t in study.trials[:6]:
          print(t.number, t.state.name, len(t.intermediate_values), "folds")
