  catch_outs:
  - Report the same instance id for the same fold in every trial.
  - Trials with infinity or nan are never pruned.
  - The code also holds off pruning unless the best trial's average is better. The docs page does not say this.
  - Needs scipy installed.
  - Experimental since Optuna 3.6.0, so the interface may change.
  key_settings:
    tier1:
    - name: p_threshold
      page: null
      controls: The p-value cut-off for stopping. Default is 0.1.
      effect: A larger value prunes more aggressively.
    - name: n_startup_steps
      page: null
      controls: Steps that must be available before any pruning. Default is 2.
      effect: The first two steps are never pruned, and too few steps leave the test little to compare.
    tier2: []
    tier3: []
  watch_it_work:
    none: true
  intuition:
    idea: Compare a setting with the best one fold by fold, and stop it once the gap is clear.
    analogy: Two students sitting the same set of questions, where one is clearly behind after each question.
    animation: none
    goal: Stop a setting early when its fold scores are clearly worse than the best setting's.
    steps:
    - Each trial scores the same folds, one at a time.
    - Report each fold's score with its fold number.
    - Pair the trial's scores with the best trial's scores, fold by fold.
    - Run a Wilcoxon signed-rank test on those pairs.
    - Prune the trial if the test says it is worse, with p below p_threshold.
    - Otherwise, let the trial score the next fold.
    math:
      notation:
      - symbol: i
        meaning: The instance, here a fold, identified by the step number.
      - symbol: p
        meaning: The p-value from a Wilcoxon signed-rank test on paired scores.
      - symbol: p_threshold
        meaning: The p-value cut-off, set by the p_threshold argument.
      equations:
      - expression: prune t if p < p_threshold and t is worse than the best on average
        meaning: A trial is stopped only when the test is sure enough and the average favours the best.
      prediction: The check runs at each report. A trial stops at the first fold where both conditions hold.
    good_at:
    - per-fold scores
    - costly folds or instances
    - noisy scores
    bad_at:
    - one score per trial
    - infinite or nan scores
    vs_siblings:
    - page: medianpruner
      note: Compares steps with the median, not paired folds.
    - page: successivehalvingpruner
      note: Uses rung budgets, not a paired test.
    - page: percentilepruner
      note: Keeps a share of trials, not a test result.
    read_more:
    - Shuffle the fold order in each trial, as the reference advises.
    - The reference page covers the sequential test and its error rate.
    - Report the same fold id for the same fold in every trial.
