  intuition:
    idea: "One bar per trial, from when it started to when it finished, so you can see how long trials took."
    analogy: "A timetable with one row per train, where each bar shows when it left and when it arrived."
    animation: none
    goal: "See which trials took the longest, and when the search spent its time."
    steps:
      - "The horizontal axis is the datetime, the clock time when trials ran."
      - "The vertical axis is the trial number, with one row for each trial."
      - "Each bar is one trial."
      - "The left end of a bar is when the trial started."
      - "The right end is when the trial finished, so bar length is how long it took."
      - "Colour shows the trial's state, and the legend names each state shown."
      - "Look for the longest bars first, because they took the most time."
    good_at: ["how long each trial took", "slow trials in the search", "when trials ran"]
    bad_at: ["scores of each trial", "which settings each trial used", "why a trial was slow"]
