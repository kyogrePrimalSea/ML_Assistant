      - {page: plot-edf, note: "Shows how scores are spread, not how long trials took."}
    read_more:
      - "Bar length is the finish time minus the start time."
      - "n_recent_trials keeps only the last trials in trial order."
      - "A running trial's bar ends at the latest finish time in the study, not at the present."
      - "A study with no trials gives an empty plot."
