    snippet: |
      # optuna 5.0.0
      import optuna
      from sklearn.datasets import make_regression
      from sklearn.linear_model import ElasticNet
      from sklearn.model_selection import cross_val_score

      optuna.logging.set_verbosity(optuna.logging.WARNING)

      X, y = make_regression(
          n_samples=200, n_features=8, n_informative=3, noise=10, random_state=0
      )
      SCORING = "neg_mean_squared_error"
      search_space = {"alpha": [0.01, 0.1, 1.0, 10.0], "l1_ratio": [0.1, 0.5, 0.9]}


      def objective(trial):
          alpha = trial.suggest_categorical("alpha", search_space["alpha"])
          l1_ratio = trial.suggest_categorical("l1_ratio", search_space["l1_ratio"])
          model = ElasticNet(alpha=alpha, l1_ratio=l1_ratio)
          return -cross_val_score(model, X, y, cv=3, scoring=SCORING).mean()


      sampler = optuna.samplers.BruteForceSampler(seed=0, avoid_premature_stop=True)
      study = optuna.create_study(sampler=sampler, direction="minimize")
      study.optimize(objective)

      tried = {tuple(sorted(t.params.items())) for t in study.trials}
      print("best_params:", {k: round(v, 3) for k, v in study.best_params.items()})
      print("best_value:", round(study.best_value, 3))
      print("trials:", len(study.trials))
      print("distinct settings tried:", len(tried))
    snippet_library: optuna
    output: |
      best_params: {'alpha': 0.01, 'l1_ratio': 0.9}
      best_value: 106.537
      trials: 12
      distinct settings tried: 12
    visual: null
  catch_outs:
  - By default it may stop before covering every combination.
  - avoid_premature_stop=True gives a strict sweep, with more repeated tries.
  - Float settings need a step, because the space must be finite.
  - Only worth it when the space is small and discrete.
  key_settings:
    tier1:
    - name: avoid_premature_stop
      page: null
      controls: When True, runs a strict exhaustive sweep. False uses a looser stop rule.
      effect: True covers every combination, but may repeat some tries.
    tier2:
    - name: seed
      page: null
      controls: Fixes a random order for trying the combinations.
      effect: Not advised in distributed runs, since order cannot be ensured.
    tier3: []
  watch_it_work:
    none: true
  intuition:
    idea: Try every combination in a small, finite space, each one once.
    analogy: Checking every drawer in a small cabinet, one drawer at a time.
    animation: none
    goal: Cover every combination in a small space, so none is missed.
    steps:
    - Name the choices inside the objective with suggest calls.
    - Each distinct combination of choices becomes one trial.
    - Trials run in a fixed order, shuffled when seed is set.
    - Score each trial with the objective.
    - Stop when the space is used up, or earlier under the default rule.
    - Keep the trial with the lowest value.
    math:
      notation:
      - symbol: n_1 ... n_p
        meaning: How many choices each setting has.
      - symbol: C
        meaning: The number of combinations, one trial each.
      - symbol: v_c
        meaning: The value the objective returned for combination c.
      - symbol: c*
        meaning: The winning combination, stored as best_params.
      equations:
      - expression: C = n_1 × n_2 × ... × n_p
        meaning: For a flat space of fixed choices, each extra choice multiplies the count.
      - expression: c* = argmin over c of v_c
        meaning: The winner is the combination with the smallest value.
      prediction: 4 alpha choices x 3 l1_ratio choices = 12 trials.
    good_at:
    - small discrete spaces
    - full coverage
    bad_at:
    - continuous settings
    - large spaces
    vs_siblings:
