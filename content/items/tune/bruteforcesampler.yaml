      note: Same full sweep, but you list the grid yourself.
    - page: qmcsampler
      note: Spreads a set number of tries over a range.
    read_more:
    - Each combination of choices is one trial.
    - Trials run until the space is used up.
    - avoid_premature_stop makes the sweep strict.
