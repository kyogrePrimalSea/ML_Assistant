  watch_it_work: {none: true}
  intuition:
    idea: A chart of the area the trials cover up to a reference point, after each trial.
    analogy: Like painting a wall after each trial, where a trial that adds nothing paints nothing.
    animation: none
    goal: Did each new trial still add area to the trade-offs found so far?
    steps:
      - The horizontal axis is the trial number, starting from 0.
      - The vertical axis is the hypervolume, the area covered up to the reference point.
      - Each dot is one completed trial, joined to the next by a line.
      - Each dot's height is the area covered by all trials up to that one.
      - A rise from one dot to the next means that trial added new area.
      - A flat stretch means those trials added no area.
      - A line still rising at the last trial means the newest trials still added area.
    math:
      notation:
        - {symbol: "k", meaning: "The number of goals. The reference point has one value per goal."}
        - {symbol: "r", meaning: "The reference point, in the goals' own units."}
        - {symbol: "v_i", meaning: "The goal values of trial i, with maximize goals negated so lower is better."}
        - {symbol: "H_t", meaning: "The hypervolume after trial t, which is the height of its dot."}
        - {symbol: "λ", meaning: "The volume of a region in k dimensions. It is an area when k is 2."}
      equations:
        - expression: "H_t = λ(union over trials i up to t of the region between v_i and r)"
          meaning: "The space between the trial points and the reference point, counting overlaps once."
        - expression: "H_t = H_(t-1) when trial t is beyond r or dominated by an earlier trial"
          meaning: "Such a trial adds no area, so the line stays flat."
      prediction: "The line never falls, because a trial can add area or add nothing."
    good_at: [several goals over time, spotting stalled stretches, comparing runs with one reference]
    bad_at: [which trial is best, which setting mattered, runs with different reference points]
    vs_siblings:
      - {page: plot-optimization-history, note: "Use it for one goal. This plot needs two or more."}
      - {page: plot-pareto-front, note: "Shows the trials themselves, not the area they cover."}
      - {page: plot-terminator-improvement, note: "Estimates room left to improve, not the area covered."}
    read_more:
      - Give one reference point value per goal, in plain goal units.
      - Trials worse than the reference point on any goal add no area.
      - Keep the same reference point when comparing runs.
      - Only completed trials count toward the area.
