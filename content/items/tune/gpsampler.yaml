  catch_outs:
    - Needs torch and scipy installed.
    - The code example output is made up. It was not run here.
    - Set deterministic_objective only when reruns give the same score.
    - Start-up trials are random before the model takes over.
  key_settings:
    tier1:
      - name: n_startup_trials
        page: null
        controls: Number of random trials before the model starts. Default is 10.
        effect: More random trials mean more trials pass before the model helps.
      - name: deterministic_objective
        page: null
        controls: Fixes the model's noise variance at its minimum when True.
        effect: Use only when the same settings always give the same score. Experimental.
      - name: seed
        page: null
        controls: Seeds the internal random number generator. None picks a random seed.
        effect: A fixed seed makes repeated runs match.
    tier2:
      - name: independent_sampler
        page: null
        controls: Sampler for startup trials and for conditional settings.
        effect: The default is a random sampler with the same seed. Changing it changes the startup trials.
    tier3: []
  watch_it_work: {none: true}
  intuition:
    idea: Fit a smooth model of the score, then test the settings it expects to gain most.
    analogy: Like a map-maker who draws the likely landscape from a few visits, then checks the most promising spot.
    animation: none
    goal: Reach a good score in few trials, by learning from every trial.
    steps:
      - Run the startup trials at random, as set by n_startup_trials.
      - Fit a Gaussian process to the trials so far.
      - Use a Matern kernel with a separate length scale for each setting.
      - Tune the kernel settings by maximising the marginal likelihood.
      - Score candidate settings with the acquisition function, logEI for one objective.
      - Run the trial with the best acquisition score.
      - Record its score and refit the model.
    math:
      notation:
        - {symbol: "x", meaning: "A candidate set of settings."}
        - {symbol: "f(x)", meaning: "The objective score at x, known only after the trial runs."}
        - {symbol: "GP", meaning: "The Gaussian process fitted to past settings and scores."}
        - {symbol: "a(x)", meaning: "The acquisition function, scoring how promising x is."}
      equations:
        - expression: "x_next = argmax over x of a(x)"
          meaning: The next trial uses the candidate with the highest acquisition score.
        - expression: "a(x) = logEI(x)  (one objective)"
          meaning: Log expected improvement over the best score so far, for one objective.
      prediction: "The next trial uses x_next. The model refits after each trial."
    good_at: [few trials, learns from every trial]
    bad_at: [many trials, needs torch and scipy]
    vs_siblings:
      - {page: tpesampler, note: "Uses density ratios, not a Gaussian process. Needs no torch."}
      - {page: cmaessampler, note: "Uses the cmaes package. Suited to continuous settings."}
      - {page: randomsampler, note: "Draws settings at random, with no model."}
    read_more:
      - The GPSampler reference page describes the kernel and acquisition functions.
      - Set seed to make a run repeatable.
  next: []
