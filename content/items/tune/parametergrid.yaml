  watch_it_work: {none: true}
  intuition:
    idea: Write out every combination of your settings, one dictionary each.
    analogy: A menu card that lists every meal you can build from the options on offer.
    animation: none
    goal: List every combination of settings, so you can try each one.
    steps:
      - List the values to try for each setting.
      - Build every combination of those values.
      - Give each combination back as one dictionary.
      - Loop over the dictionaries and fit a model for each one.
    math:
      notation:
        - {symbol: "p", meaning: "The number of settings in param_grid."}
        - {symbol: "n_1 ... n_p", meaning: "How many values you listed for each setting."}
        - {symbol: "C", meaning: "The number of combinations, which is the number of dictionaries."}
      equations:
        - expression: "C = n_1 × n_2 × ... × n_p"
          meaning: Every extra value in any list multiplies the number of combinations.
        - expression: "len(grid) = C"
          meaning: The grid reports the same count as the product.
      prediction: "Example: 3 depths x 2 leaf sizes = 6 dictionaries, so the loop runs 6 times."
    good_at: [few settings, need every combination, custom loops]
    bad_at: [many settings, continuous ranges, fitting models itself]
    vs_siblings:
      - {page: gridsearchcv, note: "Uses this grid, then fits and scores every combination for you."}
      - {page: parametersampler, note: "Draws random settings instead of listing all of them."}
    read_more:
      - List a few values for each setting.
      - Build every combination as one dictionary.
      - Loop over the dictionaries and fit each model.
      - Score each one yourself.
