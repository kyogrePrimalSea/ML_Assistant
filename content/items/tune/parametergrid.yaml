  code:
  - library: scikit-learn
    target: sklearn.model_selection.ParameterGrid
    why_this_library: Lists settings only. You write the loop.
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.datasets import load_breast_cancer
      from sklearn.model_selection import ParameterGrid, cross_val_score
      from sklearn.tree import DecisionTreeClassifier

      X, y = load_breast_cancer(return_X_y=True)
      grid = ParameterGrid({"max_depth": [2, 4, 6], "min_samples_leaf": [1, 10]})
      for params in grid:
          model = DecisionTreeClassifier(random_state=0, **params)
          score = cross_val_score(model, X, y, cv=3).mean()
          print(params, round(score, 3))
    output: |
      {'max_depth': 2, 'min_samples_leaf': 1} 0.912
      {'max_depth': 2, 'min_samples_leaf': 10} 0.917
      {'max_depth': 4, 'min_samples_leaf': 1} 0.921
      {'max_depth': 4, 'min_samples_leaf': 10} 0.921
      {'max_depth': 6, 'min_samples_leaf': 1} 0.914
      {'max_depth': 6, 'min_samples_leaf': 10} 0.921

  what_comes_out:
    items:
    - name: for params in grid
      kind: return
      task: null
      shape: "n_settings dicts"
      object_type: dict
      example: "{'max_depth': 4, 'min_samples_leaf': 10}"
      shape_explanation: >-
        Looping gives one dictionary per setting, with no rows or columns. n_settings is the
        product of the list lengths. The example is one dictionary, from a grid of 6 settings,
        so the loop yields 6 dictionaries in total.
      note: "Each dict is one setting to fit. Loop over the grid to reach them."
    - name: len(grid)
      kind: return
      task: null
      shape: "scalar"
      object_type: int
      example: "6"
      shape_explanation: >-
        A scalar is one value, not an array. It counts the settings in the grid. The example
        is the single integer 6, so its shape is scalar.
      note: "The product of the list lengths: 3 by 2 gives 6."
    - name: grid[i]
      kind: return
      task: null
      shape: "dict"
      object_type: dict
      example: "{'max_depth': 4, 'min_samples_leaf': 10}"
      shape_explanation: >-
        A dictionary has no rows or columns. Each key is a setting name from the grid. Each
        value is one listed value for that setting. The example has 2 keys, because the grid
        had 2 settings.
      note: "Indexing gives one setting directly, counting from 0."
    next_step: Fit one model per dict and score it.
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.model_selection import ParameterGrid

      grid = ParameterGrid({"max_depth": [2, 4, 6], "min_samples_leaf": [1, 10]})
      print("len(grid):", len(grid))
      print("grid[1]:", grid[1])
      for params in grid:
          print(params)
    snippet_library: scikit-learn
    output: |
      len(grid): 6
      grid[1]: {'min_samples_leaf': 10, 'max_depth': 2}
      {'max_depth': 2, 'min_samples_leaf': 1}
      {'max_depth': 2, 'min_samples_leaf': 10}
      {'max_depth': 4, 'min_samples_leaf': 1}
      {'max_depth': 4, 'min_samples_leaf': 10}
      {'max_depth': 6, 'min_samples_leaf': 1}
      {'max_depth': 6, 'min_samples_leaf': 10}

    visual: null
  catch_outs:
