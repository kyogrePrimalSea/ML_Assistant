        shape_explanation: >-
          One trial record, not an array. It stores the trial's number, settings, score
          and state. The example is a single trial, so it has no rows or columns.
        note: "Use its number to find the trial in study.trials."
    next_step: null
    snippet: |
      # optuna 5.0.0
      import optuna
      from optuna.samplers import RandomSampler

      optuna.logging.set_verbosity(optuna.logging.WARNING)


      def objective(trial):
          x = trial.suggest_float("x", -10, 10)
          return (x - 2) ** 2


      sampler = RandomSampler(seed=0)
      study = optuna.create_study(sampler=sampler)
      study.optimize(objective, n_trials=30)
      print("best_params:", study.best_params)
      print("best_value:", round(study.best_value, 4))
      print("best_trial number:", study.best_trial.number)
      print("trials run:", len(study.trials))
      print("best_trial state:", study.best_trial.state)
    snippet_library: optuna
    output: |
      best_params: {'x': 2.055267521432878}
      best_value: 0.0031
      best_trial number: 2
      trials run: 30
      best_trial state: TrialState.COMPLETE
    visual: null
  catch_outs:
    - Seed defaults to None, so each run differs.
    - Ignores past trials, so it never gets smarter.
    - Use it as a baseline to beat, not a final pick.
  key_settings:
    tier1:
      - name: seed
        page: null
        controls: Seeds the random number generator. None picks a new seed each run.
        effect: A fixed seed gives the same settings each run. None gives different settings each run.
    tier2: []
    tier3: []
  watch_it_work: {none: true}
  intuition:
    idea: Each trial draws its settings at random, ignoring every past trial.
    analogy: Draw each setting from a hat. No memory of past draws.
    animation: none
    goal: Get a wide first look at the search space, with no learning.
    steps:
      - Define each setting's range inside the objective.
      - For each trial, draw one value per setting at random.
      - Run the trial and record its score.
      - Ignore past scores when drawing the next trial's settings.
      - Keep the best trial at the end.
    math:
      notation:
        - {symbol: "p", meaning: "The number of settings in the objective."}
        - {symbol: "x_i", meaning: "The value drawn for setting i in one trial."}
      equations:
        - expression: "P(x_1, ..., x_p) = P(x_1) x ... x P(x_p)"
          meaning: Each setting is drawn on its own, so one draw does not affect another.
      prediction: "Each new trial draws fresh settings. Past scores do not change the next draw."
    good_at: [baseline, wide first look]
    bad_at: [learning from past trials, narrowing to a best area]
    vs_siblings:
      - {page: tpesampler, note: "Learns from past trials, so it narrows the search."}
      - {page: gridsampler, note: "Tries values on a fixed grid, not at random."}
    read_more:
      - Independent sampling means no setting depends on past trials.
      - Set seed to make a run repeatable.
