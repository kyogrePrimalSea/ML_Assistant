  catch_outs:
    - Needs plotly 5.0.0 or later installed.
    - The code example output is made up. It was not run here.
    - Plots the objective value unless target is set.
    - A trial missing a chosen setting is not plotted.
    - The colour bar label is set by target_name.
    - Which end of the colour bar is best depends on whether the study minimises or maximises.
  key_settings:
    tier1:
      - name: params
        page: null
        controls: The settings to plot. None plots every setting in the study.
        effect: Naming a pair shows only that pair, and trials missing one of them are left out.
      - name: target
        page: null
        controls: The value whose rank colours each dot. None uses the objective value for one objective.
        effect: Needed for multi-objective studies, where the objective value alone is not enough.
    tier2:
      - name: target_name
        page: null
        controls: The label shown on the colour bar.
        effect: Changes the label only, not the colours.
    tier3: []
  watch_it_work: {none: true}
  intuition:
    idea: "A scatter plot of two settings, with each dot coloured by the rank of its score."
    analogy: "Like a results board where each student's colour shows their place in the class."
    animation: none
    goal: "See which ranges of two settings hold the best-ranked trials."
    math:
      notation:
        - {symbol: "n", meaning: "The number of trials plotted."}
        - {symbol: "r_i", meaning: "The rank of trial i's score, where 1 is the lowest score."}
        - {symbol: "c_i", meaning: "The colour position of trial i, from 0 at the low end of the colour bar to 1 at the high end."}
      equations:
        - expression: "c_i = (r_i - 1) / (n - 1)"
          meaning: "The lowest score gets 0, the highest gets 1, and the others are spread evenly by rank between."
      prediction: "The lowest score sits at 0 and the highest at 1 on the colour bar."
    steps:
      - "The horizontal axis is one setting."
      - "The vertical axis is a second setting."
      - "Each dot is one finished trial, placed at its two setting values."
      - "A dot's colour is the rank of its score among all trials."
      - "The colour bar runs from the lowest score at one end to the highest at the other."
      - "Its tick labels give the score at the minimum, 25%, 50%, 75% and maximum points."
      - "Look for the setting ranges where dots at one end of the colour bar gather."
    good_at: ["where top-ranked trials sit", "picking new setting ranges", "two settings at once"]
    bad_at: ["exact score values", "size of score gaps", "which end is best"]
    vs_siblings:
      - {page: plot-contour, note: "Shows the score as a map across two settings."}
      - {page: plot-slice, note: "Shows one setting at a time against the score."}
      - {page: plot-parallel-coordinate, note: "Shows every setting at once as lines through trials."}
    read_more:
      - "Read the plot_rank docs page linked in source_urls."
      - "Remember that colour shows order, not how far apart the scores are."
      - "Check the study direction before choosing which end of the colour bar to favour."
