      target: optuna.visualization.plot_rank
      why_this_library: "Draws the plot straight from a study. Output below is made up: plotly is not installed here, so this was not run."
      snippet: |
        # optuna 5.0.0
        import optuna
        from optuna.visualization import plot_rank
        from sklearn.datasets import make_regression
        from sklearn.ensemble import RandomForestRegressor
        from sklearn.model_selection import cross_val_score

        optuna.logging.set_verbosity(optuna.logging.WARNING)
        X, y = make_regression(n_samples=300, n_features=8, noise=15,
                               random_state=0)


        def objective(trial):
            depth = trial.suggest_int("max_depth", 2, 12)
            leaf = trial.suggest_int("min_samples_leaf", 1, 10)
            model = RandomForestRegressor(
                n_estimators=30, max_depth=depth, min_samples_leaf=leaf,
                random_state=0,
            )
            return cross_val_score(model, X, y, cv=3).mean()


        study = optuna.create_study(
            direction="maximize", sampler=optuna.samplers.TPESampler(seed=0)
        )
        study.optimize(objective, n_trials=20)

        fig = plot_rank(study, params=["max_depth", "min_samples_leaf"])
        print(study.best_params)
        print("figure type:", type(fig).__name__)
      output: |
        (made-up values, not run: plotly is not installed here)
        {'max_depth': 7, 'min_samples_leaf': 4}
        figure type: Figure
