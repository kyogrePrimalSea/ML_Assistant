  code:
    - library: optuna
      target: optuna.study.MaxTrialsCallback
      why_this_library: Passed as a callback to optimize, so it needs no extra setup.
      snippet: |
        # optuna 5.0.0
        import optuna
        from optuna.study import MaxTrialsCallback
        from optuna.trial import TrialState
        from sklearn.datasets import make_regression
        from sklearn.linear_model import Ridge
        from sklearn.model_selection import cross_val_score

        optuna.logging.set_verbosity(optuna.logging.WARNING)
        X, y = make_regression(n_samples=200, n_features=8, noise=15,
                               random_state=0)


        def objective(trial):
            alpha = trial.suggest_float("alpha", 1e-3, 10.0, log=True)
            return cross_val_score(Ridge(alpha=alpha), X, y, cv=3).mean()


        study = optuna.create_study(
            direction="maximize",
            sampler=optuna.samplers.RandomSampler(seed=0),
        )
        callback = MaxTrialsCallback(10, states=(TrialState.COMPLETE,))
        study.optimize(objective, n_trials=100, callbacks=[callback])
        complete = study.get_trials(states=(TrialState.COMPLETE,))
        print("trials run:", len(study.trials))
        print("complete trials:", len(complete))
        print("best alpha:", round(study.best_params["alpha"], 4))
      output: |
        trials run: 10
        complete trials: 10
        best alpha: 0.3833
  what_comes_out:
    items:
      - name: study.trials
        kind: return
        task: null
        shape: "(n_trials,) list of FrozenTrial"
        object_type: list
        example: "[FrozenTrial, FrozenTrial, FrozenTrial] (made-up values)"
        shape_explanation: >-
          A one-dimensional list with one FrozenTrial for each trial that ran, in any state. The trailing comma in (n_trials,) means one dimension. The example has 3 trials, so its concrete shape is (3,).
        note: "Every trial that ran, in any state."
      - name: study.get_trials(states=(TrialState.COMPLETE,))
        kind: return
        task: null
        shape: "(n_complete,) list of FrozenTrial"
        object_type: list
        example: "[FrozenTrial] (made-up values)"
        shape_explanation: >-
          A one-dimensional list with one FrozenTrial for each completed trial. n_complete is the number of completed trials. The example has 1 trial, so its concrete shape is (1,).
        note: "Only completed trials. The default limit counts these."
      - name: study.best_params
        kind: return
        task: null
        shape: "dict"
        object_type: dict
        example: "{'x': 8} (made-up values)"
        shape_explanation: >-
          A dictionary has no rows or columns. Each key is a setting name passed to a suggest call. The example has 1 key, so it covers 1 setting.
        note: "Best completed trial only. Failed trials are skipped."
    next_step: Compare study.trials with the completed list to see what was counted.
    snippet: |
      # optuna 5.0.0
      import optuna
      from optuna.study import MaxTrialsCallback
      from optuna.trial import TrialState

      optuna.logging.set_verbosity(optuna.logging.WARNING)


      def objective(trial):
          x = trial.suggest_int("x", 0, 9)
          if x % 3 == 0:
              raise ValueError("made-up failure")
          return float(x)


      study = optuna.create_study(
          direction="maximize",
          sampler=optuna.samplers.RandomSampler(seed=0),
      )
      callback = MaxTrialsCallback(4)
      study.optimize(
          objective, n_trials=100, callbacks=[callback], catch=(ValueError,)
      )
      complete = study.get_trials(states=(TrialState.COMPLETE,))
      print("trials run:", len(study.trials))
      print("complete trials:", len(complete))
      print("failed trials:", len(study.get_trials(states=(TrialState.FAIL,))))
      print("best_params:", study.best_params)
    snippet_library: optuna
    output: |
      trials run: 5
      complete trials: 4
      failed trials: 1
      best_params: {'x': 7}
    visual: null
  catch_outs:
    - Only completed trials count by default, so pruned and failed trials do not.
    - Add TrialState.PRUNED to states to count pruned trials too.
    - The count includes trials already stored in a reloaded study.
    - The check runs after each trial, so the trial that reaches the limit still finishes.
    - The optimize call still has its own n_trials, so the lower limit wins.
  key_settings:
    tier1:
    - name: n_trials
      page: null
      controls: The number of counted trials at which the study stops. It must be an integer.
      effect: A lower limit ends the search sooner, even when optimize allows more trials.
    - name: states
      page: null
      controls: "The trial states that count toward the limit. The default is (TrialState.COMPLETE,). None counts every state."
      effect: Counting more states reaches the limit sooner, so the search ends sooner.
    tier2: []
    tier3: []
  watch_it_work: {none: true}
  intuition:
    idea: Count finished trials, and stop the study when the count reaches a fixed limit.
    analogy: A kitchen timer for the search. It rings after a set number of finished tries, not after a set time.
    animation: none
    goal: Put a cap on the search by how many trials have finished.
    steps:
      - Set the limit with n_trials.
      - Choose which trial states count, with states.
      - Create the callback and pass it to optimize with callbacks=[...].
      - After each trial, the callback counts the trials whose state is in states.
      - When the count reaches n_trials, the callback calls study.stop().
      - The study ends after the trial that reached the limit.
    math:
      notation:
        - {symbol: "N", meaning: "The limit set by n_trials."}
        - {symbol: "c", meaning: "The number of trials whose state is in states."}
      equations:
        - expression: "c = number of trials with a state in states"
          meaning: By default only completed trials are counted.
        - expression: "stop when c >= N"
          meaning: The study stops once the count reaches the limit.
      prediction: "The snippet sets a limit of 10 and every trial completes, so it runs 10 trials."
    good_at: [fixed trial budget, shared compute limit]
    bad_at: [stop on no progress, time-based limit]
    vs_siblings:
      - {page: terminatorcallback, note: "Stops when the search has stopped gaining, based on an estimate."}
      - {page: optuna-study, note: "The n_trials of optimize counts every trial, not only completed ones."}
    read_more:
      - Pass the callback to optimize with callbacks=[...].
      - Set states to choose which trial states count toward the limit.
      - The count includes trials that were already stored in the study.
