    snippet: |
      # optuna 5.0.0
      import optuna
      from sklearn.datasets import load_breast_cancer
      from sklearn.ensemble import RandomForestClassifier
      from sklearn.model_selection import cross_val_score

      optuna.logging.set_verbosity(optuna.logging.WARNING)
      X, y = load_breast_cancer(return_X_y=True)


      def objective(trial):
          n_trees = trial.suggest_int("n_estimators", 5, 100)
          model = RandomForestClassifier(
              n_estimators=n_trees,
              max_depth=trial.suggest_int("max_depth", 2, 12),
              random_state=0,
          )
          accuracy = cross_val_score(model, X, y, cv=3).mean()
          return accuracy, n_trees


      study = optuna.create_study(
          directions=["maximize", "minimize"],
          sampler=optuna.samplers.NSGAIISampler(seed=0),
      )
      study.optimize(objective, n_trials=30)
      fig = optuna.visualization.plot_pareto_front(
          study, target_names=["accuracy", "n_estimators"]
      )
      print(fig.layout.title.text)
      print(len(fig.data))
    output: |
