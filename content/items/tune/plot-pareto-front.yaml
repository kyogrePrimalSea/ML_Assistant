  watch_it_work: {none: true}
  intuition:
    idea: Each dot is one trial, and the front is the dots that no other trial beats on the trade-off.
    analogy: Like comparing phones on price and battery life, where the front holds the phones no other phone beats on both.
    animation: none
    goal: Which trials give the best balance between your goals?
    steps:
      - The horizontal axis is the first goal, named by its axis title.
      - The vertical axis is the second goal, named by its axis title.
      - Each dot is one completed trial.
      - Dots in the Best Trial legend entry are on the front.
      - Dots in the Trial legend entry are beaten by at least one other trial.
      - No other trial is at least as good as a front dot on both goals.
      - Moving along the front trades one goal against the other.
    math:
      notation:
        - {symbol: "k", meaning: "The number of goals. Two or three are plotted unless targets is set."}
        - {symbol: "v_a", meaning: "The goal values of trial a, with maximize goals negated so lower is better."}
        - {symbol: "a ≻ b", meaning: "Trial a dominates trial b."}
        - {symbol: "F", meaning: "The front, the trials that no other trial dominates."}
      equations:
        - expression: "a ≻ b when v_a,j <= v_b,j for every goal j, and v_a is not equal to v_b"
          meaning: "Trial a is at least as good on every goal and differs from b, so it beats b."
        - expression: "F = {b : there is no trial a with a ≻ b}"
          meaning: "The front holds every trial that no other trial dominates."
      prediction: "Every dot off the front has some trial that dominates it."
    good_at: [two or three goals, seeing the front, dominated trials]
    bad_at: [which goal matters more, how the front changed, which setting caused a trial]
    vs_siblings:
      - {page: plot-hypervolume-history, note: "Shows how the covered area grew over trials."}
      - {page: plot-optimization-history, note: "The single-goal progress chart. It does not show trade-offs."}
      - {page: plot-param-importances, note: "Ranks settings by importance rather than showing the trials."}
    read_more:
      - Set one direction per goal when you create the study.
      - Use target_names so the axes name your goals.
      - The front is found from the completed trials so far.
      - Each goal is either maximized or minimized, and the front respects that.
