    tier3: []
  watch_it_work: {none: true}
  intuition:
    idea: A record of one finished trial, with its settings and score.
    analogy: A receipt for one run, with the settings used, the score and the run number.
    animation: none
    goal: Read what one trial tried and how it scored.
    steps:
      - The study finishes a trial and stores its settings.
      - The trial's state records how the trial ended.
      - The objective's return value is stored as value.
      - Reading best_trial or trials gives you these records.
      - Calling the objective with a record reruns it with those settings.
    math:
      notation:
        - {symbol: "p", meaning: "The settings stored in params for one trial."}
        - {symbol: "f", meaning: "The objective function, which returns a score."}
        - {symbol: "v", meaning: "The value stored on the trial."}
        - {symbol: "*", meaning: "Marks the best trial."}
      equations:
        - expression: "v = f(p)"
          meaning: The stored value is what the objective returned for those settings.
        - expression: "f(p*) = v*, when the objective has no randomness"
          meaning: For the best trial, rerunning the objective gives back its stored value.
      prediction: "Example: a trial with max_depth 12 and value 0.725 reruns to 0.725."
    good_at: [reading past results, checking the best trial, rescoring with the objective]
    bad_at: [saving changes to a study, sampling new settings]
    vs_siblings:
      - {page: optuna-trial, note: "The live trial during a run. FrozenTrial is the finished record."}
      - {page: optuna-study, note: "Holds all trials, and returns them as records."}
    read_more:
      - COMPLETE means the trial finished normally.
      - Use study.best_trial to get the winning record.
      - Rerun the objective with best.params to check a score.
  next: []
