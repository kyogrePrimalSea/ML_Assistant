  code:
    - library: optuna
      target: optuna.trial.FrozenTrial
      why_this_library: Returned by study.best_trial and study.trials.
      snippet: |
        # optuna 5.0.0
        import optuna
        from optuna.samplers import TPESampler
        from sklearn.datasets import make_regression
        from sklearn.ensemble import RandomForestRegressor
        from sklearn.model_selection import cross_val_score

        optuna.logging.set_verbosity(optuna.logging.WARNING)
        X, y = make_regression(n_samples=300, n_features=8, noise=15, random_state=0)


        def objective(trial):
            depth = trial.suggest_int("max_depth", 2, 12)
            leaf = trial.suggest_int("min_samples_leaf", 1, 10)
            model = RandomForestRegressor(
                n_estimators=30, max_depth=depth, min_samples_leaf=leaf, random_state=0
            )
            return cross_val_score(model, X, y, cv=3).mean()


        study = optuna.create_study(direction="maximize", sampler=TPESampler(seed=0))
        study.optimize(objective, n_trials=20)
        best = study.best_trial
        print("number:", best.number)
        print("state:", best.state.name)
        print("value:", round(best.value, 3))
        print("params:", best.params)
        print("re-scored:", round(objective(best), 3))
      output: |
        number: 12
        state: COMPLETE
        value: 0.725
        params: {'max_depth': 12, 'min_samples_leaf': 1}
        re-scored: 0.725
  what_comes_out:
    items:
      - name: number
        kind: attribute
        task: null
        shape: "scalar"
        object_type: int
        example: "4"
        shape_explanation: >-
          A single integer, not an array. It has no rows or columns. The example is the
          integer 4, so its shape is scalar.
        note: "Position of the trial in the study, from 0."
      - name: state
        kind: attribute
        task: null
        shape: "scalar, TrialState"
        object_type: optuna.trial.TrialState
        example: "TrialState.COMPLETE"
        shape_explanation: >-
          One status value, not an array. It has no rows or columns. The example is the
          single status COMPLETE, so its shape is scalar. Read its name with state.name.
        note: "Check this first. COMPLETE means the trial finished."
      - name: value
        kind: attribute
        task: null
        shape: "scalar or None"
        object_type: float
        example: "0.725"
        shape_explanation: >-
          One number, or None when no score was stored. It has no rows or columns. The
          example is the single number 0.725, so its shape is scalar.
        note: "Score from the objective. Can be None, so check state first."
      - name: params
        kind: attribute
        task: null
        shape: "dict"
        object_type: dict
        example: "{'max_depth': 12, 'min_samples_leaf': 1}"
        shape_explanation: >-
          A dictionary has no rows or columns. Each key is a setting name. Each value is
          the setting this trial used. The example has 2 keys, so the trial used 2 settings.
        note: "Settings this trial used, one entry per name."
      - name: distributions
        kind: attribute
        task: null
        shape: "dict"
        object_type: dict
        example: "{'max_depth': IntDistribution(...)}"
        shape_explanation: >-
          A dictionary has no rows or columns. Each key is a setting name, and each value
          describes the range that name was drawn from. The example has 1 key, so it
          describes 1 setting.
        note: "The range or choices each setting was drawn from."
      - name: intermediate_values
        kind: attribute
        task: null
        shape: "dict"
        object_type: dict
        example: "{0: 0.61, 1: 0.64}"
        shape_explanation: >-
          A dictionary has no rows or columns. Each key is a step number and each value
          is the score reported at that step. The example has 2 keys, so 2 steps were
          reported.
        note: "Scores reported step by step with report()."
      - name: duration
        kind: attribute
        task: null
        shape: "scalar"
        object_type: datetime.timedelta
        example: "0:00:02.410000"
        shape_explanation: >-
          A single length of time, not an array. It has no rows or columns. The example is
          one time of about 2.4 seconds, so its shape is scalar.
        note: "How long the trial took. Changes from run to run."
    next_step: null
    snippet: |
      # optuna 5.0.0
      import optuna
      from optuna.samplers import TPESampler

      optuna.logging.set_verbosity(optuna.logging.WARNING)


      def objective(trial):
          x = trial.suggest_float("x", -1.0, 1.0)
          trial.report(x**2, step=0)
          return x**2


      study = optuna.create_study(sampler=TPESampler(seed=0))
      study.optimize(objective, n_trials=5)
      trial = study.trials[0]
      print("number:", trial.number)
      print("state:", repr(trial.state))
      print("value:", round(trial.value, 4))
      print("params:", sorted(trial.params), round(trial.params["x"], 3))
      print("distributions:", trial.distributions)
      print("intermediate steps:", list(trial.intermediate_values))
      print("user_attrs:", trial.user_attrs)
    snippet_library: optuna
    output: |
      number: 0
      state: <TrialState.COMPLETE: 1>
      value: 0.0095
      params: ['x'] 0.098
      distributions: {'x': FloatDistribution(high=1.0, log=False, low=-1.0, step=None)}
      intermediate steps: [0]
      user_attrs: {}
    visual: null
  catch_outs:
