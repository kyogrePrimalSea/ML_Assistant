slots:
  header: {}
  solves:
    hero: {kind: tuning, dims: 2, trials: 30}
    line: Tries random settings and keeps the best one.
  quick_facts:
    facts:
      - {label: Default trials, value: "10 (n_iter)"}
      - {label: Scores with, value: cross-validation}
