  code:
    - library: scikit-learn
      target: sklearn.model_selection.RandomizedSearchCV
      why_this_library: Works with any scikit-learn model or Pipeline.
      snippet: |
        # scikit-learn 1.9.1
        from scipy.stats import randint
        from sklearn.datasets import make_regression
        from sklearn.ensemble import RandomForestRegressor
        from sklearn.model_selection import RandomizedSearchCV

        X, y = make_regression(n_samples=300, n_features=8, noise=15, random_state=0)

        search = RandomizedSearchCV(
            RandomForestRegressor(n_estimators=30, random_state=0),
            param_distributions={
                "max_depth": randint(2, 12),
                "min_samples_leaf": randint(1, 10),
            },
            n_iter=8,
            cv=3,
            random_state=0,
        )
        search.fit(X, y)
        print(search.best_params_)
        print(round(search.best_score_, 3))
  what_comes_out: {none: true}
  catch_outs:
    - Set random_state or results change every run.
    - The best score is from cross-validation, not a test set.
    - Trials grow with n_iter times the number of folds.
  key_settings:
