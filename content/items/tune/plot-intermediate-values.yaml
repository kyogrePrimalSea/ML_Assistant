    snippet: |
      # optuna 5.0.0
      import optuna
      from sklearn.datasets import make_regression
      from sklearn.linear_model import SGDRegressor
      from sklearn.metrics import r2_score
      from sklearn.model_selection import train_test_split
      from sklearn.preprocessing import StandardScaler

      optuna.logging.set_verbosity(optuna.logging.WARNING)
      X, y = make_regression(n_samples=300, n_features=8, noise=15, random_state=0)
      X = StandardScaler().fit_transform(X)
      X_tr, X_va, y_tr, y_va = train_test_split(X, y, random_state=0)


      def objective(trial):
          alpha = trial.suggest_float("alpha", 1e-5, 1e-1, log=True)
          model = SGDRegressor(alpha=alpha, eta0=0.01, random_state=0)
          for epoch in range(15):
              model.partial_fit(X_tr, y_tr)
              score = r2_score(y_va, model.predict(X_va))
              trial.report(score, epoch)
              if trial.should_prune():
                  raise optuna.TrialPruned()
          return score


      study = optuna.create_study(
          direction="maximize",
          pruner=optuna.pruners.MedianPruner(n_warmup_steps=3),
          sampler=optuna.samplers.TPESampler(seed=0),
      )
      study.optimize(objective, n_trials=20)
      fig = optuna.visualization.plot_intermediate_values(study)
      print(fig.layout.title.text)
      print(len(fig.data))
    output: |
