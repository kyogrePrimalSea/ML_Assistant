    next_step: Return one score for the settings you were given.
    snippet: |
      # optuna 5.0.0
      import optuna
      from optuna.samplers import TPESampler

      optuna.logging.set_verbosity(optuna.logging.WARNING)


      def objective(trial):
          print("trial number:", trial.number)
          n = trial.suggest_int("n_leaves", 2, 10, step=2)
          rate = trial.suggest_float("rate", 0.01, 1.0, log=True)
          kind = trial.suggest_categorical("kind", ["gini", "entropy"])
          print("params so far:", sorted(trial.params))
          trial.report(abs(n - 6) + rate, step=0)
          print("should_prune:", trial.should_prune())
          return abs(n - 6) + rate


      study = optuna.create_study(sampler=TPESampler(seed=0))
      study.optimize(objective, n_trials=3)
      print("kind of last trial:", study.trials[-1].params["kind"])
    snippet_library: optuna
    output: |
      trial number: 0
      params so far: ['kind', 'n_leaves', 'rate']
      should_prune: False
      trial number: 1
      params so far: ['kind', 'n_leaves', 'rate']
      should_prune: False
      trial number: 2
      params so far: ['kind', 'n_leaves', 'rate']
      should_prune: False
      kind of last trial: gini
    visual: null
  catch_outs:
    - Use the same name and range in every trial.
    - Each name you suggest becomes a search dimension.
    - A reused name with a new range keeps the first range, with a warning.
    - To limit trials with a rule, call set_constraint on the trial.
  key_settings:
    tier1:
      - name: low
        page: null
        controls: The lower end of the range a suggest call may return. It is included.
        effect: Raising it narrows the search from below. With log on, it must be above 0.
      - name: high
        page: null
        controls: The upper end of the range a suggest call may return. It is included.
        effect: Lowering it narrows the search from above. It must be at least low.
    tier2:
      - name: log
        page: null
        controls: Whether values are drawn evenly on a log scale, not a linear one.
        effect: Spreads tries across orders of magnitude. Cannot be combined with step.
      - name: step
        page: null
        controls: The gap between allowed values.
        effect: A larger gap leaves fewer values to search. Cannot be combined with log.
    tier3: []
  watch_it_work: {none: true}
  intuition:
    idea: Ask for settings, use them, and return one score.
    analogy: A form the study hands out. You fill in each box and send back one score.
    animation: none
    goal: Turn each suggest call into one setting, so the study can score it.
    steps:
      - The study creates a trial and passes it to the objective.
      - Each suggest call names a setting and its range or choices.
      - The sampler returns one value for each name.
      - The objective builds a model with those values.
      - The objective returns one score.
      - The study stores the trial and moves on.
    math:
      notation:
        - {symbol: "low, high", meaning: "The smallest and largest values allowed. Both are included."}
        - {symbol: "step", meaning: "The gap between neighbouring allowed values."}
        - {symbol: "k", meaning: "A whole number that counts steps up from low."}
        - {symbol: "x", meaning: "The value returned by one suggest call."}
      equations:
        - expression: "x = low + k × step, with low + k × step ≤ high"
          meaning: A suggested value sits on a grid that starts at low and moves in steps of size step.
        - expression: "step = 1 for suggest_int by default"
          meaning: With step 1, the grid is every whole number from low to high.
      prediction: "Example: suggest_int('n_leaves', 2, 10, step=2) can return 2, 4, 6, 8 or 10."
    good_at: [custom ranges, log scales, choices from a list]
    bad_at: [fixed settings only, values outside the range]
    vs_siblings:
      - {page: optuna-study, note: "Holds every trial. A trial is one of them."}
      - {page: frozentrial, note: "The finished record of this trial, read afterwards."}
    read_more:
      - Pass a name and range to each suggest call.
      - Use the same names in every trial.
      - Return one score from the objective.
