  intuition:
    idea: "For each score, this shows the share of trials that scored that value or lower, as a rising curve."
    analogy: "A class ranking chart: for any mark, how many students scored that mark or lower."
    animation: none
    goal: "See how spread out the trial scores are, and compare the spread of two searches."
    steps:
      - "The horizontal axis is the objective value, labelled with target_name."
      - "The vertical axis is the cumulative probability, from 0 to 1, read as a share of trials."
      - "Each line is one study. With two or more studies, the legend names each one."
      - "Only complete trials are counted."
      - "Pick a value on the horizontal axis, then go straight up to the curve."
      - "The height of the curve there is the share of trials scoring that value or lower."
      - "A steep part means many trials scored in a narrow range."
      - "A flat part means few trials scored in that range."
    math:
      notation:
        - {symbol: "n", meaning: "The number of complete trials in one study."}
        - {symbol: "v_i", meaning: "The objective value of complete trial i."}
        - {symbol: "x", meaning: "A point on the horizontal axis. The plot uses 100 evenly spaced points from the smallest to the largest value."}
        - {symbol: "F(x)", meaning: "The share of trials with a value at or below x. This is the height of the curve."}
      equations:
        - expression: "F(x) = (number of i with v_i <= x) / n"
          meaning: "Count the trials at or below x, then divide by the number of complete trials."
        - expression: "F(largest value) = 1"
          meaning: "At the largest value, every trial is at or below it, so the curve ends at 1."
      prediction: "The curve never falls as x increases, and it ends at 1 at the largest value."
    good_at: ["score spread across trials", "comparing two searches", "where most scores sit"]
    bad_at: ["which settings gave each score", "pruned or failed trials", "the order trials ran in"]
    vs_siblings:
      - {page: plot-optimization-history, note: "Shows scores in run order, not as a spread."}
      - {page: plot-intermediate-values, note: "Shows scores at each step, not final scores."}
      - {page: plot-rank, note: "Ranks each trial, rather than showing the share below a value."}
    read_more:
      - "Only complete trials are counted. Pruned and failed trials are left out."
      - "The optuna docstring says this plot is useful for analysing and improving search spaces."
      - "The optuna docstring says the curve assumes objective values are spread uniformly over the objective space."
      - "Pass several studies to compare their curves."
