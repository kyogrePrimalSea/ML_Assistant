    snippet: |
      # optuna 5.0.0
      import optuna
      from sklearn.datasets import make_regression
      from sklearn.ensemble import RandomForestRegressor
      from sklearn.model_selection import cross_val_score

      optuna.logging.set_verbosity(optuna.logging.WARNING)
      X, y = make_regression(n_samples=300, n_features=8, noise=15, random_state=0)


      def objective(trial):
          model = RandomForestRegressor(
              n_estimators=trial.suggest_int("n_estimators", 10, 80),
              max_depth=trial.suggest_int("max_depth", 2, 12),
              min_samples_leaf=trial.suggest_int("min_samples_leaf", 1, 10),
              random_state=0,
          )
          return cross_val_score(model, X, y, cv=3, scoring="r2").mean()


      study = optuna.create_study(
          direction="maximize",
          sampler=optuna.samplers.TPESampler(seed=0),
      )
      study.optimize(objective, n_trials=20)
      fig = optuna.visualization.plot_edf(study)
      print(round(study.best_value, 3))
