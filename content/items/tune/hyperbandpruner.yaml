    visual: null
  catch_outs:
  - Needs trial.report at each step. No report, no pruning.
  - Set max_resource to the last step your objective reports.
  - Set study_name so bracket assignment repeats between runs.
  - Pruned trials are not the best; judge the finished ones.
  key_settings:
    tier1:
    - name: min_resource
      page: null
      controls: The fewest steps a trial gets. Default is 1.
      effect: Smaller values stop trials sooner, but judge them on less evidence.
    - name: max_resource
      page: null
      controls: The most steps a trial can run. Default is 'auto'.
      effect: '''auto'' waits for the first finished trial. A fixed number is safer when steps vary.'
    - name: reduction_factor
      page: null
      controls: About one in this many trials is kept at each rung. Default is 3.
      effect: Sets the number of brackets. Keep it so there are about four to six.
    - name: bootstrap_count
      page: null
      controls: Trials that must finish a rung before promotion starts. Default is 0.
      effect: Cannot be used when max_resource is 'auto'.
    tier2: []
    tier3: []
  watch_it_work:
    none: true
  intuition:
    idea: Run several successive halving schedules at once, each with a different budget per trial.
    analogy: Several tournaments with different entry sizes, so one of them suits the field you have.
    animation: none
    goal: Start many cheap trials and stop the weak ones early, without picking one budget by hand.
    steps:
    - Set min_resource and max_resource, the fewest and most steps.
    - Hyperband builds several brackets, each a successive halving run.
    - Each trial is assigned to one bracket, from its study name and number.
    - Inside its bracket, a trial is judged at each rung.
    - Trials that are kept move to the next rung, as in successive halving.
    - Record the trial as PRUNED, or as COMPLETE when it finishes.
    math:
      notation:
      - symbol: r
        meaning: min_resource, the fewest steps a trial gets.
      - symbol: R
        meaning: max_resource, the most steps a trial can run.
      - symbol: eta
        meaning: reduction_factor, the ratio between rungs.
      - symbol: B
        meaning: The number of brackets, each a successive halving run.
      equations:
      - expression: B = floor(log_eta(R / r)) + 1
        meaning: The number of brackets follows from the ratio of R to r.
      - expression: B = floor(log_3(30 / 1)) + 1 = 4
        meaning: The example in the code tab sets 4 brackets.
      prediction: With r = 1, R = 30 and eta = 3, the study runs 4 brackets, each with its own rung steps.
    good_at:
    - many cheap trials
    - budget shared across brackets
    - reproducible with study_name
    bad_at:
    - few trials
    - unknown maximum steps
    vs_siblings:
    - page: successivehalvingpruner
      note: One schedule. Hyperband runs several, with a different budget each.
    - page: medianpruner
      note: Compares every step, with no brackets.
    - page: optuna-study
      note: The study the pruner is set on, with study_name.
    read_more:
    - Set study_name so the bracket for each trial repeats.
    - Set max_resource to the number of steps your objective reports.
    - The reference page covers the bracket formula.
