    why_this_library: Optuna pruner. Passed to create_study.
    snippet: |
      # optuna 5.0.0
      import optuna
      from sklearn.datasets import load_breast_cancer
      from sklearn.linear_model import SGDClassifier
      from sklearn.model_selection import train_test_split
      from sklearn.preprocessing import StandardScaler

      optuna.logging.set_verbosity(optuna.logging.WARNING)
      X, y = load_breast_cancer(return_X_y=True)
      X_train, X_val, y_train, y_val = train_test_split(X, y, random_state=0)
      scaler = StandardScaler().fit(X_train)
      X_train, X_val = scaler.transform(X_train), scaler.transform(X_val)


      def objective(trial):
          alpha = trial.suggest_float("alpha", 1e-5, 1e-1, log=True)
          model = SGDClassifier(alpha=alpha, random_state=0)
          for epoch in range(20):
              model.partial_fit(X_train, y_train, classes=[0, 1])
              score = model.score(X_val, y_val)
              trial.report(score, epoch)
              if trial.should_prune():
                  raise optuna.TrialPruned()
          return score


      study = optuna.create_study(
          study_name="hyperband-demo",
          direction="maximize",
          sampler=optuna.samplers.RandomSampler(seed=0),
          pruner=optuna.pruners.HyperbandPruner(max_resource=20),
      )
      study.optimize(objective, n_trials=12)
      pruned = sum(t.state.name == "PRUNED" for t in study.trials)
      print(pruned, "of", len(study.trials), "trials pruned")
      print(round(study.best_value, 3))
  what_comes_out:
