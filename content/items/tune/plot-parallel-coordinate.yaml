  catch_outs:
    - Needs plotly installed.
    - The code example output is made up. It was not run here.
    - For one objective, plots the objective value unless target is set.
    - A trial with no value for a setting is drawn to a None tick.
    - With constraints, solid lines are feasible and dotted lines infeasible.
    - The docs do not say what a good or bad picture looks like.
  key_settings:
