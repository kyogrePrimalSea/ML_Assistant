        controls: The settings to draw as lines through. None draws every setting in the study.
        effect: Only the named settings get a column. The others are left out.
      - name: target
        page: null
        controls: The value each line is coloured by. None uses the objective value for one objective.
        effect: With target None, a multi-objective study draws all objective values and colours lines by Pareto rank.
    tier2:
      - name: target_name
        page: null
        controls: The label shown on the axis and the legend.
        effect: Changes the label only, not the lines.
