    idea: "One line per trial, passing through its value for each setting and its objective value."
    analogy: "Like following each bus through several stops on one route diagram."
    animation: none
    goal: "See how the settings used by each trial line up with its score."
    steps:
      - "Each vertical line is one column: the objective value, then each setting."
      - "The column names run along the bottom of the plot."
      - "Each line that runs across the columns is one finished trial."
      - "Each line crosses every column once, at a height for that trial."
      - "Line colour follows the objective value, read from the colour bar."
      - "Look for lines that bunch together in one column."
      - "Look for groups of lines that stay together across several columns."
