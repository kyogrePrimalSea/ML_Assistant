      - "The vertical axis is the second setting you chose."
      - "Each dot is one finished trial, placed at its two setting values."
      - "The contour lines mark levels of the score across the two settings."
      - "The colour bar tells you which score each colour stands for."
      - "If the colour changes along only one axis, the score moves with that setting alone in this area."
      - "Look for the region where the best-scoring dots gather."
