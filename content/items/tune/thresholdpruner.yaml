    - library: optuna
      target: optuna.pruners.ThresholdPruner
      why_this_library: Used as pruner= in optuna.create_study.
      snippet: |
        # optuna 5.0.0
        import optuna
        from sklearn.datasets import make_classification
        from sklearn.linear_model import SGDClassifier
        from sklearn.model_selection import train_test_split

        optuna.logging.set_verbosity(optuna.logging.WARNING)
        X, y = make_classification(n_samples=600, n_features=10, random_state=0)
        X_train, X_val, y_train, y_val = train_test_split(X, y, random_state=0)


        def objective(trial):
            alpha = trial.suggest_float("alpha", 1e-5, 1.0, log=True)
            clf = SGDClassifier(alpha=alpha, random_state=0)
            for step in range(30):
                clf.partial_fit(X_train, y_train, classes=[0, 1])
                score = clf.score(X_val, y_val)
                trial.report(score, step)
                if trial.should_prune():
                    raise optuna.TrialPruned()
            return score


        pruner = optuna.pruners.ThresholdPruner(lower=0.93)
        study = optuna.create_study(
            direction="maximize",
            sampler=optuna.samplers.TPESampler(seed=0),
            pruner=pruner,
        )
        study.optimize(objective, n_trials=20)
        pruned = [t for t in study.trials if t.state.name == "PRUNED"]
        print(len(pruned), "of", len(study.trials), "trials pruned")
  what_comes_out:
    items:
      - {name: prune, kind: method, task: null, shape: "bool", note: "Called by Optuna. Your code uses should_prune()."}
