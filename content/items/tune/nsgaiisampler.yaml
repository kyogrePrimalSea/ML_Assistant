  intuition:
    idea: Keep the best trade-offs, breed new settings from them, and repeat.
    analogy: Breeding plants, keeping those that do best on several traits at once.
    animation: none
    goal: 'Find trade-offs: settings that no other trial beats on every goal.'
    steps:
    - Score the first generation of random trials on every goal.
    - Group the trials into fronts, with the best trade-offs first.
    - Pick parents from the best fronts.
    - Cross over pairs of parents, with chance crossover_prob.
    - Mutate settings in each child, with chance mutation_prob.
    - Score the children on every goal.
    - Keep the best trials for the next generation.
    - Repeat until n_trials is used up.
    - Return the final front as best_trials.
    math:
      notation:
      - symbol: k
        meaning: The number of goals, one per entry in directions.
      - symbol: f_i
        meaning: The value of goal i for one trial, with i from 1 to k.
      - symbol: t
        meaning: One trial in the study.
      - symbol: B
        meaning: The set of trials returned as best_trials.
      equations:
      - expression: t has values (f_1, ..., f_k)
        meaning: Each trial reports one number per goal, in directions order.
      - expression: 'B = {t : no other trial is at least as good on every goal and better on one}'
        meaning: best_trials keeps every trial that no other trial beats.
      prediction: With two goals, B can hold several trials, so there is no single answer.
    good_at:
    - two or three goals
    - trade-off curves
    bad_at:
    - one goal only
    - many goals at once
    - very few tries
