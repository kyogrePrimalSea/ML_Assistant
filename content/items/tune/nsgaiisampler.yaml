  catch_outs:
  - Pass directions, one entry per goal.
  - Each objective returns its values in the same order as directions.
  - best_trials is a set of trade-offs, not one winner.
  - study.best_params raises an error with several goals; use best_trials.
  - population_size must be at least 2 for the default crossover.
