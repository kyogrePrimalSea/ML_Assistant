      controls: Chance that two parents swap settings to make a child.
      effect: Higher values mix good settings more often.
    - name: mutation_prob
      page: null
      controls: Chance that each setting in a child is changed at random.
      effect: Higher values explore more. None uses 1 divided by the number of settings.
