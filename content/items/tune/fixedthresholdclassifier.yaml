  code:
  - library: scikit-learn
    target: sklearn.model_selection.FixedThresholdClassifier
    why_this_library: Wraps any binary classifier. You set the cut-off.
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.datasets import load_breast_cancer
      from sklearn.linear_model import LogisticRegression
      from sklearn.model_selection import FixedThresholdClassifier, train_test_split
      from sklearn.pipeline import make_pipeline
      from sklearn.preprocessing import StandardScaler

      X, y = load_breast_cancer(return_X_y=True)
      X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)
      model = FixedThresholdClassifier(
          make_pipeline(StandardScaler(), LogisticRegression(max_iter=5000)),
          threshold=0.8,
      )
      model.fit(X_train, y_train)
      print(model.predict(X_test[:10]))
      print(round(model.score(X_test, y_test), 3))
  what_comes_out:
    items:
    - {name: fit, kind: method, task: null, shape: self, note: Fits the wrapped classifier.}
    - {name: predict, kind: method, task: classification, shape: '(n_samples,)', note: Labels from your threshold on the probability.}
