  - library: scikit-learn
    target: sklearn.model_selection.TunedThresholdClassifierCV
    why_this_library: Finds the cut-off with cross-validation.
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.datasets import load_breast_cancer
      from sklearn.linear_model import LogisticRegression
      from sklearn.model_selection import (
          TunedThresholdClassifierCV,
          train_test_split,
      )
      from sklearn.pipeline import make_pipeline
      from sklearn.preprocessing import StandardScaler

      X, y = load_breast_cancer(return_X_y=True)
      X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)
      model = TunedThresholdClassifierCV(
          make_pipeline(StandardScaler(), LogisticRegression(max_iter=5000)),
          scoring="balanced_accuracy",
          cv=5,
      )
      model.fit(X_train, y_train)
      print(round(model.best_threshold_, 3))
      print(round(model.score(X_test, y_test), 3))
