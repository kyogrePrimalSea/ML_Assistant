  catch_outs:
  - Each rung keeps about 1 in reduction_factor trials.
  - Your objective sets the maximum steps, not the pruner.
  - If steps vary by trial, set min_resource by hand.
  - No trial is pruned before the first rung.
  key_settings:
    tier1:
    - name: min_resource
      page: null
      controls: The fewest steps before the first rung. 'auto' estimates it from the first finished trial.
      effect: Too small a value judges trials on noise. Set it by hand when steps differ per trial.
    - name: reduction_factor
      page: null
      controls: About one in this many trials is kept at each rung. Default is 4.
      effect: A larger number prunes harder, but may drop a trial that starts slowly.
    tier2:
    - name: min_early_stopping_rate
      page: null
      controls: Moves the first rung later, by a power of reduction_factor. Default is 0.
      effect: A higher value means no trial is pruned until later, so more steps are spent.
    - name: bootstrap_count
      page: null
      controls: Trials that must finish a rung before any can move on. Default is 0.
      effect: Holds promotion until enough trials have reached each rung. 0 turns this off.
    tier3: []
  watch_it_work:
    none: true
  intuition:
    idea: Give every trial a small budget of steps, then move only the best ones to the next budget.
    analogy: A round of job interviews, where each round keeps about one candidate in three.
    animation: none
    goal: Find a good setting while spending most steps on the trials that look best.
    steps:
    - Set min_resource, the steps before the first rung.
    - Each trial runs until it reaches the first rung.
    - At the rung, compare it with the other trials that reached it.
    - Keep it only if it is in the top 1 in reduction_factor.
    - A kept trial runs to the next rung, which is reduction_factor times further.
    - Repeat at each rung until the trial completes or is pruned.
    math:
      notation:
      - symbol: r
        meaning: min_resource, the steps before the first rung.
      - symbol: eta
        meaning: reduction_factor, the ratio between rungs.
      - symbol: s
        meaning: min_early_stopping_rate, which delays the first rung.
      - symbol: k
        meaning: The rung number, counting from 0.
      equations:
      - expression: rung k is at step r x eta^(s + k)
        meaning: Each rung sits eta times further along than the one before.
      - expression: a trial is promoted if it is in the top 1/eta of trials at that rung
        meaning: About one trial in eta moves on at each rung; the rest are pruned there.
      prediction: With r = 3 and eta = 3, the rungs fall at steps 3, 9 and 27 when s is 0.
    good_at:
    - many trials
    - long runs
    - fixed budgets per rung
    bad_at:
    - few trials
    - steps that change per trial
    vs_siblings:
    - page: hyperbandpruner
      note: Runs several rung schedules, so the trade-off is automatic.
    - page: medianpruner
      note: Compares every step, not fixed rungs.
    - page: percentilepruner
      note: Keeps a set share at each step, not at rungs.
    read_more:
    - The reference page explains rungs and promotion in full.
    - Set min_resource by hand when the steps reported differ per trial.
    - Report a value at each step with trial.report.
