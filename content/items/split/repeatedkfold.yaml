  - library: scikit-learn
    target: sklearn.model_selection.RepeatedKFold
    why_this_library: One splitter that repeats k-fold with new random splits.
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.datasets import make_regression
      from sklearn.model_selection import RepeatedKFold

      X, _ = make_regression(n_samples=6, n_features=2, random_state=0)
      rkf = RepeatedKFold(n_splits=3, n_repeats=2, random_state=0)
      for train_idx, test_idx in rkf.split(X):
          print("test", test_idx)
      print("splits", rkf.get_n_splits(X))
