    visual: null
  catch_outs:
    - Repeats mean n_splits x n_repeats fits, so it runs longer.
    - Each repeat reshuffles, so there is no shuffle setting to change.
    - Set random_state, or each run gives different repeats.
    - Each row is tested once per repeat, so the same row counts in several scores.
  key_settings:
    tier1:
      - name: n_repeats
        page: null
        controls: How many times the whole k-fold split is run, each with new shuffles.
        effect: More repeats steady the average, but multiply the number of fits.
      - name: n_splits
        page: null
        controls: The number of folds in each repeat, at least 2.
        effect: Each fold is one fit per repeat, so the total fit count is n_splits x n_repeats.
    tier2:
      - name: random_state
        page: null
        controls: The seed for the shuffles that make each repeat different. None gives new shuffles each run.
        effect: A fixed int repeats the same set of splits, so scores can be compared.
    tier3: []
  watch_it_work: {none: true}
  intuition:
    idea: Run the class-balanced folds several times with fresh shuffles, then average the scores.
    analogy: Marking a mock exam several times, each time with the papers in a new random order.
    animation: none
    goal: Get a steadier score by repeating the class-balanced folds.
    steps:
      - Shuffle the rows, class by class, and build one stratified set of folds.
      - Use each fold once as the test piece, fitting and scoring on the rest.
      - Start again with a new shuffle, and build a new set of folds.
      - Repeat this n_repeats times in total.
      - Each repeat tests every row once, so each row is tested n_repeats times.
      - Average the scores over all n_splits x n_repeats folds.
    math:
      notation:
        - {symbol: "n", meaning: "The number of folds in each repeat, set by n_splits."}
        - {symbol: "r", meaning: "The number of repeats, set by n_repeats."}
      equations:
        - expression: "total splits = n x r"
          meaning: Each repeat makes n folds, so r repeats make n x r splits.
        - expression: "times each row is tested = r"
          meaning: Each repeat tests every row once, so r repeats test it r times.
      prediction: "Example: 5 folds and 3 repeats give 15 splits. Each row is tested 3 times."
    good_at: [small data, imbalanced classes, a steadier average score]
    bad_at: [large data, time-ordered data, one clean holdout]
    vs_siblings:
      - {page: stratifiedkfold, note: "One pass of the same class-balanced folds."}
      - {page: repeatedkfold, note: "Repeats plain folds, with no class balance."}
      - {page: stratifiedshufflesplit, note: "Random hold-outs that keep the class mix."}
    read_more:
      - Each repeat reshuffles, so random_state controls every repeat.
      - Folds from different repeats overlap, so one row is seen in several test pieces.
      - The total number of fits grows with both n_splits and n_repeats.
