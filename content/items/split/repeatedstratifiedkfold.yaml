      why_this_library: One object gives every repeat and fold.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.model_selection import RepeatedStratifiedKFold

        # made-up labels: 8 rows of class 0, 4 rows of class 1
        y = np.array([0] * 8 + [1] * 4)
        X = np.arange(12).reshape(-1, 1)

        rskf = RepeatedStratifiedKFold(n_splits=4, n_repeats=2, random_state=0)
        for i, (train, test) in enumerate(rskf.split(X, y)):
            print(f"split {i}: test rows {test}")
      output: |
        split 0: test rows [2 5 9]
        split 1: test rows [ 1  4 11]
        split 2: test rows [ 6  7 10]
        split 3: test rows [0 3 8]
        split 4: test rows [1 5 9]
        split 5: test rows [0 2 8]
        split 6: test rows [ 3  4 11]
        split 7: test rows [ 6  7 10]
