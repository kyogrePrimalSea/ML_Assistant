    snippet: |
      # scikit-learn 1.9.1
      import numpy as np
      from sklearn.model_selection import RepeatedStratifiedKFold

      y = np.array([0] * 8 + [1] * 4)
      X = np.arange(12).reshape(-1, 1)
      print("in: X", X.shape, "y", y.shape)

      rskf = RepeatedStratifiedKFold(n_splits=4, n_repeats=2, random_state=0)
      print("get_n_splits:", rskf.get_n_splits())
      times_tested = np.zeros(len(y), dtype=int)
      for _, test in rskf.split(X, y):
          times_tested[test] += 1
      print("times each row is tested:", times_tested)
    snippet_library: scikit-learn
