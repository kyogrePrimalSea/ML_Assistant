  code:
    - library: scikit-learn
      target: sklearn.model_selection.PredefinedSplit
      why_this_library: Uses your own fold labels, one per row.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.datasets import make_regression
        from sklearn.model_selection import PredefinedSplit

        X, y = make_regression(n_samples=20, n_features=3, random_state=0)

        # first 12 rows always train; rows 12-15 are fold 0, rows 16-19 fold 1
        test_fold = np.array([-1] * 12 + [0] * 4 + [1] * 4)

        ps = PredefinedSplit(test_fold)
        for train_idx, test_idx in ps.split():
            print("train rows:", len(train_idx), "test rows:", len(test_idx))
