  code:
    - library: scikit-learn
      target: sklearn.model_selection.PredefinedSplit
      why_this_library: Uses your own fold labels, one per row.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.model_selection import PredefinedSplit

        # made-up fold labels: -1 rows always train; 0, 1 and 2 are test folds
        test_fold = np.array([0, 0, -1, -1, 1, 1, 2, 2])
        ps = PredefinedSplit(test_fold)
        for i, (train, test) in enumerate(ps.split()):
            print(f"fold {i}: train rows {train}, test rows {test}")
      output: |
        fold 0: train rows [2 3 4 5 6 7], test rows [0 1]
        fold 1: train rows [0 1 2 3 6 7], test rows [4 5]
        fold 2: train rows [0 1 2 3 4 5], test rows [6 7]
