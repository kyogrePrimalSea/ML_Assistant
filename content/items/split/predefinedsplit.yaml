    visual: null
  catch_outs:
    - Use -1 for rows that must always stay in training.
    - Give every row a test_fold label, even the training rows.
    - Nothing is shuffled, so you choose the folds yourself.
    - Labels need not run from 0; each distinct value is one fold, in sorted order.
  key_settings:
    tier1:
      - name: test_fold
        page: null
        controls: One integer per row, naming the test fold it belongs to, or -1 to always train.
        effect: The labels fix every split, so one wrong label changes the scores.
    tier2: []
    tier3: []
  watch_it_work: {none: true}
  intuition:
    idea: Mark each row with the fold it should be tested in, and the splits follow your marks.
    analogy: Writing a box number on each exam paper, so each box is marked as a separate group.
    animation: none
    goal: Use a validation set you already chose, instead of a random one.
    steps:
      - Make one integer label per row.
      - Label each row that belongs in a test piece with that fold's number.
      - Label each row that must always train with -1.
      - Find the distinct labels, leaving out -1, and sort them.
      - For each label f, mark the rows labelled f as the test piece.
      - Make the training piece from every other row, including the -1 rows.
      - Yield one (train, test) pair for each label.
    math:
      notation:
        - {symbol: "N", meaning: "The number of rows, one label each."}
        - {symbol: "K", meaning: "The number of distinct labels, not counting -1."}
        - {symbol: "n_f", meaning: "The number of rows labelled f."}
      equations:
        - expression: "n_splits = K"
          meaning: One split is made for each distinct label, not counting -1.
        - expression: "n_train(f) = N - n_f"
          meaning: The training piece for fold f is every row not labelled f, including the -1 rows.
      prediction: "Example: labels [0, 0, -1, -1, 1, 1, 2, 2] give K = 3 and 2 test rows per fold, so 6 training rows."
    good_at: [fixed validation set, custom folds, rows kept in training]
    bad_at: [random repeats, no fixed split yet, labels typed in by mistake]
    vs_siblings:
      - {page: kfold, note: "Makes folds for you, by row order."}
      - {page: timeseriessplit, note: "Makes time-ordered folds for you."}
      - {page: train-test-split, note: "One random hold-out, made for you."}
    read_more:
      - The X, y and groups arguments to split are ignored, so split can be called with no data.
      - get_n_splits counts the distinct labels, not counting -1.
      - Passing groups gives a warning, because they are ignored.
