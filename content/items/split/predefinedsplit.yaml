    snippet: |
      # scikit-learn 1.9.1
      import numpy as np
      from sklearn.model_selection import PredefinedSplit

      test_fold = np.array([0, 0, -1, -1, 1, 1, 2, 2])
      ps = PredefinedSplit(test_fold)
      print("get_n_splits:", ps.get_n_splits())
      pairs = list(ps.split())
      print("pairs:", len(pairs))
      print("test rows per fold:", [len(test) for _, test in pairs])
