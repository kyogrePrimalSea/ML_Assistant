  code:
    - library: scikit-learn
      target: sklearn.model_selection.LeaveOneGroupOut
      why_this_library: Leaves out each group in turn, with no settings.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.model_selection import LeaveOneGroupOut

        X = np.arange(20).reshape(10, 2)  # made-up: 10 rows, 2 columns
        y = np.arange(10) % 2             # made-up labels
        groups = np.array(["a", "a", "b", "b", "b", "c", "c", "d", "d", "d"])

        logo = LeaveOneGroupOut()
        for fold, (train_idx, test_idx) in enumerate(
            logo.split(X, y, groups=groups)
        ):
            print("fold", fold)
            print("  train rows:", train_idx)
            print("  test rows:", test_idx)
            print("  test group:", np.unique(groups[test_idx]))
      output: |
        fold 0
          train rows: [2 3 4 5 6 7 8 9]
          test rows: [0 1]
          test group: ['a']
        fold 1
          train rows: [0 1 5 6 7 8 9]
          test rows: [2 3 4]
          test group: ['b']
        fold 2
          train rows: [0 1 2 3 4 7 8 9]
          test rows: [5 6]
          test group: ['c']
        fold 3
          train rows: [0 1 2 3 4 5 6]
          test rows: [7 8 9]
          test group: ['d']
  what_comes_out:
