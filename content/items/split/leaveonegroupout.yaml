      target: sklearn.model_selection.LeaveOneGroupOut
      why_this_library: Leaves out each group in turn, with no settings.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.datasets import make_regression
        from sklearn.model_selection import LeaveOneGroupOut

        X, y = make_regression(n_samples=20, n_features=3, random_state=0)
        groups = np.repeat(["north", "south", "east", "west"], 5)

        logo = LeaveOneGroupOut()
        for train_idx, test_idx in logo.split(X, y, groups=groups):
            print("test group:", np.unique(groups[test_idx]))
