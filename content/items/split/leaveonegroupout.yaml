        shape_explanation: >-
          A single whole number, so it is a scalar with no rows or columns. The example
          is 4, a made-up count of 4 groups. It needs groups= to be counted.
        note: "Equals the number of groups."
    next_step: "Average the test scores across all the groups."
    snippet: |
      # scikit-learn 1.9.1
      import numpy as np
      from sklearn.model_selection import LeaveOneGroupOut

      X = np.arange(20).reshape(10, 2)
      y = np.arange(10) % 2
      groups = np.array(["a", "a", "b", "b", "b", "c", "c", "d", "d", "d"])

      logo = LeaveOneGroupOut()
      print("get_n_splits:", logo.get_n_splits(X, y, groups))
      pairs = list(logo.split(X, y, groups=groups))
      print("pairs:", len(pairs))
      print("test rows per fold:", [len(te) for _, te in pairs])
      print(
          "test group per fold:",
          [np.unique(groups[te]).tolist() for _, te in pairs],
      )
    snippet_library: scikit-learn
    output: |
      get_n_splits: 4
      pairs: 4
      test rows per fold: [2, 3, 2, 3]
      test group per fold: [['a'], ['b'], ['c'], ['d']]
    visual: null
  catch_outs:
    - Needs at least two groups, or it raises an error.
    - One fold per group, so many groups means many fits.
    - Pass groups=, or it raises an error.
  key_settings:
    tier1: []
    tier2: []
    tier3: []
  watch_it_work: {none: true}
  intuition:
    idea: Take each group out in turn, train on the rest, and test on it.
    analogy: Checking a new school by training on all the other schools, one school at a time.
    animation: none
    goal: Measure how well the model works on a group it has never seen.
    steps:
      - Find the distinct group labels in groups=.
      - Pick the first group as the test piece.
      - Put every row of every other group into the training piece.
      - Fit on the training piece and score on the test piece.
      - Move to the next group and repeat.
      - Stop after every group has been the test piece once.
    math:
      notation:
        - {symbol: "G", meaning: "The number of distinct group labels."}
        - {symbol: "n_splits", meaning: "The number of folds, which equals G."}
      equations:
        - expression: "n_splits = G"
          meaning: One fold is made for each group, so the fold count is the group count.
      prediction: "Example: 4 groups (made-up a, b, c, d) give 4 folds, one per group."
    good_at: [few groups, a whole-group test each time, no settings]
    bad_at: [many groups, slow models, one group only]
    vs_siblings:
      - {page: leavepgroupsout, note: "Holds out p groups at once, not one."}
      - {page: groupkfold, note: "Fewer folds, with several groups in each test piece."}
      - {page: leaveoneout, note: "Holds out one row at a time, ignoring groups."}
    read_more:
      - Each group is the test piece exactly once.
      - Each fold trains on every row except the rows of its test group.
      - Use it when a per-group score matters more than a cheap fit.
