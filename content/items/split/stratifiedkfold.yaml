  catch_outs:
    - Shuffle is off by default; turn it on to mix the rows.
    - Shuffle mixes rows within each class, not across classes.
    - random_state with shuffle=False raises ValueError, so leave it at None.
    - A class with fewer rows than n_splits gives a UserWarning, and some folds get none of it.
  key_settings:
    tier1:
      - name: shuffle
        page: null
        controls: Whether each class's rows are shuffled before they are dealt into folds.
        effect: Off gives the same folds every run. On mixes rows within each class.
      - name: n_splits
        page: null
        controls: The number of folds, at least 2.
        effect: Each fold is one fit, so more folds means more fits and smaller test folds.
    tier2:
      - name: random_state
        page: null
        controls: The seed for shuffling within each class. None gives new folds each run.
        effect: A fixed int repeats the same folds. It needs shuffle=True.
    tier3: []
  watch_it_work: {none: true}
  intuition:
    idea: Deal each class's rows across the folds in turn, so every fold keeps its share.
    analogy: Dealing a deck of red and black cards into piles, so each pile gets the same mix.
    animation: none
    goal: Give every fold about the same class mix as the full dataset.
    steps:
      - Count the rows in each class.
      - Work out how many rows of each class each fold should hold, as even as whole rows allow.
      - Walk through the rows class by class, in row order.
      - Give the first rows of each class to fold 0, the next rows to fold 1, and so on.
      - Use one fold as the test piece and the other folds together as the training piece.
      - Repeat so that every fold is the test piece once.
      - With shuffle=True, shuffle the rows inside each class before filling the folds.
    math:
      notation:
        - {symbol: "k", meaning: "One class label."}
        - {symbol: "c_k", meaning: "The number of rows in class k."}
        - {symbol: "n", meaning: "The number of folds, set by n_splits."}
        - {symbol: "t(i,k)", meaning: "The number of class k rows in test fold i."}
      equations:
        - expression: "t(i,k) = floor(c_k / n) or ceil(c_k / n)"
          meaning: Each fold gets the rounded-down or rounded-up share of every class.
        - expression: "sum over i of t(i,k) = c_k"
          meaning: Across all folds, every class k row is a test row exactly once.
      prediction: "Example: 8 rows of class 0 and n = 4 give 2 class-0 rows per fold. 4 class-1 rows give 1 per fold."
    good_at: [classification, one rare class, even class mix per fold]
    bad_at: [regression target, time-ordered data, classes smaller than n_splits]
    vs_siblings:
      - {page: kfold, note: "Same folds, but no class balance."}
      - {page: stratifiedshufflesplit, note: "Random hold-outs that keep the class mix."}
      - {page: repeatedstratifiedkfold, note: "Runs this split several times with new shuffles."}
    read_more:
      - Without shuffle, the same folds come back every run.
      - Stratification uses the class labels in y, so y must be given.
      - A class with fewer rows than n_splits gives a warning, and some folds get none of it.
