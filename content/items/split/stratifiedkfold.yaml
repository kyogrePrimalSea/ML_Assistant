    - library: scikit-learn
      target: sklearn.model_selection.StratifiedKFold
      why_this_library: Keeps each class's share even across folds, within one row.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.model_selection import StratifiedKFold

        # made-up labels: 8 rows of class 0, 4 rows of class 1
        y = np.array([0] * 8 + [1] * 4)
        X = np.arange(12).reshape(-1, 1)

        skf = StratifiedKFold(n_splits=4)
        for i, (train, test) in enumerate(skf.split(X, y)):
            print(f"fold {i}: test rows {test}, class counts {np.bincount(y[test])}")
      output: |
        fold 0: test rows [0 1 8], class counts [2 1]
        fold 1: test rows [2 3 9], class counts [2 1]
        fold 2: test rows [ 4  5 10], class counts [2 1]
        fold 3: test rows [ 6  7 11], class counts [2 1]
