  code:
    - library: scikit-learn
      target: sklearn.model_selection.KFold
      why_this_library: One splitter that rotates the test fold through all rows.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.model_selection import KFold

        X = np.arange(10)
        kf = KFold(n_splits=3)
        for train_idx, test_idx in kf.split(X):
            print("train", train_idx, "test", test_idx)
      output: |
        train [4 5 6 7 8 9] test [0 1 2 3]
        train [0 1 2 3 7 8 9] test [4 5 6]
        train [0 1 2 3 4 5 6] test [7 8 9]
  what_comes_out:
    items:
      - name: split
        kind: method
        task: null
        shape: "(train, test) pairs"
        object_type: generator of tuples
        example: "(array([2, 3]), array([0, 1]))"
        shape_explanation: >-
          A generator. It yields one (train, test) pair per fold, one pair at a time.
          Each part is a one-dimensional array of row positions, written (n_train,) or
          (n_test,). n_test is the size of the held-out fold. The example is made-up:
          2 training rows and 2 test rows, so both parts have shape (2,).
        note: "One train and test pair per fold. Fold sizes differ by at most one."
      - name: get_n_splits
