  code:
  - library: scikit-learn
    target: sklearn.model_selection.KFold
    why_this_library: One splitter that rotates the test fold through all rows.
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.datasets import make_regression
      from sklearn.model_selection import KFold

      X, _ = make_regression(n_samples=10, n_features=2, random_state=0)
      kf = KFold(n_splits=5)
      for train_idx, test_idx in kf.split(X):
          print("test", test_idx)
