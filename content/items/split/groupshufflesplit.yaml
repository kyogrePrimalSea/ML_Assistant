        note: "Returns n_splits, 5 by default."
    next_step: "Average the test scores over all the splits."
    snippet: |
      # scikit-learn 1.9.1
      import numpy as np
      from sklearn.model_selection import GroupShuffleSplit

      X = np.arange(20).reshape(10, 2)
      y = np.arange(10) % 2
      groups = np.array([0, 0, 1, 1, 1, 2, 2, 3, 3, 3])

      gss = GroupShuffleSplit(n_splits=3, test_size=0.3, random_state=0)
      print("get_n_splits:", gss.get_n_splits(X, y, groups))
      pairs = list(gss.split(X, y, groups=groups))
      print("pairs:", len(pairs))
      print("test rows per split:", [len(te) for _, te in pairs])
      print(
          "test groups per split:",
          [np.unique(groups[te]).tolist() for _, te in pairs],
      )
    snippet_library: scikit-learn
    output: |
      get_n_splits: 3
      pairs: 3
      test rows per split: [5, 4, 5]
      test groups per split: [[2, 3], [0, 2], [0, 3]]
    visual: null
  catch_outs:
    - Test groups are random, so one group can be tested in several splits.
    - Pass groups=, or it raises an error.
    - Set random_state, or the splits change every run.
    - Only groups are held out, so a test split can be a different size each time.
  key_settings:
    tier1:
      - name: test_size
        page: null
        controls: The share of groups held out for testing. An int gives a group count.
        effect: Rounded up, so even a small share holds out at least one whole group.
      - name: n_splits
        page: null
        controls: The number of re-shuffle and split draws.
        effect: More draws give more test scores to average, and more fits to run.
    tier2:
      - name: train_size
        page: null
        controls: The share of groups used for training. None uses what test_size leaves.
        effect: Setting both can leave some groups out of both pieces.
      - name: random_state
        page: null
        controls: The seed for the random group draws.
        effect: A fixed int repeats the same splits. None gives new splits each run.
    tier3: []
  watch_it_work: {none: true}
  intuition:
    idea: Shuffle the groups, hold some out for testing, then draw again.
    analogy: Drawing a few schools out of a hat for the exam, then drawing a new set to check again.
    animation: none
    goal: Get several test scores, each from whole groups the model did not learn from.
    steps:
      - Find the distinct group labels in groups=.
      - Work out how many groups go to the test piece from test_size, rounded up.
      - Shuffle the group labels, seeded by random_state.
      - Put the first groups of the shuffled order into the test piece.
      - Put the remaining groups, or train_size groups, into the training piece.
      - Turn the group picks into row numbers, so every row of a group stays together.
      - Draw again from a fresh shuffle, once per split, for n_splits splits in all.
    math:
      notation:
        - {symbol: "G", meaning: "The number of distinct group labels."}
        - {symbol: "f", meaning: "The test share, set by test_size when it is a float."}
        - {symbol: "g_test", meaning: "The number of groups in the test piece."}
      equations:
        - expression: "g_test = ceil(f × G)"
          meaning: A float test_size becomes a whole group count, rounded up.
        - expression: "g_train = G − g_test"
          meaning: With train_size unset, the other groups go to training.
      prediction: "Example: 4 groups and test_size=0.3 give g_test = 2 (ceil of 1.2), so 2 groups are held out (made-up)."
    good_at: [random group holdouts, repeated scores, any group column]
    bad_at: [every group tested once, very few groups, time-ordered data]
    vs_siblings:
      - {page: groupkfold, note: "Tests every group once, in fixed folds."}
      - {page: shufflesplit, note: "Random row holdouts, with no group rule."}
      - {page: train-test-split, note: "One row split, with no groups."}
    read_more:
      - Within one split, a group is either in train or in test, never both.
      - Across splits, the same group can land in test more than once.
      - Each draw starts from a fresh shuffle of the group labels.
