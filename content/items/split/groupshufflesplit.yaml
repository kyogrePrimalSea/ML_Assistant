  code:
    - library: scikit-learn
      target: sklearn.model_selection.GroupShuffleSplit
      why_this_library: Random group holdouts, repeated so you can average.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.model_selection import GroupShuffleSplit

        X = np.arange(20).reshape(10, 2)  # made-up: 10 rows, 2 columns
        y = np.arange(10) % 2             # made-up labels
        groups = np.array([0, 0, 1, 1, 1, 2, 2, 3, 3, 3])  # made-up: 4 groups

        gss = GroupShuffleSplit(n_splits=3, test_size=0.3, random_state=0)
        for i, (train_idx, test_idx) in enumerate(
            gss.split(X, y, groups=groups)
        ):
            print("split", i)
            print("  train rows:", train_idx)
            print("  test rows:", test_idx)
            print("  test groups:", np.unique(groups[test_idx]))
      output: |
        split 0
          train rows: [0 1 2 3 4]
          test rows: [5 6 7 8 9]
          test groups: [2 3]
        split 1
          train rows: [2 3 4 7 8 9]
          test rows: [0 1 5 6]
          test groups: [0 2]
        split 2
          train rows: [2 3 4 5 6]
          test rows: [0 1 7 8 9]
          test groups: [0 3]
  what_comes_out:
