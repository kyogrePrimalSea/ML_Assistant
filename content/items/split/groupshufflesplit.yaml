  code:
    - library: scikit-learn
      target: sklearn.model_selection.GroupShuffleSplit
      why_this_library: Random group holdouts, repeated so you can average.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.datasets import make_regression
        from sklearn.model_selection import GroupShuffleSplit

        X, y = make_regression(n_samples=20, n_features=3, random_state=0)
        groups = np.repeat([0, 1, 2, 3], 5)  # 4 groups, 5 rows each

        gss = GroupShuffleSplit(n_splits=5, test_size=0.25, random_state=0)
        for train_idx, test_idx in gss.split(X, y, groups=groups):
            print("test groups:", np.unique(groups[test_idx]))
