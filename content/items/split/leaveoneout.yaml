  watch_it_work: {none: true}
  intuition:
    idea: Leave one row out, train on the rest, test on that row, and repeat for every row.
    analogy: Grading each student's essay with a model learned from all the other essays, one student at a time.
    animation: none
    goal: Give every row a test score from a model that never saw that row.
    steps:
      - Pass in N rows. Each row takes a turn as the test set.
      - Take the first row as the test set.
      - Put the other N minus 1 rows in the training set.
      - Fit on the training rows, then score on the test row.
      - Move to the next row as the test set, and repeat.
      - Stop after the last row has been the test set.
      - Average the N scores yourself.
    math:
      notation:
        - {symbol: "N", meaning: "The number of rows you pass in."}
        - {symbol: "n_train", meaning: "The number of training rows in each split."}
      equations:
        - expression: "number of splits = N"
          meaning: One split for each row, so N fits in total.
        - expression: "n_train = N − 1"
          meaning: Every split trains on all rows except the one held out.
      prediction: "Example: 5 rows give 5 splits, each with 4 training rows and 1 test row."
    good_at: [very small data, every row tested alone]
    bad_at: [large data, slow fits, noisy single-row scores]
    vs_siblings:
      - {page: leavepout, note: "Holds out p rows at a time, in every combination."}
      - {page: kfold, note: "Holds out whole folds, so each fit tests many rows."}
      - {page: shufflesplit, note: "Random holdouts, not one row at a time."}
    read_more:
      - LeavePOut with p equal to 1 gives the same splits as this page.
      - Every row is the test set exactly once.
