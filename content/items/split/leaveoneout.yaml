        shape: "int"
        object_type: int
        example: "5"
        shape_explanation: >-
          A single whole number, not an array, so it has no rows or columns. It equals
          N, the number of rows. The example is made-up: 5 rows give the value 5.
        note: "Equals the number of rows."
    next_step: Average the one-row errors into one score.
    snippet: |
      # scikit-learn 1.9.1
      import numpy as np
      from sklearn.model_selection import LeaveOneOut

      X = np.arange(5)
      loo = LeaveOneOut()
      splits = list(loo.split(X))
      print("pairs:", len(splits))
      print("test sizes:", sorted({len(t) for _, t in splits}))
      print("train sizes:", sorted({len(tr) for tr, _ in splits}))
      print("rows tested:", sorted(int(t[0]) for _, t in splits))
    snippet_library: scikit-learn
    output: |
      pairs: 5
      test sizes: [1]
      train sizes: [4]
      rows tested: [0, 1, 2, 3, 4]
    visual: null
  catch_outs:
