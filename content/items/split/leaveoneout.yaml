  - library: scikit-learn
    target: sklearn.model_selection.LeaveOneOut
    why_this_library: One splitter that holds out a single row per split.
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.datasets import make_regression
      from sklearn.model_selection import LeaveOneOut

      X, _ = make_regression(n_samples=6, n_features=2, random_state=0)
      loo = LeaveOneOut()
      for train_idx, test_idx in loo.split(X):
          print("test", test_idx)
      print("splits", loo.get_n_splits(X))
