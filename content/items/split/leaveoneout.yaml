  code:
    - library: scikit-learn
      target: sklearn.model_selection.LeaveOneOut
      why_this_library: One splitter that holds out a single row per split.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.model_selection import LeaveOneOut

        X = np.arange(5)
        print("in: X has", len(X), "rows")
        loo = LeaveOneOut()
        for train_idx, test_idx in loo.split(X):
            print("train", train_idx, "test", test_idx)
        print("get_n_splits:", loo.get_n_splits(X))
      output: |
        in: X has 5 rows
        train [1 2 3 4] test [0]
        train [0 2 3 4] test [1]
        train [0 1 3 4] test [2]
        train [0 1 2 4] test [3]
        train [0 1 2 3] test [4]
        get_n_splits: 5
  what_comes_out:
    items:
      - name: split
        kind: method
        task: null
        shape: "(train, test) pairs"
        object_type: generator of tuples
        example: "(array([0, 2, 3]), array([1]))"
        shape_explanation: >-
          A generator. It yields one (train, test) pair per row, one pair at a time.
          The test part is a one-dimensional array holding one row position, written
          (1,). The train part holds the other rows, written (n_train,), where n_train
          is N minus 1. The example is made-up: 3 training rows and 1 test row.
        note: "One pair per row. The test part always holds one row."
