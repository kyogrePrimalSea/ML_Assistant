  code:
    - library: scikit-learn
      target: sklearn.model_selection.StratifiedGroupKFold
      why_this_library: Keeps groups whole and balances the classes per fold.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.datasets import make_classification
        from sklearn.model_selection import StratifiedGroupKFold

        X, y = make_classification(n_samples=40, n_features=3, n_informative=2,
                                   n_redundant=0, weights=[0.8, 0.2],
                                   random_state=0)
        groups = np.repeat(np.arange(10), 4)  # 10 groups, 4 rows each

        sgkf = StratifiedGroupKFold(n_splits=4, shuffle=True, random_state=0)
        for train_idx, test_idx in sgkf.split(X, y, groups=groups):
            print("test rows:", len(test_idx), "positives:", y[test_idx].sum())
