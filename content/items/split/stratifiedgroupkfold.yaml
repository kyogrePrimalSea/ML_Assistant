    visual: null
  catch_outs:
    - Classification only, so y must hold class labels, not continuous values.
    - Pass groups=, or it raises an error.
    - Shuffle only reorders groups with similar class mixes, so it is not a full shuffle.
    - Class shares per fold are close, not exact.
    - n_splits above the smallest class count raises a warning.
  key_settings:
    tier1:
      - name: n_splits
        page: null
        controls: The number of folds, at least 2. Each fold is the test piece once.
        effect: More folds give smaller test pieces and more fits. Must not exceed the group count.
    tier2:
      - name: shuffle
        page: null
        controls: Whether each class's groups are shuffled before they are dealt into folds.
        effect: Changes the folds. Off, the same folds appear every run.
      - name: random_state
        page: null
        controls: The seed for the shuffle. Used only when shuffle is True.
        effect: A fixed int repeats the same folds. None gives new folds each run.
    tier3: []
  watch_it_work: {none: true}
  intuition:
    idea: Deal whole groups into folds, keeping each class in similar shares.
    analogy: Dealing families to tables at a dinner, so each table gets a similar mix of ages.
    animation: none
    goal: Score a model on unseen groups, with each fold showing a similar class mix.
    steps:
      - Find the distinct group labels and the class of each row.
      - Count how many rows of each class sit in each group.
      - Sort the groups from most uneven class mix to least.
      - Give each group, in turn, to the fold whose class counts suit it best.
      - Each fold's groups become its test piece, with all their rows.
      - The rows of the other folds form the training piece for that fold.
      - Every row is tested exactly once across all the folds.
    math:
      notation:
        - {symbol: "N", meaning: "The number of rows you pass in."}
        - {symbol: "P", meaning: "The total number of positive rows, in a binary y."}
        - {symbol: "k", meaning: "The number of folds, set by n_splits."}
        - {symbol: "p_f", meaning: "The number of positive rows in the test piece of fold f."}
      equations:
        - expression: "p_1 + p_2 + ... + p_k = P"
          meaning: Every positive row is held out in exactly one fold.
        - expression: "P / k"
          meaning: The ideal positives per fold. The folds aim near this, but do not hit it exactly.
      prediction: "Example: P = 8 positives and k = 4 folds give an ideal of 2 per fold. The made-up run gave [1, 2, 3, 2]."
    good_at: [groups plus a rare class, close class shares, a fixed fold count]
    bad_at: [regression targets, very few groups, exact class counts]
    vs_siblings:
      - {page: groupkfold, note: "Keeps groups whole, but ignores class shares."}
      - {page: stratifiedkfold, note: "Balances classes, but ignores groups."}
      - {page: kfold, note: "Ignores both groups and classes."}
    read_more:
      - Each group lands in exactly one test fold.
      - Shares per fold are close to the overall shares, not exact.
      - n_splits must not be more than the number of groups.
  next: []
