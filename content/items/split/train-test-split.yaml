        note: "Targets for X_test. Keep them away from fit."
    next_step: null
    snippet: |
      # scikit-learn 1.9.1
      import numpy as np
      from sklearn.datasets import load_breast_cancer
      from sklearn.model_selection import train_test_split

      X, y = load_breast_cancer(return_X_y=True)
      X_train, X_test, y_train, y_test = train_test_split(
          X, y, test_size=0.2, stratify=y, random_state=0
      )

      print("rows:", len(X_train), len(X_test))
      print("positive share, all:", round(y.mean(), 3))
      print("positive share, train:", round(y_train.mean(), 3))
      print("positive share, test:", round(y_test.mean(), 3))
      print("type of X_train:", type(X_train).__name__)
    snippet_library: scikit-learn
    output: |
      rows: 455 114
      positive share, all: 0.627
      positive share, train: 0.626
      positive share, test: 0.632
      type of X_train: ndarray
    visual: null
  catch_outs:
    - Fit scalers and encoders after the split, on training rows only.
    - Set random_state, or the split changes every run.
    - Shuffling mixes time order. Use TimeSeriesSplit for time data.
    - Pass stratify to keep class shares equal in both pieces.
    - It returns one flat list, so unpack it as train, test for each array passed in.
    - With shuffle=False, stratify must be None, or it raises an error.
  key_settings:
    tier1:
      - name: test_size
        page: null
        controls: The share (a float) or number (an int) of rows held back for testing.
        effect: A bigger test set scores more steadily, but leaves fewer rows to learn from.
      - name: random_state
        page: null
        controls: The seed for the shuffle. None gives a different split each run.
        effect: Any fixed int repeats the same split, so scores can be compared.
    tier2:
      - name: stratify
        page: null
        controls: Class labels to keep in the same shares in both pieces.
        effect: Keeps a rare class in the test set, but needs labels and shuffle on.
      - name: shuffle
        page: null
        controls: Whether rows are shuffled before the cut. The default is True.
        effect: Off keeps row order, with the first rows for training and the last for testing.
    tier3:
      - name: train_size
        page: null
        controls: The share or number of rows for training. None uses what test_size leaves.
        effect: Setting both lets you leave some rows out of both pieces.
  watch_it_work: {none: true}
  intuition:
    idea: Shuffle the rows, then cut them into a learning pile and an exam pile.
    analogy: Setting aside some past exam questions before you study, so you can test yourself honestly.
    animation: none
    goal: Get a score from rows the model never saw while learning.
    steps:
      - Pass in one or more arrays with the same number of rows.
      - Work out how many rows go to the test piece from test_size.
      - Shuffle the row positions, seeded by random_state.
      - Take the first rows of the shuffled order for the test piece.
      - Take the next rows for the training piece.
      - Cut every array you passed at the same positions, so rows stay matched.
      - Fit on the training piece only, then score once on the test piece.
    math:
      notation:
        - {symbol: "N", meaning: "The number of rows you pass in."}
        - {symbol: "f", meaning: "The test share, set by test_size when it is a float."}
        - {symbol: "n_test", meaning: "The number of rows in the test piece."}
        - {symbol: "n_train", meaning: "The number of rows in the training piece."}
      equations:
        - expression: "n_test = ceil(f × N)"
          meaning: A float test_size is turned into a row count, rounded up.
        - expression: "n_train = N − n_test"
          meaning: With train_size unset, every other row goes to training.
      prediction: "Example: 200 rows and test_size=0.25 give n_test = 50 and n_train = 150."
    good_at: [one quick holdout, any row order, any array type]
    bad_at: [time-ordered data, tiny data, a steady score estimate]
    vs_siblings:
      - {page: shufflesplit, note: "Makes several random splits, as a cv splitter."}
      - {page: kfold, note: "Rotates the test piece so every row is tested once."}
      - {page: timeseriessplit, note: "Keeps time order, so training rows come first."}
    read_more:
      - It returns train and test pieces for every array you pass.
      - Without shuffle it takes the first rows to train and the last to test.
      - One test score depends on which rows landed in it.
