    - library: scikit-learn
      target: sklearn.model_selection.train_test_split
      why_this_library: One call returns the train and test pieces.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.datasets import make_regression
        from sklearn.model_selection import train_test_split

        X, y = make_regression(n_samples=200, n_features=3, random_state=0)
        X_train, X_test, y_train, y_test = train_test_split(
            X, y, test_size=0.25, random_state=0
        )

        print("X_train:", X_train.shape)
        print("X_test:", X_test.shape)
        print("y_train:", y_train.shape)
        print("y_test:", y_test.shape)
        again = train_test_split(X, y, test_size=0.25, random_state=0)
        print("same split again:", np.array_equal(X_test, again[1]))
        _, ordered_test = train_test_split(np.arange(8), test_size=0.25, shuffle=False)
        print("shuffle=False test rows:", ordered_test)
      output: |
        X_train: (150, 3)
        X_test: (50, 3)
        y_train: (150,)
        y_test: (50,)
        same split again: True
        shuffle=False test rows: [6 7]
