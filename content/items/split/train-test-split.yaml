    hero: {kind: splitter, rows: 20, folds: 2, ordered: false}
    line: Holds back rows the model never sees while learning.
  quick_facts:
    facts:
      - {label: Default test share, value: "25%"}
      - {label: Shuffled by default, value: "yes"}
  use_avoid:
    use_when: [one quick holdout, rows in any order]
    avoid_when: [time-ordered data, tiny data]
  prep: []
  code:
    - library: scikit-learn
      target: sklearn.model_selection.train_test_split
      why_this_library: One call returns the train and test pieces.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import make_regression
        from sklearn.model_selection import train_test_split

        X, y = make_regression(n_samples=200, n_features=3, random_state=0)
        X_train, X_test, y_train, y_test = train_test_split(
            X, y, test_size=0.25, random_state=0
        )

        print(X_train.shape, X_test.shape)
  catch_outs:
    - Fit scalers and encoders after the split, on training rows only.
    - Set random_state, or the split changes every run.
    - Shuffling mixes time order. Use TimeSeriesSplit for time data.
    - Pass stratify to keep class shares equal in both pieces.
