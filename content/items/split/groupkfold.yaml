  code:
    - library: scikit-learn
      target: sklearn.model_selection.GroupKFold
      why_this_library: Splits by group id, so no group crosses folds.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.datasets import make_regression
        from sklearn.model_selection import GroupKFold

        X, y = make_regression(n_samples=20, n_features=3, random_state=0)
        groups = np.repeat([0, 1, 2, 3], 5)  # 4 groups, 5 rows each

        gkf = GroupKFold(n_splits=4)
        for train_idx, test_idx in gkf.split(X, y, groups=groups):
            print("test groups:", np.unique(groups[test_idx]))
