    next_step: "Fit on train and score on test for each fold."
    snippet: |
      # scikit-learn 1.9.1
      import numpy as np
      from sklearn.model_selection import GroupKFold

      X = np.arange(20).reshape(10, 2)
      y = np.arange(10) % 2
      groups = np.array([0, 0, 1, 1, 1, 2, 2, 3, 3, 3])

      gkf = GroupKFold(n_splits=2)
      print("get_n_splits:", gkf.get_n_splits(X, y, groups))
      pairs = list(gkf.split(X, y, groups=groups))
      print("pairs:", len(pairs))
      print("first pair length:", len(pairs[0]))
      print("test rows per fold:", [len(te) for _, te in pairs])
    snippet_library: scikit-learn
    output: |
