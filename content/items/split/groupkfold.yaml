      test rows per fold: [5, 5]
    visual: null
  catch_outs:
    - Pass groups=, or it raises an error.
    - Fold sizes follow group sizes, so they can differ a lot.
    - Groups are not shuffled unless shuffle=True.
    - n_splits cannot be more than the number of groups.
  key_settings:
    tier1:
      - name: n_splits
        page: null
        controls: The number of folds, at least 2. Each fold is the test piece once.
        effect: More folds means more fits. Each fold holds fewer groups.
    tier2:
      - name: shuffle
        page: null
        controls: Whether the group labels are shuffled before they are cut into folds.
        effect: Changes which groups share a fold. Off, the same groups are grouped every run.
      - name: random_state
        page: null
        controls: The seed for the group shuffle. Used only when shuffle is True.
        effect: A fixed int repeats the same folds. None gives new folds each run.
    tier3: []
  watch_it_work: {none: true}
  intuition:
    idea: Deal whole groups into the folds, so no group is split across them.
    analogy: Seating each school's pupils in the same exam room, so no school is split up.
    animation: none
    goal: Score a model on groups it has never seen, one fold at a time.
    steps:
      - Find the distinct group labels in groups=.
      - Count the rows in each group.
      - Sort the groups from largest to smallest.
      - Give each group, in turn, to the fold with the fewest rows so far.
      - With shuffle=True, shuffle the group labels and cut them into equal-count batches instead.
      - Use each fold's rows as the test piece, in turn.
      - The rows of the other folds form the training piece for that fold.
      - Every row is tested exactly once across all the folds.
    math:
      notation:
        - {symbol: "N", meaning: "The number of rows you pass in."}
        - {symbol: "k", meaning: "The number of folds, set by n_splits."}
        - {symbol: "n_test_f", meaning: "The number of rows in the test piece of fold f."}
      equations:
        - expression: "n_test_1 + n_test_2 + ... + n_test_k = N"
          meaning: Every row is held out in exactly one fold.
        - expression: "n_test_f = sum of the sizes of the groups given to fold f"
          meaning: A fold's test size comes from which whole groups it receives.
      prediction: "Example: group sizes 2, 3, 2, 3 with n_splits=2 give two test folds of 5 rows each (made-up)."
    good_at: [groups never split, many rows per group, a fixed fold count]
    bad_at: [equal fold sizes, very few groups, time-ordered data]
    vs_siblings:
      - {page: groupshufflesplit, note: "Random group holdouts, repeated, not one test per group."}
      - {page: stratifiedgroupkfold, note: "Keeps groups whole and also balances the classes."}
      - {page: kfold, note: "Ignores groups, so one group can span folds."}
    read_more:
      - Each group lands in exactly one test fold.
      - Fold sizes are as even as the group sizes allow, not exactly equal.
      - Pass a seed with shuffle=True to get the same folds each run.
  next: []
