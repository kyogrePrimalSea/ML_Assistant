  code:
    - library: scikit-learn
      target: sklearn.model_selection.GroupKFold
      why_this_library: Splits by group id, so no group crosses folds.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.model_selection import GroupKFold

        X = np.arange(20).reshape(10, 2)  # made-up: 10 rows, 2 columns
        y = np.arange(10) % 2             # made-up labels
        groups = np.array([0, 0, 1, 1, 1, 2, 2, 3, 3, 3])  # made-up: 4 groups

        gkf = GroupKFold(n_splits=2)
        for fold, (train_idx, test_idx) in enumerate(
            gkf.split(X, y, groups=groups)
        ):
            print("fold", fold)
            print("  train rows:", train_idx)
            print("  test rows:", test_idx)
            print("  test groups:", np.unique(groups[test_idx]))
      output: |
        fold 0
          train rows: [0 1 2 3 4]
          test rows: [5 6 7 8 9]
          test groups: [2 3]
        fold 1
          train rows: [5 6 7 8 9]
          test rows: [0 1 2 3 4]
          test groups: [0 1]
