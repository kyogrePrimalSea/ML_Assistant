    target: sklearn.model_selection.ShuffleSplit
    why_this_library: One splitter gives repeated random train and test sets.
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.datasets import make_regression
      from sklearn.model_selection import ShuffleSplit

      X, _ = make_regression(n_samples=20, n_features=3, random_state=0)
      splitter = ShuffleSplit(n_splits=3, test_size=0.25, random_state=0)
      for train_idx, test_idx in splitter.split(X):
          print("train", len(train_idx), "test", test_idx)
