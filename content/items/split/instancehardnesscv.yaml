      target: imblearn.model_selection.InstanceHardnessCV
      why_this_library: A classifier ranks how hard each row is to predict.
      snippet: |
        # imbalanced-learn 0.14.2
        from imblearn.model_selection import InstanceHardnessCV
        from sklearn.datasets import load_breast_cancer
        from sklearn.linear_model import LogisticRegression

        X, y = load_breast_cancer(return_X_y=True)
        cv = InstanceHardnessCV(LogisticRegression(max_iter=5000), n_splits=5)

        print([len(test) for _, test in cv.split(X, y)])
