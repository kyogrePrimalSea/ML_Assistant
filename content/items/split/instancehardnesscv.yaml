  catch_outs:
    - Needs a classifier with predict_proba, which it fits to rank the rows.
    - Targets must be binary; a three-class y raises ValueError.
    - Set pos_label to choose which class's probability ranks the rows.
    - Calling split first runs cross-validation on the estimator, so it is slower than KFold.
    - Use StratifiedKFold when class balance is the only concern.
  key_settings:
    tier1:
      - name: estimator
        page: null
        controls: The classifier that scores how hard each row is. It must have predict_proba.
        effect: A weak classifier ranks rows poorly, so the spread is less useful.
      - name: n_splits
        page: null
        controls: The number of folds, at least 2.
        effect: More folds means smaller test folds and more estimator fits.
      - name: pos_label
        page: null
        controls: Which class's predicted probability ranks the rows. None uses classes_[1].
        effect: Choosing the other class reverses the ranking within each class.
    tier2: []
    tier3: []
  watch_it_work: {none: true}
  intuition:
    idea: Rank the rows by how the model predicts them, then deal the ranked rows across folds.
    analogy: Dealing the hardest practice questions evenly to each study group.
    animation: none
    goal: Give every fold a similar mix of easy and hard rows.
    steps:
      - Get a predicted probability for each row, from cross-validation with n_splits folds.
      - Sort the rows by class.
      - Within each class, sort the rows by the predicted probability of the positive class.
      - Number the sorted rows 0, 1, 2, and so on.
      - Send sorted row p to fold p mod n_splits, so the folds take turns.
      - Each fold gets rows across the whole range of probabilities.
      - Use one fold as the test piece and the rest for training.
      - Repeat so that every fold is the test piece once.
    math:
      notation:
        - {symbol: "N", meaning: "The number of rows you pass in."}
        - {symbol: "n", meaning: "The number of folds, set by n_splits."}
        - {symbol: "p", meaning: "A row's position in the sorted order, from 0 to N - 1."}
      equations:
        - expression: "fold(p) = p mod n"
          meaning: The row at sorted position p goes to fold p mod n, so folds take turns.
        - expression: "test size of each fold = floor(N / n) or ceil(N / n)"
          meaning: Each fold gets either the rounded-down or the rounded-up share of rows.
      prediction: "Example: 23 rows and 5 folds give test folds of 5, 5, 5, 4 and 4 rows."
    good_at: [binary classification, spreading hard rows, rows in any order]
    bad_at: [multiclass targets, regression, a quick split]
    vs_siblings:
      - {page: stratifiedkfold, note: "Balances class counts, but ignores how hard rows are."}
      - {page: kfold, note: "Plain folds, with no ranking by the model."}
      - {page: repeatedstratifiedkfold, note: "Repeats class-balanced folds with new shuffles."}
    read_more:
      - Rows are ranked by the predicted probability of the positive class, not a separate score.
      - The ranking comes from the estimator, so a different estimator gives different folds.
      - Each call to split runs the estimator again, so the folds are recomputed.
