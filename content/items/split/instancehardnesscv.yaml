  code:
    - library: imbalanced-learn
      target: imblearn.model_selection.InstanceHardnessCV
      why_this_library: Ranks rows by a classifier's predicted probability, then deals them out.
      snippet: |
        # imbalanced-learn 0.14.2
        from imblearn.model_selection import InstanceHardnessCV
        from sklearn.datasets import make_classification
        from sklearn.linear_model import LogisticRegression

        X, y = make_classification(n_samples=20, n_features=4, random_state=0)
        cv = InstanceHardnessCV(LogisticRegression(max_iter=1000), n_splits=4)
        for i, (train, test) in enumerate(cv.split(X, y)):
            print(f"fold {i}: test rows {len(test)}, positive rows {y[test].sum()}")
      output: |
        fold 0: test rows 5, positive rows 2
        fold 1: test rows 5, positive rows 2
        fold 2: test rows 5, positive rows 3
        fold 3: test rows 5, positive rows 3
