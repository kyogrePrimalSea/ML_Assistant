  code:
  - library: scikit-learn
    target: sklearn.model_selection.LeavePOut
    why_this_library: One splitter that tests every group of p rows.
    snippet: |
      # scikit-learn 1.9.1
      from sklearn.datasets import make_regression
      from sklearn.model_selection import LeavePOut

      X, _ = make_regression(n_samples=6, n_features=2, random_state=0)
      lpo = LeavePOut(p=2)
      train_idx, test_idx = next(lpo.split(X))
      print("first test", test_idx)
      print("splits", lpo.get_n_splits(X))
