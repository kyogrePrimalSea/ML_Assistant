slots:
  header: {}
  solves:
    hero: {kind: splitter, rows: 20, folds: 5, ordered: false}
    line: Scores the model once per fold, so the result is steadier.
  quick_facts:
    facts:
      - {label: Default folds, value: "5"}
      - {label: Returns, value: "One score per fold"}
  use_avoid:
    use_when: [one metric, rows in any order]
    avoid_when: [time-ordered data, several metrics]
  prep: []
  code:
    - library: scikit-learn
      target: sklearn.model_selection.cross_val_score
      why_this_library: One call scores the model on every fold.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.datasets import load_breast_cancer
        from sklearn.linear_model import LogisticRegression
        from sklearn.model_selection import cross_val_score

        X, y = load_breast_cancer(return_X_y=True)
        model = LogisticRegression(max_iter=5000)

        scores = cross_val_score(model, X, y, cv=5, scoring="accuracy")
        print(scores.round(3))
  what_comes_out:
    items:
      - {name: cross_val_score, kind: return, task: null, shape: "float array, shape (n_splits,)", note: "One score per fold."}
    next_step: Compare the mean and the spread across folds.
    visual: null
  catch_outs:
    - Report the spread across folds, not just the mean.
    - Use cross_validate when you need several metrics or fit times.
    - Pass groups when one person or unit appears in many rows.
