  code:
    - library: scikit-learn
      target: sklearn.model_selection.StratifiedShuffleSplit
      why_this_library: Random hold-outs with a near-equal class mix each time.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.model_selection import StratifiedShuffleSplit

        # made-up labels: 8 rows of class 0, 4 rows of class 1
        y = np.array([0] * 8 + [1] * 4)
        X = np.arange(12).reshape(-1, 1)

        sss = StratifiedShuffleSplit(n_splits=3, test_size=0.25, random_state=0)
        for i, (train, test) in enumerate(sss.split(X, y)):
            print(f"split {i}: test rows {test}, class counts {np.bincount(y[test])}")
      output: |
        split 0: test rows [4 5 9], class counts [2 1]
        split 1: test rows [5 1 8], class counts [2 1]
        split 2: test rows [10  0  1], class counts [2 1]
