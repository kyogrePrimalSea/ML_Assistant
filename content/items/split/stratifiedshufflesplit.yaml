  catch_outs:
    - Test sets can overlap, so a row may be tested more than once.
    - Set test_size; the default test share is 10% of rows.
    - Set random_state for repeatable splits.
    - Every class needs at least 2 rows, or split raises ValueError.
    - The test piece needs at least one row per class, or split raises ValueError.
  key_settings:
    tier1:
      - name: test_size
        page: null
        controls: The share (a float) or count (an int) of rows held back for testing.
        effect: A bigger test piece gives steadier scores but leaves fewer training rows.
      - name: train_size
        page: null
        controls: The share or count of rows for training. None uses the rest after test_size.
        effect: Setting both lets you leave some rows out of both pieces.
      - name: n_splits
        page: null
        controls: The number of random splits to make. 10 by default.
        effect: More splits give more scores to average, and more fits.
    tier2:
      - name: random_state
        page: null
        controls: The seed for the random shuffles. None gives new splits each run.
        effect: A fixed int repeats the same splits, so scores can be compared.
    tier3: []
  watch_it_work: {none: true}
  intuition:
    idea: Shuffle the rows many times, and cut a class-balanced test piece each time.
    analogy: Drawing a fresh handful of practice questions each time, with the same mix of topics.
    animation: none
    goal: Get several hold-out scores, each from a fresh random test piece with the class mix kept.
    steps:
      - Work out n_test from test_size, and n_train from train_size or the rest.
      - Count the rows in each class.
      - Choose how many rows of each class go to training, and how many to testing.
      - Pick random rows of each class for the training piece, and random rows for the test piece.
      - Shuffle the training rows and the test rows separately.
      - Yield the (train, test) pair for this split.
      - Start a new random split, n_splits times in total.
      - Fit and score once per split, then average the scores.
    math:
      notation:
        - {symbol: "N", meaning: "The number of rows you pass in."}
        - {symbol: "f", meaning: "The test share, from test_size when it is a float."}
        - {symbol: "n_test", meaning: "The number of rows in each test piece."}
        - {symbol: "n_train", meaning: "The number of rows in each training piece."}
      equations:
        - expression: "n_test = ceil(f x N)"
          meaning: A float test_size is rounded up to a whole row count.
        - expression: "n_train = N - n_test"
          meaning: With train_size unset, the training piece gets every other row.
      prediction: "Example: 12 rows with test_size=0.25 give n_test = 3 and n_train = 9."
    good_at: [classification, class mix kept, repeated hold-outs]
    bad_at: [time-ordered data, one fixed test set, classes with one row]
    vs_siblings:
      - {page: shufflesplit, note: "Same random splits, but no class balance."}
      - {page: stratifiedkfold, note: "Folds that each test once, not random pieces."}
      - {page: train-test-split, note: "One random hold-out, not repeated."}
    read_more:
      - Test pieces are drawn fresh each time, so they can overlap.
      - Each piece keeps the class percentages, as close as whole rows allow.
      - With the default settings, 10% of rows go to each test piece.
