    snippet: |
      # scikit-learn 1.9.1
      import numpy as np
      from math import comb
      from sklearn.model_selection import LeavePGroupsOut

      X = np.arange(20).reshape(10, 2)
      y = np.arange(10) % 2
      groups = np.array([0, 0, 1, 1, 1, 2, 2, 3, 3, 3])

      lpgo = LeavePGroupsOut(n_groups=2)
      print("get_n_splits:", lpgo.get_n_splits(X, y, groups))
      print("comb(4, 2):", comb(4, 2))
      pairs = list(lpgo.split(X, y, groups=groups))
      print("pairs:", len(pairs))
      print("test rows per fold:", [len(te) for _, te in pairs])
    snippet_library: scikit-learn
    output: |
      get_n_splits: 6
      comb(4, 2): 6
      pairs: 6
      test rows per fold: [5, 4, 5, 5, 6, 5]
    visual: null
  catch_outs:
    - Folds grow fast, since every set of p groups is one fold. 20 groups, p=3 gives 1140.
    - n_groups is required, and there is no default.
    - n_groups must be less than the number of groups, or it raises an error.
    - Pass groups=, or it raises an error.
  key_settings:
    tier1:
      - name: n_groups
        page: null
        controls: The number of groups (p) held out together in each test piece.
        effect: A bigger p gives bigger test pieces, but many more folds to fit.
    tier2: []
    tier3: []
  watch_it_work: {none: true}
  intuition:
    idea: Hold out every set of p groups in turn, not just one group.
    analogy: Testing a new school with every possible pair of schools left out, one pair at a time.
    animation: none
    goal: Get a score for every combination of p held-out groups.
    steps:
      - Find the distinct group labels in groups=.
      - List every set of n_groups labels, with no set repeated.
      - Take the first set as the test piece, with all of its rows.
      - Put every row of the other groups into the training piece.
      - Fit on the training piece and score on the test piece.
      - Move to the next set and repeat until every set has been used.
    math:
      notation:
        - {symbol: "G", meaning: "The number of distinct group labels."}
        - {symbol: "p", meaning: "The number of groups held out together, set by n_groups."}
        - {symbol: "C(G, p)", meaning: "The number of ways to choose p groups from G, with order ignored."}
      equations:
        - expression: "n_splits = C(G, p) = G! / (p! × (G − p)!)"
          meaning: One fold is made for each set of p groups, so the count grows fast.
      prediction: "Example: 4 groups and p=2 give C(4, 2) = 6 folds. 20 groups and p=3 give 1140 folds (made-up)."
    good_at: [few groups, many test combinations, a set-level score]
    bad_at: [many groups, slow models, large p]
    vs_siblings:
      - {page: leaveonegroupout, note: "The p=1 case: one group held out per fold."}
      - {page: groupkfold, note: "Fixed folds, so each group is tested only once."}
      - {page: leavepout, note: "Holds out p rows instead of p groups."}
    read_more:
      - n_groups must be less than the number of distinct groups.
      - Each fold holds out a different set of groups.
      - Count the folds with get_n_splits before running a slow model.
