    - library: scikit-learn
      target: sklearn.model_selection.LeavePGroupsOut
      why_this_library: Tries every combination of p held-out groups.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.model_selection import LeavePGroupsOut

        X = np.arange(20).reshape(10, 2)  # made-up: 10 rows, 2 columns
        y = np.arange(10) % 2             # made-up labels
        groups = np.array([0, 0, 1, 1, 1, 2, 2, 3, 3, 3])  # made-up: 4 groups

        lpgo = LeavePGroupsOut(n_groups=2)
        for fold, (train_idx, test_idx) in enumerate(
            lpgo.split(X, y, groups=groups)
        ):
            print("fold", fold, "test groups:", np.unique(groups[test_idx]))
            print("  test rows:", test_idx)
      output: |
        fold 0 test groups: [0 1]
          test rows: [0 1 2 3 4]
        fold 1 test groups: [0 2]
          test rows: [0 1 5 6]
        fold 2 test groups: [0 3]
          test rows: [0 1 7 8 9]
        fold 3 test groups: [1 2]
          test rows: [2 3 4 5 6]
        fold 4 test groups: [1 3]
          test rows: [2 3 4 7 8 9]
        fold 5 test groups: [2 3]
          test rows: [5 6 7 8 9]
