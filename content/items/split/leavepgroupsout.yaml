  code:
    - library: scikit-learn
      target: sklearn.model_selection.LeavePGroupsOut
      why_this_library: Tries every combination of p held-out groups.
      snippet: |
        # scikit-learn 1.9.1
        import numpy as np
        from sklearn.datasets import make_regression
        from sklearn.model_selection import LeavePGroupsOut

        X, y = make_regression(n_samples=20, n_features=3, random_state=0)
        groups = np.repeat([0, 1, 2, 3], 5)  # 4 groups, 5 rows each

        lpgo = LeavePGroupsOut(n_groups=2)
        for train_idx, test_idx in lpgo.split(X, y, groups=groups):
            print("test groups:", np.unique(groups[test_idx]))
