stage: model
questions:
  - id: model-overfitting
    stem: my_model_is
    text: Our model is great on training data, but poor on new data
    stage: model
    tracks: [standard]
    answers:
      - {page: max-depth}
      - {page: random-forest, setting: min_samples_leaf}
      - {page: gradient-boosting, setting: ccp_alpha}
      - {page: random-forest, setting: max_features}
    next: [evaluate-how-good]
