# Worked example 2: hyperparameter page spanning several tree models with different defaults.
id: max-depth
plain_name: Tree depth limit
code_name: max_depth
aliases: [depth, tree depth]
stage: tune
family: Tree shape
tracks: [standard]
archetype: hyperparameter
question_tags: [overfitting, too slow]
targets: []
applies_to: [decision-tree-regressor, random-forest, gradient-boosting, xgboost, lightgbm]
pairs_with: []
clashes: []
source_urls:
  - https://scikit-learn.org/stable/modules/generated/sklearn.tree.DecisionTreeRegressor.html
  - https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.GradientBoostingRegressor.html
  - https://xgboost.readthedocs.io/en/stable/parameter.html
  - https://lightgbm.readthedocs.io/en/stable/Parameters.html
library_versions:
  scikit-learn: "1.9.1"
  xgboost: "3.4.1"
  lightgbm: "4.7.0"
reviewed: false
rules:
  task_types: []
  blocked_when: []
  fits_on_data: false
  shape_effect: {rows: same, columns: same}
slots:
  header: {}
  solves:
    hero: {kind: hyperparameter, dataset: ames, sweep: [2, 4, 8, 16]}
    line: Caps how many questions a tree can ask in a row.
  quick_facts:
    values:
      - {page: decision-tree-regressor, default: None (unlimited), typical_range: 3 to 20}
      - {page: random-forest, default: None (unlimited), typical_range: 8 to 30}
      - {page: gradient-boosting, default: "3", typical_range: 2 to 8}
      - {page: xgboost, default: "6", typical_range: 3 to 10}
      - {page: lightgbm, default: "-1 (unlimited)", typical_range: 3 to 12}
  use_avoid:
    use_when: [overfitting, slow training]
    avoid_when: [underfitting]
  prep: []
  code:
    - library: scikit-learn
      target: sklearn.tree.DecisionTreeRegressor
      why_this_library: Depth is unlimited by default here.
      snippet: |
        # scikit-learn 1.9.1
        from sklearn.tree import DecisionTreeRegressor

        model = DecisionTreeRegressor(max_depth=5)
    - library: xgboost
      target: xgboost.XGBRegressor
      why_this_library: Default depth is 6 (the booster default).
      snippet: |
        # xgboost 3.4.1
        from xgboost import XGBRegressor

        model = XGBRegressor(max_depth=4)
    - library: lightgbm
      target: lightgbm.LGBMRegressor
      why_this_library: Pair with num_leaves; -1 means no limit.
      snippet: |
        # lightgbm 4.7.0
        from lightgbm import LGBMRegressor

        model = LGBMRegressor(max_depth=5, num_leaves=24)
  what_comes_out: {none: true}
  catch_outs:
    - Defaults differ a lot between libraries.
    - In LightGBM, num_leaves limits the tree before max_depth does.
  key_settings:
    tier1: []
    tier2: []
    tier3: []
  watch_it_work:
    dataset: ames
    control: {name: max_depth, min: 1, max: 16, step: 1, default: 3}
  intuition:
    text: Deeper trees fit finer detail, and also fit noise.
  next: [model-overfitting]
